name: hf-models

# 음성 인식 모델(SenseVoice int8)을 허깅페이스 모델 저장소(brand.json 의 repo_hf)의 stt-sv/ 에 올린다.
# 원본은 leeyunjai/themaker .model/stt (tools/fetch_stt.py 가 받는다). 올린 뒤 sha256 이 같은지 본다.
# 필요한 것: 저장소 Secret HF_TOKEN — 허깅페이스 쓰기 토큰. 손으로 돌리기: Actions → hf-models → Run workflow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 받기
        run: |
          pip install "$(grep -E '^huggingface[-_]hub==' requirements.lock.txt || echo huggingface_hub)"
          python tools/fetch_stt.py

      - name: 올리기 · 확인
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN" || { echo "저장소 Secret HF_TOKEN 이 없어요"; exit 1; }
          python - <<'PY'
          import hashlib, pathlib
          import brand
          from huggingface_hub import CommitOperationAdd, HfApi
          src, dst = pathlib.Path("models/stt-sv"), "stt-sv"
          files = ["model.int8.onnx", "tokens.txt", "silero_vad.onnx", "LICENSE-SenseVoice.txt"]
          sha = {f: hashlib.sha256((src / f).read_bytes()).hexdigest() for f in files}
          api = HfApi()
          api.create_commit(repo_id=brand.REPO_HF, commit_message="stt-sv: SenseVoice int8 (leeyunjai/themaker .model/stt)",
                            operations=[CommitOperationAdd(path_in_repo=f"{dst}/{f}", path_or_fileobj=str(src / f)) for f in files])
          bad = 0
          for p in api.get_paths_info(brand.REPO_HF, [f"{dst}/{f}" for f in files]):
              f = p.path.split("/", 1)[1]
              got = p.lfs.sha256 if p.lfs else hashlib.sha256(open(api.hf_hub_download(brand.REPO_HF, p.path), "rb").read()).hexdigest()
              bad += got != sha[f]
              print("OK  " if got == sha[f] else "FAIL", p.path, sha[f])
          raise SystemExit(bad)
          PY
