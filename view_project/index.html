<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>컴퓨터 비전 실습</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
  <style>
    /* ===== 디자인 토큰 : "학습지" (줄노트 + 시험지 머리표 + 빨간펜) ===== */
    :root {
      --paper:    #faf8f0;                 /* 갱지 느낌 */
      --rule:     rgba(59, 93, 214, .10);  /* 노트 파란 줄 */
      --box:      #ffffff;
      --ink:      #26262e;
      --ink-2:    #6d6c66;
      --pen-blue: #2b4bd8;
      --pen-blue-d:#1f3ab0;
      --pen-red:  #d94141;
      --line:     #cdcabc;
      --line-d:   #26262e;
      --r: 6px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      color: var(--ink);
      background-color: var(--paper);
      background-image: repeating-linear-gradient(
        transparent 0, transparent 27px, var(--rule) 27px, var(--rule) 28px
      );
      font-family: "Gowun Dodum", "Apple SD Gothic Neo", system-ui, sans-serif;
      line-height: 1.5;
      padding: 12px;
      gap: 10px;
    }
    .serif { font-family: "Gowun Batang", serif; }

    a { color: var(--pen-blue-d); text-decoration: none; }
    a:hover { text-decoration: underline; }

    select, input, button {
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--ink);
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: var(--r);
      padding: 7px 11px;
      outline: none;
      transition: border-color .12s, background .12s;
    }
    select:hover, input:hover { border-color: #a8a596; }
    select:focus, input:focus { border-color: var(--pen-blue); }
    input[readonly] { background: #fbfaf5; color: var(--ink-2); }

    /* ===== 시험지 머리표 ===== */
    .header {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: stretch;
      background: var(--box);
      border: 2px solid var(--line-d);
      border-radius: 3px;
      box-shadow: 2px 2px 0 rgba(38,38,46,.12);
    }
    .header > div {
      display: flex; flex-direction: column; justify-content: center;
      padding: 10px 16px;
      border-right: 1px solid var(--line-d);
    }
    .header > div:last-child { border-right: none; }
    .h-subject .eyebrow {
      font-size: .7rem; letter-spacing: .14em; color: var(--ink-2);
    }
    .h-subject .title {
      font-family: "Gowun Batang", serif;
      font-size: 1.4rem; font-weight: 700; letter-spacing: .02em; line-height: 1.2;
    }
    .h-fill { justify-content: center; gap: 4px; }
    .fill-row { display: flex; align-items: baseline; gap: 8px; font-size: .88rem; }
    .fill-row .k { color: var(--ink-2); white-space: nowrap; }
    .fill-row .v {
      min-width: 130px;
      border-bottom: 1.5px solid var(--line-d);
      padding: 0 4px 1px;
      font-variant-numeric: tabular-nums;
      color: var(--pen-blue-d);
      white-space: nowrap;
    }
    .h-env { gap: 4px; }
    .h-env .k { font-size: .78rem; color: var(--ink-2); }
    .h-tools { flex-direction: row !important; align-items: center; gap: 8px; margin-left: auto; }

    #fullscreenButton {
      display: inline-flex; align-items: center; gap: 7px;
      background: #fff; border: 1.5px solid var(--line-d); color: var(--ink);
      font-weight: 600; padding: 8px 14px; cursor: pointer;
    }
    #fullscreenButton:hover { background: var(--paper); }
    #fullscreenButton svg { width: 15px; height: 15px; }

    /* ===== 문항 공통 ===== */
    .qnum {
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; flex: 0 0 26px;
      border: 1.8px solid var(--ink); border-radius: 50%;
      font-family: "Gowun Batang", serif; font-weight: 700; font-size: .95rem;
      background: #fff;
    }
    .qtext { font-family: "Gowun Batang", serif; font-weight: 700; font-size: 1.02rem; }

    /* ===== 문항 1 : 모델 고르기 ===== */
    .subheader {
      flex: 0 0 auto;
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
      background: var(--box);
      border: 1.5px solid var(--line);
      border-radius: var(--r);
      padding: 10px 16px;
    }
    .subheader .q { display: flex; align-items: center; gap: 9px; }
    .subheader .field { display: flex; align-items: center; gap: 8px; flex: 1 1 auto; min-width: 200px; }
    .field-label { font-size: .88rem; color: var(--ink-2); white-space: nowrap; }
    #modelSelect { font-weight: 600; min-width: 160px; }
    #guide { flex: 1 1 240px; width: auto; }
    .doc-link { margin-left: auto; font-size: .88rem; white-space: nowrap; }
    .doc-link::before { content: "※ "; color: var(--pen-red); }

    /* ===== 문항 2 헤더줄 : 탭 + 프롬프트 + 실행 ===== */
    .tab-prompt-row {
      flex: 0 0 auto;
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
      background: var(--box);
      border: 1.5px solid var(--line);
      border-radius: var(--r);
      padding: 10px 16px;
    }
    .tab-prompt-row .q { display: flex; align-items: center; gap: 9px; }
    .tabs { display: flex; gap: 2px; }
    .tabButton {
      background: transparent; border: none; border-bottom: 3px solid transparent;
      border-radius: 0; color: var(--ink-2); font-size: .95rem;
      padding: 6px 12px 4px; cursor: pointer;
    }
    .tabButton:hover { color: var(--ink); }
    .tabButton.active {
      color: var(--pen-blue-d); font-weight: 700;
      border-bottom-color: var(--pen-blue);
    }
    .promptWrapper { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: 1 1 300px; }
    #promptInput { flex: 1 1 auto; width: auto; min-width: 110px; }

    #mainRunButton {
      background: var(--pen-blue); border: 1.5px solid var(--pen-blue); color: #fff;
      font-weight: 700; font-size: .98rem; padding: 8px 26px; cursor: pointer;
      border-radius: var(--r); white-space: nowrap;
    }
    #mainRunButton:hover { background: var(--pen-blue-d); border-color: var(--pen-blue-d); }
    #mainRunButton:disabled { background: #b9b7ac; border-color: #b9b7ac; cursor: wait; }

    /* ===== 답안 영역 (좌우) ===== */
    .main-container {
      flex: 1 1 auto; min-height: 0;
      display: flex; gap: 12px;
    }
    .panel {
      flex: 1 1 0; min-width: 0;
      display: flex; flex-direction: column;
      background: var(--box);
      border: 1.5px solid var(--line);
      border-radius: var(--r);
      overflow: hidden;
    }
    .panel-head {
      flex: 0 0 auto;
      display: flex; align-items: center; gap: 9px;
      padding: 11px 16px;
      border-bottom: 1.5px dashed var(--line);
    }
    .panel-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 16px; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* 붙임 상자 (업로드) — "사진을 붙이세요" */
    .upload-container {
      border: 2px dashed #b3b0a2;
      border-radius: var(--r);
      min-height: 280px;
      display: flex; align-items: center; justify-content: center; text-align: center;
      color: var(--ink-2); cursor: pointer;
      background: #fdfcf8;
      transition: border-color .15s, background .15s;
      padding: 14px;
    }
    .upload-container:hover { border-color: var(--pen-blue); color: var(--ink); background: #f7f8ff; }
    .upload-container .hint { font-size: .8rem; margin-top: 6px; color: #a3a094; }
    #uploadPreview { max-width: 100%; height: auto; display: none; border-radius: 3px; }

    .webcam-container {
      border: 1.5px solid var(--line);
      border-radius: var(--r);
      min-height: 280px;
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center;
      background: #fdfcf8; padding: 14px;
    }
    #webcamVideo { width: 320px; max-width: 100%; height: auto; background: #222; border-radius: 3px; }
    #webcamCanvas { display: none; border-radius: 3px; }

    .sketch-container {
      border: 1.5px solid var(--line);
      border-radius: var(--r);
      display: flex; flex-direction: column; align-items: center;
      background: #fdfcf8; padding: 14px;
    }
    #sketchCanvas { background: #fff; border: 1px solid var(--line); max-width: 100%; height: auto; touch-action: none; border-radius: 3px; }
    .sketch-controls { margin-top: 12px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .sketch-controls input[type="color"] { padding: 2px; width: 42px; height: 34px; cursor: pointer; }
    .sketch-controls input[type="range"] { cursor: pointer; }

    .button-row { margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-line {
      background: #fff; border: 1.5px solid var(--line-d); color: var(--ink);
      font-weight: 600; padding: 7px 18px; cursor: pointer; border-radius: var(--r);
    }
    .btn-line:hover { background: var(--paper); }

    /* 답란 (결과) */
    .result-frame {
      position: relative;
      border: 1.5px solid var(--line-d);
      border-radius: 3px;
      background: #fff;
      padding: 12px;
      display: inline-block;
      max-width: 100%;
    }
    #resultCanvas { max-width: 100%; height: auto; display: block; }

    /* 확인 도장 — 실행 완료 시에만 */
    #stampMark {
      position: absolute; top: 8px; right: 8px;
      width: 72px; height: 72px;
      border: 3px double var(--pen-red);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: "Gowun Batang", serif; font-weight: 700; font-size: 1.05rem;
      color: var(--pen-red);
      transform: rotate(-12deg) scale(0);
      opacity: 0;
      pointer-events: none;
    }
    #stampMark.show {
      animation: stampIn .35s cubic-bezier(.2, 1.6, .4, 1) forwards;
    }
    @keyframes stampIn {
      to { transform: rotate(-12deg) scale(1); opacity: .88; }
    }
    @media (prefers-reduced-motion: reduce) {
      #stampMark.show { animation: none; transform: rotate(-12deg) scale(1); opacity: .88; }
    }

    /* 미션 모드 */
    .mission-label {
      font-family: "Gowun Batang", serif; font-weight: 700; font-size: .9rem;
      color: #fff; background: var(--pen-red);
      padding: 2px 10px; border-radius: 4px; white-space: nowrap;
    }
    .mission-text { font-weight: 600; word-break: keep-all; }
    #missionProgress {
      margin-left: auto; font-size: .95rem; letter-spacing: .18em;
      color: var(--ink-2); white-space: nowrap;
    }
    #missionProgress .done { color: var(--pen-red); }
    #stampMark.complete { font-size: .82rem; line-height: 1.2; text-align: center; padding: 6px; }
    .lesson-index { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 16px; }
    .lesson-index a.lesson-card {
      display: flex; align-items: baseline; gap: 12px;
      padding: 12px 16px; margin-bottom: 10px;
      background: var(--box); border: 1.5px solid var(--line); border-radius: var(--r);
      color: var(--ink); text-decoration: none;
    }
    .lesson-index a.lesson-card:hover { border-color: var(--pen-blue); }
    .lesson-card .no {
      font-family: "Gowun Batang", serif; font-weight: 700; color: var(--pen-blue-d);
      flex: 0 0 52px;
    }
    .lesson-card .t { font-weight: 700; }
    .lesson-card .m { color: var(--ink-2); font-size: .85rem; margin-left: auto; text-align: right; }

    /* 풀이 (쉬운 결과) */
    .easy-answer {
      display: none;
      margin-top: 14px;
      border-left: 4px solid var(--pen-blue);
      background: #f5f7ff;
      border-radius: 0 var(--r) var(--r) 0;
      padding: 10px 14px;
    }
    .easy-answer.show { display: flex; align-items: flex-start; gap: 12px; }
    .easy-answer .ea-label {
      flex: 0 0 auto;
      font-family: "Gowun Batang", serif; font-weight: 700; font-size: .9rem;
      color: var(--pen-blue-d);
      border: 1.5px solid var(--pen-blue);
      border-radius: 4px;
      padding: 1px 8px;
      margin-top: 1px;
    }
    #easyText { font-size: .98rem; line-height: 1.75; word-break: keep-all; }
    #easyText .sub { color: var(--ink-2); font-size: .85rem; }
    #easyText b { color: var(--pen-blue-d); }

    /* 연습장 (JSON) — 접이식 */
    .scratchpad { margin-top: 18px; }
    .scratchpad summary {
      cursor: pointer; list-style: none;
      display: flex; align-items: center; gap: 8px;
      font-family: "Gowun Batang", serif; font-weight: 700; font-size: .95rem;
      color: var(--ink-2);
      user-select: none;
    }
    .scratchpad summary::-webkit-details-marker { display: none; }
    .scratchpad summary::before { content: "▸"; color: var(--pen-blue); }
    .scratchpad[open] summary::before { content: "▾"; }
    .scratchpad .pad-tools { display: flex; justify-content: flex-end; margin: 8px 0 6px; }
    #copyJsonButton {
      background: #fff; border: 1.5px solid var(--line); color: var(--ink-2);
      font-size: .85rem; padding: 4px 14px; cursor: pointer; border-radius: var(--r);
    }
    #copyJsonButton:hover { border-color: var(--pen-blue); color: var(--pen-blue-d); }
    .scratchpad pre {
      background: #fdfcf8;
      background-image: repeating-linear-gradient(
        transparent 0, transparent 23px, var(--rule) 23px, var(--rule) 24px
      );
      border: 1.5px solid var(--line);
      border-radius: var(--r);
      padding: 12px 14px;
      max-height: 300px; overflow-y: auto;
      font-size: .82rem;
      font-family: "Menlo", "Consolas", ui-monospace, monospace;
      line-height: 24px;
      white-space: pre-wrap; word-wrap: break-word;
      color: #3a3a42;
    }
    .scratchpad pre:empty::before { content: "실행하면 결과 데이터가 여기에 적혀요."; color: #a3a094; }

    /* 스크롤바 */
    .panel-body::-webkit-scrollbar, .scratchpad pre::-webkit-scrollbar { width: 10px; }
    .panel-body::-webkit-scrollbar-thumb, .scratchpad pre::-webkit-scrollbar-thumb {
      background: #d8d5c8; border-radius: 999px;
    }

    /* ===== 반응형 ===== */
    @media (max-width: 860px) {
      body { overflow: auto; height: auto; min-height: 100dvh; }
      .main-container { flex-direction: column; min-height: 0; }
      .panel-body { overflow: visible; }
      .header { flex-direction: column; }
      .header > div { border-right: none; border-bottom: 1px solid var(--line-d); }
      .header > div:last-child { border-bottom: none; }
      .h-tools { margin-left: 0; }
      .promptWrapper { margin-left: 0; flex-basis: 100%; }
      .doc-link { margin-left: 0; }
    }
  </style>
</head>
<body>
  <!-- 시험지 머리표 -->
  <div class="header">
    <div class="h-subject">
      <span class="eyebrow">인공지능 · 컴퓨터 비전</span>
      <span class="title">컴퓨터 비전 실습</span>
    </div>
    <div class="h-fill">
      <div class="fill-row"><span class="k">날짜 :</span><span class="v" id="clockDisplay"></span></div>
      <div class="fill-row"><span class="k">지역 :</span><span class="v" id="regionDisplay"></span></div>
    </div>
    <div class="h-env">
      <span class="k">서버</span>
      <select id="envSelect">
        <option value="local">local</option>
        <option value="ops">ops</option>
        <option value="stg">stg</option>
        <option value="dev">dev</option>
      </select>
    </div>
    <div class="h-tools">
      <select id="lessonSelect" title="차시 선택"></select>
      <button id="fullscreenButton" title="전체화면으로 보기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4"/></svg>
        <span id="fsLabel">전체화면</span>
      </button>
    </div>
  </div>

  <!-- 문항 1 : 모델 고르기 -->
  <div class="subheader">
    <div class="q" id="q1">
      <span class="qnum">1</span>
      <span class="qtext">모델을 골라요</span>
    </div>
    <div class="q" id="missionBox" style="display:none;">
      <span class="mission-label">미션</span>
      <span class="mission-text" id="missionText"></span>
    </div>
    <div class="field" id="modelField">
      <label class="field-label" for="modelSelect">모델</label>
      <select id="modelSelect"></select>
    </div>
    <div class="field">
      <label class="field-label" for="guide">가이드</label>
      <input type="text" id="guide" readonly />
    </div>
    <a id="apiDocLink" class="doc-link" href="#" target="_blank">API 문서</a>
  </div>

  <!-- 문항 2 : 이미지 넣고 실행 -->
  <div class="tab-prompt-row">
    <div class="q">
      <span class="qnum">2</span>
      <span class="qtext">이미지를 넣고 실행해요</span>
    </div>
    <div class="tabs">
      <button class="tabButton active" data-tab="upload">이미지</button>
      <button class="tabButton" data-tab="webcam">웹캠</button>
      <button class="tabButton" data-tab="sketch">스케치북</button>
    </div>
    <div class="promptWrapper">
      <label class="field-label" for="promptInput">프롬프트</label>
      <input type="text" id="promptInput" value="-" />
      <button id="mainRunButton"><span id="runLabel">실행</span></button>
    </div>
  </div>

  <!-- 답안 영역 -->
  <div class="main-container">
    <!-- 왼쪽: 입력 -->
    <div class="panel">
      <div class="panel-head">
        <span class="qtext" style="font-size:.95rem;">입력 이미지</span>
      </div>
      <div class="panel-body">
        <div id="upload" class="tab-content active">
          <div class="upload-container" id="uploadPlaceholder">
            <div id="uploadText">
              이 칸에 이미지를 붙여 보세요
              <div class="hint">끌어놓기 또는 클릭해서 업로드</div>
            </div>
            <input type="file" id="fileInput" accept="image/*" style="display:none;">
            <img id="uploadPreview">
          </div>
        </div>

        <div id="webcam" class="tab-content">
          <div class="webcam-container">
            <video id="webcamVideo"></video>
            <canvas id="webcamCanvas" width="320" height="240"></canvas>
          </div>
          <div class="button-row">
            <button id="captureWebcam" class="btn-line">캡쳐</button>
          </div>
        </div>

        <div id="sketch" class="tab-content">
          <div class="sketch-container">
            <canvas id="sketchCanvas" width="640" height="480"></canvas>
            <div class="sketch-controls">
              <label class="field-label" for="penColor">색상</label>
              <input type="color" id="penColor" value="#000000">
              <label class="field-label" for="penWidth">굵기</label>
              <input type="range" id="penWidth" min="1" max="10" value="5">
            </div>
          </div>
          <div class="button-row">
            <button id="clearSketch" class="btn-line">초기화</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 오른쪽: 결과 -->
    <div class="panel">
      <div class="panel-head">
        <span class="qnum">3</span>
        <span class="qtext">결과를 확인해요</span>
        <span id="missionProgress" style="display:none;"></span>
      </div>
      <div class="panel-body">
        <div class="result-frame">
          <canvas id="resultCanvas"></canvas>
          <div id="stampMark">확인!</div>
        </div>

        <div class="easy-answer" id="easyAnswer">
          <span class="ea-label">풀이</span>
          <div id="easyText"></div>
        </div>

        <details class="scratchpad">
          <summary>상세보기 — 결과 데이터(JSON)</summary>
          <div class="pad-tools">
            <button id="copyJsonButton">복사</button>
          </div>
          <pre id="resultJSON"></pre>
        </details>
      </div>
    </div>
  </div>

  <script>
    /****************************************************
     * 기능 로직은 기존과 동일 (스타일/도장/연습장만 변경)
     * vapi-od: local(same-origin) 모드 추가, gan 변환 4종 재구성, 캡션 제거
     ****************************************************/

    const HOST_OPTIONS = {
      "local": "",
      "dev": "http://0.0.0.0:57711",
      "stg": "https://s-vapi.circul.us",
      "ops": "https://o-vapi.circul.us"
    };

    function clearSketchCanvas() {
      sketchCtx.fillStyle = "#ffffff";

    }
    clearSketchCanvas();

    function getSketchPos(clientX, clientY) {
      const rect = sketchCanvas.getBoundingClientRect();
      return {
        x: (clientX - rect.left) * (sketchCanvas.width / rect.width),
        y: (clientY - rect.top) * (sketchCanvas.height / rect.height)
      };
    }

    sketchCanvas.addEventListener('mousedown', e => {
      drawing = true;
      const p = getSketchPos(e.clientX, e.clientY);
      sketchCtx.beginPath();
      sketchCtx.moveTo(p.x, p.y);
    });
    sketchCanvas.addEventListener('mousemove', e => {
      if (drawing) {
        const p = getSketchPos(e.clientX, e.clientY);
        sketchCtx.lineWidth = penWidth.value;
        sketchCtx.strokeStyle = penColor.value;
        sketchCtx.lineCap = 'round';
        sketchCtx.lineTo(p.x, p.y);
        sketchCtx.stroke();
      }
    });
    sketchCanvas.addEventListener('mouseup', () => { drawing = false; });
    sketchCanvas.addEventListener('mouseleave', () => { drawing = false; });

    sketchCanvas.addEventListener('touchstart', e => {
      e.preventDefault();
      drawing = true;
      const t = e.touches[0];

      sketchCtx.beginPath();
      sketchCtx.moveTo(p.x, p.y);
    }, { passive: false });

      e.preventDefault();

      sketchCtx.strokeStyle = penColor.value;
      sketchCtx.lineCap = 'round';
      sketchCtx.lineTo(p.x, p.y);
      sketchCtx.stroke();
    }, { passive: false });
    sketchCanvas.addEventListener('touchend', () => { drawing = false; });

    document.getElementById('clearSketch').addEventListener('click', () => {
      clearSketchCanvas();
    });

    function resizeImage(image, callback) {
      const canvas = document.createElement('canvas');
      let width = image.width;
      let height = image.height;
      if (width > MAX_WIDTH) {
        height = height * (MAX_WIDTH / width);
        width = MAX_WIDTH;
      }
      if (height > MAX_HEIGHT) {
        width = width * (MAX_HEIGHT / height);
        height = MAX_HEIGHT;
      }
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(image, 0, 0, width, height);
      canvas.toBlob(function(blob) {
        callback({ blob: blob, width: width, height: height });
      }, 'image/jpeg');
    }

    function drawRect(ctx, x1, y1, x2, y2, color, text, scaleX, scaleY) {
      const rectX = x1 * scaleX;
      const rectY = y1 * scaleY;
      const rectWidth = (x2 - x1) * scaleX;
      const rectHeight = (y2 - y1) * scaleY;

      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.strokeRect(rectX, rectY, rectWidth, rectHeight);

      if (text) {
        ctx.font = "16px 'Gowun Dodum', 'Apple SD Gothic Neo', sans-serif";
        const textMetrics = ctx.measureText(text);
        const textWidth = textMetrics.width;
        const textHeight = 16;

        ctx.fillStyle = color;
        ctx.fillRect(rectX, rectY - textHeight - 4, textWidth + 8, textHeight + 4);

        ctx.fillStyle = "#ffffff";
        ctx.fillText(text, rectX + 4, rectY - 4);
      }
    }

    function drawLine(ctx, x1, y1, x2, y2, scaleX, scaleY) {
      ctx.beginPath();
      ctx.moveTo(x1*scaleX, y1*scaleY);
      ctx.lineTo(x2*scaleX, y2*scaleY);
      ctx.stroke();
    }
    function drawEllipse(ctx, x, y, radius, color, scaleX, scaleY) {
      ctx.beginPath();
      ctx.ellipse(x*scaleX, y*scaleY, radius*scaleX, radius*scaleY, 0, 0, 2*Math.PI);
      ctx.strokeStyle = color;
      ctx.stroke();
    }

    async function runInference(imageBlob, prompt, model) {
      const selectedService = SERVICE_LIST[model];
      let url = HOST + '/' + selectedService.api;
      const headers = {
        'x-client-id': btoa(SERIAL),
        'x-client-type': CLIENT_TYPE
      };

      const formData = new FormData();
      if (model === "이미지 질문" || model === "이미지 설명") {
        selectedService.params.prompt = prompt;
      }
      formData.append('uploadFile', imageBlob, 'image.jpg');
      const query = new URLSearchParams(selectedService.params).toString();
      url = url + '?' + query;
      try {
        const response = await fetch(url, { method: 'POST', headers: headers, body: formData });
        return await response.json();
      } catch (err) {
        return { error: err.toString() };
      }
    }

    /* ----- 확인 도장 ----- */
    const stampMark = document.getElementById('stampMark');
    function hideStamp() { stampMark.classList.remove('show'); }
    function showStamp() {
      stampMark.classList.remove('show');
      void stampMark.offsetWidth; // 애니메이션 재시작
      stampMark.classList.add('show');
    }

    /* ----- 쉬운 결과 (풀이) — 서버 응답 스키마 기반 ----- */
    const easyAnswer = document.getElementById('easyAnswer');
    const easyText = document.getElementById('easyText');
    function hideEasy() { easyAnswer.classList.remove('show'); easyText.innerHTML = ''; }
    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    const DIR_KO = { L:'왼쪽', R:'오른쪽', C:'', T:'위', B:'아래' };
    function dirToKo(d) {
      if (!d || d.length !== 2) return d || '';
      if (d === 'CC') return '정면';
      const h = DIR_KO[d[0]] || '', v = DIR_KO[d[1]] || '';
      return (h + ' ' + v).trim() + ' 방향';
    }
    const WEATHER_KO = { sunny:'맑음 ☀', snow:'눈 ☃', cloudy:'흐림', rainy:'비', unknown:'알 수 없음' };
    const TIME_KO = { morning:'아침', noon:'낮', afternoon:'낮(오후)', evening:'저녁', night:'밤', daytime:'낮', unknown:'알 수 없음' };
    const RPS_KO = { rock:'바위', paper:'보', scissors:'가위', scissor:'가위' };
    function nameCounts(items, key) {
      const m = {};
      (items || []).forEach(it => { const n = it[key]; if (n) m[n] = (m[n] || 0) + 1; });
      return Object.entries(m).map(([n, c]) => c > 1 ? `${esc(n)} ${c}개` : esc(n)).join(', ');
    }
    function easySummary(res) {
      if (!res || res.result === 'fail' || res.error) {
        return `앗, 이번에는 잘 안 됐어요. <span class="sub">(${esc(res && (res.data || res.error) || '오류')})</span>`;
      }
      const d = res.data;
      switch (res.type) {
        /* --- 텍스트 계열 --- */
        case 'caption_place_e': {
          const env = d.environment === 'indoor' ? '실내' : d.environment === 'outdoor' ? '실외' : esc(d.environment);
          return `이곳은 <b>${env}</b>이고, <b>${esc(d.category)}</b>(으)로 보여요.`;
        }
        case 'caption_time_e': {
          const t = TIME_KO[d.time] || esc(d.time);
          return d.time === 'unknown'
            ? `시간대를 알 수 없어요. <span class="sub">(바깥 풍경이 보이지 않아요)</span>`
            : `사진을 찍은 시간대는 <b>${t}</b>인 것 같아요.`;
        }
        case 'caption_weather_e': {
          const w = WEATHER_KO[d.weather] || esc(d.weather);
          return d.weather === 'unknown'
            ? `날씨를 알 수 없어요. <span class="sub">(바깥 풍경이 보이지 않아요)</span>`
            : `사진 속 날씨는 <b>${w}</b>이에요.`;
        }
        case 'caption_question_e':
          return `질문에 대한 답: <b>${esc(d.answer)}</b><div class="sub">${esc(d.answer_en || '')}</div>`;
        case 'caption_tag_e': {
          const tags = Array.isArray(d.tag) ? d.tag.join(', ') : d.tag;
          return `사진에서 찾은 태그: <b>${esc(tags)}</b>`;
        }
        case 'vlm_inference_e':
          return `<b>${esc(d.answer)}</b>`;

        /* --- 검출 계열 --- */
        case 'face_detect_e':
          return d.length ? `얼굴을 <b>${d.length}개</b> 찾았어요!` : `얼굴을 찾지 못했어요.`;
        case 'face_analyze_e':
          if (!d.length) return `얼굴을 찾지 못했어요.`;
          return d.map((f, i) =>
            `${d.length > 1 ? (i+1) + '번 ' : ''}얼굴: <b>${esc(f.gender)}</b> · 약 <b>${esc(f.age)}살</b> · <b>${esc(f.emotion)}</b> 표정 · ${dirToKo(f.pos && f.pos.direction)}`
          ).join('<br>');
        case 'face_emotion_e':
          if (!d.length) return `얼굴을 찾지 못했어요.`;
          return d.map((f, i) =>
            `${d.length > 1 ? (i+1) + '번 ' : ''}얼굴의 표정은 <b>${esc(f.emotion)}</b>이에요.`
          ).join('<br>');
        case 'face_age_gender_e':
          if (!d.length) return `얼굴을 찾지 못했어요.`;
          return d.map((f, i) =>
            `${d.length > 1 ? (i+1) + '번 ' : ''}얼굴: <b>${esc(f.gender)}</b> · 약 <b>${esc(f.age)}살</b>`
          ).join('<br>');
        case 'face_pose_e':
          if (!d.length) return `얼굴을 찾지 못했어요.`;
          return d.map((f, i) =>
            `${d.length > 1 ? (i+1) + '번 ' : ''}얼굴은 <b>${dirToKo((f.pos || f.pose || {}).direction)}</b>을 보고 있어요.`
          ).join('<br>');
        case 'face_attribute': {
          if (!d.length) return `얼굴을 찾지 못했어요.`;
          const ATTR_KO = { Eyeglasses:'안경', Mustache:'콧수염', Beard:'턱수염', Hat:'모자' };
          return d.map((f, i) => {
            const found = Object.keys(ATTR_KO).filter(k => f[k] > 55).map(k => ATTR_KO[k]);
            const head = d.length > 1 ? (i+1) + '번 얼굴' : '얼굴';
            return found.length
              ? `${head}에서 <b>${found.join(', ')}</b>을(를) 찾았어요.`
              : `${head}에서 특별한 특징을 찾지 못했어요.`;
          }).join('<br>');
        }
        case 'mask_detect': {
          if (!d.length) return `얼굴을 찾지 못했어요.`;
          const on = d.filter(f => f.mask === 1).length;
          return `얼굴 <b>${d.length}개</b> 중 <b>${on}개</b>가 마스크를 쓰고 있어요.`;
        }
        case 'object_search_e': {
          const people = d.person || [];
          const objs = d.object || [];
          const parts = [];
          if (people.length) parts.push(`사람 <b>${people.length}명</b>`);
          if (objs.length) parts.push(`사물: <b>${nameCounts(objs, 'name')}</b>`);
          return parts.length ? `사진에서 ${parts.join(' / ')}을(를) 찾았어요!` : `사물을 찾지 못했어요.`;
        }
        case 'object_custom_e': {
          const objs = (d && d.object) || [];
          if (!objs.length) return `찾지 못했어요.`;
          const mode = res.detect_mode;
          if (mode === 'rps') {
            const names = objs.map(o => `<b>${RPS_KO[o.name] || esc(o.name)}</b>`).join(', ');
            return `${names}을(를) 냈어요!`;
          }
          return `<b>${nameCounts(objs, 'name')}</b>을(를) 찾았어요!`;
        }
        case 'object_pose_e':
          return d.length
            ? `사람 <b>${d.length}명</b>의 몸 자세(주요 포인트 17개)를 찾았어요. 결과 이미지의 점과 선을 살펴보세요!`
            : `사람을 찾지 못했어요.`;
        case 'object_cls_e': {
          if (!d.length) return `분류하지 못했어요.`;
          const top = d[0];
          const ko = top['ko_name'] || top['ko_name:'] || top.name;
          return `이 이미지는 <b>${esc(ko)}</b>인 것 같아요. <span class="sub">(확신 ${esc(top.score)}%)</span>`;
        }
        case 'ocr': {
          if (!d.length) return `글자를 찾지 못했어요.`;
          return `읽은 글자: <b>${d.map(t => esc(t.text)).join(' ')}</b>`;
        }
        case 'barcode': {
          if (!d.length) return `QR코드를 찾지 못했어요.`;
          return d.map(b => `QR코드 내용: <b>${esc(b.data || b.text || '')}</b>`).join('<br>');
        }

        /* --- 이미지 변환 계열 --- */
        case 'cartoon': case 'webtoon': case 'portrait': case 'sketch': case 'sr':
          return `이미지를 새로운 스타일로 바꿨어요! 위 그림을 확인해 보세요.`;
        case 'object_seg_e':
          return `사물의 영역을 색으로 칠해 표시했어요. 위 그림을 확인해 보세요.`;

        default:
          return `결과가 나왔어요. 자세한 내용은 아래 상세보기를 펼쳐 보세요.`;
      }
    }
    function showEasy(res) {
      easyText.innerHTML = easySummary(res);
      easyAnswer.classList.add('show');
    }

    function displayResult(res, displayedImg, srcWidth, srcHeight) {
      const resultCanvas = document.getElementById('resultCanvas');
      const ctx = resultCanvas.getContext('2d');
      const resultJSON = document.getElementById('resultJSON');

      if (res.error) {
        alert("Error: " + res.error);
      } else if (res.result === 'ok') {
        showStamp();
        if (LESSON) { missionCount++; updateProgress(); }
      }
      showEasy(res);
      resultJSON.innerText = JSON.stringify(res, null, 2);

      if (
        res.type &&
        ["cartoon","webtoon","portrait","sketch","sr","object_seg_e"]
          .includes(res.type)
      ) {
        const base64Image = "data:image/jpeg;base64," + res.data;
        const genImg = new Image();
        genImg.onload = function() {
          resultCanvas.width = genImg.width;
          resultCanvas.height = genImg.height;
          ctx.clearRect(0, 0, genImg.width, genImg.height);
          ctx.drawImage(genImg, 0, 0);
        };
        genImg.src = base64Image;
        return;
      }

      if (displayedImg) {
        resultCanvas.width = srcWidth;
        resultCanvas.height = srcHeight;
        ctx.clearRect(0, 0, srcWidth, srcHeight);
        ctx.drawImage(displayedImg, 0, 0, srcWidth, srcHeight);

        const scaleX = resultCanvas.width / srcWidth;
        const scaleY = resultCanvas.height / srcHeight;

        if (res.type === "mask_detect") {
          res.data.forEach((item, idx) => {
            const [x1, y1, x2, y2] = item.box;
            const color = item.mask === 1 ? "rgb(43, 75, 216)" : "rgb(217, 65, 65)";
            const label = item.mask === 1 ? "Mask" : "No Mask";
            drawRect(ctx, x1, y1, x2, y2, color, label, scaleX, scaleY);
          });
        }
        else if ([
          "face_attribute","face_detect_e","face_analyze_e",
          "face_emotion_e","face_age_gender_e","face_pose_e"
        ].includes(res.type)) {
          res.data.forEach((item, idx) => {
            const [x1, y1, x2, y2] = item.box;
            let label = 'face';

            if (res.type === "face_attribute") {
                let attributes = [];
                if (item.Eyeglasses > 55) attributes.push('Eyeglasses');
                if (item.Mustache > 55) attributes.push('Mustache');
                if (item.Beard > 55) attributes.push('Beard');
                if (item.Hat > 55) attributes.push('Hat');

                if (attributes.length > 0) {
                    label = attributes.join(', ');
                }
            } else if (res.type === "face_analyze_e") {
                label = `${item.gender_en}, ${item.age}, ${item.emotion_en}`;
            } else if (res.type === "face_age_gender_e") {
                label = `${item.gender_en}, ${item.age}`;
            } else if (res.type === "face_emotion_e") {
                label = item.emotion_en;
            } else if (res.type === "face_pose_e") {
                if (item.pos && item.pos.direction) {
                    label = item.pos.direction;
                }
            }

            drawRect(ctx, x1, y1, x2, y2, "rgb(43, 75, 216)", label, scaleX, scaleY);
          });
        }
        else if (res.type === "object_custom_e") {
          if (res.data.object) {
            res.data.object.forEach((item, idx) => {
              const [x1, y1, x2, y2] = item.box;
              const label = `${item.name} (${item.score}%)`;
              drawRect(ctx, x1, y1, x2, y2, "rgb(217, 65, 65)", label, scaleX, scaleY);
            });
          }
        }
        else if (res.type === "object_search_e") {
          const personData = res.data.person_en || res.data.person;
          const objectData = res.data.object_en || res.data.object;

          if (personData) {
            personData.forEach((item, idx) => {
              const [x1, y1, x2, y2] = item.box;
              const label = `${item.name} (${item.score}%)`;
              drawRect(ctx, x1, y1, x2, y2, "rgb(43, 75, 216)", label, scaleX, scaleY);
            });
          }
          if (objectData) {
            objectData.forEach((item, idx) => {
              const [x1, y1, x2, y2] = item.box;
              const label = `${item.name} (${item.score}%)`;
              drawRect(ctx, x1, y1, x2, y2, "rgb(217, 65, 65)", label, scaleX, scaleY);
            });
          }
        }
        else if (res.type === "object_pose_e") {
          res.data.forEach((item, idx) => {
            const [x1, y1, x2, y2] = item.box;
            ctx.strokeStyle = "rgb(43, 75, 216)";
            ctx.lineWidth = 2;
            ctx.strokeRect(x1*scaleX, y1*scaleY, (x2 - x1)*scaleX, (y2 - y1)*scaleY);
            const points = item.points;
            draw_points.forEach(pair => {
              const p1 = points[pair[0]];
              const p2 = points[pair[1]];
              drawLine(ctx, p1[0], p1[1], p2[0], p2[1], scaleX, scaleY);
            });
            points.forEach(point => {
              drawEllipse(ctx, point[0], point[1], 3, "rgb(217, 65, 65)", scaleX, scaleY);
            });
          });
        }
        else if (res.type === "ocr") {
          res.data.forEach((item, idx) => {
            const [x1, y1, x2, y2] = item.box;
            drawRect(ctx, x1, y1, x2, y2, "rgb(43, 75, 216)", item.text, scaleX, scaleY);
          });
        }
        else if (res.type === "barcode") {
          res.data.forEach((item, idx) => {
            const [x1, y1, x2, y2] = item.box;
            drawRect(ctx, x1, y1, x2, y2, "rgb(43, 75, 216)", item.data, scaleX, scaleY);
          });
        }
      }
      else {
        resultCanvas.width = 640;
        resultCanvas.height = 480;
        ctx.clearRect(0, 0, 640, 480);
      }
    }

    async function handleRun(model, prompt, imageSource) {
      if (!imageSource) {
        alert("이미지를 선택하세요.");
        return;
      }

      if (imageSource instanceof HTMLCanvasElement && imageSource.id === "sketchCanvas") {
        const tempCanvas = document.createElement("canvas");
        tempCanvas.width = imageSource.width;
        tempCanvas.height = imageSource.height;
        const tempCtx = tempCanvas.getContext("2d");
        tempCtx.fillStyle = "#ffffff";
        tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
        tempCtx.drawImage(imageSource, 0, 0);
        imageSource = tempCanvas;
      }

      let imageBlob;
      if (imageSource instanceof HTMLCanvasElement) {
        imageBlob = await new Promise(resolve => imageSource.toBlob(resolve, 'image/jpeg'));
      }
      else if (imageSource instanceof HTMLImageElement) {
        const offCanvas = document.createElement('canvas');
        offCanvas.width = imageSource.naturalWidth;
        offCanvas.height = imageSource.naturalHeight;
        offCanvas.getContext('2d').drawImage(imageSource, 0, 0);
        imageBlob = await new Promise(resolve => offCanvas.toBlob(resolve, 'image/jpeg'));
      }

      if (!imageBlob) {
        alert("이미지를 선택하세요.");
        return;
      }

      const tempImg = new Image();
      tempImg.src = URL.createObjectURL(imageBlob);
      tempImg.onload = function() {
        resizeImage(tempImg, async function(resized) {
          const resizedBlob = resized.blob;
          const resizedWidth = resized.width;
          const resizedHeight = resized.height;
          const newImg = new Image();
          newImg.src = URL.createObjectURL(resizedBlob);
          newImg.onload = async function() {
            const res = await runInference(resizedBlob, prompt, model);
            displayResult(res, newImg, resizedWidth, resizedHeight);
          }
        });
      }
    }

    document.getElementById('mainRunButton').addEventListener('click', async function() {
      const mainRunButton = this;
      const runLabel = document.getElementById('runLabel');
      const resultJSON = document.getElementById('resultJSON');

      mainRunButton.disabled = true;
      runLabel.innerText = '실행 중...';
      resultJSON.innerText = '';
      hideStamp();
      hideEasy();

      const minimumWait = new Promise(resolve => setTimeout(resolve, 1000));

      const runProcess = (async () => {
        try {
          const prompt = document.getElementById('promptInput').value;
          const model = modelSelect.value;

          const activeTab = document.querySelector('.tab-content.active');
          let imageSource = null;

          if (activeTab.id === 'upload') {
            if (!fileInput.files[0]) {
              alert("이미지를 선택하세요.");
              return;
            }
            imageSource = uploadPreview;
          } else if (activeTab.id === 'webcam') {
            if (webcamCanvas.style.display === 'none') {
              alert("웹캠 이미지를 캡쳐하세요.");
              return;
            }
            imageSource = webcamCanvas;
          } else if (activeTab.id === 'sketch') {
            imageSource = sketchCanvas;
          }

          if (imageSource) {
             await handleRun(model, prompt, imageSource);
          }

        } catch (error) {
          console.error("실행 중 오류 발생:", error);
          alert("오류가 발생했습니다. 콘솔을 확인해주세요.");
        }
      })();

      await Promise.all([runProcess, minimumWait]);

      mainRunButton.disabled = false;
      runLabel.innerText = '실행';
    });

    document.getElementById('copyJsonButton').addEventListener('click', function() {
      const jsonText = document.getElementById('resultJSON').innerText;
      if (!jsonText || jsonText.trim() === "") {
        return;
      }

      const textArea = document.createElement("textarea");
      textArea.value = jsonText;
      textArea.style.position = 'fixed';
      textArea.style.top = 0;
      textArea.style.left = 0;
      textArea.style.width = '2em';
      textArea.style.height = '2em';
      textArea.style.padding = 0;
      textArea.style.border = 'none';
      textArea.style.outline = 'none';
      textArea.style.boxShadow = 'none';
      textArea.style.background = 'transparent';

      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();

      try {
        document.execCommand('copy');
        this.innerText = '복사됨!';
        setTimeout(() => {
          this.innerText = '복사';
        }, 1500);
      } catch (err) {
        console.error('JSON 복사 실패:', err);
        alert('복사에 실패했습니다.');
      }

      document.body.removeChild(textArea);
    });
  </script>
