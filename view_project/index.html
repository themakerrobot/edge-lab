<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>edge-lab — 체험하기</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link href="/fonts/fonts.css" rel="stylesheet">
  <script>
    /* 밝은 곳 모드: 화면이 그려지기 전에 적용해야 깜빡이지 않는다 */
    try { if (localStorage.getItem("vapi-hc") === "1")
            document.documentElement.classList.add("hc"); } catch (e) {}
  </script>
  <link rel="stylesheet" href="/lib/tokens.css">
  <!-- 모델 목록·아이콘은 아래 인라인 스크립트가 바로 쓰므로 head 에서 먼저 싣는다 -->
  <script src="/lib/icons.js"></script>
  <script src="/lib/apps.js"></script>
  <script src="/lib/boot.js"></script>
  <style>




    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      color: var(--ink);
      background-color: var(--paper);

      font-family: "Gowun Dodum", "Apple SD Gothic Neo", system-ui, sans-serif;
      line-height: 1.5;
      padding: var(--sp-2, 8px);
      gap: var(--sp-2, 8px);
    }
    .serif { font-family: "Gowun Batang", serif; }

    a { color: var(--pen-blue-d); text-decoration: none; }
    a:hover { text-decoration: underline; }

    select, input, button {
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--ink);
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: var(--r);
      padding: 7px 11px;
      outline: none;
      transition: border-color .12s, background .12s;
    }
    select:hover, input:hover { border-color: #a8a596; }
    select:focus, input:focus { border-color: var(--pen-blue); }
    input[readonly] { background: #fbfaf5; color: var(--ink-2); }

    /* ===== 시험지 머리표 ===== */
    .h-subject .eyebrow {
      font-size: 0.82rem; letter-spacing: .14em; color: var(--ink-2);
    }
    .h-subject .title {
      font-family: "Gowun Batang", serif;
      font-size: 1.15rem; font-weight: 700; letter-spacing: .02em; line-height: 1.2;
    }
    .h-fill { justify-content: center; gap: 4px; }
    .fill-row { display: flex; align-items: baseline; gap: var(--sp-1, 4px); font-size: .88rem; }
    .fill-row .k { color: var(--ink-2); white-space: nowrap; }
    .fill-row .v {
      min-width: 130px;
      border-bottom: 1.5px solid var(--line-d);
      padding: 0 4px 1px;
      font-variant-numeric: tabular-nums;
      color: var(--pen-blue-d);
      white-space: nowrap;
    }
    .h-env { gap: 4px; }
    .h-env .k { font-size: 0.82rem; color: var(--ink-2); }


    /* ===== 시스템 상태바 (온디바이스 콘솔) ===== */   /* lib/sysbar.js 가 오버레이로 옮겨 담는다 */
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: #fff; border: 1.5px solid var(--line); border-radius: 999px;
      padding: 2px 10px; color: #6b6255;
    }
    .chip .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #cfc7b8;
    }
    .chip.on { color: var(--ink); border-color: var(--ink); }
    .chip.on .dot { background: var(--cyan); box-shadow: 0 0 5px rgba(31, 95, 122,.6); }
    .chip.busy { border-color: var(--pen-red); color: var(--pen-red); }
    .chip.busy .dot { background: var(--pen-red); animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: .35; } }
    .chip .st { color: #6b6255; font-variant-numeric: tabular-nums; }
    .chip.on .st { color: var(--ink-2); }
    .chip.hit { border-color: var(--cyan); }
    .chip.hit .st { color: var(--cyan-d); }
    @media (prefers-reduced-motion: reduce) { .chip.busy .dot { animation: none; } }

    /* ===== 문항 공통 ===== */
    .qnum::after { content: "."; }

    /* ===== 조작 줄 — 왼쪽 패널 머리표 =====
       모델·입력 방법·라이브·실행이 한 줄. 프롬프트(물어보는 모델만)는 제 줄.
       내용보다 위에 있는 줄은 전부 내용을 밀어내므로, 여기가 전부다. */
    .run-head { gap: 6px; }
    #modelSelect {
      font-weight: 700; font-size: 13px; min-width: 150px; max-width: 220px;
      min-height: var(--tap-sm, 32px); padding: 0 6px;
    }
    .run-head .q[hidden] { display: none; }
    .tabs { display: flex; gap: 3px; flex: 0 0 auto; }
    .tabButton {
      background: #fff; border: 1.5px solid var(--line);
      border-radius: var(--r); color: var(--ink-2);
      font-size: 13px; font-weight: 600;
      min-height: var(--tap-sm, 32px); padding: 0 10px; cursor: pointer;
      white-space: nowrap;
    }
    .tabButton:hover { color: var(--ink); border-color: var(--cyan); }
    .tabButton.active {
      color: #fff; font-weight: 700;
      background: var(--pen-blue); border-color: var(--pen-blue);
    }
    #promptInput { flex: 1 1 100%; width: 100%; min-height: var(--tap-sm, 32px); font-size: 13.5px; }
    #promptInput[hidden] { display: none; }
    #mainRunButton {
      background: var(--pen-blue); border: 1.5px solid var(--pen-blue); color: #fff;
      font-weight: 700; font-size: 13.5px; min-height: var(--tap-sm, 32px);
      padding: 0 18px; cursor: pointer;
      border-radius: var(--r); white-space: nowrap;
    }
    #mainRunButton:hover { background: var(--pen-blue-d); border-color: var(--pen-blue-d); }
    #mainRunButton:disabled { background: #b9b7ac; border-color: #b9b7ac; cursor: wait; }
    .live-toggle {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 13px; color: var(--ink-2); white-space: nowrap;
      border: 1.5px solid var(--line); border-radius: var(--r);
      min-height: var(--tap-sm, 32px); padding: 0 9px; cursor: pointer; background: #fff;
    }
    .live-toggle input { width: 15px; height: 15px; cursor: pointer; }
    .live-toggle.on { border-color: var(--pen-red); color: var(--pen-red); font-weight: 700; }
    .live-toggle.off { opacity: .45; cursor: not-allowed; }

    /* 결과 도구 (저장) */
    .result-tools { flex: 0 0 auto; display: flex; gap: 8px; margin-top: var(--sp-2, 8px); }
    .result-tools button {
      background: #fff; border: 1.5px solid var(--line); color: var(--ink-2);
      font-size: .85rem; padding: 4px 14px; cursor: pointer; border-radius: var(--r);
    }
    .result-tools button:hover { border-color: var(--pen-blue); color: var(--pen-blue-d); }

    /* 기록 스트립 */
    .history { flex: 0 0 auto; margin-top: var(--sp-2, 8px); }
    .history .h-title {
      font-family: "Gowun Batang", serif; font-weight: 700; font-size: .88rem;
      color: var(--ink-2); margin-bottom: 6px;
    }
    .history .strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .history .item {
      flex: 0 0 auto; width: 92px; cursor: pointer;
      border: 1.5px solid var(--line); border-radius: var(--r); padding: 4px;
      background: #fff;
    }
    .history .item:hover { border-color: var(--pen-blue); }
    .history .item img { width: 100%; height: 62px; object-fit: cover; border-radius: 3px; display: block; }
    .history .item .cap {
      font-size: 0.82rem; color: var(--ink-2); margin-top: 3px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* ===== 답안 영역 (좌우) ===== */

    .tab-content { display: none; }
    .tab-content.active {
      display: flex; flex-direction: column;
      flex: 1 1 auto; min-height: 0;
    }

    /* 붙임 상자 (업로드) — "사진을 붙이세요" */
    .upload-container {
      border: 2px dashed #b3b0a2;
      border-radius: var(--r);
      flex: 1 1 auto; min-height: 240px;
      display: flex; align-items: center; justify-content: center; text-align: center;
      color: var(--ink-2); cursor: pointer;
      background: #fdfcf8;
      transition: border-color .15s, background .15s;
      padding: 14px;
    }
    .upload-container:hover { border-color: var(--pen-blue); color: var(--ink); background: #f7f8ff; }
    .upload-container .hint { margin-top: 6px; }
    #uploadPreview {
      max-width: 100%; max-height: 100%; height: auto;
      object-fit: contain; display: none; border-radius: 3px;
    }

    .webcam-container {
      border: 1.5px solid var(--line);
      border-radius: var(--r);
      flex: 1 1 auto; min-height: 240px; min-width: 0;
      display: flex; flex-wrap: wrap; gap: var(--sp-2, 8px); align-items: center; justify-content: center;
      background: #fdfcf8; padding: 14px;
    }
    #webcamVideo, #webcamCanvas {
      /* 스트리밍/캡처 2장이 한 줄에 나란히: 반응형으로 늘고 줄어들며,
         좁아지면 flex-wrap에 의해 자동으로 세로 배치로 전환 */
      flex: 1 1 300px;
      width: auto; min-width: 240px;
      max-width: calc(50% - 6px); max-height: 100%;
      object-fit: contain; background: #222; border-radius: 3px;
    }
    #webcamCanvas { display: none; background: #fff; }
    /* 캡처 전(1장뿐)에는 넓게 사용 */
    .webcam-container:has(#webcamCanvas[style*="none"]) #webcamVideo { max-width: 100%; }
    @media (max-width: 1023px) {
      #webcamVideo, #webcamCanvas { max-width: 100%; }
    }

    .sketch-container {
      border: 1.5px solid var(--line);
      border-radius: var(--r);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      flex: 1 1 auto; min-height: 0;
      background: #fdfcf8; padding: 14px;
    }
    #sketchCanvas {
      background: #fff; border: 1px solid var(--line);
      max-width: 100%; max-height: 100%; height: auto;
      touch-action: none; border-radius: 3px;
    }
    .sketch-controls { margin-top: var(--sp-2, 8px); display: flex; align-items: center; gap: var(--sp-2, 8px); flex-wrap: wrap; }
    .sketch-controls input[type="color"] { padding: 2px; width: 42px; height: 34px; cursor: pointer; }
    .sketch-controls input[type="range"] { cursor: pointer; }

    .button-row { margin-top: var(--sp-2, 8px); flex: 0 0 auto; display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-line {
      background: #fff; border: 1.5px solid var(--line-d); color: var(--ink);
      font-weight: 600; padding: 7px 18px; cursor: pointer; border-radius: var(--r);
    }
    .btn-line:hover { background: var(--paper); }

    /* 답란 (결과) */
    .result-frame {
      position: relative;
      border: 1.5px solid var(--line-d);
      border-radius: 3px;
      background: #fff;
      padding: 12px;
      display: flex; align-items: center; justify-content: center;
      flex: 1 1 auto; min-height: 200px;
      max-width: 100%;
    }
    #resultCanvas {
      max-width: 100%; max-height: 100%;
      width: auto; height: auto;
      object-fit: contain; display: block;
    }

    /* 확인 도장 — 실행 완료 시에만 */
    #stampMark {
      position: absolute; top: 8px; right: 8px;
      width: 84px; height: 84px;
      border: 3px double var(--pen-red);
      border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1px;
      font-family: "Gowun Batang", serif; font-weight: 700; font-size: 0.82rem;
      color: var(--pen-red);
      background: rgba(255,255,255,.72);
      transform: rotate(-12deg) scale(0);
      opacity: 0;
      pointer-events: none;
    }
    #stampMark::before {
      content: "";
      width: 40px; height: 44px;
      background: url('/assets/pibo-thumbsup.png') center/contain no-repeat;
    }
    #stampMark.complete::before { background-image: url('/assets/pibo-hero.png'); }
    #stampMark.show {
      animation: stampIn .35s cubic-bezier(.2, 1.6, .4, 1) forwards;
    }
    @keyframes stampIn {
      to { transform: rotate(-12deg) scale(1); opacity: .88; }
    }
    @media (prefers-reduced-motion: reduce) {
      #stampMark.show { animation: none; transform: rotate(-12deg) scale(1); opacity: .88; }
    }


    /* 풀이 (쉬운 결과) */
    .easy-answer {
      display: none;
      flex: 0 0 auto;
      margin-top: var(--sp-3, 12px);
      align-items: flex-start; gap: var(--sp-2, 8px);
    }
    .easy-answer.show { display: flex; }
    .easy-answer .pibo {
      flex: 0 0 auto; width: 64px; height: 72px;
      background: url('/assets/pibo-idea.png') center/contain no-repeat;
      margin-top: 2px;
    }
    .easy-answer.fail .pibo { background-image: url('/assets/pibo-hmm.png'); }
    .easy-answer .bubble-wrap {
      position: relative; flex: 1 1 auto;
      background: #f5f7ff;
      border: 1.5px solid var(--pen-blue);
      border-radius: 10px;
      padding: 10px 14px;
    }
    .easy-answer .bubble-wrap::before {
      content: "";
      position: absolute; left: -9px; top: 22px;
      width: 14px; height: 14px;
      background: #f5f7ff;
      border-left: 1.5px solid var(--pen-blue);
      border-bottom: 1.5px solid var(--pen-blue);
      transform: rotate(45deg);
    }
    .easy-answer.fail .bubble-wrap { background: #fdf3f2; border-color: var(--pen-red); }
    .easy-answer.fail .bubble-wrap::before { background: #fdf3f2; border-color: var(--pen-red); }
    .easy-answer .ea-label {
      flex: 0 0 auto;
      font-family: "Gowun Batang", serif; font-weight: 700; font-size: .82rem;
      color: var(--pen-blue-d);
      margin-bottom: 3px;
    }
    .easy-answer.fail .ea-label { color: var(--pen-red); }
    #easyText .sub { color: var(--ink-2); font-size: .85rem; }
    #easyText b { color: var(--pen-blue-d); }

    /* 연습장 (JSON) — 접이식 */
    .scratchpad { margin-top: var(--sp-3, 12px); flex: 0 0 auto; }
    .scratchpad summary {
      cursor: pointer; list-style: none;
      display: flex; align-items: center; gap: 8px;
      font-family: "Gowun Batang", serif; font-weight: 700; font-size: .95rem;
      color: var(--ink-2);
      user-select: none;
    }
    .scratchpad summary::-webkit-details-marker { display: none; }
    .scratchpad summary::before { content: "▸"; color: var(--pen-blue); }
    .scratchpad[open] summary::before { content: "▾"; }
    .scratchpad .pad-tools { display: flex; justify-content: flex-end; margin: var(--sp-1, 4px) 0; }
    #copyJsonButton {
      background: #fff; border: 1.5px solid var(--line); color: var(--ink-2);
      font-size: .85rem; padding: 4px 14px; cursor: pointer; border-radius: var(--r);
    }
    #copyJsonButton:hover { border-color: var(--pen-blue); color: var(--pen-blue-d); }
    .scratchpad pre {
      background: #fdfcf8;
      background-image: repeating-linear-gradient(
        transparent 0, transparent 23px, var(--rule) 23px, var(--rule) 24px
      );
      border: 1.5px solid var(--line);
      border-radius: var(--r);
      padding: 12px 14px;
      max-height: 300px; overflow-y: auto;
      font-size: .82rem;
      font-family: "Menlo", "Consolas", ui-monospace, monospace;
      line-height: 24px;
      white-space: pre-wrap; word-wrap: break-word;
      color: #3a3a42;
    }
    .scratchpad pre:empty::before { content: "실행하면 결과 데이터가 여기에 적혀요."; color: #6b6255; }
    html[lang="en"] .scratchpad pre:empty::before { content: "Run once and the result data shows up here."; }

    /* 스크롤바 */
    .panel-body::-webkit-scrollbar, .scratchpad pre::-webkit-scrollbar { width: 10px; }
    .panel-body::-webkit-scrollbar-thumb, .scratchpad pre::-webkit-scrollbar-thumb {
      background: #cfc7b8; border-radius: 999px;
    }

    /* ===== 반응형 ===== */
    /* 좁은 화면 — 기준은 lib/tokens.css 주석의 네 개뿐이다(md 1023 / sm 639).
       전에는 페이지마다 560/860/900/960/980/1200 이 섞여 있어, 같은 창 폭에서
       화면을 옮기면 어떤 것은 접히고 어떤 것은 눌려서 잘렸다.
       body 스크롤과 .main-container 세로 적층은 lib/shell.css 가 한 번에 하므로
       여기는 이 화면에만 필요한 것만 남긴다. */
    @media (max-width: 1023px) {
      .main-container { min-height: 0; }
      .panel-body { overflow: visible; display: block; }
      .tab-content.active { display: block; }
      .upload-container, .webcam-container, .sketch-container, .result-frame { min-height: 260px; }
    }
  </style>
  <link rel="stylesheet" href="/lib/ui.css">
  <link rel="stylesheet" href="/lib/shell.css">
</head>
<body data-density="explore">

  <!-- 시험지 머리표 -->
  <div class="titlebar">
    <a class="tb-brand" href="/" title="인터넷 없이 내 컴퓨터에서 실행돼요">
      <img src="/assets/pibo-logo.png" alt=""><b>edge-lab</b>
    </a>
    <span class="tb-sep"></span>
    <span class="tb-app" id="txtTitle"></span>
    <div class="h-tools">
      <button id="langButton" title="한국어 / English">EN</button>
    </div>
  </div>

  <div class="shell-body">
    <div class="workbench">

  <!-- 문항 1·2 는 왼쪽 패널 머리표로 들어갔다 (아래).
       전에는 이 자리에 가로 막대 두 개가 따로 서 있어서, 헤더까지 합쳐
       내용 이전에 183px 을 먹었다. 고를 것(모델)과 실행할 것(탭·프롬프트·실행)은
       모두 왼쪽 "입력" 패널에 딸린 조작이라 그 패널 머리표에 모은다. -->

  <!-- 답안 영역 -->
  <div class="main-container">
    <!-- 왼쪽: 입력 -->
    <div class="panel">
      <div class="panel-head run-head">
        <!-- 문항 제목은 두지 않는다 — 드롭다운(고른 AI)이 곧 제목이고,
             글자 한 덩어리가 더 있으면 1366px 에서 줄이 접힌다. -->
        <span class="q" hidden><span class="qnum">1</span><span class="qtext" id="txtQ1">골라서 실행해요</span></span>
        <!-- 지금 고른 AI. 홈의 아이콘으로 들어오면 그게 골라져 있고,
             여기서 바로 다른 것으로 바꿀 수도 있다(홈에 갔다 오지 않아도). -->
        <select id="modelSelect" aria-label="모델"></select>
        <span class="tabs">
          <button class="tabButton active" data-tab="upload" id="txtTabUpload">이미지</button>
          <button class="tabButton" data-tab="webcam" id="txtTabWebcam">웹캠</button>
          <button class="tabButton" data-tab="sketch" id="txtTabSketch">스케치북</button>
        </span>
        <span class="right">
          <label class="live-toggle" id="liveToggle" title="웹캠에서 계속 인식합니다 (빠른 모델만)">
            <input type="checkbox" id="liveCheck"> <span id="txtLive">라이브</span>
          </label>
          <button id="mainRunButton" title="스페이스바로도 실행할 수 있어요"><span id="runLabel">실행</span></button>
        </span>
        <!-- 프롬프트는 물어보는 모델에서만 보인다. 나머지 열다섯은 값이 "-" 인 채
             서버로도 안 가는 칸이었다. 보일 때는 제 줄을 통째로 쓴다 —
             오른쪽 구석에 어정쩡하게 두 줄로 접히던 것. -->
        <input type="text" id="promptInput" value="-" aria-label="프롬프트"
               placeholder="사진에 대해 물어볼 말" />
      </div>
      <!-- 고른 모델이 무엇을 하는지 — 전에는 [가이드] 라는 읽기 전용 입력칸이었다.
           입력칸처럼 생겼는데 못 쓰는 칸이라 아이가 눌러 보고 헤맸다. 글로 바꾼다. -->
      <!-- 고른 모델 설명은 드롭다운의 title(툴팁)로만. 한 줄을 통째로 쓰던 안내 줄은
           걷어냈다 — 내용보다 위에 있는 줄은 전부 내용을 밀어낸다. -->
      <span id="guide" hidden></span>
      <a id="apiDocLink" href="#" target="_blank" hidden>API Docs</a>

  <script>
    /****************************************************
     * 기능 로직은 기존과 동일 (스타일/도장/연습장만 변경)
     * edge-lab: local(same-origin) 모드 추가, gan 변환 4종 재구성, 캡션 제거
     ****************************************************/

    const HOST = "";  // 온디바이스: 같은 서버(same-origin) 고정

    /* ═════ 한/영 ═════ */
    let LANG = "ko";
    try { LANG = localStorage.getItem("vapiLang") || "ko"; } catch (e) {}
    document.documentElement.lang = LANG;

    const UI = {
      ko: {
        titleTag: "edge-lab — 체험하기", title: "edge-lab",
        eyebrow: "체험하기 · AI 16가지를 눌러 봐요 · 인터넷 없이 내 컴퓨터에서",
        blocksLink: "블록", trainLink: "가르치기", codeLink: "파이썬", talkLink: "대화", optionsTip: "설정", langBtn: "EN",
        cam_denied: "카메라를 쓸 수 없어요.<br>주소창 왼쪽(또는 창 위쪽)의 자물쇠·카메라 아이콘을 눌러 <b>허용</b>으로 바꿔 주세요.",
        cam_busy: "다른 프로그램이 카메라를 쓰고 있어요.<br>화상회의·카메라 앱을 닫고 다시 눌러 보세요.",
        cam_none: "카메라를 찾지 못했어요.<br>웹캠이 꽂혀 있는지, 노트북이라면 카메라 덮개가 열려 있는지 확인해 주세요.",
        cam_fail: "카메라를 켜지 못했어요.",
        cam_retry: "다시 시도",
        customGroup: "내가 가르친 AI", customTip: "내가 직접 학습시킨 모델로 분류합니다.",
        q1: "골라서 실행해요", q3: "결과를 확인해요",
        tabUpload: "이미지", tabWebcam: "웹캠", tabSketch: "스케치북",
        live: "라이브", run: "실행", running: "실행 중...", liveRun: "라이브 중",
        uploadMain: "이 칸에 이미지를 붙여 보세요", uploadHint: "끌어놓기 또는 클릭해서 업로드",
        capture: "캡쳐", penColor: "색상", penWidth: "굵기", clearSketch: "초기화",
        stamp: "확인!", stampDone: "참 잘했어요", easyLabel: "파이보의 풀이",
        saveResult: "결과 이미지 저장", clearHistory: "기록 지우기",
        historyTitle: "실행 기록 — 눌러서 다시 보기",
        details: "상세보기 — 결과 데이터(JSON)", copy: "복사", copied: "복사됨!",
        promptQ: "이미지를 설명해주세요.",
        liveOkTip: "웹캠으로 계속 인식합니다 (체크하면 웹캠 탭으로 전환)",
        liveNoTip: "이 모델은 응답이 길어 라이브를 지원하지 않아요 (얼굴·사물·포즈 계열에서 사용)",
        aSelectImage: "이미지를 선택하세요.", aCapture: "웹캠 이미지를 캡쳐하세요.",
        aRunFirst: "먼저 실행해 주세요.", aError: "오류가 발생했습니다. 콘솔을 확인해주세요.",
        aNoWebcam: "웹캠을 사용할 수 없어요. 카메라 권한을 확인해 주세요.",
        aCopyFail: "복사에 실패했습니다.",
      },
      en: {
        titleTag: "edge-lab — Try it", title: "edge-lab",
        eyebrow: "Try it · 16 AIs · runs on this computer, no internet",
        blocksLink: "Blocks", trainLink: "Train", codeLink: "Python", talkLink: "Talk", optionsTip: "Settings", langBtn: "한",
        cam_denied: "Camera is blocked.<br>Click the lock or camera icon near the address bar and choose <b>Allow</b>.",
        cam_busy: "Another app is using the camera.<br>Close video-call or camera apps, then try again.",
        cam_none: "No camera found.<br>Check that a webcam is connected and the privacy cover is open.",
        cam_fail: "Could not start the camera.",
        cam_retry: "Try again",
        customGroup: "My own AI", customTip: "Classifies with a model you trained yourself.",
        q1: "Pick one and run", q3: "Check the result",
        tabUpload: "Image", tabWebcam: "Webcam", tabSketch: "Sketchbook",
        live: "Live", run: "Run", running: "Running...", liveRun: "Live",
        uploadMain: "Drop an image here", uploadHint: "Drag & drop, or click to upload",
        capture: "Capture", penColor: "Color", penWidth: "Width", clearSketch: "Clear",
        stamp: "Done!", stampDone: "Great job!", easyLabel: "Pibo says",
        saveResult: "Save result image", clearHistory: "Clear history",
        historyTitle: "History — click to view again",
        details: "Details — result data (JSON)", copy: "Copy", copied: "Copied!",
        promptQ: "Describe this image.",
        liveOkTip: "Keeps detecting from the webcam (checking switches to the webcam tab)",
        liveNoTip: "This model is too slow for live mode (use face / object / pose models)",
        aSelectImage: "Choose an image first.", aCapture: "Capture a webcam image first.",
        aRunFirst: "Run something first.", aError: "Something went wrong. Check the console.",
        aNoWebcam: "No webcam available. Check the camera permission.",
        aCopyFail: "Copy failed.",
      },
    };
    const T = k => UI[LANG][k] !== undefined ? UI[LANG][k] : UI.ko[k];

    /* 묶음 순서 = 화면에 보이는 순서. 얼굴 → 몸·손 → 사물 → 개별 인식 →
       말로 답하는 AI → 사진 바꾸기 → 글자·QR (빠른 것부터, 느린 VLM 은 뒤로) */
    /* 모델 목록은 lib/apps.js 가 갖는다 — 런처(/)와 이 화면이 같은 표를 본다.
       전에는 이 자리에 SERVICE_LIST 가 통째로 있어서, 런처를 만들면 두 벌이 됐다. */
    const GROUPS = EL_APPS.GROUPS;
    const SERVICE_LIST = EL_APPS.SERVICE_LIST;
    const mName = key => EL_APPS.name(key, LANG);
    const mTip  = key => EL_APPS.tip(key, LANG);

    const MAX_WIDTH = 1600;
    const MAX_HEIGHT = 1600;
    const draw_points = [
      [0,1],[0,2],[1,3],[2,4],[5,6],[5,7],[5,11],[6,8],[6,12],
      [7,9],[8,10],[11,12],[11,13],[12,14],[13,15],[14,16]
    ];
    const apiDocLink = document.getElementById('apiDocLink');

    /* ----- 시스템 상태바 ----- */
    let runCount = 0;
    /* 상태 칸은 lib/sysbar.js 가 오버레이에 만든다 — 이 코드가 도는 시점에는 아직
       없을 수 있으므로 미리 잡아 두지 않고, 쓸 때마다 찾는다(없으면 조용히 넘어간다).
       예전에는 미리 잡아 두어 null 이 되었고, 거기서 오류가 나 뒤 코드가 멈췄다. */
    const pick = id => document.getElementById(id) || { set textContent(v) {}, style: {} };
    const sysEl = {
      get elapsed() { return pick('sysElapsed'); },
      get device()  { return pick('sysDevice');  },
      get runs()    { return pick('sysRuns');    },
    };
    /* 서비스명 -> 실행 디바이스 (서버가 런타임에서 읽은 실측값) */
    let DEVICE_OF = {};
    const DEV_STATS = { CPU:{n:0,ms:0}, GPU:{n:0,ms:0}, NPU:{n:0,ms:0} };
    const svcName = model => (SERVICE_LIST[model].api.split('/')[1] || '');
    const devOf = model => (DEVICE_OF[svcName(model)] || '').toUpperCase();

    /* 모델 로딩이 끝나기 전에는 디바이스 표가 비어 있다. 준비될 때까지 다시 물어본다. */
    (async function initSystem() {
      try {
        const info = await (await fetch('/system')).json();
        DEVICE_OF = info.device_of || {};
        (info.devices || []).forEach(d => {
          const el = sysEl[d.toLowerCase()];
          if (el) el.classList.add('on');
        });
        if (info.ready) return;
      } catch (e) { /* 서버가 아직 못 뜬 경우 */ }
      setTimeout(initSystem, 1500);
    })();
    /* 실행 중에는 '그 디바이스 칩만' 점멸시킨다.
       세 칩이 전부 켜지면 어디서 도는지 구분이 안 된다. */
    let LAST_DEV = '';                     // 서버가 마지막으로 알려준 실행 장치
    function sysBusy(on, dev) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('busy'));
      if (!on) return;
      /* 어느 칩이 일할지 모르면 아무 칩도 켜지 않는다.
         전부 켜면 "세 개를 동시에 쓴다"는 잘못된 인상을 준다. */
      const el = sysEl[((dev || LAST_DEV) || '').toLowerCase()];
      if (el) el.classList.add('busy');
    }
    function sysReport(res, ms) {
      runCount++;
      sysEl.runs.textContent = runCount;
      const took = (res && res.elapsed_ms) ? res.elapsed_ms : ms;
      sysEl.elapsed.textContent = took + ' ms';
      const dev = ((res && res.device) || '').toUpperCase();
      sysEl.device.textContent = dev || '--';
      if (dev) LAST_DEV = dev;

      const st = DEV_STATS[dev];
      if (st) {
        st.n++; st.ms = took;
        const el = document.getElementById('st' + dev);
        if (el) el.textContent = ' ' + took + 'ms ×' + st.n;
        const chip = sysEl[dev.toLowerCase()];
        if (chip) {
          chip.classList.add('hit');
          setTimeout(() => chip.classList.remove('hit'), 600);
        }
      }
    }


    apiDocLink.href = '/docs';
    /* 선생님용 링크 — 타이틀바 도구로. 조작 줄에서는 자리만 먹는다 */
    apiDocLink.hidden = false;
    document.querySelector('.titlebar .h-tools').prepend(apiDocLink);

    /* ----- 언어 적용 (정적 텍스트) ----- */
    (function applyStatic() {
      const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
      document.title = T("titleTag");
      if (window.navRepaint) window.navRepaint();   /* 레일 글자는 lib/shell.js 가 갖고 있다 */
      set("langButton", T("langBtn"));
      set("txtQ1", T("q1")); set("txtQ3", T("q3"));
      set("txtTabUpload", T("tabUpload")); set("txtTabWebcam", T("tabWebcam"));
      set("txtTabSketch", T("tabSketch"));
      set("txtLive", T("live")); set("runLabel", T("run"));
      set("txtUploadMain", T("uploadMain")); set("txtUploadHint", T("uploadHint"));
      set("captureWebcam", T("capture"));
      set("txtPenColor", T("penColor")); set("txtPenWidth", T("penWidth"));
      set("clearSketch", T("clearSketch"));
      set("stampMark", T("stamp")); set("txtEasyLabel", T("easyLabel"));
      set("saveResultButton", T("saveResult")); set("clearHistoryButton", T("clearHistory"));
      set("txtHistoryTitle", T("historyTitle")); set("txtDetails", T("details"));
      set("copyJsonButton", T("copy"));
    })();
    document.getElementById('langButton').addEventListener('click', function() {
      try { localStorage.setItem("vapiLang", LANG === "ko" ? "en" : "ko"); } catch (e) {}
      location.reload();       // 상태가 많은 페이지라 새로고침 전환이 안전
    });

    const modelSelect = document.getElementById('modelSelect');
    const guide = document.getElementById('guide');
    modelSelect.addEventListener('change', function() {
      const selected = this.value;
      let prompt = "-";
      if (selected === "이미지 질문·설명") {
        prompt = T("promptQ");            // 비우면 서버가 알아서 설명해 준다
      }
      document.getElementById('promptInput').value = prompt;
      /* 물어보는 모델일 때만 프롬프트 칸을 보여 준다 — 값은 그대로 두므로
         runInference 쪽(값이 "-" 면 안 보냄)은 손댈 것이 없다. */
      document.getElementById('promptInput').hidden = (prompt === "-");
      guide.textContent = mTip(selected);
      modelSelect.title = mTip(selected);
    });

    /* 묶음(optgroup)으로 나눠 넣는다 — 스물몇 개를 한 줄로 늘어놓으면 못 찾는다 */
    GROUPS.forEach(([id, ko, en]) => {
      const keys = Object.keys(SERVICE_LIST).filter(k => SERVICE_LIST[k].g === id);
      if (!keys.length) return;
      const group = document.createElement('optgroup');
      group.label = (LANG === "en" ? en : ko);
      keys.forEach(key => {
        const option = document.createElement('option');
        option.value = key;               // 내부 키는 한국어 이름 그대로 (API 매핑 유지)
        option.text = mName(key);
        group.appendChild(option);
      });
      modelSelect.appendChild(group);
    });
    /* 홈의 AI 아이콘을 눌러 들어오면 그 AI 로 바로 시작한다 (/try?m=...).
       없거나 모르는 값이면 조용히 기본값으로 — 옛 북마크로 들어올 수 있다. */
    (function pickFromUrl() {
      let want = "";
      try { want = new URLSearchParams(location.search).get("m") || ""; } catch (e) {}
      modelSelect.value = (want && SERVICE_LIST[want]) ? want : "얼굴 인식";
      if (!modelSelect.value) modelSelect.value = "얼굴 인식";
      guide.textContent = mTip(modelSelect.value);
      modelSelect.dispatchEvent(new Event('change')); // 프롬프트 기본값 반영
    })();

    /* ----- 내가 만든 AI (train.html 에서 학습한 모델) ----- */
    async function loadCustomModels() {
      let list = [];
      try {
        const r = await fetch(HOST + '/custom/models');
        const j = await r.json();
        list = (j.result === 'ok' && Array.isArray(j.data)) ? j.data : [];
      } catch (e) { return; }
      if (!list.length) return;
      const group = document.createElement('optgroup');
      group.label = T("customGroup");
      list.forEach(m => {
        const key = "custom:" + m.slug;
        SERVICE_LIST[key] = {
          api: "custom/predict", params: { model: m.slug },
          ko: m.title, en: m.title,
          tooltip: T("customTip") + " (" + (m.labels || []).join(", ") + ")",
          tooltip_en: T("customTip") + " (" + (m.labels || []).join(", ") + ")",
        };
        LIVE_OK.add(key);                    // 가벼운 모델이라 라이브 가능
        const o = document.createElement('option');
        o.value = key; o.text = m.title;
        group.appendChild(o);
      });
      modelSelect.appendChild(group);
    }

    const tabButtons = document.querySelectorAll('.tabButton');
    tabButtons.forEach(btn => {
      btn.addEventListener('click', function() {
        const tab = this.getAttribute('data-tab');
        document.querySelectorAll('.tab-content').forEach(div => {
          div.classList.remove('active');
        });
        document.getElementById(tab).classList.add('active');
        tabButtons.forEach(b => b.classList.remove('active'));
        this.classList.add('active');
      });
    });

    const fileInput = document.getElementById('fileInput');
    const uploadPlaceholder = document.getElementById('uploadPlaceholder');
    const uploadText = document.getElementById('uploadText');
    const uploadPreview = document.getElementById('uploadPreview');

    uploadPlaceholder.addEventListener('click', () => fileInput.click());
    uploadPlaceholder.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
    });
    uploadPlaceholder.addEventListener('drop', e => {
      e.preventDefault();
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        fileInput.files = e.dataTransfer.files;
        handleFileInput(e.dataTransfer.files[0]);
      }
    });
    fileInput.addEventListener('change', function() {
      if (fileInput.files.length > 0) {
        handleFileInput(fileInput.files[0]);
      }
    });
    function handleFileInput(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        if (uploadText) {
          uploadText.style.display = 'none';
        }
        uploadPreview.src = e.target.result;
        uploadPreview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    const webcamVideo = document.getElementById('webcamVideo');
    const webcamCanvas = document.getElementById('webcamCanvas');
    const webcamMsg = document.getElementById('webcamMsg');

    /* 웹캠이 안 될 때 검은 화면만 보이면 왜 그런지 알 수 없다 — 이유를 화면에 적는다 */
    function showWebcamError(err) {
      const name = (err && err.name) || "";
      const why = {
        NotAllowedError:  T("cam_denied"),
        NotReadableError: T("cam_busy"),
        NotFoundError:    T("cam_none"),
        OverconstrainedError: T("cam_none"),
      }[name] || (T("cam_fail") + " (" + (name || err) + ")");
      webcamVideo.style.display = "none";
      webcamMsg.style.display = "block";
      webcamMsg.innerHTML = why +
        '<br><br><button class="btn" id="webcamRetry">' + T("cam_retry") + "</button>";
      const btn = document.getElementById("webcamRetry");
      if (btn) btn.addEventListener("click", startWebcam);
      console.log("웹캠 접근 오류:", err);
    }

    function startWebcam() {
      if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
        showWebcamError({ name: "NotFoundError" });
        return;
      }
      webcamMsg.style.display = "none";
      webcamVideo.style.display = "";
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
          webcamVideo.srcObject = stream;
          webcamVideo.play();
        })
        .catch(showWebcamError);
    }
    startWebcam();
    document.getElementById('captureWebcam').addEventListener('click', function() {
      const ctx = webcamCanvas.getContext('2d');
      ctx.drawImage(webcamVideo, 0, 0, webcamCanvas.width, webcamCanvas.height);
      webcamCanvas.style.display = 'block';
    });

    const sketchCanvas = document.getElementById('sketchCanvas');
    const sketchCtx = sketchCanvas.getContext('2d');
    const penColor = document.getElementById('penColor');
    const penWidth = document.getElementById('penWidth');
    let drawing = false;

    function clearSketchCanvas() {
      sketchCtx.fillStyle = "#ffffff";
      sketchCtx.fillRect(0, 0, sketchCanvas.width, sketchCanvas.height);
    }
    clearSketchCanvas();

    function getSketchPos(clientX, clientY) {
      const rect = sketchCanvas.getBoundingClientRect();
      return {
        x: (clientX - rect.left) * (sketchCanvas.width / rect.width),
        y: (clientY - rect.top) * (sketchCanvas.height / rect.height)
      };
    }

    sketchCanvas.addEventListener('mousedown', e => {
      drawing = true;
      const p = getSketchPos(e.clientX, e.clientY);
      sketchCtx.beginPath();
      sketchCtx.moveTo(p.x, p.y);
    });
    sketchCanvas.addEventListener('mousemove', e => {
      if (drawing) {
        const p = getSketchPos(e.clientX, e.clientY);
        sketchCtx.lineWidth = penWidth.value;
        sketchCtx.strokeStyle = penColor.value;
        sketchCtx.lineCap = 'round';
        sketchCtx.lineTo(p.x, p.y);
        sketchCtx.stroke();
      }
    });
    sketchCanvas.addEventListener('mouseup', () => { drawing = false; });
    sketchCanvas.addEventListener('mouseleave', () => { drawing = false; });

    sketchCanvas.addEventListener('touchstart', e => {
      e.preventDefault();
      drawing = true;
      const t = e.touches[0];
      const p = getSketchPos(t.clientX, t.clientY);
      sketchCtx.beginPath();
      sketchCtx.moveTo(p.x, p.y);
    }, { passive: false });
    sketchCanvas.addEventListener('touchmove', e => {
      e.preventDefault();
      if (!drawing) return;
      const t = e.touches[0];
      const p = getSketchPos(t.clientX, t.clientY);
      sketchCtx.lineWidth = penWidth.value;
      sketchCtx.strokeStyle = penColor.value;
      sketchCtx.lineCap = 'round';
      sketchCtx.lineTo(p.x, p.y);
      sketchCtx.stroke();
    }, { passive: false });
    sketchCanvas.addEventListener('touchend', () => { drawing = false; });

    document.getElementById('clearSketch').addEventListener('click', () => {
      clearSketchCanvas();
    });

    function resizeImage(image, callback) {
      const canvas = document.createElement('canvas');
      let width = image.width;
      let height = image.height;
      if (width > MAX_WIDTH) {
        height = height * (MAX_WIDTH / width);
        width = MAX_WIDTH;
      }
      if (height > MAX_HEIGHT) {
        width = width * (MAX_HEIGHT / height);
        height = MAX_HEIGHT;
      }
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(image, 0, 0, width, height);
      canvas.toBlob(function(blob) {
        callback({ blob: blob, width: width, height: height });
      }, 'image/jpeg');
    }

    function drawRect(ctx, x1, y1, x2, y2, color, text, scaleX, scaleY) {
      const rectX = x1 * scaleX;
      const rectY = y1 * scaleY;
      const rectWidth = (x2 - x1) * scaleX;
      const rectHeight = (y2 - y1) * scaleY;

      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.strokeRect(rectX, rectY, rectWidth, rectHeight);

      if (text) {
        ctx.font = "16px 'Gowun Dodum', 'Apple SD Gothic Neo', sans-serif";
        const textMetrics = ctx.measureText(text);
        const textWidth = textMetrics.width;
        const textHeight = 16;

        ctx.fillStyle = color;
        ctx.fillRect(rectX, rectY - textHeight - 4, textWidth + 8, textHeight + 4);

        ctx.fillStyle = "#ffffff";
        ctx.fillText(text, rectX + 4, rectY - 4);
      }
    }

    function drawLine(ctx, x1, y1, x2, y2, scaleX, scaleY) {
      ctx.beginPath();
      ctx.moveTo(x1*scaleX, y1*scaleY);
      ctx.lineTo(x2*scaleX, y2*scaleY);
      ctx.stroke();
    }
    function drawEllipse(ctx, x, y, radius, color, scaleX, scaleY) {
      ctx.beginPath();
      ctx.ellipse(x*scaleX, y*scaleY, radius*scaleX, radius*scaleY, 0, 0, 2*Math.PI);
      ctx.strokeStyle = color;
      ctx.stroke();
    }

    async function runInference(imageBlob, prompt, model) {
      const selectedService = SERVICE_LIST[model];
      let url = HOST + '/' + selectedService.api;

      const formData = new FormData();
      formData.append('uploadFile', imageBlob, 'image.jpg');
      /* 메뉴 이름이 아니라 주소로 가른다 — 메뉴 이름은 바뀌어도 주소는 그대로다.
         (예전에는 없어진 이름 "이미지 질문"·"이미지 설명" 을 비교해 물음이 안 갔다)
         params 는 손대지 않고 복사본에 담는다 — 원본을 고치면 다음 실행까지 남는다. */
      const params = Object.assign({ lang: LANG }, selectedService.params);
      if (selectedService.api === "vlm/look") {
        const q = (prompt || "").trim();
        if (q && q !== "-") { params.prompt = q; }   // 비우면 서버가 알아서 설명해 준다
      }
      const query = new URLSearchParams(params).toString();                 // VLM 응답 언어
      url = url + '?' + query;
      try {
        const response = await fetch(url, { method: 'POST', body: formData });
        return await response.json();
      } catch (err) {
        return { error: err.toString() };
      }
    }

    /* ----- 확인 도장 ----- */
    const stampMark = document.getElementById('stampMark');
    function hideStamp() { stampMark.classList.remove('show'); }
    function showStamp() {
      stampMark.classList.remove('show');
      void stampMark.offsetWidth; // 애니메이션 재시작
      stampMark.classList.add('show');
    }

    /* ----- 쉬운 결과 (풀이) — 서버 응답 스키마 기반 ----- */
    const easyAnswer = document.getElementById('easyAnswer');
    const easyText = document.getElementById('easyText');
    function hideEasy() { easyAnswer.classList.remove('show'); easyText.innerHTML = ''; }
    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function nameCounts(items, key) {
      const m = {};
      (items || []).forEach(it => { const n = it[key]; if (n) m[n] = (m[n] || 0) + 1; });
      return Object.entries(m).map(([n, c]) =>
        c > 1 ? (LANG === 'en' ? `${esc(n)} ×${c}` : `${esc(n)} ${c}개`) : esc(n)).join(', ');
    }
    function easySummary(res) {
      if (!res || res.result === 'fail' || res.error) {
        return LANG === 'en'
          ? `Hmm, that didn't work this time. <span class="sub">(${esc(res && (res.data || res.error) || 'error')})</span>`
          : `앗, 이번에는 잘 안 됐어요. <span class="sub">(${esc(res && (res.data || res.error) || '오류')})</span>`;
      }
      const d = res.data;
      if (LANG === 'en') {
        switch (res.type) {
          case 'look':
            return `Answer: <b>${esc(d.answer)}</b>`;
          case 'custom': {
            if (!d || !d.length) return `Nothing to answer.`;
            const t0 = d[0];
            return `My AI says this is <b>${esc(t0.name)}</b>. <span class="sub">(confidence ${Math.round(t0.score*100)}%)</span>`;
          }
          case 'face_detect':
            return d.length ? `Found <b>${d.length}</b> face${d.length > 1 ? 's' : ''}!` : `No faces found.`;
          case 'face_analyze':
            if (!d.length) return `No faces found.`;
            return d.map((f, i) =>
              `${d.length > 1 ? 'Face ' + (i+1) + ': ' : 'Face: '}<b>${esc(f.gender)}</b> · about <b>${esc(f.age)}</b> · <b>${esc(f.emotion)}</b> · looking ${esc((f.pos && f.pos.direction) || '')}`
            ).join('<br>');
          case 'face_emotion':
            if (!d.length) return `No faces found.`;
            return d.map((f, i) =>
              `${d.length > 1 ? 'Face ' + (i+1) : 'The face'} looks <b>${esc(f.emotion)}</b>.`
            ).join('<br>');
          case 'face_age_gender':
            if (!d.length) return `No faces found.`;
            return d.map((f, i) =>
              `${d.length > 1 ? 'Face ' + (i+1) + ': ' : 'Face: '}<b>${esc(f.gender)}</b> · about <b>${esc(f.age)}</b>`
            ).join('<br>');
          case 'mesh':
            if (!d.length) return `No faces found.`;
            return d.map((f, i) =>
              `${d.length > 1 ? 'Face ' + (i+1) : 'The face'} is about <b>${esc(f.distance)}cm</b> away, looking <b>${esc(f.direction || '')}</b>.`
            ).join('<br>');
          case 'hand':
            if (!d.length) return `No hands found.`;
            return d.map(hd => `Hand gesture: <b>${esc(hd.gesture)}</b> <span class="sub">(${esc(hd.score)}%)</span>`).join('<br>');
          case 'mask_detect': {
            if (!d.length) return `No faces found.`;
            const on = d.filter(f => f.mask === 1).length;
            return `<b>${on}</b> of <b>${d.length}</b> face${d.length > 1 ? 's are' : ' is'} wearing a mask.`;
          }
          case 'object_search': {
            const all = d.object || [];
            const people = all.filter(o => o.name_en === 'person');
            const objs = all.filter(o => o.name_en !== 'person');
            const parts = [];
            if (people.length) parts.push(`<b>${people.length}</b> ${people.length > 1 ? 'people' : 'person'}`);
            if (objs.length) parts.push(`objects: <b>${nameCounts(objs, 'name')}</b>`);
            return parts.length ? `Found ${parts.join(' / ')}!` : `No objects found.`;
          }
          case 'object_pose':
            return d.length
              ? `Found the pose of <b>${d.length}</b> ${d.length > 1 ? 'people' : 'person'} (17 key points). Check the dots and lines above!`
              : `No people found.`;
          case 'ocr': {
            if (!d.length) return `No text found.`;
            return `Text read: <b>${d.map(t => esc(t.text)).join(' ')}</b>`;
          }
          case 'barcode': {
            if (!d.length) return `No QR code found.`;
            return d.map(b => `QR code says: <b>${esc(b.data || b.text || '')}</b>`).join('<br>');
          }
          case 'depth':
            return `Colored how near and far things are. Brighter means closer.`;
          case 'portrait': case 'sr':
            return `Changed the image into a new style! Check the picture above.`;
          case 'object_seg':
            {
            const objs = (d && d.object) || [];
            return objs.length
              ? `Colored in the area of <b>${nameCounts(objs, 'name')}</b>. Check the picture above.`
              : `Nothing found to color in.`;
            }
          default:
            return `Got a result. Open the details below for more.`;
        }
      }
      switch (res.type) {
        /* --- 텍스트 계열 --- */
        case 'look':
          return `질문에 대한 답: <b>${esc(d.answer)}</b>`;

        /* --- 검출 계열 --- */
        case 'face_detect':
          return d.length ? `얼굴을 <b>${d.length}개</b> 찾았어요!` : `얼굴을 찾지 못했어요.`;
        case 'face_analyze':
          if (!d.length) return `얼굴을 찾지 못했어요.`;
          return d.map((f, i) =>
            `${d.length > 1 ? (i+1) + '번 ' : ''}얼굴: <b>${esc(f.gender)}</b> · 약 <b>${esc(f.age)}살</b> · <b>${esc(f.emotion)}</b> 표정 · ${esc((f.pos && f.pos.direction) || '')}`
          ).join('<br>');
        case 'face_emotion':
          if (!d.length) return `얼굴을 찾지 못했어요.`;
          return d.map((f, i) =>
            `${d.length > 1 ? (i+1) + '번 ' : ''}얼굴의 표정은 <b>${esc(f.emotion)}</b>이에요.`
          ).join('<br>');
        case 'face_age_gender':
          if (!d.length) return `얼굴을 찾지 못했어요.`;
          return d.map((f, i) =>
            `${d.length > 1 ? (i+1) + '번 ' : ''}얼굴: <b>${esc(f.gender)}</b> · 약 <b>${esc(f.age)}살</b>`
          ).join('<br>');
        case 'mesh':
          if (!d.length) return `얼굴을 찾지 못했어요.`;
          return d.map((f, i) =>
            `${d.length > 1 ? (i+1) + '번 ' : ''}얼굴은 카메라에서 약 <b>${esc(f.distance)}cm</b>, <b>${esc(f.direction || '')}</b>을 보고 있어요.`
          ).join('<br>');
        case 'hand':
          if (!d.length) return `손을 찾지 못했어요.`;
          return d.map(hd => `손 모양: <b>${esc(hd.gesture)}</b> <span class="sub">(확신 ${esc(hd.score)}%)</span>`).join('<br>');
        case 'mask_detect': {
          if (!d.length) return `얼굴을 찾지 못했어요.`;
          const on = d.filter(f => f.mask === 1).length;
          return `얼굴 <b>${d.length}개</b> 중 <b>${on}개</b>가 마스크를 쓰고 있어요.`;
        }
        case 'object_search': {
          const all = d.object || [];
          const people = all.filter(o => o.name_en === 'person');
          const objs = all.filter(o => o.name_en !== 'person');
          const parts = [];
          if (people.length) parts.push(`사람 <b>${people.length}명</b>`);
          if (objs.length) parts.push(`사물: <b>${nameCounts(objs, 'name')}</b>`);
          return parts.length ? `사진에서 ${parts.join(' / ')}을(를) 찾았어요!` : `사물을 찾지 못했어요.`;
        }
        case 'object_pose':
          return d.length
            ? `사람 <b>${d.length}명</b>의 몸 자세(주요 포인트 17개)를 찾았어요. 결과 이미지의 점과 선을 살펴보세요!`
            : `사람을 찾지 못했어요.`;
        case 'custom': {
          if (!d || !d.length) return `대답할 게 없어요.`;
          const t0 = d[0];
          return `내가 가르친 AI는 <b>${esc(t0.name)}</b>(이)라고 생각해요. <span class="sub">(확신 ${Math.round(t0.score*100)}%)</span>`;
        }
        case 'ocr': {
          if (!d.length) return `글자를 찾지 못했어요.`;
          return `읽은 글자: <b>${d.map(t => esc(t.text)).join(' ')}</b>`;
        }
        case 'barcode': {
          if (!d.length) return `QR코드를 찾지 못했어요.`;
          return d.map(b => `QR코드 내용: <b>${esc(b.data || b.text || '')}</b>`).join('<br>');
        }

        /* --- 이미지 변환 계열 --- */
        case 'depth':
          return `멀고 가까움을 색으로 칠했어요. 밝을수록 가까운 곳이에요.`;
        case 'portrait': case 'sr':
          return `이미지를 새로운 스타일로 바꿨어요! 위 그림을 확인해 보세요.`;
        case 'object_seg':
          {
          const objs = (d && d.object) || [];
          return objs.length
            ? `<b>${nameCounts(objs, 'name')}</b>의 영역을 색으로 칠했어요. 위 그림을 확인해 보세요.`
            : `칠할 사물을 찾지 못했어요.`;
          }

        default:
          return `결과가 나왔어요. 자세한 내용은 아래 상세보기를 펼쳐 보세요.`;
      }
    }
    function showEasy(res) {
      easyText.innerHTML = easySummary(res);
      const failed = !res || res.result === 'fail' || res.error;
      easyAnswer.classList.toggle('fail', !!failed);
      easyAnswer.classList.add('show');
    }

    function displayResult(res, displayedImg, srcWidth, srcHeight) {
      const resultCanvas = document.getElementById('resultCanvas');
      const ctx = resultCanvas.getContext('2d');
      const resultJSON = document.getElementById('resultJSON');

      if (res.error) {
        alert("Error: " + res.error);
      } else if (res.result === 'ok') {
        showStamp();
      }
      showEasy(res);
      sysReport(res, 0);
      if (!liveRunning && res.result === 'ok') setTimeout(() => pushHistory(res), 60);
      resultJSON.innerText = JSON.stringify(res, null, 2);

      if (
        res.type &&
        ["portrait","sr","depth","object_seg"]
          .includes(res.type)
      ) {
        /* 분할은 색칠한 그림 + 찾은 것 목록으로 온다.
           이름·박스는 여기서 그린다 — 서버 그림에 새기면 영문이라 화면 언어와 어긋난다. */
        const b64 = (res.data && res.data.image) ? res.data.image : res.data;
        const segItems = (res.data && res.data.object) || [];
        const base64Image = "data:image/jpeg;base64," + b64;
        const genImg = new Image();
        genImg.onload = function() {
          resultCanvas.width = genImg.width;
          resultCanvas.height = genImg.height;
          ctx.clearRect(0, 0, genImg.width, genImg.height);
          ctx.drawImage(genImg, 0, 0);
          segItems.forEach(item => {
            const [x1, y1, x2, y2] = item.box;
            drawRect(ctx, x1, y1, x2, y2, "rgb(43, 75, 216)",
                     `${item.name} (${item.score}%)`, 1, 1);
          });
        };
        genImg.src = base64Image;
        return;
      }

      if (displayedImg) {
        resultCanvas.width = srcWidth;
        resultCanvas.height = srcHeight;
        ctx.clearRect(0, 0, srcWidth, srcHeight);
        ctx.drawImage(displayedImg, 0, 0, srcWidth, srcHeight);

        const scaleX = resultCanvas.width / srcWidth;
        const scaleY = resultCanvas.height / srcHeight;

        if (res.type === "mesh") {
          res.data.forEach((item) => {
            const [x1, y1, x2, y2] = item.box;
            drawRect(ctx, x1, y1, x2, y2, "rgb(43, 75, 216)", `${item.distance}cm ${item.direction}`, scaleX, scaleY);
          });
        }
        else if (res.type === "hand") {
          res.data.forEach((item) => {
            const [x1, y1, x2, y2] = item.box;
            const gname = item.gesture;
            drawRect(ctx, x1, y1, x2, y2, "rgb(217, 65, 65)", `${gname} (${item.score}%)`, scaleX, scaleY);
            (item.points || []).forEach(p => drawEllipse(ctx, p[0], p[1], 3, "rgb(43, 75, 216)", scaleX, scaleY));
          });
        }
        else if (res.type === "mask_detect") {
          res.data.forEach((item, idx) => {
            const [x1, y1, x2, y2] = item.box;
            const color = item.mask === 1 ? "rgb(43, 75, 216)" : "rgb(217, 65, 65)";
            const label = item.name || (item.mask === 1 ? "Mask" : "No Mask");
            drawRect(ctx, x1, y1, x2, y2, color, label, scaleX, scaleY);
          });
        }
        else if ([
          "face_detect","face_analyze",
          "face_emotion","face_age_gender"
        ].includes(res.type)) {
          res.data.forEach((item, idx) => {
            const [x1, y1, x2, y2] = item.box;
            let label = item.name || 'face';

            if (res.type === "face_analyze") {
                label = `${item.gender}, ${item.age}, ${item.emotion}`;
            } else if (res.type === "face_age_gender") {
                label = `${item.gender}, ${item.age}`;
            } else if (res.type === "face_emotion") {
                label = item.emotion;
            }

            drawRect(ctx, x1, y1, x2, y2, "rgb(43, 75, 216)", label, scaleX, scaleY);
          });
        }
        else if (res.type === "object_search") {
          (res.data.object || []).forEach((item) => {
            const [x1, y1, x2, y2] = item.box;
            const color = item.name_en === "person" ? "rgb(43, 75, 216)" : "rgb(217, 65, 65)";
            drawRect(ctx, x1, y1, x2, y2, color, `${item.name} (${item.score}%)`, scaleX, scaleY);
          });
        }
        else if (res.type === "object_pose") {
          res.data.forEach((item, idx) => {
            const [x1, y1, x2, y2] = item.box;
            ctx.strokeStyle = "rgb(43, 75, 216)";
            ctx.lineWidth = 2;
            ctx.strokeRect(x1*scaleX, y1*scaleY, (x2 - x1)*scaleX, (y2 - y1)*scaleY);
            const points = item.points;
            draw_points.forEach(pair => {
              const p1 = points[pair[0]];
              const p2 = points[pair[1]];
              drawLine(ctx, p1[0], p1[1], p2[0], p2[1], scaleX, scaleY);
            });
            points.forEach(point => {
              drawEllipse(ctx, point[0], point[1], 3, "rgb(217, 65, 65)", scaleX, scaleY);
            });
          });
        }
        else if (res.type === "ocr") {
          res.data.forEach((item, idx) => {
            const [x1, y1, x2, y2] = item.box;
            drawRect(ctx, x1, y1, x2, y2, "rgb(43, 75, 216)", item.text, scaleX, scaleY);
          });
        }
        else if (res.type === "barcode") {
          res.data.forEach((item, idx) => {
            const [x1, y1, x2, y2] = item.box;
            drawRect(ctx, x1, y1, x2, y2, "rgb(43, 75, 216)", item.data, scaleX, scaleY);
          });
        }
      }
      else {
        resultCanvas.width = 640;
        resultCanvas.height = 480;
        ctx.clearRect(0, 0, 640, 480);
      }
    }

    async function handleRun(model, prompt, imageSource) {
      if (window.vapiStat) vapiStat("lab_run");
      if (!imageSource) {
        alert(T("aSelectImage"));
        return;
      }

      if (imageSource instanceof HTMLCanvasElement && imageSource.id === "sketchCanvas") {
        const tempCanvas = document.createElement("canvas");
        tempCanvas.width = imageSource.width;
        tempCanvas.height = imageSource.height;
        const tempCtx = tempCanvas.getContext("2d");
        tempCtx.fillStyle = "#ffffff";
        tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
        tempCtx.drawImage(imageSource, 0, 0);
        imageSource = tempCanvas;
      }

      let imageBlob;
      if (imageSource instanceof HTMLCanvasElement) {
        imageBlob = await new Promise(resolve => imageSource.toBlob(resolve, 'image/jpeg'));
      }
      else if (imageSource instanceof HTMLImageElement) {
        // 이미지가 아직 디코딩 전이면 0x0 캔버스가 되어 첫 실행이 실패함 → 로드 대기
        if (!imageSource.complete || !imageSource.naturalWidth) {
          await new Promise((resolve, reject) => {
            imageSource.onload = resolve;
            imageSource.onerror = reject;
          });
        }
        const offCanvas = document.createElement('canvas');
        offCanvas.width = imageSource.naturalWidth;
        offCanvas.height = imageSource.naturalHeight;
        offCanvas.getContext('2d').drawImage(imageSource, 0, 0);
        imageBlob = await new Promise(resolve => offCanvas.toBlob(resolve, 'image/jpeg'));
      }

      if (!imageBlob) {
        alert(T("aSelectImage"));
        return;
      }

      const tempImg = new Image();
      tempImg.src = URL.createObjectURL(imageBlob);
      tempImg.onload = function() {
        resizeImage(tempImg, async function(resized) {
          const resizedBlob = resized.blob;
          const resizedWidth = resized.width;
          const resizedHeight = resized.height;
          const newImg = new Image();
          newImg.src = URL.createObjectURL(resizedBlob);
          newImg.onload = async function() {
            const res = await runInference(resizedBlob, prompt, model);
            displayResult(res, newImg, resizedWidth, resizedHeight);
          }
        });
      }
    }

    document.getElementById('mainRunButton').addEventListener('click', async function() {
      const mainRunButton = this;
      const runLabel = document.getElementById('runLabel');
      const resultJSON = document.getElementById('resultJSON');

      mainRunButton.disabled = true;
      sysBusy(true, devOf(modelSelect.value));
      runLabel.innerText = T('running');
      resultJSON.innerText = '';
      hideStamp();
      hideEasy();

      const minimumWait = new Promise(resolve => setTimeout(resolve, 1000));

      const runProcess = (async () => {
        try {
          const prompt = document.getElementById('promptInput').value;
          const model = modelSelect.value;

          const activeTab = document.querySelector('.tab-content.active');
          let imageSource = null;

          if (activeTab.id === 'upload') {
            if (!fileInput.files[0]) {
              alert(T("aSelectImage"));
              return;
            }
            imageSource = uploadPreview;
          } else if (activeTab.id === 'webcam') {
            if (webcamCanvas.style.display === 'none') {
              alert(T("aCapture"));
              return;
            }
            imageSource = webcamCanvas;
          } else if (activeTab.id === 'sketch') {
            imageSource = sketchCanvas;
          }

          if (imageSource) {
             await handleRun(model, prompt, imageSource);
          }

        } catch (error) {
          console.error("실행 중 오류 발생:", error);
          alert(T("aError"));
        }
      })();

      await Promise.all([runProcess, minimumWait]);

      sysBusy(false);
      mainRunButton.disabled = false;
      runLabel.innerText = T('run');
    });

    /* ----- 결과 이미지 저장 ----- */
    document.getElementById('saveResultButton').addEventListener('click', function() {
      const canvas = document.getElementById('resultCanvas');
      if (!canvas.width || !canvas.height) { alert(T("aRunFirst")); return; }
      const a = document.createElement('a');
      const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
      a.download = `vapi-${modelSelect.value}-${stamp}.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
    });

    /* ----- 실행 기록 스트립 ----- */
    const historyBox = document.getElementById('historyBox');
    const historyStrip = document.getElementById('historyStrip');
    const history = [];
    function pushHistory(res) {
      const canvas = document.getElementById('resultCanvas');
      if (!canvas.width) return;
      const thumb = document.createElement('canvas');
      thumb.width = 184; thumb.height = 124;
      thumb.getContext('2d').drawImage(canvas, 0, 0, thumb.width, thumb.height);
      const entry = {
        img: thumb.toDataURL('image/jpeg', 0.7),
        full: canvas.toDataURL('image/jpeg', 0.85),
        text: easyText.innerText.slice(0, 40),
        json: JSON.stringify(res, null, 2),
        model: mName(modelSelect.value),
      };
      history.unshift(entry);
      if (history.length > 8) history.pop();
      renderHistory();
    }
    function renderHistory() {
      historyBox.style.display = history.length ? 'block' : 'none';
      historyStrip.innerHTML = '';
      history.forEach((h, i) => {
        const el = document.createElement('div');
        el.className = 'item';
        el.innerHTML = `<img src="${h.img}" alt=""><div class="cap">${esc(h.model)}</div>`;
        el.title = h.text;
        el.addEventListener('click', () => {
          const canvas = document.getElementById('resultCanvas');
          const ctx = canvas.getContext('2d');
          const im = new Image();
          im.onload = () => {
            canvas.width = im.width; canvas.height = im.height;
            ctx.drawImage(im, 0, 0);
          };
          im.src = h.full;
          easyText.innerHTML = esc(h.text);
          easyAnswer.classList.add('show');
          document.getElementById('resultJSON').innerText = h.json;
        });
        historyStrip.appendChild(el);
      });
    }
    document.getElementById('clearHistoryButton').addEventListener('click', function() {
      history.length = 0;
      renderHistory();
    });

    /* ----- 라이브 모드 (웹캠 연속 인식) — 빠른 모델만 ----- */
    const LIVE_OK = new Set([
      "얼굴 인식","얼굴 분석","얼굴 감정 분석","얼굴 나이/성별 분석","마스크 인식",
      "사물 인식","사람 포즈 인식",
      "QR코드 인식","얼굴 거리·방향","손동작 인식"
    ]);
    const liveToggle = document.getElementById('liveToggle');
    const liveCheck = document.getElementById('liveCheck');
    let liveRunning = false;
    loadCustomModels();                      // 목록 로드(비동기) — LIVE_OK 준비 후 호출

    function updateLiveAvailability() {
      // 모델만 보고 판단한다. 웹캠 탭이 아니면 체크 시 자동으로 전환한다.
      const ok = LIVE_OK.has(modelSelect.value);
      liveCheck.disabled = !ok;
      liveToggle.classList.toggle('off', !ok);
      liveToggle.title = ok ? T("liveOkTip") : T("liveNoTip");
      if (!ok && liveCheck.checked) { liveCheck.checked = false; stopLive(); }
    }
    modelSelect.addEventListener('change', () => {
      updateLiveAvailability();
      if (liveRunning) sysBusy(true, devOf(modelSelect.value));
    });
    tabButtons.forEach(b => b.addEventListener('click', updateLiveAvailability));

    async function liveLoop() {
      while (liveRunning) {
        const ctx = webcamCanvas.getContext('2d');
        ctx.drawImage(webcamVideo, 0, 0, webcamCanvas.width, webcamCanvas.height);
        webcamCanvas.style.display = 'block';
        sysBusy(true, devOf(modelSelect.value));   // 도중에 모델을 바꿔도 따라간다
        try {
          await handleRun(modelSelect.value, document.getElementById('promptInput').value, webcamCanvas);
        } catch (e) { console.error(e); }
        await new Promise(r => setTimeout(r, 400));
      }
    }
    function startLive() {
      if (liveRunning) return;
      liveRunning = true;
      liveToggle.classList.add('on');
      document.getElementById('runLabel').innerText = T('liveRun');
      document.getElementById('mainRunButton').disabled = true;
      sysBusy(true, devOf(modelSelect.value));
      liveLoop();
    }
    function stopLive() {
      liveRunning = false;
      liveToggle.classList.remove('on');
      document.getElementById('runLabel').innerText = T('run');
      document.getElementById('mainRunButton').disabled = false;
      sysBusy(false);
    }
    liveCheck.addEventListener('change', async function() {
      if (!this.checked) { stopLive(); return; }
      // 웹캠 탭이 아니면 자동 전환
      if (document.querySelector('.tab-content.active').id !== 'webcam') {
        const btn = document.querySelector('.tabButton[data-tab="webcam"]');
        if (btn && btn.style.display !== 'none') btn.click();
      }
      // 웹캠 영상이 준비될 때까지 잠깐 대기
      for (let i = 0; i < 30 && !webcamVideo.videoWidth; i++) {
        await new Promise(r => setTimeout(r, 100));
      }
      if (!webcamVideo.videoWidth) {
        alert(T("aNoWebcam"));
        this.checked = false;
        return;
      }
      startLive();
    });
    updateLiveAvailability();

    /* ----- 스페이스바로 실행 ----- */
    document.addEventListener('keydown', function(e) {
      if (e.code !== 'Space' || liveRunning) return;
      const t = e.target.tagName;
      if (t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA' || t === 'BUTTON') return;
      e.preventDefault();
      document.getElementById('mainRunButton').click();
    });

    document.getElementById('copyJsonButton').addEventListener('click', function() {
      const jsonText = document.getElementById('resultJSON').innerText;
      if (!jsonText || jsonText.trim() === "") {
        return;
      }

      const textArea = document.createElement("textarea");
      textArea.value = jsonText;
      textArea.style.position = 'fixed';
      textArea.style.top = 0;
      textArea.style.left = 0;
      textArea.style.width = '2em';
      textArea.style.height = '2em';
      textArea.style.padding = 0;
      textArea.style.border = 'none';
      textArea.style.outline = 'none';
      textArea.style.boxShadow = 'none';
      textArea.style.background = 'transparent';

      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();

      try {
        document.execCommand('copy');
        this.innerText = T('copied');
        setTimeout(() => {
          this.innerText = T('copy');
        }, 1500);
      } catch (err) {
        console.error('JSON 복사 실패:', err);
        alert(T('aCopyFail'));
      }

      document.body.removeChild(textArea);
    });
  </script>
