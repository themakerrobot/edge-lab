<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>엣지 랩</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link href="/fonts/fonts.css" rel="stylesheet">
  <script>
    /* 밝은 곳 모드: 화면이 그려지기 전에 적용해야 깜빡이지 않는다 */
    try { if (localStorage.getItem("vapi-hc") === "1")
            document.documentElement.classList.add("hc"); } catch (e) {}
  </script>
  <style>
    /* ---------------- 부팅(로딩) 화면 ---------------- */
    #boot {
      position: fixed; inset: 0; z-index: 100; display: flex;
      align-items: center; justify-content: center; padding: 20px;
      background: #fbf7ef;
      background-image: radial-gradient(rgba(31, 95, 122,.07) 1px, transparent 1px);
      background-size: 22px 22px;
    }
    #boot.done { display: none; }
    .boot-card {
      width: min(880px, 100%); background: #fff; border: 2px solid #4a3f2e;
      border-radius: 4px; box-shadow: 0 2px 0 rgba(44,74,124,.2);
      padding: 28px 32px 24px; display: flex; flex-direction: column; gap: 20px;
    }
    .boot-brand { display: flex; align-items: center; gap: 12px; }
    .boot-brand img { height: 62px; }
    .boot-brand b { display: block; font-family: "Gowun Batang", serif;
                    font-size: 1.7rem; line-height: 1.2; }
    .boot-brand i { font-style: normal; font-size: 1.02rem; color: #4a423a; }
    .boot-slide { display: flex; align-items: center; gap: 26px; min-height: 200px; }
    .boot-art { flex: 0 0 200px; height: 180px; }
    .boot-art svg { width: 100%; height: 100%; }
    .boot-text h2 { font-family: "Gowun Dodum", sans-serif; font-size: 1.5rem;
                    color: #17475c; margin-bottom: 10px; }
    .boot-text p { font-size: 1.18rem; color: #2a2620; line-height: 1.7; }
    .boot-slide.fade { opacity: 0; }
    .boot-slide { transition: opacity .35s; }
    .boot-dots { display: flex; gap: 8px; justify-content: center; }
    .boot-dots span { width: 10px; height: 10px; border-radius: 50%; background: #9a8f7d; }
    .boot-dots span.on { background: #1f5f7a; }
    .boot-progress { display: flex; flex-direction: column; gap: 5px; }
    .boot-bar { height: 18px; background: #e6eef6; border-radius: 9px; overflow: hidden; }
    .boot-bar > i { display: block; height: 100%; width: 0;
                    background: linear-gradient(90deg, #1f5f7a, #1f5f7a);
                    transition: width .4s; }
    .boot-status { display: flex; align-items: baseline; gap: 10px;
                   font-family: "Menlo","Consolas",monospace;
                   font-size: 1rem; color: #4a423a; }
    .boot-status #bootNow { flex: 1 1 auto; min-width: 0;
                            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* 진행 수치는 오른쪽에 모아 둔다 — 숫자 폭을 고정해 갱신될 때 흔들리지 않게 */
    .boot-meter { flex: 0 0 auto; display: flex; align-items: baseline; gap: 7px;
                  font-variant-numeric: tabular-nums; }
    .boot-meter .sep { color: #9a8f7d; }
    .boot-meter #bootTime { color: #6b6255; }
    .boot-actions { display: flex; gap: 8px; }
    .boot-actions button {
      font-family: inherit; font-size: 1.08rem; font-weight: 600; cursor: pointer;
      border: 1.5px solid #4a3f2e; border-radius: 6px; padding: 11px 22px;
      background: #1f5f7a; color: #fff; margin-left: auto;
    }
    .boot-actions button:disabled { background: #c4b9a5; border-color: #c4b9a5; cursor: default; }
    .boot-actions button.ghost { background: #fff; color: #4a423a;
                                 border-color: #9a8f7d; margin-left: 0; }
    @media (max-width: 560px) {
      .boot-slide { flex-direction: column; text-align: center; }
      .boot-art { flex: 0 0 auto; height: 150px; }
      .boot-text h2 { font-size: 1.3rem; }
      .boot-text p { font-size: 1.05rem; }
    }

    /* ===== 디자인 토큰 : "학습지" (줄노트 + 시험지 머리표 + 빨간펜) ===== */
    :root {
      --paper:    #fbf7ef;                 /* 흰 활동지 */
      --rule:     transparent;
      --box:      #ffffff;
      --ink:      #2a2620;
      --ink-2:    #4a423a;
      --cyan:     #1f5f7a;                 /* 활동지 섹션 타이틀 */
      --cyan-d:   #17475c;
      --pen-blue: #1f5f7a;
      --pen-blue-d:#12455c;
      --pen-red:  #b4451c;
      --line:     #9a8f7d;
      --line-d:   #4a3f2e;                 /* 활동지 표 네이비 괘선 */
      --r: 6px;
    }

    /* ===== 밝은 곳 모드 (설정에서 켠다) =====
       색 토큰만 덮어써서 대비를 끌어올린다. 배치는 그대로다. */
    html.hc {
      --paper:    #fffdf8;
      --box:      #ffffff;
      --ink:      #1a1712;
      --ink-2:    #332d26;
      --cyan:     #114558;
      --cyan-d:   #0c3444;
      --pen-blue: #123f52;
      --pen-blue-d:#0a2c3a;
      --pen-red:  #8f3312;
      --line:     #7a6f5d;
      --line-d:   #2e281c;
    }
    html.hc body { background-image: none; }          /* 배경 무늬 제거 */
    html.hc select, html.hc input, html.hc button,
    html.hc .panel, html.hc .q, html.hc .card { border-width: 2px; }
    html.hc .panel-head { border-width: 3px; }


    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      color: var(--ink);
      background-color: var(--paper);

      font-family: "Gowun Dodum", "Apple SD Gothic Neo", system-ui, sans-serif;
      line-height: 1.5;
      padding: var(--sp-2, 8px);
      gap: var(--sp-2, 8px);
    }
    .serif { font-family: "Gowun Batang", serif; }

    a { color: var(--pen-blue-d); text-decoration: none; }
    a:hover { text-decoration: underline; }

    select, input, button {
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--ink);
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: var(--r);
      padding: 7px 11px;
      outline: none;
      transition: border-color .12s, background .12s;
    }
    select:hover, input:hover { border-color: #a8a596; }
    select:focus, input:focus { border-color: var(--pen-blue); }
    input[readonly] { background: #fbfaf5; color: var(--ink-2); }

    /* ===== 시험지 머리표 ===== */
    .header {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: stretch;
      background: var(--box);
      border: 2px solid var(--line-d);
      border-radius: 3px;
      box-shadow: 0 1px 0 rgba(44,74,124,.18);
    }
    .header > div {
      display: flex; flex-direction: column; justify-content: center;
      padding: 5px 12px;
    }
    .h-subject .eyebrow {
      font-size: 0.82rem; letter-spacing: .14em; color: var(--ink-2);
    }
    .h-subject .title {
      font-family: "Gowun Batang", serif;
      font-size: 1.15rem; font-weight: 700; letter-spacing: .02em; line-height: 1.2;
    }
    .h-fill { justify-content: center; gap: 4px; }
    .fill-row { display: flex; align-items: baseline; gap: var(--sp-1, 4px); font-size: .88rem; }
    .fill-row .k { color: var(--ink-2); white-space: nowrap; }
    .fill-row .v {
      min-width: 130px;
      border-bottom: 1.5px solid var(--line-d);
      padding: 0 4px 1px;
      font-variant-numeric: tabular-nums;
      color: var(--pen-blue-d);
      white-space: nowrap;
    }
    .h-env { gap: 4px; }
    .h-env .k { font-size: 0.82rem; color: var(--ink-2); }
    .h-tools { flex-direction: row !important; align-items: center; gap: 8px; margin-left: auto; }


    /* ===== 시스템 상태바 (온디바이스 콘솔) ===== */   /* lib/sysbar.js 가 오버레이로 옮겨 담는다 */
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: #fff; border: 1.5px solid var(--line); border-radius: 999px;
      padding: 2px 10px; color: #6b6255;
    }
    .chip .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #cfc7b8;
    }
    .chip.on { color: var(--ink); border-color: var(--ink); }
    .chip.on .dot { background: var(--cyan); box-shadow: 0 0 5px rgba(31, 95, 122,.6); }
    .chip.busy { border-color: var(--pen-red); color: var(--pen-red); }
    .chip.busy .dot { background: var(--pen-red); animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: .35; } }
    .chip .st { color: #6b6255; font-variant-numeric: tabular-nums; }
    .chip.on .st { color: var(--ink-2); }
    .chip.hit { border-color: var(--cyan); }
    .chip.hit .st { color: var(--cyan-d); }
    @media (prefers-reduced-motion: reduce) { .chip.busy .dot { animation: none; } }

    /* ===== 문항 공통 ===== */
    .qnum::after { content: "."; }

    /* ===== 문항 1 : 모델 고르기 ===== */
    .subheader {
      flex: 0 0 auto;
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
      background: var(--box);
      border: 1.5px solid var(--line);
      border-radius: var(--r);
      padding: var(--sp-2, 6px) 16px;
    }
    .subheader .q { display: flex; align-items: center; gap: 9px; }
    .subheader .field { display: flex; align-items: center; gap: 8px; flex: 1 1 auto; min-width: 200px; }
    .field-label { font-size: .88rem; color: var(--ink-2); white-space: nowrap; }
    #modelSelect { font-weight: 600; min-width: 160px; }
    #guide { flex: 1 1 240px; width: auto; }
    .doc-link { margin-left: auto; font-size: .88rem; white-space: nowrap; }
    .doc-link::before { content: "※ "; color: var(--pen-red); }

    /* ===== 문항 2 헤더줄 : 탭 + 프롬프트 + 실행 ===== */
    .tab-prompt-row {
      flex: 0 0 auto;
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
      background: var(--box);
      border: 1.5px solid var(--line);
      border-radius: var(--r);
      padding: var(--sp-2, 8px) 16px;
    }
    .tab-prompt-row .q { display: flex; align-items: center; gap: 9px; }
    .tabs { display: flex; gap: 2px; }
    .tabButton {
      background: transparent; border: none; border-bottom: 3px solid transparent;
      border-radius: 0; color: var(--ink-2); font-size: .95rem;
      padding: 6px 12px 4px; cursor: pointer;
    }
    .tabButton:hover { color: var(--ink); }
    .tabButton.active {
      color: var(--pen-blue-d); font-weight: 700;
      border-bottom-color: var(--pen-blue);
    }
    .promptWrapper { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: 1 1 300px; }
    #promptInput { flex: 1 1 auto; width: auto; min-width: 110px; }

    #mainRunButton {
      background: var(--pen-blue); border: 1.5px solid var(--pen-blue); color: #fff;
      font-weight: 700; font-size: .98rem; padding: 8px 26px; cursor: pointer;
      border-radius: var(--r); white-space: nowrap;
    }
    #mainRunButton:hover { background: var(--pen-blue-d); border-color: var(--pen-blue-d); }
    #mainRunButton:disabled { background: #b9b7ac; border-color: #b9b7ac; cursor: wait; }

    /* 라이브 토글 */
    .live-toggle {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: .88rem; color: var(--ink-2); white-space: nowrap;
      border: 1.5px solid var(--line); border-radius: var(--r);
      padding: 6px 11px; cursor: pointer; background: #fff;
    }
    .live-toggle input { width: 15px; height: 15px; cursor: pointer; }
    .live-toggle.on { border-color: var(--pen-red); color: var(--pen-red); font-weight: 700; }
    .live-toggle.off { opacity: .45; cursor: not-allowed; }

    /* 결과 도구 (저장) */
    .result-tools { flex: 0 0 auto; display: flex; gap: 8px; margin-top: var(--sp-2, 8px); }
    .result-tools button {
      background: #fff; border: 1.5px solid var(--line); color: var(--ink-2);
      font-size: .85rem; padding: 4px 14px; cursor: pointer; border-radius: var(--r);
    }
    .result-tools button:hover { border-color: var(--pen-blue); color: var(--pen-blue-d); }

    /* 기록 스트립 */
    .history { flex: 0 0 auto; margin-top: var(--sp-2, 8px); }
    .history .h-title {
      font-family: "Gowun Batang", serif; font-weight: 700; font-size: .88rem;
      color: var(--ink-2); margin-bottom: 6px;
    }
    .history .strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .history .item {
      flex: 0 0 auto; width: 92px; cursor: pointer;
      border: 1.5px solid var(--line); border-radius: var(--r); padding: 4px;
      background: #fff;
    }
    .history .item:hover { border-color: var(--pen-blue); }
    .history .item img { width: 100%; height: 62px; object-fit: cover; border-radius: 3px; display: block; }
    .history .item .cap {
      font-size: 0.82rem; color: var(--ink-2); margin-top: 3px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* ===== 답안 영역 (좌우) ===== */

    .tab-content { display: none; }
    .tab-content.active {
      display: flex; flex-direction: column;
      flex: 1 1 auto; min-height: 0;
    }

    /* 붙임 상자 (업로드) — "사진을 붙이세요" */
    .upload-container {
      border: 2px dashed #b3b0a2;
      border-radius: var(--r);
      flex: 1 1 auto; min-height: 240px;
      display: flex; align-items: center; justify-content: center; text-align: center;
      color: var(--ink-2); cursor: pointer;
      background: #fdfcf8;
      transition: border-color .15s, background .15s;
      padding: 14px;
    }
    .upload-container:hover { border-color: var(--pen-blue); color: var(--ink); background: #f7f8ff; }
    .upload-container .hint { margin-top: 6px; }
    #uploadPreview {
      max-width: 100%; max-height: 100%; height: auto;
      object-fit: contain; display: none; border-radius: 3px;
    }

    .webcam-container {
      border: 1.5px solid var(--line);
      border-radius: var(--r);
      flex: 1 1 auto; min-height: 240px; min-width: 0;
      display: flex; flex-wrap: wrap; gap: var(--sp-2, 8px); align-items: center; justify-content: center;
      background: #fdfcf8; padding: 14px;
    }
    #webcamVideo, #webcamCanvas {
      /* 스트리밍/캡처 2장이 한 줄에 나란히: 반응형으로 늘고 줄어들며,
         좁아지면 flex-wrap에 의해 자동으로 세로 배치로 전환 */
      flex: 1 1 300px;
      width: auto; min-width: 240px;
      max-width: calc(50% - 6px); max-height: 100%;
      object-fit: contain; background: #222; border-radius: 3px;
    }
    #webcamCanvas { display: none; background: #fff; }
    /* 캡처 전(1장뿐)에는 넓게 사용 */
    .webcam-container:has(#webcamCanvas[style*="none"]) #webcamVideo { max-width: 100%; }
    @media (max-width: 1200px) {
      #webcamVideo, #webcamCanvas { max-width: 100%; }
    }

    .sketch-container {
      border: 1.5px solid var(--line);
      border-radius: var(--r);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      flex: 1 1 auto; min-height: 0;
      background: #fdfcf8; padding: 14px;
    }
    #sketchCanvas {
      background: #fff; border: 1px solid var(--line);
      max-width: 100%; max-height: 100%; height: auto;
      touch-action: none; border-radius: 3px;
    }
    .sketch-controls { margin-top: var(--sp-2, 8px); display: flex; align-items: center; gap: var(--sp-2, 8px); flex-wrap: wrap; }
    .sketch-controls input[type="color"] { padding: 2px; width: 42px; height: 34px; cursor: pointer; }
    .sketch-controls input[type="range"] { cursor: pointer; }

    .button-row { margin-top: var(--sp-2, 8px); flex: 0 0 auto; display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-line {
      background: #fff; border: 1.5px solid var(--line-d); color: var(--ink);
      font-weight: 600; padding: 7px 18px; cursor: pointer; border-radius: var(--r);
    }
    .btn-line:hover { background: var(--paper); }

    /* 답란 (결과) */
    .result-frame {
      position: relative;
      border: 1.5px solid var(--line-d);
      border-radius: 3px;
      background: #fff;
      padding: 12px;
      display: flex; align-items: center; justify-content: center;
      flex: 1 1 auto; min-height: 200px;
      max-width: 100%;
    }
    #resultCanvas {
      max-width: 100%; max-height: 100%;
      width: auto; height: auto;
      object-fit: contain; display: block;
    }

    /* 확인 도장 — 실행 완료 시에만 */
    #stampMark {
      position: absolute; top: 8px; right: 8px;
      width: 84px; height: 84px;
      border: 3px double var(--pen-red);
      border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1px;
      font-family: "Gowun Batang", serif; font-weight: 700; font-size: 0.82rem;
      color: var(--pen-red);
      background: rgba(255,255,255,.72);
      transform: rotate(-12deg) scale(0);
      opacity: 0;
      pointer-events: none;
    }
    #stampMark::before {
      content: "";
      width: 40px; height: 44px;
      background: url('/assets/pibo-thumbsup.png') center/contain no-repeat;
    }
    #stampMark.complete::before { background-image: url('/assets/pibo-hero.png'); }
    #stampMark.show {
      animation: stampIn .35s cubic-bezier(.2, 1.6, .4, 1) forwards;
    }
    @keyframes stampIn {
      to { transform: rotate(-12deg) scale(1); opacity: .88; }
    }
    @media (prefers-reduced-motion: reduce) {
      #stampMark.show { animation: none; transform: rotate(-12deg) scale(1); opacity: .88; }
    }


    /* 풀이 (쉬운 결과) */
    .easy-answer {
      display: none;
      flex: 0 0 auto;
      margin-top: var(--sp-3, 12px);
      align-items: flex-start; gap: var(--sp-2, 8px);
    }
    .easy-answer.show { display: flex; }
    .easy-answer .pibo {
      flex: 0 0 auto; width: 64px; height: 72px;
      background: url('/assets/pibo-idea.png') center/contain no-repeat;
      margin-top: 2px;
    }
    .easy-answer.fail .pibo { background-image: url('/assets/pibo-hmm.png'); }
    .easy-answer .bubble-wrap {
      position: relative; flex: 1 1 auto;
      background: #f5f7ff;
      border: 1.5px solid var(--pen-blue);
      border-radius: 10px;
      padding: 10px 14px;
    }
    .easy-answer .bubble-wrap::before {
      content: "";
      position: absolute; left: -9px; top: 22px;
      width: 14px; height: 14px;
      background: #f5f7ff;
      border-left: 1.5px solid var(--pen-blue);
      border-bottom: 1.5px solid var(--pen-blue);
      transform: rotate(45deg);
    }
    .easy-answer.fail .bubble-wrap { background: #fdf3f2; border-color: var(--pen-red); }
    .easy-answer.fail .bubble-wrap::before { background: #fdf3f2; border-color: var(--pen-red); }
    .easy-answer .ea-label {
      flex: 0 0 auto;
      font-family: "Gowun Batang", serif; font-weight: 700; font-size: .82rem;
      color: var(--pen-blue-d);
      margin-bottom: 3px;
    }
    .easy-answer.fail .ea-label { color: var(--pen-red); }
    #easyText .sub { color: var(--ink-2); font-size: .85rem; }
    #easyText b { color: var(--pen-blue-d); }

    /* 연습장 (JSON) — 접이식 */
    .scratchpad { margin-top: var(--sp-3, 12px); flex: 0 0 auto; }
    .scratchpad summary {
      cursor: pointer; list-style: none;
      display: flex; align-items: center; gap: 8px;
      font-family: "Gowun Batang", serif; font-weight: 700; font-size: .95rem;
      color: var(--ink-2);
      user-select: none;
    }
    .scratchpad summary::-webkit-details-marker { display: none; }
    .scratchpad summary::before { content: "▸"; color: var(--pen-blue); }
    .scratchpad[open] summary::before { content: "▾"; }
    .scratchpad .pad-tools { display: flex; justify-content: flex-end; margin: var(--sp-1, 4px) 0; }
    #copyJsonButton {
      background: #fff; border: 1.5px solid var(--line); color: var(--ink-2);
      font-size: .85rem; padding: 4px 14px; cursor: pointer; border-radius: var(--r);
    }
    #copyJsonButton:hover { border-color: var(--pen-blue); color: var(--pen-blue-d); }
    .scratchpad pre {
      background: #fdfcf8;
      background-image: repeating-linear-gradient(
        transparent 0, transparent 23px, var(--rule) 23px, var(--rule) 24px
      );
      border: 1.5px solid var(--line);
      border-radius: var(--r);
      padding: 12px 14px;
      max-height: 300px; overflow-y: auto;
      font-size: .82rem;
      font-family: "Menlo", "Consolas", ui-monospace, monospace;
      line-height: 24px;
      white-space: pre-wrap; word-wrap: break-word;

    const SLIDES = [
      { art: "offline", key: "s1" }, { art: "models", key: "s2" },
      { art: "chips", key: "s3" },   { art: "menus", key: "s4" },

    (function boot() {
      const box = document.getElementById("boot");
      if (!box) return;
      let idx = 0, ready = false, timer = null, shown = false;

      function paint() {
        const sl = SLIDES[idx];
        document.getElementById("bootArt").innerHTML = ART[sl.art];
        document.getElementById("bootHead").textContent = T(sl.key + "h");
        document.getElementById("bootBody").textContent = T(sl.key + "b");
        document.getElementById("bootDots").innerHTML =
          SLIDES.map((_, i) => '<span class="' + (i === idx ? "on" : "") + '"></span>').join("");
      }
      function next() {
        const slide = document.querySelector(".boot-slide");
        slide.classList.add("fade");
        setTimeout(() => {
          idx = (idx + 1) % SLIDES.length;
          paint();
          slide.classList.remove("fade");
        }, 350);
      }
      function finish() {
        box.classList.add("done");
        if (timer) clearInterval(timer);
      }

      /* 로딩이 끝난 뒤 다시 들어온 경우에는 안내를 띄우지 않는다.
         (블록 코딩 → 체험 실습 처럼 페이지를 오갈 때마다 나오면 방해가 된다) */
      function show() {
        if (shown) return;
        shown = true;
        box.classList.remove("done");
        document.getElementById("bootTitle").textContent = T("title");
        document.getElementById("bootSub").textContent = T("bootSub");
        document.getElementById("bootSkip").textContent = T("bootSkip");
        document.getElementById("bootStart").textContent = T("bootWait");
        paint();
        timer = setInterval(next, 8000);
        document.getElementById("bootSkip").addEventListener("click", finish);
        document.getElementById("bootStart").addEventListener("click", () => {
          if (ready) finish();
        });
      }

      const bootT0 = Date.now();
      function elapsed() {
        const s = Math.floor((Date.now() - bootT0) / 1000);   // 내림 — 59.5 가 "60초" 로 보이지 않게
        return s < 60 ? s + T("bootSec")
                      : Math.floor(s / 60) + T("bootMin") + (s % 60) + T("bootSec");
      }

      async function poll() {
        try {
          const r = await (await fetch("/ready")).json();
          if (r.ready) sessionStorage.setItem("vapi-ready", "1");
          if (r.ready && !shown) { finish(); return; }   // 이미 준비 끝 → 바로 실습 화면
          show();
          const pct = r.total ? Math.round(r.loaded / r.total * 100) : 0;
          document.getElementById("bootBar").style.width = pct + "%";
          document.getElementById("bootCount").textContent = r.loaded + " / " + r.total;
          document.getElementById("bootTime").textContent = elapsed();
          if (r.error) {
            document.getElementById("bootNow").textContent = T("bootError") + r.error;
            return;                                   // 더 묻지 않는다
          }
          document.getElementById("bootNow").textContent = r.ready
            ? T("bootDone")
            : (LANG === "en" ? (r.current_en || "") : (r.current_ko || "")) + " ...";
          if (r.ready) {
            ready = true;
            /* 얼마나 걸렸는지 남겨 둔다 — 느린 PC 를 가늠하는 데 쓴다 */
            document.getElementById("bootNow").textContent = T("bootDone");
            document.getElementById("bootTime").textContent = elapsed();   // 총 걸린 시간
            const b = document.getElementById("bootStart");
            b.disabled = false;
            b.textContent = T("bootStart");
            return;                                   /* 자동 전환하지 않는다 */
          }
        } catch (e) {
          show();                                     // 서버가 아직 못 뜬 상태 → 안내를 띄운다
        }
        setTimeout(poll, 700);
      }
      poll();
    })();

    const pick = id => document.getElementById(id) || { set textContent(v) {}, style: {} };

    (async function initSystem() {
      try {
        const info = await (await fetch('/system')).json();
        DEVICE_OF = info.device_of || {};
        (info.devices || []).forEach(d => {
          const el = sysEl[d.toLowerCase()];
          if (el) el.classList.add('on');

        if (info.ready) return;

      setTimeout(initSystem, 1500);
    })();
    /* 실행 중에는 '그 디바이스 칩만' 점멸시킨다.
       세 칩이 전부 켜지면 어디서 도는지 구분이 안 된다. */
    let LAST_DEV = '';                     // 서버가 마지막으로 알려준 실행 장치
    function sysBusy(on, dev) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('busy'));
      if (!on) return;
      /* 어느 칩이 일할지 모르면 아무 칩도 켜지 않는다.
         전부 켜면 "세 개를 동시에 쓴다"는 잘못된 인상을 준다. */
      const el = sysEl[((dev || LAST_DEV) || '').toLowerCase()];
      if (el) el.classList.add('busy');
    }
    function sysReport(res, ms) {
      runCount++;
      sysEl.runs.textContent = runCount;
      const took = (res && res.elapsed_ms) ? res.elapsed_ms : ms;
      sysEl.elapsed.textContent = took + ' ms';
      const dev = ((res && res.device) || '').toUpperCase();
      sysEl.device.textContent = dev || '--';
      if (dev) LAST_DEV = dev;

      const st = DEV_STATS[dev];
      if (st) {
        st.n++; st.ms = took;
        const el = document.getElementById('st' + dev);
        if (el) el.textContent = ' ' + took + 'ms ×' + st.n;
        const chip = sysEl[dev.toLowerCase()];
        if (chip) {
          chip.classList.add('hit');
          setTimeout(() => chip.classList.remove('hit'), 600);
        }
      }
    }

    async function loadCustomModels() {
      let list = [];
      try {
        const r = await fetch(HOST + '/custom/models');
        const j = await r.json();
        list = (j.result === 'ok' && Array.isArray(j.data)) ? j.data : [];
      } catch (e) { return; }
      if (!list.length) return;
      const group = document.createElement('optgroup');
      group.label = T("customGroup");
      list.forEach(m => {
        const key = "custom:" + m.slug;
        SERVICE_LIST[key] = {
          api: "custom/predict", params: { model: m.slug },
          ko: m.title, en: m.title,
          tooltip: T("customTip") + " (" + (m.labels || []).join(", ") + ")",
          tooltip_en: T("customTip") + " (" + (m.labels || []).join(", ") + ")",

    });
    uploadPlaceholder.addEventListener('drop', e => {
      e.preventDefault();
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        fileInput.files = e.dataTransfer.files;
        handleFileInput(e.dataTransfer.files[0]);

    function handleFileInput(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        if (uploadText) {
          uploadText.style.display = 'none';

        uploadPreview.src = e.target.result;
        uploadPreview.style.display = 'block';

      reader.readAsDataURL(file);

    /* 웹캠이 안 될 때 검은 화면만 보이면 왜 그런지 알 수 없다 — 이유를 화면에 적는다 */
    function showWebcamError(err) {
      const name = (err && err.name) || "";
      const why = {
        NotAllowedError:  T("cam_denied"),
        NotReadableError: T("cam_busy"),
        NotFoundError:    T("cam_none"),
        OverconstrainedError: T("cam_none"),
      }[name] || (T("cam_fail") + " (" + (name || err) + ")");
      webcamVideo.style.display = "none";
      webcamMsg.style.display = "block";
      webcamMsg.innerHTML = why +
        '<br><br><button class="btn" id="webcamRetry">' + T("cam_retry") + "</button>";
      const btn = document.getElementById("webcamRetry");
      if (btn) btn.addEventListener("click", startWebcam);
      console.log("웹캠 접근 오류:", err);
    }

    function startWebcam() {
      if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
        showWebcamError({ name: "NotFoundError" });
        return;
      }
      webcamMsg.style.display = "none";
      webcamVideo.style.display = "";
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
          webcamVideo.srcObject = stream;
          webcamVideo.play();

    const sketchCanvas = document.getElementById('sketchCanvas');

    const penWidth = document.getElementById('penWidth');

    function clearSketchCanvas() {
      sketchCtx.fillStyle = "#ffffff";
      sketchCtx.fillRect(0, 0, sketchCanvas.width, sketchCanvas.height);
    }
    clearSketchCanvas();

    function getSketchPos(clientX, clientY) {
      const rect = sketchCanvas.getBoundingClientRect();
      return {
        x: (clientX - rect.left) * (sketchCanvas.width / rect.width),
        y: (clientY - rect.top) * (sketchCanvas.height / rect.height)
      };
    }

    sketchCanvas.addEventListener('mousedown', e => {
      drawing = true;
      const p = getSketchPos(e.clientX, e.clientY);
      sketchCtx.beginPath();
      sketchCtx.moveTo(p.x, p.y);
    });
    sketchCanvas.addEventListener('mousemove', e => {
      if (drawing) {
        const p = getSketchPos(e.clientX, e.clientY);
        sketchCtx.lineWidth = penWidth.value;
        sketchCtx.strokeStyle = penColor.value;
        sketchCtx.lineCap = 'round';
        sketchCtx.lineTo(p.x, p.y);
        sketchCtx.stroke();
      }
    });
    sketchCanvas.addEventListener('mouseup', () => { drawing = false; });
    sketchCanvas.addEventListener('mouseleave', () => { drawing = false; });

    sketchCanvas.addEventListener('touchstart', e => {
      e.preventDefault();
      drawing = true;
      const t = e.touches[0];
      const p = getSketchPos(t.clientX, t.clientY);
      sketchCtx.beginPath();
      sketchCtx.moveTo(p.x, p.y);
    }, { passive: false });
    sketchCanvas.addEventListener('touchmove', e => {
      e.preventDefault();
      if (!drawing) return;
      const t = e.touches[0];
      const p = getSketchPos(t.clientX, t.clientY);
      sketchCtx.lineWidth = penWidth.value;
      sketchCtx.strokeStyle = penColor.value;
      sketchCtx.lineCap = 'round';
      sketchCtx.lineTo(p.x, p.y);
      sketchCtx.stroke();
    }, { passive: false });

    function resizeImage(image, callback) {
      const canvas = document.createElement('canvas');
      let width = image.width;
      let height = image.height;
      if (width > MAX_WIDTH) {
        height = height * (MAX_WIDTH / width);
        width = MAX_WIDTH;
      }
      if (height > MAX_HEIGHT) {
        width = width * (MAX_HEIGHT / height);
        height = MAX_HEIGHT;
      }
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(image, 0, 0, width, height);
      canvas.toBlob(function(blob) {
        callback({ blob: blob, width: width, height: height });
      }, 'image/jpeg');
    }

    function drawRect(ctx, x1, y1, x2, y2, color, text, scaleX, scaleY) {
      const rectX = x1 * scaleX;
      const rectY = y1 * scaleY;
      const rectWidth = (x2 - x1) * scaleX;
      const rectHeight = (y2 - y1) * scaleY;

      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.strokeRect(rectX, rectY, rectWidth, rectHeight);

      if (text) {
        ctx.font = "16px 'Gowun Dodum', 'Apple SD Gothic Neo', sans-serif";
        const textMetrics = ctx.measureText(text);
        const textWidth = textMetrics.width;
        const textHeight = 16;

        ctx.fillStyle = color;
        ctx.fillRect(rectX, rectY - textHeight - 4, textWidth + 8, textHeight + 4);

        ctx.fillStyle = "#ffffff";
        ctx.fillText(text, rectX + 4, rectY - 4);
      }
    }

    function drawLine(ctx, x1, y1, x2, y2, scaleX, scaleY) {
      ctx.beginPath();
      ctx.moveTo(x1*scaleX, y1*scaleY);
      ctx.lineTo(x2*scaleX, y2*scaleY);
      ctx.stroke();
    }
    function drawEllipse(ctx, x, y, radius, color, scaleX, scaleY) {
      ctx.beginPath();
      ctx.ellipse(x*scaleX, y*scaleY, radius*scaleX, radius*scaleY, 0, 0, 2*Math.PI);
      ctx.strokeStyle = color;
      ctx.stroke();
    }

    async function runInference(imageBlob, prompt, model) {
      const selectedService = SERVICE_LIST[model];
      let url = HOST + '/' + selectedService.api;

      const formData = new FormData();
      formData.append('uploadFile', imageBlob, 'image.jpg');
      /* 메뉴 이름이 아니라 주소로 가른다 — 메뉴 이름은 바뀌어도 주소는 그대로다.
         (예전에는 없어진 이름 "이미지 질문"·"이미지 설명" 을 비교해 물음이 안 갔다)
         params 는 손대지 않고 복사본에 담는다 — 원본을 고치면 다음 실행까지 남는다. */
      const params = Object.assign({ lang: LANG }, selectedService.params);
      if (selectedService.api === "vlm/look") {
        const q = (prompt || "").trim();
        if (q && q !== "-") { params.prompt = q; }   // 비우면 서버가 알아서 설명해 준다
      }
      const query = new URLSearchParams(params).toString();                 // VLM 응답 언어
      url = url + '?' + query;
      try {
        const response = await fetch(url, { method: 'POST', body: formData });
        return await response.json();
      } catch (err) {
        return { error: err.toString() };
      }
    }

    function nameCounts(items, key) {
      const m = {};
      (items || []).forEach(it => { const n = it[key]; if (n) m[n] = (m[n] || 0) + 1; });
      return Object.entries(m).map(([n, c]) =>

            return `<b>${on}</b> of <b>${d.length}</b> face${d.length > 1 ? 's are' : ' is'} wearing a mask.`;
          }

            const all = d.object || [];

            const objs = all.filter(o => o.name_en !== 'person');
            const parts = [];
            if (people.length) parts.push(`<b>${people.length}</b> ${people.length > 1 ? 'people' : 'person'}`);
            if (objs.length) parts.push(`objects: <b>${nameCounts(objs, 'name')}</b>`);
            return parts.length ? `Found ${parts.join(' / ')}!` : `No objects found.`;
          }
          case 'object_pose':
            return d.length
              ? `Found the pose of <b>${d.length}</b> ${d.length > 1 ? 'people' : 'person'} (17 key points). Check the dots and lines above!`
              : `No people found.`;
          case 'ocr': {
            if (!d.length) return `No text found.`;
            return `Text read: <b>${d.map(t => esc(t.text)).join(' ')}</b>`;
          }
          case 'barcode': {
            if (!d.length) return `No QR code found.`;
            return d.map(b => `QR code says: <b>${esc(b.data || b.text || '')}</b>`).join('<br>');
          }
          case 'depth':

      switch (res.type) {

          ).join('<br>');
        case 'face_emotion':

          return d.map((f, i) =>
            `${d.length > 1 ? (i+1) + '번 ' : ''}얼굴의 표정은 <b>${esc(f.emotion)}</b>이에요.`
          ).join('<br>');
        case 'face_age_gender':
          if (!d.length) return `얼굴을 찾지 못했어요.`;
          return d.map((f, i) =>
            `${d.length > 1 ? (i+1) + '번 ' : ''}얼굴: <b>${esc(f.gender)}</b> · 약 <b>${esc(f.age)}살</b>`
          ).join('<br>');
        case 'mesh':
          if (!d.length) return `얼굴을 찾지 못했어요.`;
          return d.map((f, i) =>
            `${d.length > 1 ? (i+1) + '번 ' : ''}얼굴은 카메라에서 약 <b>${esc(f.distance)}cm</b>, <b>${esc(f.direction || '')}</b>을 보고 있어요.`
          ).join('<br>');
        case 'hand':
          if (!d.length) return `손을 찾지 못했어요.`;
          return d.map(hd => `손 모양: <b>${esc(hd.gesture)}</b> <span class="sub">(확신 ${esc(hd.score)}%)</span>`).join('<br>');
        case 'mask_detect': {
          if (!d.length) return `얼굴을 찾지 못했어요.`;
          const on = d.filter(f => f.mask === 1).length;
          return `얼굴 <b>${d.length}개</b> 중 <b>${on}개</b>가 마스크를 쓰고 있어요.`;

    function displayResult(res, displayedImg, srcWidth, srcHeight) {
      const resultCanvas = document.getElementById('resultCanvas');
      const ctx = resultCanvas.getContext('2d');
      const resultJSON = document.getElementById('resultJSON');

      if (res.error) {
        alert("Error: " + res.error);
      } else if (res.result === 'ok') {
        showStamp();
      }
      showEasy(res);
      sysReport(res, 0);
      if (!liveRunning && res.result === 'ok') setTimeout(() => pushHistory(res), 60);
      resultJSON.innerText = JSON.stringify(res, null, 2);

      if (
        res.type &&
        ["cartoon","webtoon","portrait","sketch","sr","depth","object_seg"]
          .includes(res.type)
      ) {
        /* 분할은 색칠한 그림 + 찾은 것 목록으로 온다.
           이름·박스는 여기서 그린다 — 서버 그림에 새기면 영문이라 화면 언어와 어긋난다. */
        const b64 = (res.data && res.data.image) ? res.data.image : res.data;
        const segItems = (res.data && res.data.object) || [];
        const base64Image = "data:image/jpeg;base64," + b64;
        const genImg = new Image();
        genImg.onload = function() {
          resultCanvas.width = genImg.width;
          resultCanvas.height = genImg.height;
          ctx.clearRect(0, 0, genImg.width, genImg.height);
          ctx.drawImage(genImg, 0, 0);
          segItems.forEach(item => {
            const [x1, y1, x2, y2] = item.box;
            drawRect(ctx, x1, y1, x2, y2, "rgb(43, 75, 216)",
                     `${item.name} (${item.score}%)`, 1, 1);
          });
        };
        genImg.src = base64Image;
        return;
      }

      if (displayedImg) {
        resultCanvas.width = srcWidth;
        resultCanvas.height = srcHeight;
        ctx.clearRect(0, 0, srcWidth, srcHeight);
        ctx.drawImage(displayedImg, 0, 0, srcWidth, srcHeight);

        const scaleX = resultCanvas.width / srcWidth;
        const scaleY = resultCanvas.height / srcHeight;

        if (res.type === "mesh") {
          res.data.forEach((item) => {
            const [x1, y1, x2, y2] = item.box;
            drawRect(ctx, x1, y1, x2, y2, "rgb(43, 75, 216)", `${item.distance}cm ${item.direction}`, scaleX, scaleY);
          });
        }
        else if (res.type === "hand") {
          res.data.forEach((item) => {
            const [x1, y1, x2, y2] = item.box;
            const gname = item.gesture;
            drawRect(ctx, x1, y1, x2, y2, "rgb(217, 65, 65)", `${gname} (${item.score}%)`, scaleX, scaleY);
            (item.points || []).forEach(p => drawEllipse(ctx, p[0], p[1], 3, "rgb(43, 75, 216)", scaleX, scaleY));
          });
        }
        else if (res.type === "mask_detect") {
          res.data.forEach((item, idx) => {
            const [x1, y1, x2, y2] = item.box;
            const color = item.mask === 1 ? "rgb(43, 75, 216)" : "rgb(217, 65, 65)";
            const label = item.name || (item.mask === 1 ? "Mask" : "No Mask");
            drawRect(ctx, x1, y1, x2, y2, color, label, scaleX, scaleY);
          });
        }
        else if ([
          "face_detect","face_analyze",
          "face_emotion","face_age_gender"
        ].includes(res.type)) {
          res.data.forEach((item, idx) => {
            const [x1, y1, x2, y2] = item.box;
            let label = item.name || 'face';

            if (res.type === "face_analyze") {
                label = `${item.gender}, ${item.age}, ${item.emotion}`;
            } else if (res.type === "face_age_gender") {
                label = `${item.gender}, ${item.age}`;
            } else if (res.type === "face_emotion") {
                label = item.emotion;
            }

            drawRect(ctx, x1, y1, x2, y2, "rgb(43, 75, 216)", label, scaleX, scaleY);
          });
        }
        else if (res.type === "object_search") {
          (res.data.object || []).forEach((item) => {
            const [x1, y1, x2, y2] = item.box;
            const color = item.name_en === "person" ? "rgb(43, 75, 216)" : "rgb(217, 65, 65)";
            drawRect(ctx, x1, y1, x2, y2, color, `${item.name} (${item.score}%)`, scaleX, scaleY);
          });
        }
        else if (res.type === "object_pose") {
          res.data.forEach((item, idx) => {
            const [x1, y1, x2, y2] = item.box;
            ctx.strokeStyle = "rgb(43, 75, 216)";
            ctx.lineWidth = 2;
            ctx.strokeRect(x1*scaleX, y1*scaleY, (x2 - x1)*scaleX, (y2 - y1)*scaleY);
            const points = item.points;
            draw_points.forEach(pair => {
              const p1 = points[pair[0]];
              const p2 = points[pair[1]];
              drawLine(ctx, p1[0], p1[1], p2[0], p2[1], scaleX, scaleY);
            });
            points.forEach(point => {
              drawEllipse(ctx, point[0], point[1], 3, "rgb(217, 65, 65)", scaleX, scaleY);
            });
          });
        }
        else if (res.type === "ocr") {
          res.data.forEach((item, idx) => {
            const [x1, y1, x2, y2] = item.box;
            drawRect(ctx, x1, y1, x2, y2, "rgb(43, 75, 216)", item.text, scaleX, scaleY);
          });
        }
        else if (res.type === "barcode") {
          res.data.forEach((item, idx) => {
            const [x1, y1, x2, y2] = item.box;
            drawRect(ctx, x1, y1, x2, y2, "rgb(43, 75, 216)", item.data, scaleX, scaleY);
          });
        }
      }
      else {
        resultCanvas.width = 640;
        resultCanvas.height = 480;
        ctx.clearRect(0, 0, 640, 480);
      }
    }

    async function handleRun(model, prompt, imageSource) {
      if (window.vapiStat) vapiStat("lab_run");
      if (!imageSource) {
        alert(T("aSelectImage"));
        return;
      }

      if (imageSource instanceof HTMLCanvasElement && imageSource.id === "sketchCanvas") {
        const tempCanvas = document.createElement("canvas");
        tempCanvas.width = imageSource.width;
        tempCanvas.height = imageSource.height;
        const tempCtx = tempCanvas.getContext("2d");
        tempCtx.fillStyle = "#ffffff";
        tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
        tempCtx.drawImage(imageSource, 0, 0);
        imageSource = tempCanvas;
      }

      let imageBlob;
      if (imageSource instanceof HTMLCanvasElement) {
        imageBlob = await new Promise(resolve => imageSource.toBlob(resolve, 'image/jpeg'));
      }
      else if (imageSource instanceof HTMLImageElement) {
        // 이미지가 아직 디코딩 전이면 0x0 캔버스가 되어 첫 실행이 실패함 → 로드 대기
        if (!imageSource.complete || !imageSource.naturalWidth) {
          await new Promise((resolve, reject) => {
            imageSource.onload = resolve;
            imageSource.onerror = reject;
          });
        }
        const offCanvas = document.createElement('canvas');
        offCanvas.width = imageSource.naturalWidth;
        offCanvas.height = imageSource.naturalHeight;
        offCanvas.getContext('2d').drawImage(imageSource, 0, 0);
        imageBlob = await new Promise(resolve => offCanvas.toBlob(resolve, 'image/jpeg'));
      }

      if (!imageBlob) {
        alert(T("aSelectImage"));
        return;
      }

      const tempImg = new Image();
      tempImg.src = URL.createObjectURL(imageBlob);
      tempImg.onload = function() {
        resizeImage(tempImg, async function(resized) {
          const resizedBlob = resized.blob;
          const resizedWidth = resized.width;
          const resizedHeight = resized.height;
          const newImg = new Image();
          newImg.src = URL.createObjectURL(resizedBlob);
          newImg.onload = async function() {
            const res = await runInference(resizedBlob, prompt, model);
            displayResult(res, newImg, resizedWidth, resizedHeight);
          }
        });
      }
    }

    document.getElementById('mainRunButton').addEventListener('click', async function() {
      const mainRunButton = this;
      const runLabel = document.getElementById('runLabel');
      const resultJSON = document.getElementById('resultJSON');

      mainRunButton.disabled = true;
      sysBusy(true, devOf(modelSelect.value));
      runLabel.innerText = T('running');
      resultJSON.innerText = '';
      hideStamp();
      hideEasy();

      const minimumWait = new Promise(resolve => setTimeout(resolve, 1000));

      const runProcess = (async () => {
        try {
          const prompt = document.getElementById('promptInput').value;
          const model = modelSelect.value;

          const activeTab = document.querySelector('.tab-content.active');
          let imageSource = null;

          if (activeTab.id === 'upload') {
            if (!fileInput.files[0]) {
              alert(T("aSelectImage"));
              return;
            }
            imageSource = uploadPreview;
          } else if (activeTab.id === 'webcam') {
            if (webcamCanvas.style.display === 'none') {
              alert(T("aCapture"));
              return;
            }
            imageSource = webcamCanvas;
          } else if (activeTab.id === 'sketch') {
            imageSource = sketchCanvas;
          }

          if (imageSource) {
             await handleRun(model, prompt, imageSource);
          }

        } catch (error) {
          console.error("실행 중 오류 발생:", error);
          alert(T("aError"));
        }
      })();

      await Promise.all([runProcess, minimumWait]);

      sysBusy(false);
      mainRunButton.disabled = false;
      runLabel.innerText = T('run');
    });

    /* ----- 결과 이미지 저장 ----- */
    document.getElementById('saveResultButton').addEventListener('click', function() {
      const canvas = document.getElementById('resultCanvas');
      if (!canvas.width || !canvas.height) { alert(T("aRunFirst")); return; }
      const a = document.createElement('a');
      const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
      a.download = `vapi-${modelSelect.value}-${stamp}.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
    });

    /* ----- 실행 기록 스트립 ----- */
    const historyBox = document.getElementById('historyBox');
    const historyStrip = document.getElementById('historyStrip');
    const history = [];
    function pushHistory(res) {
      const canvas = document.getElementById('resultCanvas');
      if (!canvas.width) return;
      const thumb = document.createElement('canvas');
      thumb.width = 184; thumb.height = 124;
      thumb.getContext('2d').drawImage(canvas, 0, 0, thumb.width, thumb.height);
      const entry = {
        img: thumb.toDataURL('image/jpeg', 0.7),
        full: canvas.toDataURL('image/jpeg', 0.85),
        text: easyText.innerText.slice(0, 40),
        json: JSON.stringify(res, null, 2),
        model: mName(modelSelect.value),
      };
      history.unshift(entry);
      if (history.length > 8) history.pop();
      renderHistory();
    }
    function renderHistory() {
      historyBox.style.display = history.length ? 'block' : 'none';
      historyStrip.innerHTML = '';
      history.forEach((h, i) => {
        const el = document.createElement('div');
        el.className = 'item';
        el.innerHTML = `<img src="${h.img}" alt=""><div class="cap">${esc(h.model)}</div>`;
        el.title = h.text;
        el.addEventListener('click', () => {
          const canvas = document.getElementById('resultCanvas');
          const ctx = canvas.getContext('2d');
          const im = new Image();
          im.onload = () => {
            canvas.width = im.width; canvas.height = im.height;
            ctx.drawImage(im, 0, 0);
          };
          im.src = h.full;
          easyText.innerHTML = esc(h.text);
          easyAnswer.classList.add('show');
          document.getElementById('resultJSON').innerText = h.json;
        });
        historyStrip.appendChild(el);
      });
    }
    document.getElementById('clearHistoryButton').addEventListener('click', function() {
      history.length = 0;
      renderHistory();
    });

    /* ----- 라이브 모드 (웹캠 연속 인식) — 빠른 모델만 ----- */
    const LIVE_OK = new Set([
      "얼굴 인식","얼굴 분석","얼굴 감정 분석","얼굴 나이/성별 분석","마스크 인식",
      "사물 인식","사람 포즈 인식",
      "QR코드 인식","얼굴 거리·방향","손동작 인식"
    ]);
    const liveToggle = document.getElementById('liveToggle');
    const liveCheck = document.getElementById('liveCheck');
    let liveRunning = false;
    loadCustomModels();                      // 목록 로드(비동기) — LIVE_OK 준비 후 호출

    function updateLiveAvailability() {
      // 모델만 보고 판단한다. 웹캠 탭이 아니면 체크 시 자동으로 전환한다.
      const ok = LIVE_OK.has(modelSelect.value);
      liveCheck.disabled = !ok;
      liveToggle.classList.toggle('off', !ok);
      liveToggle.title = ok ? T("liveOkTip") : T("liveNoTip");
      if (!ok && liveCheck.checked) { liveCheck.checked = false; stopLive(); }
    }
    modelSelect.addEventListener('change', () => {
      updateLiveAvailability();
      if (liveRunning) sysBusy(true, devOf(modelSelect.value));
    });
    tabButtons.forEach(b => b.addEventListener('click', updateLiveAvailability));

    async function liveLoop() {
      while (liveRunning) {
        const ctx = webcamCanvas.getContext('2d');
        ctx.drawImage(webcamVideo, 0, 0, webcamCanvas.width, webcamCanvas.height);
        webcamCanvas.style.display = 'block';
        sysBusy(true, devOf(modelSelect.value));   // 도중에 모델을 바꿔도 따라간다
        try {
          await handleRun(modelSelect.value, document.getElementById('promptInput').value, webcamCanvas);
        } catch (e) { console.error(e); }
        await new Promise(r => setTimeout(r, 400));
      }
    }
    function startLive() {
      if (liveRunning) return;
      liveRunning = true;
      liveToggle.classList.add('on');
      document.getElementById('runLabel').innerText = T('liveRun');
      document.getElementById('mainRunButton').disabled = true;
      sysBusy(true, devOf(modelSelect.value));
      liveLoop();
    }
    function stopLive() {
      liveRunning = false;
      liveToggle.classList.remove('on');
      document.getElementById('runLabel').innerText = T('run');
      document.getElementById('mainRunButton').disabled = false;
      sysBusy(false);
    }
    liveCheck.addEventListener('change', async function() {
      if (!this.checked) { stopLive(); return; }
      // 웹캠 탭이 아니면 자동 전환
      if (document.querySelector('.tab-content.active').id !== 'webcam') {
        const btn = document.querySelector('.tabButton[data-tab="webcam"]');
        if (btn && btn.style.display !== 'none') btn.click();
      }
      // 웹캠 영상이 준비될 때까지 잠깐 대기
      for (let i = 0; i < 30 && !webcamVideo.videoWidth; i++) {
        await new Promise(r => setTimeout(r, 100));
      }
      if (!webcamVideo.videoWidth) {
        alert(T("aNoWebcam"));
        this.checked = false;
        return;
      }
      startLive();
    });
    updateLiveAvailability();

    /* ----- 스페이스바로 실행 ----- */
    document.addEventListener('keydown', function(e) {
      if (e.code !== 'Space' || liveRunning) return;
      const t = e.target.tagName;
      if (t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA' || t === 'BUTTON') return;
      e.preventDefault();
      document.getElementById('mainRunButton').click();
    });

    document.getElementById('copyJsonButton').addEventListener('click', function() {
      const jsonText = document.getElementById('resultJSON').innerText;
      if (!jsonText || jsonText.trim() === "") {
        return;
      }

      const textArea = document.createElement("textarea");
      textArea.value = jsonText;
      textArea.style.position = 'fixed';
      textArea.style.top = 0;
      textArea.style.left = 0;
      textArea.style.width = '2em';
      textArea.style.height = '2em';
      textArea.style.padding = 0;
      textArea.style.border = 'none';
      textArea.style.outline = 'none';
      textArea.style.boxShadow = 'none';
      textArea.style.background = 'transparent';

      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();

      try {
        document.execCommand('copy');
        this.innerText = T('copied');
        setTimeout(() => {
          this.innerText = T('copy');
        }, 1500);
      } catch (err) {
        console.error('JSON 복사 실패:', err);
        alert(T('aCopyFail'));
      }

      document.body.removeChild(textArea);
    });
  </script>
