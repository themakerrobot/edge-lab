<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>edge-lab</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link href="/fonts/fonts.css" rel="stylesheet">
  <script>
    /* 밝은 곳 모드: 화면이 그려지기 전에 적용해야 깜빡이지 않는다 */
    try { if (localStorage.getItem("vapi-hc") === "1")
            document.documentElement.classList.add("hc"); } catch (e) {}
    /* 첫 화면: 바탕(배경)은 바로 그리고, 내용은 글꼴과 첫 자료가 다 온 뒤 한 번에 보인다 — 맨 아래 "첫 화면" */
    document.documentElement.classList.add("el-wait");
    /* 키오스크로 켰을 때(appwin 이 ?launch=1 을 붙인다): 전체 화면 창은 페이지를 그리기 전에 검은색이다.
       첫 프레임을 같은 검정으로 그리고, 화면이 준비되면 검정이 서서히 걷힌다 — 검정 → 화면으로 튀지 않게.
       보통 브라우저(첫 프레임이 흰색)에서는 하지 않는다. 표시는 주소에서 지운다. */
    try {
      var qs = new URLSearchParams(location.search);
      if (qs.get("launch") === "1") {
        document.documentElement.classList.add("el-app", "el-dark");
        qs.delete("launch");
        history.replaceState(null, "", location.pathname + (qs.toString() ? "?" + qs : "") + location.hash);
      }
    } catch (e) {}
  </script>
  <style>
    /* 검은 막 — 스크립트가 멈춰도 3초 뒤에는 걷힌다(animation) */
    html.el-app::before { content: ""; position: fixed; inset: 0; z-index: 2147483647; pointer-events: none;
                          background: #000; opacity: 0; transition: opacity .45s ease-out; }
    html.el-app.el-dark::before { opacity: 1; animation: el-undark 0s 3s forwards; }
    @keyframes el-undark { to { opacity: 0; } }
  </style>
  <link rel="stylesheet" href="/lib/tokens.css">
  <script src="/lib/boot.js"></script>
  <style>
    /* 셸 — edge-lab 을 하나의 컴퓨터처럼 보이게 하는 첫 화면.
     *
     * 전에는 "/" 가 런처(home.html)였고, 앱을 누르면 페이지가 통째로 바뀌었다.
     * 그러면 블록을 짜다 카메라를 보러 가는 순간 블록이 사라진다. 여기서는 셸이
     * 계속 떠 있고, 앱은 그 안의 창(iframe)으로 열린다. 한 번에 하나를 보여 주되
     * 뒤로 간 창도 살아 있어서, 돌아오면 하던 그대로다.
     *
     * 창 안의 페이지는 lib/embed.js 가 제목줄을 숨기고, 셸이 보내는 숨김/보임을
     * 받아 카메라·실시간 인식을 멈춘다. 창을 여는 일은 이 파일만 한다 — 창 안의
     * 링크도 embed.js 가 가로채 여기로 넘긴다.
     *
     * 옛 런처는 /home 에 그대로 둔다 (창 없이 쓰는 길).
     */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
      color: var(--ink); font-family: "Gowun Dodum", "Apple SD Gothic Neo", system-ui, sans-serif;
      font-size: var(--fs-body); line-height: 1.5;
    }
    /* 첫 화면 — 내용(body)은 준비될 때까지 투명, 배경은 html 이 바로 그린다.
       스크립트가 멈춰도 3초 뒤에는 보이게(animation) — 빈 화면에 갇히지 않는다 */
    html.el-wait body { opacity: 0; animation: el-show 0s 3s forwards; }
    @keyframes el-show { to { opacity: 1; } }
    html.el-shown body { transition: opacity .15s ease-out; }
    /* html.el-booting 도 같이 — 준비 화면(lib/boot.js)이 떠 있는 동안에도 배경이 바뀌지 않게.
       boot.js 의 같은 선택자보다 뒤에 오므로 이것이 이긴다 */
    html, html.el-booting {
      /* 바탕화면 — 그림 파일 없이 CSS 로만 */
      background:
        radial-gradient(1100px 620px at 8% 0%,   #d4e9f0 0%, rgba(212,233,240,0) 62%),
        radial-gradient(900px 560px at 100% 100%, #fbe1cf 0%, rgba(251,225,207,0) 60%),
        radial-gradient(700px 420px at 78% 18%,  #e3efdd 0%, rgba(227,239,221,0) 58%),
        #f5efe3;
    }
    html.hc, html.hc.el-booting { background: var(--paper); }
    /* 준비 화면 카드는 바탕화면 배경 위에 뜬다 — 켜는 내내 배경이 한 번도 바뀌지 않는다 */
    html #boot { background: transparent; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    svg { display: block; }

    /* ── 상단바 ── */
    #osbar {
      flex: 0 0 40px; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 6px;
      position: relative; z-index: 20; white-space: nowrap;
      background: rgba(255,253,248,.82); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(74,63,46,.16);
    }
    html.hc #osbar { background: #fff; border-bottom: 1.5px solid var(--line-d); }
    .os-start { display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px 0 6px;
                border-radius: 16px; font-weight: 700; font-size: 14px; }
    .os-start img { width: 24px; height: 24px; }
    .os-start:hover { background: rgba(31,95,122,.08); }
    .os-start.on { background: var(--cyan); color: #fff; }
    .os-sep { width: 1px; height: 20px; background: rgba(74,63,46,.2); margin: 0 6px; }
    .os-apps { display: flex; gap: 3px; flex: 1 1 auto; min-width: 0; overflow: hidden; }
    .os-app { position: relative; display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 9px;
              border-radius: 10px; font-size: 13.5px; color: var(--ink-2); flex: 0 0 auto; }
    .os-app svg { width: 19px; height: 19px; }
    .os-app:hover { background: rgba(31,95,122,.08); }
    .os-app .lbl { display: none; }
    .os-app.run .lbl { display: inline; }
    .os-app.run::after { content: ""; position: absolute; left: 50%; bottom: 1px; width: 14px; height: 3px;
                         border-radius: 2px; margin-left: -7px; background: rgba(31,95,122,.45); }
    .os-app.on { background: #fff; color: var(--cyan-d); font-weight: 700; box-shadow: 0 1px 4px rgba(44,74,124,.14); }
    .os-app.on::after { background: var(--cyan); width: 22px; margin-left: -11px; }
    .os-app .x { display: none; width: 20px; height: 20px; border-radius: 10px; margin-right: -4px;
                 align-items: center; justify-content: center; font-size: 15px; line-height: 1; color: var(--ink-2); }
    .os-app.run.on .x, .os-app.run:hover .x { display: inline-flex; }
    .os-app .x:hover { background: #fdecea; color: #a3321f; }
    .os-tray { display: flex; align-items: center; gap: 5px; flex: 0 0 auto; }
    .os-chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px;
               font-size: 12.5px; background: rgba(255,255,255,.75); border: 1px solid rgba(74,63,46,.14); }
    .os-chip svg { width: 15px; height: 15px; }
    .os-chip[hidden] { display: none; }
    button.os-chip:hover, a.os-chip:hover { background: #fff; }
    .os-dot { width: 7px; height: 7px; border-radius: 50%; background: #c9bda6; flex: 0 0 auto; }
    .os-ai.ok .os-dot { background: #3a9a55; }
    .os-ai.wait .os-dot { background: #e0a030; }
    .os-ai.bad .os-dot { background: #d9412b; }
    /* 카메라·마이크를 쓰는 창이 있으면 — 개인정보 표시라 눈에 띄게 */
    .os-use { background: #fdecea; border-color: #f2b8b0; color: #a3321f; font-weight: 700; }
    .os-use .os-dot { background: #d9412b; }
    .os-bell { position: relative; padding: 0 9px; }
    .os-bell b { position: absolute; top: -4px; right: -4px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px;
                 background: #d9412b; color: #fff; font-size: 10.5px; line-height: 17px; text-align: center; }
    .os-bell b[hidden] { display: none; }
    .os-bell.open, .os-bell.open:hover { background: var(--cyan); color: #fff; border-color: var(--cyan); }
    .os-power { width: 30px; padding: 0; justify-content: center; }
    .os-power.open, .os-power.open:hover { background: var(--cyan); color: #fff; border-color: var(--cyan); }
    .os-clock { font-family: Menlo, Consolas, ui-monospace, monospace; font-weight: 700; font-size: 13px; padding: 0 4px 0 6px; }
    .os-clock small { font-weight: 400; font-size: 11px; color: var(--ink-2); margin-left: 5px; }

    /* ── 바탕화면과 창이 함께 쓰는 자리 ── */
    #osMain { flex: 1 1 auto; position: relative; min-height: 0; }

    /* ── 바탕화면 ── */
    #desk { position: absolute; inset: 0; overflow-y: auto; padding: 26px 28px 30px;
            display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 28px; align-content: start; }
    #desk[hidden] { display: none; }
    .d-hero { grid-column: 1 / -1; display: flex; align-items: flex-end; gap: 18px; }
    .d-hero .t { font-family: "Gowun Batang", serif; font-size: 56px; font-weight: 700; line-height: 1;
                 letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .d-hero .d { font-size: 15px; color: var(--ink-2); padding-bottom: 6px; }
    .d-hero .d b { display: block; font-family: "Gowun Batang", serif; font-size: 19px; color: var(--ink); margin-top: 3px; }
    .d-hero img { height: 72px; margin-left: auto; }
    .d-icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; align-content: start; }
    .d-ic { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 10px 14px;
            border-radius: 18px; text-align: center; }
    .d-ic:hover { background: rgba(255,255,255,.6); }
    .d-ic .g { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; color: #fff;
               background: var(--cyan); box-shadow: 0 6px 16px rgba(23,71,92,.24); }
    .d-ic .g svg { width: 34px; height: 34px; }
    /* 묶음(lib/apps.js 의 cat)마다 색 — AI 는 기본 파랑 */
    .d-ic.c-dev .g { background: #5d4f9e; box-shadow: 0 6px 14px rgba(70,55,130,.22); }
    .d-ic.c-tool .g { background: #d07a3e; box-shadow: 0 6px 14px rgba(150,80,30,.22); }
    .d-ic.c-sys .g { background: #5b6b76; box-shadow: 0 6px 14px rgba(40,50,60,.2); }
    .d-cat { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; color: var(--ink-2);
             letter-spacing: .04em; margin: 4px 4px -4px; }
    .d-cat::after { content: ""; flex: 1; height: 1px; background: rgba(74,63,46,.16); }
    .d-cat:first-child { margin-top: 0; }
    .d-ic b { font-size: var(--fs-name); }
    .d-ic i { font-style: normal; font-size: 12.5px; color: var(--ink-2); line-height: 1.35; }
    .d-file .g { background: #fff; color: var(--ink-2); border-radius: 8px 20px 8px 8px; border: 1.5px solid rgba(74,63,46,.22);
                 box-shadow: 0 4px 10px rgba(44,74,124,.12); position: relative; }
    .d-file .g .ext { font-family: Menlo, Consolas, monospace; font-size: 11px; font-weight: 700; }
    .d-file .g .badge { position: absolute; right: -8px; bottom: -6px; width: 28px; height: 28px; border-radius: 9px; background: var(--cyan);
                        color: #fff; display: grid; place-items: center; border: 2px solid #fff; }
    .d-file .g .badge svg { width: 16px; height: 16px; }
    .d-file { position: relative; }
    .d-file b { font-weight: 400; font-size: 14px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .d-file .unpin { position: absolute; top: 4px; right: 10px; width: 22px; height: 22px; border-radius: 11px; display: none;
                     background: #fff; border: 1px solid rgba(74,63,46,.2); font-size: 14px; line-height: 1; color: var(--ink-2); }
    .d-file:hover .unpin { display: block; }
    .d-ic.run .g { outline: 3px solid rgba(31,95,122,.35); outline-offset: 3px; }
    .d-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .w { background: rgba(255,255,255,.74); backdrop-filter: blur(8px); border: 1px solid rgba(74,63,46,.12);
         border-radius: 16px; padding: 13px 16px; box-shadow: 0 4px 14px rgba(44,74,124,.08); }
    html.hc .w { background: #fff; border-color: var(--line-d); }
    .w h3 { font-size: 13px; color: var(--cyan-d); display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
    .w h3 svg { width: 15px; height: 15px; }
    .w h3 em { margin-left: auto; font-style: normal; font-weight: 400; font-size: 12px; color: var(--ink-2); }
    .w-row { display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 3px 6px; border-radius: 10px; font-size: 14px; width: 100%; text-align: left; }
    .w-row:hover { background: rgba(31,95,122,.08); }
    .w-row .i { width: 28px; height: 28px; border-radius: 9px; background: var(--cyan-bg); color: var(--cyan-d);
                display: grid; place-items: center; flex: 0 0 auto; }
    .w-row .i svg { width: 16px; height: 16px; }
    .w-row span { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .w-row small { font-size: 12px; color: var(--ink-2); flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 55%; }
    .w-empty { font-size: 13px; color: var(--ink-2); padding: 4px 6px 2px; }
    .devs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .dev { background: #fff; border: 1px solid rgba(74,63,46,.14); border-radius: 12px; padding: 8px 10px; min-width: 0; }
    .dev b { font-family: Menlo, Consolas, monospace; font-size: 13px; color: var(--cyan-d); display: flex; align-items: center; gap: 6px; }
    .dev i { display: block; font-style: normal; font-size: 12px; color: var(--ink-2); margin-top: 3px; line-height: 1.35; }
    .dev.none { opacity: .45; }
    .dev.none .os-dot { background: #c9bda6; }
    .dev .os-dot { background: #3a9a55; }
    .mem { height: 8px; border-radius: 4px; background: #ece5d6; overflow: hidden; margin-top: 10px; }
    .mem i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #1f5f7a, #3d8fb0); border-radius: 4px; }
    .mem-t { font-size: 12px; color: var(--ink-2); margin-top: 5px; }

    /* ── 창 — 하나만 보이고, 뒤로 간 것도 살아 있다 ── */
    #wins { position: absolute; inset: 0; pointer-events: none; }
    .win { position: absolute; inset: 6px; border-radius: 10px; overflow: hidden; background: var(--paper);
           border: 1px solid rgba(74,63,46,.22); box-shadow: 0 10px 30px rgba(44,74,124,.16);
           visibility: hidden; pointer-events: none; }
    /* display:none 이 아니라 visibility — 크기가 남아 있어야 블록 작업판처럼 제 크기를
       재는 것들이 돌아왔을 때 멀쩡하다 */
    .win.on { visibility: visible; pointer-events: auto; }
    .win iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--paper); }

    /* ── 알림 — 토스트(잠깐 뜨는 것)와 목록(상단바 종) ── */
    #osToasts { position: fixed; top: 48px; right: 10px; z-index: 70; display: flex; flex-direction: column; gap: 8px;
                width: min(340px, calc(100% - 20px)); pointer-events: none; }
    .toast, .note { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 11px; align-items: start;
                    padding: 11px 12px 11px 13px; border-radius: 14px; background: rgba(255,253,248,.97);
                    border: 1px solid rgba(74,63,46,.16); }
    .toast { box-shadow: 0 14px 34px rgba(44,74,124,.24); pointer-events: auto; cursor: pointer;
             animation: toastIn .18s ease-out; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-6px); } }
    @media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
    .toast .i, .note .i { grid-row: 1 / 4; width: 34px; height: 34px; border-radius: 11px; background: var(--cyan); color: #fff;
                          display: grid; place-items: center; }
    .toast .i svg, .note .i svg { width: 19px; height: 19px; }
    .toast b, .note b { font-size: 13.5px; }
    .toast b small, .note b small { font-weight: 400; color: var(--ink-2); font-size: 12px; margin-left: 6px; }
    .toast p, .note p { grid-column: 2 / 4; font-size: 13.5px; color: var(--ink); line-height: 1.45; word-break: keep-all; }
    .toast .x { width: 24px; height: 24px; border-radius: 12px; font-size: 16px; line-height: 1; color: var(--ink-2); }
    .toast .x:hover { background: rgba(31,95,122,.1); }
    .acts { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .act { height: 32px; padding: 0 13px; border-radius: 16px; border: 1px solid rgba(31,95,122,.35); background: #fff;
           font-size: 13px; font-weight: 700; color: var(--cyan-d); }
    .act:hover { background: var(--cyan); color: #fff; border-color: var(--cyan); }
    #osNote { position: fixed; top: 46px; right: 10px; z-index: 80; width: min(360px, calc(100% - 20px));
              max-height: calc(100dvh - 60px); overflow-y: auto; padding: 12px; border-radius: 18px;
              background: rgba(250,246,238,.97); border: 1px solid rgba(74,63,46,.18); box-shadow: 0 18px 44px rgba(44,74,124,.24); }
    #osNote[hidden] { display: none; }
    .note-head { display: flex; align-items: center; margin: 0 2px 8px; }
    .note-head b { font-size: 14px; }
    .note-head button { margin-left: auto; font-size: 12.5px; color: var(--ink-2); padding: 4px 8px; border-radius: 8px; }
    .note-head button:hover { background: rgba(31,95,122,.1); }
    #noteList { display: flex; flex-direction: column; gap: 8px; }
    .note-none { font-size: 13px; color: var(--ink-2); padding: 10px 4px 6px; text-align: center; }

    /* ── 창이 너무 많을 때 ── */
    #osFull { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; background: rgba(42,38,32,.28); }
    #osFull[hidden] { display: none; }
    .full-card { width: min(420px, calc(100% - 32px)); background: var(--paper); border: 1.5px solid var(--line-d);
                 border-radius: 16px; padding: 18px 18px 14px; box-shadow: 0 20px 50px rgba(44,74,124,.3); }
    .full-card h2 { font-family: "Gowun Batang", serif; font-size: 18px; margin-bottom: 4px; }
    .full-card p { font-size: 13.5px; color: var(--ink-2); margin-bottom: 12px; }
    .full-row { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 4px 6px; border-radius: 10px; }
    .full-row + .full-row { border-top: 1px solid rgba(74,63,46,.1); }
    .full-row svg { width: 20px; height: 20px; color: var(--cyan-d); }
    .full-row span { flex: 1; font-size: 15px; }
    .btn-s { height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid rgba(74,63,46,.25); background: #fff;
             font-size: 13.5px; font-weight: 700; }
    .btn-s:hover { border-color: #a3321f; color: #a3321f; }
    .full-foot { display: flex; justify-content: flex-end; margin-top: 10px; }

    @media (max-width: 1100px) {
      #desk { grid-template-columns: 1fr; }
    }
    @media (max-width: 760px) {
      .os-start b, .os-clock small, #osDocs, .os-sep { display: none; }
      .os-app.run .lbl { display: none; }
      .os-ai .lbl { display: none; }
      #desk { padding: 18px 16px 24px; }
      .d-hero .t { font-size: 44px; }
      .d-icons { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
    }
  </style>
</head>
<body>

  <div id="osbar">
    <button class="os-start" id="osStart" type="button"><img src="/assets/pibo-logo.png" alt=""><b>edge-lab</b></button>
    <span class="os-sep"></span>
    <nav class="os-apps" id="osApps"></nav>
    <div class="os-tray">
      <span class="os-chip os-use" id="osCam" hidden></span>
      <span class="os-chip os-use" id="osMic" hidden></span>
      <button class="os-chip" id="osBoard" type="button" hidden></button>
      <button class="os-chip os-bell" id="osBell" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6.5 2 6.5H4S6 14 6 9Z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg><b id="osBellN" hidden></b></button>
      <span class="os-chip os-ai wait" id="osAi"><span class="os-dot"></span><span class="lbl"></span></span>
      <a class="os-chip" id="osDocs" href="/docs" target="_blank">API</a>
      <button class="os-chip" id="osLang" type="button"></button>
      <span class="os-chip" id="osBat" hidden></span>
      <span class="os-clock" id="osClock"></span>
      <button class="os-chip os-power" id="osPower" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></button>
    </div>
  </div>

  <main id="osMain">
    <section id="desk">
      <div class="d-hero">
        <span class="t" id="dTime"></span>
        <span class="d"><span id="dDate"></span><b id="dHello"></b></span>
        <img src="/assets/pibo-hello.png" alt="">
      </div>
      <div class="d-icons" id="dIcons"></div>
      <div class="d-side">
        <div class="w" id="wMine"></div>
        <div class="w" id="wPc"></div>
      </div>
    </section>
    <div id="wins"></div>
  </main>

  <div id="osToasts"></div>
  <div id="osNote" hidden>
    <div class="note-head"><b id="noteTitle"></b><button id="noteClear" type="button"></button></div>
    <div id="noteList"></div>
  </div>

  <div id="osFull" hidden>
    <div class="full-card">
      <h2 id="fullTitle"></h2>
      <p id="fullText"></p>
      <div id="fullList"></div>
      <div class="full-foot"><button class="btn-s" id="fullCancel" type="button"></button></div>
    </div>
  </div>

  <script src="/lib/icons.js"></script>
  <script src="/lib/apps.js"></script>
  <script>
    (function () {
      "use strict";

      /* 창 안의 페이지(lib/embed.js)가 이것을 보고 "셸 안에 있다" 고 안다.
         keys — 창에 포커스가 있어도 셸이 받는 단축키 */
      window.EL_SHELL = { keys: ["alt+home"], keyFns: {}, hidden: [], teacher: false };

      var MAX = 4;                   // 뒤에 살려 둘 창 수. 창 하나가 페이지 하나라 메모리를 먹는다
      var A = window.EL_APPS;
      var LANG = A.lang();
      document.documentElement.lang = LANG;

      var UI = {
        ko: {
          hello: "무엇을 해 볼까요?", helloName: "{n}, 무엇을 해 볼까요?", pins: "바탕화면에 둔 것",
          days: ["일", "월", "화", "수", "목", "금", "토"], date: "{m}월 {d}일 {w}요일",
          mine: "내가 가르친 AI", mineGo: "가르치기에서 보기", mineNone: "아직 없어요. 가르치기에서 만들어 보세요.",
          pc: "이 컴퓨터", pcSub: "AI 를 돌리는 곳", mem: "메모리 {u} / {t} GB",
          work: { face: "얼굴", vlm: "말 · 사진 설명", vision: "사진 바꾸기", code: "글자 · QR" },
          idle: "쉬는 중",
          aiOk: "AI 준비", aiWait: "AI 준비 중", aiBad: "AI 문제",
          cam: "카메라", mic: "마이크", boardOn: "보드 연결됨 — 누르면 보드 앱", boardLost: "보드 연결이 끊겼어요. USB 케이블을 확인해 주세요.", boardOpen: "보드 앱", close: "닫기", langBtn: "EN", docs: "API 문서 (선생님용)",
          start: "바탕화면", fullTitle: "창이 너무 많아요",
          fullText: "{max}개까지 켜 둘 수 있어요. 하나를 닫으면 ‘{app}’ 창을 열게요.", cancel: "그만두기",
          notes: "알림", noteNone: "새 알림이 없어요", noteClear: "모두 지우기", now: "방금", ago: "{n}분 전",
          aiReady: "AI 준비가 끝났어요. 이제 모든 앱을 쓸 수 있어요.",
          blocked: "‘{app}’ 은(는) 수업 중에는 쉬어요.", removed: "‘{app}’ 은(는) 빼 두었어요. 앱 가게에서 다시 넣을 수 있어요.", storeGo: "앱 가게"
        },
        en: {
          hello: "What shall we do?", helloName: "{n}, what shall we do?", pins: "Pinned",
          days: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], date: "{w}, {mo} {d}",
          mine: "AI I trained", mineGo: "Open in Train", mineNone: "None yet. Make one in Train.",
          pc: "This computer", pcSub: "Where the AI runs", mem: "Memory {u} / {t} GB",
          work: { face: "Faces", vlm: "Talk · describe", vision: "Photo effects", code: "Text · QR" },
          idle: "idle",
          aiOk: "AI ready", aiWait: "AI loading", aiBad: "AI problem",
          cam: "Camera", mic: "Mic", boardOn: "Board connected — open the Board app", boardLost: "The board was disconnected. Check the USB cable.", boardOpen: "Board app", close: "Close", langBtn: "한", docs: "API docs (for teachers)",
          start: "Desktop", fullTitle: "Too many windows",
          fullText: "Up to {max} can stay open. Close one and ‘{app}’ will open.", cancel: "Cancel",
          notes: "Notifications", noteNone: "Nothing new", noteClear: "Clear all", now: "just now", ago: "{n} min ago",
          aiReady: "The AI is ready. Every app can be used now.",
          blocked: "‘{app}’ is resting during class.", removed: "‘{app}’ was removed. Add it again in the App store.", storeGo: "App store"
        }
      };
      var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      function T(k) { return UI[LANG][k]; }
      function fill(s, o) { return s.replace(/\{(\w+)\}/g, function (_, k) { return o[k] != null ? o[k] : ""; }); }
      function $(id) { return document.getElementById(id); }
      function icon(n) { return window.elIcon ? window.elIcon(n) : ""; }
      function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
      /* 선생님이 수업 모드로 숨긴 앱 (lib/os-teacher.js 가 EL_SHELL.hidden 을 채운다) */
      function hiddenApp(path) {                  // 선생님이 수업 중 쉬게 한 앱 · 앱 가게에서 뺀 앱
        return ((window.EL_SHELL.hidden || []).indexOf(path) >= 0 && !window.EL_SHELL.teacher) || A.isRemoved(path);
      }
      function appOf(path) { return A.APPS.filter(function (x) { return x.href === path; })[0] || null; }
      function appName(path) { var a = appOf(path); return a ? (LANG === "en" ? a.en : a.ko) : path; }

      /* ─────────────── 창 ─────────────── */
      var wins = {};                 // 경로 → { el, frame, href, last, media:{camera,mic} }
      var active = null;             // 보이는 창의 경로. null 이면 바탕화면
      var pending = null;            // 창이 꽉 찼을 때 열려던 것

      function pathOf(href) {
        var u = new URL(href, location.href);
        return { path: u.pathname.replace(/\/+$/, "") || "/", href: u.pathname + u.search + u.hash, origin: u.origin };
      }
      function post(w, action) {
        try { w.frame.contentWindow.postMessage({ type: "el-shell", action: action }, location.origin); } catch (e) {}
      }

      function open(href, blank) {
        var p = pathOf(href);
        if (p.origin !== location.origin) { window.open(href, "_blank"); return; }
        if (p.path === "/" || p.path === "/home") { showDesk(); return; }
        if (!appOf(p.path)) { window.open(p.href, "_blank"); return; }   // /docs 같은 것 — 창이 아니다
        if (A.isRemoved(p.path)) { notify(null, fill(T("removed"), { app: appName(p.path) }), [{ label: T("storeGo"), href: "/store" }], true); return; }
        if (hiddenApp(p.path)) { notify(null, fill(T("blocked"), { app: appName(p.path) }), [], true); return; }
        var w = wins[p.path];
        if (w) {
          /* ?from=blocks · ?add=… 처럼 넘길 것이 있으면 그 창을 새로 불러온다 (기록을 남기지 않게 replace).
             같은 주소라도 다시 — 알림의 [블록에 넣기] 를 두 번 누르면 두 번 넣는 것이 맞다.
             하던 것은 각 페이지의 초안 자동 저장이 지킨다. */
          if (p.href !== p.path) {
            w.href = p.href;
            try { w.frame.contentWindow.location.replace(p.href); } catch (e) { w.frame.src = p.href; }
          }
          activate(p.path);
          return;
        }
        if (Object.keys(wins).length >= MAX) { askClose(p); return; }
        var el = document.createElement("div");
        el.className = "win";
        var f = document.createElement("iframe");
        f.src = p.href;
        f.title = appName(p.path);
        f.setAttribute("allow", "camera; microphone; serial; clipboard-write; autoplay");
        el.appendChild(f);
        $("wins").appendChild(el);
        wins[p.path] = { el: el, frame: f, href: p.href, last: 0, media: { camera: false, mic: false } };
        activate(p.path);
      }

      function activate(path) {
        Object.keys(wins).forEach(function (k) {
          var w = wins[k];
          if (k === path) {
            if (!w.el.classList.contains("on")) { w.el.classList.add("on"); post(w, "show"); }
            w.last = Date.now();
          } else if (w.el.classList.contains("on")) {
            w.el.classList.remove("on"); post(w, "hide");
          }
        });
        active = path;
        $("desk").hidden = true;
        paintBar();
        try { wins[path].frame.focus(); } catch (e) {}
      }

      function showDesk() {
        if (active && wins[active]) { wins[active].el.classList.remove("on"); post(wins[active], "hide"); }
        active = null;
        $("desk").hidden = false;
        paintBar(); paintDesk();
        loadDesk();
      }

      function close(path) {
        var w = wins[path];
        if (!w) return;
        w.el.remove();                      // 페이지가 내려가면 카메라·타이머도 함께 끝난다
        delete wins[path];
        if (active === path) showDesk(); else paintBar();
        paintUse();
      }

      function askClose(p) {
        pending = p;
        $("fullTitle").textContent = T("fullTitle");
        $("fullText").textContent = fill(T("fullText"), { max: MAX, app: appName(p.path) });
        $("fullCancel").textContent = T("cancel");
        var list = $("fullList");
        list.innerHTML = "";
        Object.keys(wins).sort(function (a, b) { return wins[a].last - wins[b].last; }).forEach(function (k) {
          var a = appOf(k), row = document.createElement("div");
          row.className = "full-row";
          row.innerHTML = icon(a ? a.ic : "") + "<span>" + esc(appName(k)) + '</span><button class="btn-s" type="button">' + esc(T("close")) + "</button>";
          row.querySelector("button").addEventListener("click", function () {
            close(k);
            $("osFull").hidden = true;
            var go = pending; pending = null;
            if (go) open(go.href);
          });
          list.appendChild(row);
        });
        $("osFull").hidden = false;
      }
      $("fullCancel").addEventListener("click", function () { pending = null; $("osFull").hidden = true; });

      /* 창에서 오는 말 (lib/embed.js) */
      window.addEventListener("message", function (e) {
        if (e.origin !== location.origin || !e.data || e.data.type !== "el-win") return;
        var path = null;
        Object.keys(wins).forEach(function (k) { if (wins[k].frame.contentWindow === e.source) path = k; });
        if (!path) return;
        var w = wins[path], d = e.data;
        if (d.action === "hello") {
          if (active !== path) post(w, "hide");      // 뜨는 사이 다른 창으로 옮겨 갔다
        } else if (d.action === "open") {
          open(d.href, d.blank);
        } else if (d.action === "media") {
          w.media = { camera: !!d.camera, mic: !!d.mic };
          paintUse();
        } else if (d.action === "notify") {
          notify(path, d.text, d.actions, !!d.always || active !== path);
        } else if (d.action === "key") {
          onKey(d.key);
        }
      });

      /* ─────────────── 단축키 ─────────────── */
      function onKey(k) {
        if (k === "alt+home") showDesk();
        else if (window.EL_SHELL.keyFns[k]) window.EL_SHELL.keyFns[k]();
      }
      document.addEventListener("keydown", function (e) {
        var k = (e.ctrlKey ? "ctrl+" : "") + (e.altKey ? "alt+" : "") + (e.shiftKey ? "shift+" : "") +
                (e.metaKey ? "meta+" : "") + String(e.key || "").toLowerCase();
        if (window.EL_SHELL.keys.indexOf(k) >= 0) { e.preventDefault(); onKey(k); }
      });

      /* 뒤로 가기 — 셸을 떠나지 않고 바탕화면으로. 마우스 옆 단추를 누르는 아이가 많다. */
      try { history.replaceState({ el: 0 }, ""); history.pushState({ el: 1 }, ""); } catch (e) {}
      window.addEventListener("popstate", function () {
        try { history.pushState({ el: 1 }, ""); } catch (e) {}
        showDesk();
      });

      /* ─────────────── 상단바 ─────────────── */
      function paintBar() {
        $("osStart").classList.toggle("on", active === null);
        $("osStart").title = T("start");
        var box = $("osApps");
        box.innerHTML = "";
        var lastCat = null;
        A.APPS.forEach(function (a) {
          if (hiddenApp(a.href) && !wins[a.href]) return;
          /* 작업 표시줄처럼 — 기본 앱(core)과 지금 떠 있는 창만. 앱이 스무 개를 넘자 상단바가 넘쳐
             오른쪽 앱이 잘렸다. 나머지는 바탕화면 · 시작 메뉴에서 연다 */
          if (!a.core && !wins[a.href]) return;
          if (lastCat && a.cat !== lastCat) {            // 묶음이 바뀌는 곳에 가는 세로줄
            var sep = document.createElement("span"); sep.className = "os-sep"; sep.style.alignSelf = "center";
            box.appendChild(sep);
          }
          lastCat = a.cat;
          var run = !!wins[a.href], on = active === a.href;
          var name = LANG === "en" ? a.en : a.ko;
          var b = document.createElement("button");
          b.type = "button";
          b.className = "os-app" + (run ? " run" : "") + (on ? " on" : "");
          b.title = name;
          b.innerHTML = icon(a.ic) + '<span class="lbl">' + esc(name) + "</span>" +
                        (run ? '<span class="x" title="' + esc(T("close")) + '">×</span>' : "");
          b.addEventListener("click", function (e) {
            if (e.target.closest(".x")) { close(a.href); return; }
            if (on) showDesk(); else open(a.href);   // 보이는 앱을 다시 누르면 내린다
          });
          box.appendChild(b);
        });
        $("osLang").textContent = T("langBtn");
        $("osLang").title = "한국어 / English";
        $("osDocs").title = T("docs");
      }

      /* 카메라·마이크를 쓰는 창 */
      function paintUse() {
        var cam = [], mic = [];
        Object.keys(wins).forEach(function (k) {
          if (wins[k].media.camera) cam.push(appName(k));
          if (wins[k].media.mic) mic.push(appName(k));
        });
        var CAM = '<span class="os-dot"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5h12v9H3z"/><path d="m15 11 6-3.5v9L15 13"/></svg>';
        var MIC = '<span class="os-dot"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>';
        $("osCam").hidden = !cam.length;
        $("osCam").innerHTML = CAM + esc(cam.join(" · "));
        $("osCam").title = T("cam");
        $("osMic").hidden = !mic.length;
        $("osMic").innerHTML = MIC + esc(mic.join(" · "));
        $("osMic").title = T("mic");
      }

      /* AI 준비 상태 — 로딩이 끝날 때까지 자주, 그 뒤로는 가끔 */
      var aiState = null, aiWasLoading = false;
      function paintAi() {
        var c = $("osAi"), s = aiState;
        c.className = "os-chip os-ai " + (!s ? "wait" : s.error ? "bad" : s.ready ? "ok" : "wait");
        c.querySelector(".lbl").textContent = !s ? T("aiWait")
          : s.error ? T("aiBad")
          : s.ready ? T("aiOk")
          : T("aiWait") + (s.total ? " " + s.loaded + "/" + s.total : "");
        c.title = !s ? "" : s.error ? String(s.error)
          : s.ready ? "" : ((LANG === "en" ? s.current_en : s.current_ko) || "");   // 지금 올리는 AI
      }
      function pollAi() {
        return fetch("/ready").then(function (r) { return r.json(); }).then(function (r) {
          // 켜 둔 채 기다린 사람에게 — 준비 화면(lib/boot.js)이 떠 있으면 거기서 "준비 끝!" 을 이미 보여 준다
          if (r.ready && aiWasLoading && !document.documentElement.classList.contains("el-booting"))
            notify(null, T("aiReady"), [], true);
          aiWasLoading = !r.ready && !r.error;
          var wasReady = !!(aiState && aiState.ready);
          aiState = r; paintAi();
          if (r.ready && !wasReady) loadDesk();     // 준비가 끝난 값(장치 배정)으로 이 컴퓨터 칸을 다시
          setTimeout(pollAi, r.ready || r.error ? 30000 : 1500);
        }).catch(function () { aiState = null; paintAi(); setTimeout(pollAi, 3000); });
      }

      /* 보드 — 연결돼 있을 때만 칩이 보인다. 쓰다가 끊기면(케이블이 빠짐) 알린다. 4초마다 가볍게 묻는다 */
      var boardWas = false, CHIP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/><path d="M9 3v3.5M15 3v3.5M9 17.5V21M15 17.5V21M3 9h3.5M3 15h3.5M17.5 9H21M17.5 15H21"/></svg>';
      function pollBoard() {
        fetch("/board/status").then(function (r) { return r.json(); }).then(function (j) {
          var d = (j && j.data) || {}, c = $("osBoard");
          c.hidden = !d.connected;
          if (d.connected) { c.innerHTML = CHIP + esc(d.port || ""); c.title = T("boardOn"); }
          if (boardWas && !d.connected && d.lost) notify(null, T("boardLost"), [{ label: T("boardOpen"), href: "/board" }], true);
          boardWas = !!d.connected;
        }).catch(function () {}).then(function () { setTimeout(pollBoard, 4000); });
      }
      $("osBoard").addEventListener("click", function () { open("/board"); });

      function paintClock() {
        var n = new Date();
        var hh = String(n.getHours()).padStart(2, "0") + ":" + String(n.getMinutes()).padStart(2, "0");
        $("osClock").innerHTML = hh + "<small>" + (n.getMonth() + 1) + "/" + n.getDate() + "</small>";
        $("dTime").textContent = hh;
        $("dDate").textContent = fill(T("date"), { m: n.getMonth() + 1, mo: MONTHS[n.getMonth()], d: n.getDate(), w: T("days")[n.getDay()] });
      }

      /* ─────────────── 알림 ─────────────── */
      var notes = [], unread = 0;
      var BELL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6.5 2 6.5H4S6 14 6 9Z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>';

      function notify(src, text, actions, toast) {
        var acts = (Array.isArray(actions) ? actions : []).filter(function (a) {
          return a && typeof a.href === "string" && a.href.charAt(0) === "/" && a.href.charAt(1) !== "/";   // 이 컴퓨터 안의 화면만
        }).slice(0, 3).map(function (a) { return { label: String(a.label || "").slice(0, 30), href: a.href }; });
        var n = { src: src, text: String(text || "").slice(0, 200), actions: acts, at: Date.now() };
        notes.unshift(n);
        if (notes.length > 20) notes.pop();
        unread++;
        paintBell();
        if (!$("osNote").hidden) paintNotes();
        if (toast) showToast(n);
      }
      function ago(t) {
        var m = Math.floor((Date.now() - t) / 60000);
        return m < 1 ? T("now") : fill(T("ago"), { n: m });
      }
      function noteEl(n, cls, onDone) {
        var a = n.src ? appOf(n.src) : null;
        var el = document.createElement("div");
        el.className = cls;
        el.innerHTML = '<span class="i">' + (a ? icon(a.ic) : BELL) + "</span><b>" + esc(n.src ? appName(n.src) : "edge-lab") +
          "<small>" + esc(ago(n.at)) + "</small></b>" +
          (cls === "toast" ? '<button class="x" type="button" title="' + esc(T("close")) + '">×</button>' : "<span></span>") +
          "<p>" + esc(n.text) + "</p>";
        if (n.actions.length) {
          var box = document.createElement("div");
          box.className = "acts";
          n.actions.forEach(function (x) {
            var b = document.createElement("button");
            b.type = "button"; b.className = "act"; b.textContent = x.label;
            b.addEventListener("click", function (e) { e.stopPropagation(); onDone(); open(x.href); });
            box.appendChild(b);
          });
          el.appendChild(box);
        }
        el.addEventListener("click", function (e) {
          if (e.target.closest(".x")) { onDone(); return; }
          onDone();
          if (n.src) open(n.src);                  // 알림을 누르면 그 창으로
        });
        return el;
      }
      function showToast(n) {
        var box = $("osToasts");
        while (box.children.length >= 3) box.lastChild.remove();
        var t = null;
        var el = noteEl(n, "toast", function () { clearTimeout(t); el.remove(); });
        box.insertBefore(el, box.firstChild);
        t = setTimeout(function () { el.remove(); }, 8000);
        el.addEventListener("mouseenter", function () { clearTimeout(t); });
        el.addEventListener("mouseleave", function () { t = setTimeout(function () { el.remove(); }, 4000); });
      }
      function paintBell() {
        var b = $("osBellN");
        b.hidden = !unread;
        b.textContent = unread > 9 ? "9+" : String(unread);
        $("osBell").title = T("notes");
      }
      function paintNotes() {
        $("noteTitle").textContent = T("notes");
        $("noteClear").textContent = T("noteClear");
        var list = $("noteList");
        list.innerHTML = "";
        if (!notes.length) { list.innerHTML = '<div class="note-none">' + esc(T("noteNone")) + "</div>"; return; }
        notes.forEach(function (n) {
          list.appendChild(noteEl(n, "note", function () { $("osNote").hidden = true; $("osBell").classList.remove("open"); }));
        });
      }
      $("osBell").addEventListener("click", function (e) {
        e.stopPropagation();
        var show = $("osNote").hidden;
        $("osNote").hidden = !show;
        $("osBell").classList.toggle("open", show);
        if (show) { unread = 0; paintBell(); paintNotes(); $("osToasts").innerHTML = ""; }
      });
      $("noteClear").addEventListener("click", function (e) { e.stopPropagation(); notes = []; paintNotes(); });
      $("osNote").addEventListener("click", function (e) { e.stopPropagation(); });
      document.addEventListener("click", function () {
        if (!$("osNote").hidden) { $("osNote").hidden = true; $("osBell").classList.remove("open"); }
      });

      $("osStart").addEventListener("click", function (e) {
        e.stopPropagation();
        if (window.EL_SHELL.onStart) window.EL_SHELL.onStart(); else showDesk();
      });
      var langFns = [];
      function setLang(l) {
        if (l === LANG) return;
        LANG = l;
        try { localStorage.setItem("vapiLang", LANG); } catch (e) {}   // 창들은 storage 이벤트로 따라온다
        document.documentElement.lang = LANG;
        Object.keys(wins).forEach(function (k) { wins[k].frame.title = appName(k); });
        paintBar(); paintUse(); paintAi(); paintClock(); paintDesk(); paintBell();
        if (!$("osNote").hidden) paintNotes();
        langFns.forEach(function (fn) { try { fn(LANG); } catch (e) { console.error(e); } });
      }
      $("osLang").addEventListener("click", function () { setLang(LANG === "ko" ? "en" : "ko"); });

      /* ─────────────── 바탕화면 ─────────────── */
      var who = "", models = null, sys = null;
      /* 지난번에 받은 이름 · 내가 가르친 AI · 이 컴퓨터를 기억해 두고 첫 화면을 그것으로 바로 그린다.
         켤 때는 모델을 올리느라 서버가 바빠 대답이 늦다 — 기다렸다 채우면 보인 뒤에 칸이 바뀌어 깜빡였다.
         서버 값은 온 뒤에 달라졌을 때만 다시 그린다. */
      var DESK_KEY = "el-desk-cache", desk = {};
      try { desk = JSON.parse(localStorage.getItem(DESK_KEY) || "{}") || {}; } catch (e) { desk = {}; }
      if (typeof desk.who === "string") who = desk.who;
      if (desk.models) models = desk.models;
      if (desk.sys) sys = desk.sys;
      /* 달라졌으면 기억하고 true */
      function remember(k, v) {
        var a = JSON.stringify(v);
        if (JSON.stringify(desk[k]) === a) return false;
        desk[k] = v;
        try { localStorage.setItem(DESK_KEY, JSON.stringify(desk)); } catch (e) {}
        return true;
      }

      function paintDesk() {
        $("dHello").textContent = who ? fill(T("helloName"), { n: who }) : T("hello");

        var box = $("dIcons");
        box.innerHTML = "";
        function head(text) {
          var h = document.createElement("div");
          h.className = "d-cat"; h.textContent = text;
          box.appendChild(h);
        }
        A.CATS.forEach(function (c) {
          var list = A.APPS.filter(function (a) { return a.cat === c[0] && !hiddenApp(a.href); });
          if (!list.length) return;
          head(A.catName(c[0], LANG));
          list.forEach(deskIcon);
        });
        function deskIcon(a) {
          var b = document.createElement("a");
          b.href = a.href;
          b.className = "d-ic c-" + a.cat + (wins[a.href] ? " run" : "");
          b.innerHTML = '<span class="g">' + icon(a.ic) + "</span><b></b><i></i>";
          b.querySelector("b").textContent = LANG === "en" ? a.en : a.ko;
          b.querySelector("i").textContent = LANG === "en" ? a.en_d : a.ko_d;
          b.addEventListener("click", function (e) { e.preventDefault(); open(a.href); });
          box.appendChild(b);
        }

        /* 바탕화면에 둔 작품 (내 작품의 ⋯ → 바탕화면에 두기). 종이 모양에 어느 앱 것인지 딱지 */
        var PINS = [];
        try { PINS = JSON.parse(localStorage.getItem("el-desk-pins") || "[]"); } catch (e) {}
        PINS = PINS.filter(function (p) { return p && typeof p.href === "string" && p.href.charAt(0) === "/"; });
        if (PINS.length) head(T("pins"));
        PINS.forEach(function (p) {
          var f = document.createElement("a");
          f.href = p.href;
          f.className = "d-ic d-file";
          f.title = p.name;
          f.innerHTML = '<span class="g"><span class="ext">' + esc(({ blocks: "BLK", code: "PY", model: "AI", project: "PRJ", db: "TXT" })[p.kind] || "") +
                        '</span><span class="badge">' + icon(p.ic || "folder") + '</span></span><b></b><button class="unpin" type="button" title="×">×</button>';
          f.querySelector("b").textContent = p.name;
          f.addEventListener("click", function (e) {
            e.preventDefault();
            if (e.target.closest(".unpin")) {
              var left = PINS.filter(function (x) { return x.key !== p.key; });
              try { localStorage.setItem("el-desk-pins", JSON.stringify(left)); } catch (err) {}
              paintDesk(); return;
            }
            open(p.href);
          });
          box.appendChild(f);
        });

        var mine = $("wMine");
        var h = "<h3>" + icon("train") + esc(T("mine")) + "<em>" + esc(T("mineGo")) + "</em></h3>";
        if (models && models.length) {
          models.slice(0, 4).forEach(function (m) {
            h += '<button class="w-row" type="button" data-go="/train"><span class="i">' + icon("custom") + "</span><span>" +
                 esc(m.title || m.slug) + "</span><small>" + esc((m.labels || []).join(" · ")) + "</small></button>";
          });
        } else {
          h += '<div class="w-empty">' + esc(T("mineNone")) + "</div>";
        }
        mine.innerHTML = h;
        mine.querySelectorAll("[data-go]").forEach(function (x) {
          x.addEventListener("click", function () { open(x.getAttribute("data-go")); });
        });

        /* 이 컴퓨터 — 장치마다 무엇을 맡았는지. 사용률(%)은 넣지 않는다:
           NPU·GPU 카운터는 드라이버마다 있기도 없기도 해서 빈칸이 고장으로 읽힌다 (lib/sysbar.js 와 같은 이유) */
        var W = T("work"), job = { NPU: [], GPU: [], CPU: [] };
        if (sys && sys.assign) {
          Object.keys(W).forEach(function (k) {
            var d = String(sys.assign[k] || "").toUpperCase().split(".")[0];
            if (job[d]) job[d].push(W[k]);
          });
        }
        var has = {};
        ((sys && sys.devices) || []).forEach(function (d) {
          var n = String(d && d.name != null ? d.name : d).toUpperCase().split(".")[0];
          has[n] = true;
        });
        var pc = "<h3>" + icon("gear") + esc(T("pc")) + "<em>" + esc(T("pcSub")) + '</em></h3><div class="devs">';
        ["NPU", "GPU", "CPU"].forEach(function (d) {
          var off = sys && sys.devices && !has[d];
          pc += '<div class="dev' + (off ? " none" : "") + '"><b><span class="os-dot"></span>' + d + "</b><i>" +
                esc(job[d].length ? job[d].join(" · ") : T("idle")) + "</i></div>";
        });
        pc += "</div>";
        if (sys && sys.mem) {
          pc += '<div class="mem"><i style="width:' + Math.min(100, sys.mem.percent || 0) + '%"></i></div>' +
                '<div class="mem-t">' + esc(fill(T("mem"), { u: sys.mem.used_gb, t: sys.mem.total_gb })) + "</div>";
        }
        $("wPc").innerHTML = pc;
        if (window.EL_WIDGETS) window.EL_WIDGETS.paint();
      }

      /* 내 작품 창에서 바탕화면에 두거나 빼면 바로 다시 그린다 (같은 출처라 storage 이벤트가 온다) */
      window.addEventListener("storage", function (e) {
        if (e.key === "el-desk-pins") paintDesk();
        if (e.key === "el-removed") {             // 앱 가게에서 빼면 떠 있던 창도 닫는다
          Object.keys(wins).forEach(function (k) { if (A.isRemoved(k)) close(k); });
          paintBar(); paintDesk();
        }
      });

      /* 바탕화면에 올 때마다 새로 묻는다 — 방금 가르친 AI 가 바로 보이게 */
      function loadDesk() {
        return Promise.all([
          fetch("/custom/models").then(function (r) { return r.json(); }).then(function (j) {
            if (j && j.result === "ok") { models = j.data || []; if (remember("models", models)) paintDesk(); }
          }).catch(function () {}),
          fetch("/system").then(function (r) { return r.json(); }).then(function (j) {
            /* 모델을 올리는 동안의 장치 배정은 반쯤 찬 값이다 — 기억한 값을 두고, 준비가 끝나면(pollAi) 다시 받는다 */
            if (desk.sys && !(aiState && aiState.ready)) return;
            sys = j; if (remember("sys", j)) paintDesk();
          }).catch(function () {})
        ]);
      }
      var whoLoaded = fetch("/system/workdir").then(function (r) { return r.json(); }).then(function (j) {
        var d = j && j.data;
        who = d && !d.name_is_default ? String(d.name || "").trim() : "";   // 윈도우 로그인 이름은 인사에 쓰지 않는다
        if (remember("who", who)) paintDesk();
      }).catch(function () {});

      paintBar(); paintUse(); paintAi(); paintClock(); paintDesk(); paintBell();
      setInterval(paintClock, 15000);
      var firstData = [pollAi(), loadDesk(), whoLoaded];
      pollBoard();

      /* 다른 셸 파일(lib/os-quick.js · os-start.js · os-teacher.js)이 쓰는 것 */
      window.EL_SHELL.api = {
        open: open, showDesk: showDesk, close: close,
        notify: function (text, actions, toast) { notify(null, text, actions, toast !== false); },
        lang: function () { return LANG; }, setLang: setLang,
        onLang: function (fn) { langFns.push(fn); },
        windows: function () { return Object.keys(wins); },
        active: function () { return active; },
        broadcast: function (action) { Object.keys(wins).forEach(function (k) { post(wins[k], action); }); },
        resume: function () { if (active && wins[active]) post(wins[active], "show"); },
        repaint: function () { paintBar(); paintDesk(); },
        who: function () { return who; },
        setWho: function (n) { who = n; remember("who", n); paintDesk(); },
        appName: appName, icon: icon, esc: esc, fill: fill
      };

      /* 첫 화면 — 한 번에 보인다. 배경(html)은 바로 그리고, 내용(body)은 스크립트가 다 돌고(DOMContentLoaded)
         화면에 쓰인 글꼴을 받은 뒤에 보인다 — 대체 글꼴로 그렸다가 Gowun 으로 다시 그려지는 것을 보이지 않게.
         칸의 내용은 기억해 둔 값(DESK_KEY)으로 이미 그려져 있어 서버를 기다리지 않는다.
         기억한 값이 없는 첫 실행만 첫 자료를 기다린다 — 준비 화면이 떠 있으면 바탕화면은 가려져 있으니 기다리지 않는다.
         어느 쪽이든 1.5초를 넘기지 않는다. */
      (function () {
        var first = !desk.models && !desk.sys && !document.documentElement.classList.contains("el-booting");
        var parsed = new Promise(function (ok) {
          if (document.readyState !== "loading") ok(); else document.addEventListener("DOMContentLoaded", ok);
        });
        var ready = parsed.then(function () { return first ? Promise.all(firstData) : null; }).then(function () {
          void document.body.offsetWidth;         // 배치를 한 번 해야 이 화면에 쓰인 글꼴을 받기 시작한다
          return document.fonts ? document.fonts.ready : null;
        });
        Promise.race([ready, new Promise(function (ok) { setTimeout(ok, 1500); })]).then(function () {
          var h = document.documentElement;
          h.classList.add("el-shown");
          h.classList.remove("el-wait", "el-dark");       // 검은 막(키오스크로 켰을 때)도 같이 걷힌다
        });
      })();

      /* /?open=/blocks 처럼 들어오면 그 앱을 바로 연다 */
      try {
        var want = new URLSearchParams(location.search).get("open");
        if (want && want.charAt(0) === "/") open(want);
      } catch (e) {}
    })();
  </script>
  <script src="/lib/os-quick.js"></script>
  <script src="/lib/os-start.js"></script>
  <script src="/lib/os-teacher.js"></script>
  <script src="/lib/os-widgets.js"></script>
  <script src="/lib/usage.js" data-page="home"></script>
</body>
</html>
