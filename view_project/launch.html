<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>edge-lab</title>
  <!--
    켜는 화면 — 서버보다 먼저 뜬다 (appwin.early 가 키오스크 창을 이 파일로 연다).

    처음부터 준비 화면(lib/boot.js)을 그대로 보여 준다. boot.js 가 서버의 /ready 를 물으며 서버를 기다리는 것부터
    모델 올리기까지 이 한 화면에서 보여 주고, [시작하기](또는 건너뛰기)를 누르면 바탕화면("/?booted=1")으로
    한 번만 넘어간다. 전에는 켜는 화면 → 바탕화면 → 준비 화면으로 세 번 바뀌어 깜빡였다.

    file:// 에서 열리므로 서버의 /fonts 는 서버가 대답한 뒤에 붙인다(onServer). 그림은 옆 폴더(assets/)의 것.
    CORS 는 서버가 allow_origins=["*"] 라 file:// 에서 /ready 를 읽을 수 있다.
    화면 주소는 localhost 로 연다 — 전과 같은 주소여야 저장해 둔 설정(localStorage)이 이어진다.
    location.replace 로 넘어가 방문 기록이 한 칸으로 남는다 — [끄기] 의 window.close() 가 먹힌다.
  -->
  <style>
    html, body { margin: 0; height: 100%; }
    body { background: #fbf7ef radial-gradient(rgba(31,95,122,.07) 1px, transparent 1px) 0 0 / 22px 22px;
           font-family: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
    #slow { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 200; display: none;
            max-width: min(640px, calc(100% - 32px)); background: #fff; border: 2px solid #b4451c; border-radius: 10px;
            padding: 12px 18px; color: #2a2620; line-height: 1.6; box-shadow: 0 8px 24px rgba(0,0,0,.15); }
    #slow b { color: #8f3312; }
    #slow kbd { font-family: inherit; border: 1px solid #9a8f7d; border-radius: 5px; padding: 0 6px; background: #f4efe4; }
    body.slow #slow { display: block; }
  </style>
  <script>
    (function () {
      var port = +(new URLSearchParams(location.search).get("port")) || 57711;
      var base = "http://localhost:" + port, answered = false;
      window.EL_BOOT = {
        base: base,
        asset: "assets/",
        onServer: function () {                 // 서버가 처음 대답했다 — 글꼴을 서버에서 받는다
          answered = true;
          document.body.classList.remove("slow");
          var l = document.createElement("link");
          l.rel = "stylesheet"; l.href = base + "/fonts/fonts.css";
          document.head.appendChild(l);
        },
        onDone: function () { location.replace(base + "/?booted=1"); }
      };
      /* 90초가 지나도 서버가 한 번도 대답하지 않으면 — 까만 창에 오류가 있을 것이다 */
      setTimeout(function () { if (!answered) document.body.classList.add("slow"); }, 90000);
    })();
  </script>
  <script src="lib/boot.js"></script>
</head>
<body>
  <div id="slow"></div>
  <script>
    (function () {
      var en = navigator.language && !/^ko/i.test(navigator.language);
      document.getElementById("slow").innerHTML = en
        ? "<b>The program has not started yet.</b> Press <kbd>Alt</kbd> + <kbd>F4</kbd> to close this screen and read the message in the black window behind it."
        : "<b>프로그램이 아직 켜지지 않았어요.</b> <kbd>Alt</kbd> + <kbd>F4</kbd> 로 이 화면을 닫으면 뒤의 까만 창에서 무슨 일인지 볼 수 있어요.";
    })();
  </script>
</body>
</html>
