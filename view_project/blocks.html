<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="txtTitleTag">블록</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link href="/fonts/fonts.css" rel="stylesheet">
  <script>
    /* 밝은 곳 모드: 화면이 그려지기 전에 적용해야 깜빡이지 않는다 */
    try { if (localStorage.getItem("vapi-hc") === "1")
            document.documentElement.classList.add("hc"); } catch (e) {}
  </script>
  <link rel="stylesheet" href="/lib/tokens.css">
  <!-- 셸(/) 안의 창으로 열렸을 때 — 제목줄 숨김·숨김/보임 전달. 다른 스크립트보다 먼저 -->
  <script src="/lib/brand.js"></script>
  <script src="/lib/embed.js"></script>
  <!-- 다 그려지기 전에는 내보내지 않는다. 앞 화면이 그대로 떠 있다가 완성된 화면으로
       넘어간다(lib/tokens.css 의 view-transition). 늦어도 DOMContentLoaded 에 풀린다. -->
  <link rel="expect" href="#el-built" blocking="render">
  <style>


    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
      color: var(--ink); background-color: var(--paper);

      font-family: var(--font-ui);
      padding: var(--sp-2, 8px); gap: var(--sp-2, 8px);
    }
    button, select {
      font-family: inherit; font-size: 13px; color: var(--ink); background: #fff;
      border: 1px solid var(--line-mid); border-radius: var(--r-sm); padding: 6px 12px; cursor: pointer;
    }

    /* 실행 · 정지는 한 자리 — 실행하는 동안(body.running) 실행 단추가 정지 단추로 바뀐다 */
    .panel-head #runButton, .panel-head #stopButton { min-width: 92px; padding: 0 16px; font-size: 14px; }
    #stopButton { display: none; }
    body.running #runButton { display: none; }
    body.running #stopButton { display: inline-flex; }
    .tool-div { width: 1px; height: 20px; background: var(--line-soft); margin: 0 2px; }
    #curFile { font-size: 13px; color: var(--ink-2); margin-left: 4px; max-width: 22ch;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* 작업판이 좁으면 새로 · 저장 · 불러오기는 아이콘만 (글자는 마우스를 올리면 보인다) */
    .work { container-type: inline-size; container-name: work; }
    @container work (max-width: 900px) {
      #newButton .lbl, #saveButton .lbl, #loadButton .lbl { display: none; }
      #newButton, #saveButton, #loadButton { padding: 0 9px; }
    }
    @container work (max-width: 640px) { .tool-div, #curFile { display: none; } }

    .work {
      flex: 1.25 1 0; min-width: 0; display: flex; flex-direction: column;
      background: var(--box); border: 1px solid var(--line-mid); border-radius: var(--r-lg);
      box-shadow: var(--shadow-1); overflow: hidden;
    }
    /* 문항 상자와 작업 버튼을 한 줄에 둔다 (버튼은 오른쪽 끝) */
    .stage-tools {
      margin: var(--sp-1, 4px) 12px var(--sp-1, 4px) auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .work-tools {
      margin: var(--sp-1, 4px) 12px var(--sp-1, 4px) auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    
    #blocklyDiv { flex: 1 1 auto; min-height: 0; }

    /* ── 블록 편집기 — 밝고 조용한 판, 분류는 색 타일 + 아이콘 (openpibo IDE 와 같은 결) ──
       Blockly 13 의 클래스 이름이다(10 의 blocklyTreeRow → blocklyToolboxCategory 등).
       분류 색은 줄 왼쪽 막대 대신 아이콘 타일에만 쓴다 — ElCategory 가 --cat 으로 넘긴다. */
    #blocklyDiv { --bk-bg: #f7f8fa; --bk-work: #fdfdfe; --bk-line: #e4e7ec; --bk-line2: #c7cdd6; --bk-hover: #eceff3;
                  --bk-ink: #1f2430; --bk-font: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
    #blocklyDiv .blocklyToolbox { background: var(--bk-bg) !important; border-right: 1px solid var(--bk-line); padding: 8px 0; width: 184px; }
    #blocklyDiv .blocklyToolboxCategory { display: flex; align-items: center; height: 31px !important; margin: 1px 8px !important; padding: 0 8px !important;
                  border: 0 !important; border-radius: 8px; background: transparent; cursor: pointer; }
    #blocklyDiv .blocklyToolboxCategory:not(.blocklyToolboxSelected):hover { background: var(--bk-hover) !important; }
    #blocklyDiv .blocklyToolboxSelected { background: #fff !important; box-shadow: 0 1px 3px rgba(20,24,40,.12); }
    #blocklyDiv .blocklyTreeRowContentContainer { display: flex; align-items: center; gap: 10px; }
    #blocklyDiv .blocklyToolboxCategoryLabel { color: var(--bk-ink) !important; font: 500 14px var(--bk-font) !important; }
    #blocklyDiv .blocklyToolboxSelected .blocklyToolboxCategoryLabel { font-weight: 700 !important; }
    #blocklyDiv .elCatIcon { flex: none; width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center;
                  background: var(--cat, #8a93a2); color: #fff; }
    #blocklyDiv .elCatIcon svg { width: 15px; height: 15px; }
    #blocklyDiv .blocklyTreeSeparator { border-bottom: 1px solid var(--bk-line) !important; margin: 6px 14px !important; height: 0 !important; }
    #blocklyDiv .blocklyText { font-family: var(--bk-font) !important; font-weight: 700 !important; }
    #blocklyDiv .blocklyPath { stroke-width: 1px; }
    #blocklyDiv .blocklyFlyoutLabelText { fill: #4b5363 !important; font: 600 13px var(--bk-font) !important; }
    #blocklyDiv .blocklyZoom > image, #blocklyDiv .blocklyTrash > image { opacity: .45; }
    #blocklyDiv .blocklyZoom > image:hover, #blocklyDiv .blocklyTrash > image:hover { opacity: .75; }
    #blocklyDiv .blocklyScrollbarHandle { fill: var(--bk-line2) !important; }
    @media (max-width: 1100px) { #blocklyDiv .blocklyToolbox { width: 156px; } }

    .stage-panel {
      flex: 1 1 0; min-width: 380px; display: flex; flex-direction: column;
      background: var(--box); border: 1px solid var(--line-mid); border-radius: var(--r-lg);
      box-shadow: var(--shadow-1); overflow: hidden;
    }
    .stage-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: var(--sp-2, 8px); display: flex; flex-direction: column; gap: var(--sp-2, 8px); }
    .stage {
      position: relative; width: 100%; aspect-ratio: 4/3; max-height: 60vh;
      background: #1d1f26; border: 0; border-radius: var(--r-lg); overflow: hidden;
      flex: 0 0 auto; align-self: center;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .25);
      transition: box-shadow .2s;
    }
    /* 실행 중 — 무대 둘레가 초록으로 빛나고 왼쪽 위에 '실행 중' */
    body.running .stage { box-shadow: 0 0 0 3px var(--ok), 0 6px 18px rgba(46, 143, 99, .25); }
    #runBadge { position: absolute; top: 10px; right: 10px; z-index: 5; display: none; align-items: center; gap: 6px;
                padding: 4px 10px; border-radius: 999px; background: rgba(20, 22, 28, .7); color: #fff;
                font-size: 12px; font-weight: 700; pointer-events: none; }
    #runBadge i { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; animation: blink 1s infinite; }
    body.running #runBadge { display: inline-flex; }
    @keyframes blink { 50% { opacity: .25; } }
    /* 처음 — 무엇을 할지 알려 주는 빈 무대 */
    #stageEmpty { position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center;
                  justify-content: center; gap: 8px; text-align: center; padding: 16px;
                  background: radial-gradient(circle at 50% 40%, #2a2d36 0%, #1d1f26 70%); color: #e8e6e1; }
    #stageEmpty[hidden] { display: none; }
    #stageEmpty img { width: 22%; max-width: 120px; filter: drop-shadow(0 6px 12px rgba(0, 0, 0, .35)); }
    #stageEmpty b { font-size: 17px; font-weight: 800; color: #fff; }
    #stageEmpty span { font-size: 13px; color: #c9c6bf; }
    #stageEmpty button { margin-top: 6px; display: inline-flex; align-items: center; gap: 6px;
                         padding: 8px 16px; border-radius: var(--r-sm); font-weight: 700; }
    .stage video, .stage canvas, .stage img.shot {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
    }
    .stage img.shot { display: none; background: #191a1f; }
    /* 라이브 영상은 무대에 안 보인다 — 찍은 사진만 놓는다. display:none 은 안 된다:
       그러면 프레임이 안 와서 「사진 찍기」 가 검은 사진을 찍는다. */
    .stage video { visibility: hidden; }
    #bigText {
      position: absolute; left: 0; right: 0; top: 4%; text-align: center; pointer-events: none;
      font-family: var(--font-ui); font-size: 2rem; font-weight: 800; color: #fff; letter-spacing: -.02em;
      text-shadow: 0 2px 10px rgba(0,0,0,.7); padding: 0 12px; word-break: keep-all;
    }
    /* 캐릭터 — 무대 좌표(가로 640 · 세로 480, 사진 좌표와 같다)를 % 로 바꿔 놓는다.
       크기는 무대 너비에 맞춰 함께 줄어든다(cqw) */
    .stage { container-type: size; }
    #sprites { position: absolute; inset: 0; pointer-events: none; }
    #sprites .sp { position: absolute; transform: translate(-50%, -50%); line-height: 1; white-space: nowrap;
                   user-select: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
    #sprites .sp img { display: block; }
    #askBox { position: absolute; left: 6%; right: 6%; bottom: 6%; display: none; flex-direction: column; gap: 8px; z-index: 6;
              background: #fff; border: 0; border-radius: var(--r-lg); padding: 12px 14px; box-shadow: var(--shadow-2); }
    #askOk { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; padding: 0 18px; }
    #askBox.on { display: flex; }
    #askQ { font-size: 1rem; font-weight: 700; }
    #askIn { flex: 1 1 auto; min-width: 0; font: inherit; font-size: 1rem; padding: 8px 12px;
             border: 1px solid var(--line-mid); border-radius: var(--r-sm); }
    #bubble {
      position: absolute; top: 10px; left: 10px; max-width: 75%;
      background: #fff; border: 0; border-radius: 14px; border-bottom-left-radius: 4px; z-index: 5;
      padding: 8px 14px; font-size: 1rem; font-weight: 600; display: none; box-shadow: var(--shadow-2);
    }
    .stage-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    
    /* 무대 아래 — 사진 올리기 한 줄, 그리고 기록 · 변수 · 파이썬 탭 카드 하나 */
    .stage-sub { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
    .stage-sub .hint { font-size: 12.5px; color: var(--ink-2); }
    .stage-sub button { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
    .outcard { flex: 1 1 auto; min-height: 150px; display: flex; flex-direction: column;
               border: 1px solid var(--line-mid); border-radius: var(--r-lg); background: #fff; overflow: hidden; }
    .tabs { display: flex; align-items: center; gap: 2px; padding: 4px 6px 0; border-bottom: 1px solid var(--line-soft);
            background: var(--surface-2); }
    .tabs .tab { position: relative; border: 0; background: transparent; border-radius: 6px 6px 0 0; padding: 8px 12px 9px;
                 font-size: 13px; font-weight: 600; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
    .tabs .tab:hover { color: var(--ink); background: rgba(0, 0, 0, .03); }
    .tabs .tab.on { color: var(--accent); font-weight: 800; }
    .tabs .tab.on::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2.5px;
                           border-radius: 2px; background: var(--accent); }
    #varsCount:not(:empty) { font-style: normal; font-size: 11px; font-weight: 800; min-width: 18px; padding: 1px 5px;
                             border-radius: 999px; background: var(--accent-bg); color: var(--accent); }
    .tabs-sp { flex: 1; }
    .tab-act { display: none; align-items: center; gap: 5px; border: 1px solid var(--line-soft); background: #fff;
               border-radius: 6px; padding: 3px 9px; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
    .outcard[data-tab="py"] .tab-act { display: inline-flex; }
    .pane { flex: 1 1 auto; min-height: 0; overflow: auto; }
    .pane[hidden] { display: none; }
    #logBox { padding: 10px 12px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6;
              color: #3a3a42; white-space: pre-wrap; max-height: 220px; overflow-y: auto; }
    #logBox .el-err { white-space: normal; font-family: var(--font-ui); }
    .runchip { margin-left: 10px; padding: 2px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700;
               font-family: var(--font-mono); border: 1.5px solid currentColor; white-space: nowrap; }
    .runchip[hidden] { display: none; }
    .runchip.running { color: #1f6feb; animation: chipBlink 1.2s ease-in-out infinite; }
    .runchip.done { color: #1a7f37; }
    .runchip.error { color: #fff; background: #e5484d; border-color: #e5484d; }
    .runchip.stopped { color: #6e7781; }
    @keyframes chipBlink { 50% { opacity: .55; } }
    @media (prefers-reduced-motion: reduce) { .runchip.running { animation: none; } }
    #logBox:empty::before { content: "실행하면 진행 상황이 여기에 적혀요."; color: #8a8174; font-family: var(--font-ui); }
    html[lang="en"] #logBox:empty::before { content: "Run your blocks and progress shows up here."; }
    #varsBox { padding: 8px 12px; }
    #varsBody { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 13px; font-variant-numeric: tabular-nums; }
    #varsBody > div { display: contents; }
    #varsBody b { color: var(--ink); }
    .pane-empty { padding: 14px 12px; color: #8a8174; font-size: 13px; }
    #varsBox[style*="block"] + .pane-empty { display: none; }
    #codeView { margin: 0; padding: 10px 12px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6;
                white-space: pre-wrap; max-height: 260px; overflow: auto; background: #fbfaf7; }

    /* 예제 창 — 그림 · 수준 · 배우는 개념이 보이는 카드 */
    #exModal { position: fixed; inset: 0; z-index: 50; background: rgba(28, 30, 38, .45); backdrop-filter: blur(2px);
               align-items: center; justify-content: center; }
    .ex-dlg { width: min(820px, 94vw); max-height: 88vh; display: flex; flex-direction: column; background: #fff;
              border-radius: 16px; box-shadow: var(--shadow-2); overflow: hidden; }
    .ex-head { display: flex; align-items: flex-start; gap: 12px; padding: 16px 18px 12px; border-bottom: 1px solid var(--line-soft); }
    .ex-head b { font-size: 17px; font-weight: 800; }
    .ex-head .hint { font-size: 12.5px; margin-top: 2px; }
    #exClose { margin-left: auto; width: 32px; height: 32px; padding: 0; border-radius: 50%; font-size: 18px; line-height: 1; }
    #exList { overflow-y: auto; min-height: 0; padding: 6px 18px 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    #exList .ex-grp { grid-column: 1 / -1; margin-top: 10px; font-size: 12.5px; font-weight: 800; color: var(--ink-2);
                      letter-spacing: .02em; }
    #exList .ex-card { text-align: left; display: grid; grid-template-columns: 44px 1fr; gap: 4px 12px; align-items: start;
                       padding: 12px; border: 1px solid var(--line-soft); border-radius: var(--r-lg); background: #fff;
                       transition: border-color .12s, box-shadow .12s, transform .12s; }
    #exList .ex-card:hover { border-color: var(--accent); box-shadow: var(--shadow-1), 0 4px 14px rgba(31, 95, 122, .12); transform: translateY(-1px); }
    #exList .ex-ic { grid-row: 1 / span 3; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
                     font-size: 24px; background: var(--surface-2); border: 1px solid var(--line-soft); }
    #exList .ex-name { font-size: 14px; font-weight: 800; color: var(--ink); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    #exList .ex-lv { font-size: 10.5px; font-weight: 800; padding: 1px 7px; border-radius: 999px; }
    #exList .ex-lv.l0 { background: #e7f6ee; color: #23714e; }
    #exList .ex-lv.l1 { background: var(--accent-bg); color: var(--accent); }
    #exList .ex-lv.l2 { background: #f6ece4; color: #9a4a17; }
    #exList .ex-desc { font-size: 12.5px; color: var(--ink-2); line-height: 1.45; }
    #exList .ex-tags { display: flex; flex-wrap: wrap; gap: 4px; }
    #exList .ex-tags i { font-style: normal; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 6px;
                         background: #f3f0ea; color: #6b6255; }
    @media (max-width: 760px) { #exList { grid-template-columns: 1fr; } }
    html.hc .outcard, html.hc .work, html.hc .stage-panel { border-width: 2px; border-color: var(--line-d); box-shadow: none; }
    /* 좁은 화면 — 기준은 lib/tokens.css 주석의 네 개뿐이다(md 1023 / sm 639).
       전에는 페이지마다 560/860/900/960/980/1200 이 섞여 있어, 같은 창 폭에서
       화면을 옮기면 어떤 것은 접히고 어떤 것은 눌려서 잘렸다.
       body 스크롤과 .main-container 세로 적층은 lib/shell.css 가 한 번에 하므로
       여기는 이 화면에만 필요한 것만 남긴다. */
    @media (max-width: 1023px) {
      .work, .stage-panel { min-width: 0; }
      #blocklyDiv { height: 60vh; }
    }
  </style>
  <link rel="stylesheet" href="/lib/ui.css">
  <link rel="stylesheet" href="/lib/shell.css">
</head>
<body data-density="work">
  <div class="titlebar">
    <a class="tb-brand" href="/">
      <img src="/assets/pibo-logo.png" alt=""><b></b>
    </a>
    <span class="tb-sep"></span>
    <span class="tb-app" id="txtTitle"></span>
    <div class="h-tools">
      <button id="langButton" title="한국어 / English">EN</button>
    </div>
  </div>

  <div class="shell-body">
    <div class="workbench">

  <div class="main-container" data-split="h" data-split-key="blocks">
    <div class="work" data-min="340">
      <div class="panel-head">
        <div class="q"><span class="qnum">1</span><span class="qtext" id="txtWorkHead">블록을 조립해요</span></div>
        <!-- 지금 어느 작품을 고치는 중인지 — 저장하면 이 이름으로 덮어쓴다 -->
        <span id="curFile"></span>
        <div class="work-tools">
          <div class="seg" id="levelSeg" role="radiogroup" title="블록 수준">
            <button type="button" data-lv="easy" role="radio">쉬움</button>
            <button type="button" data-lv="basic" role="radio">기본</button>
            <button type="button" data-lv="all" role="radio">전체</button>
          </div>
          <select id="levelSel" title="블록 수준" hidden>
            <option value="easy">쉬움</option>
            <option value="basic">기본</option>
            <option value="all">전체</option>
          </select>
          <span class="tool-div"></span>
          <button id="newButton" class="btn-ghost"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/></svg><span class="lbl">새로 만들기</span></button>
          <button id="saveButton" class="btn-ghost"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/></svg><span class="lbl">저장</span></button>
          <button id="loadButton" class="btn-ghost"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="lbl">불러오기</span></button>
          <input type="file" id="loadFile" accept=".json" style="display:none">
          <button id="runButton" class="btn-go"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg><span id="runLabel">실행</span></button>
          <button id="stopButton" class="btn-stop"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg><span class="lbl">정지</span></button>

  const t = k => (I18N[LANG] && I18N[LANG][k] !== undefined) ? I18N[LANG][k] : I18N.ko[k];

  /* =======================================================================
     블록 -> 파이썬 변환
     화면에서 도는 JS 와 별개로, themaker 라이브러리를 쓰는 파이썬을 만든다.
     파이썬 페이지에 붙여넣으면 그대로 돌아간다.
     ======================================================================= */
  const PY = (() => {
    const q = s => "'" + String(s).replace(/\\/g, "\\\\").replace(/'/g, "\\'") + "'";
    let needTime = false, needCam = false, needScore = false;

    /* 값 블록 -> 파이썬 식 */
    function val(block, name, dflt) {
      const t = block.getInputTargetBlock(name);
      if (!t) return dflt;
      return expr(t);
    }
    function field(b, n) { return b.getFieldValue(n); }
    function num(b, n, d) { const t = b.getInputTargetBlock(n); return t ? expr(t) : String(d); }

    /* 이미지 인자 — 안 꽂혀 있으면 방금 찍은 사진을 쓴다 */
    function img(b, name) {
      const t = b.getInputTargetBlock(name);
      if (t) return expr(t);
      needCam = true;
      return "img";
    }

    const E = {
      /* ---- 값 ---- */
      text: b => q(field(b, "TEXT")),
      math_number: b => String(Number(field(b, "NUM")) || 0),
      logic_boolean: b => (field(b, "BOOL") === "TRUE" ? "True" : "False"),
      variables_get: b => pyName(b.getField("VAR").getText()),
      text_join: b => {
        const n = b.inputList.filter(i => i.name.startsWith("ADD")).length;
        const parts = [];
        for (let i = 0; i < n; i++) {
          const v = val(b, "ADD" + i, "''");
          /* 이미 글자면 str() 로 감싸지 않는다 — 코드가 읽기 쉬워진다 */
          parts.push(/^'.*'$/.test(v) ? v : "str(" + v + ")");
        }
        return parts.length ? parts.join(" + ") : "''";
      },
      math_arithmetic: b => {
        const op = { ADD: "+", MINUS: "-", MULTIPLY: "*", DIVIDE: "/", POWER: "**" }[field(b, "OP")] || "+";
        return "(" + val(b, "A", "0") + " " + op + " " + val(b, "B", "0") + ")";
      },
      logic_compare: b => {
        const op = { EQ: "==", NEQ: "!=", LT: "<", LTE: "<=", GT: ">", GTE: ">=" }[field(b, "OP")] || "==";
        return "(" + val(b, "A", "0") + " " + op + " " + val(b, "B", "0") + ")";
      },
      logic_operation: b =>
        "(" + val(b, "A", "False") + (field(b, "OP") === "AND" ? " and " : " or ") + val(b, "B", "False") + ")",
      logic_negate: b => "(not " + val(b, "BOOL", "False") + ")",
      math_random_int: b => { needRandom = true; return "random.randint(" + val(b, "FROM", "1") + ", " + val(b, "TO", "10") + ")"; },
      text_length: b => "len(" + val(b, "VALUE", "''") + ")",
      lists_length: b => "len(" + val(b, "VALUE", "[]") + ")",
      lists_create_with: b => {
        const n = b.inputList.filter(i => i.name.startsWith("ADD")).length;
        const parts = [];
        for (let i = 0; i < n; i++) parts.push(val(b, "ADD" + i, "None"));
        return "[" + parts.join(", ") + "]";
      },
      logic_null: () => "None",
      logic_ternary: b =>
        "(" + val(b, "THEN", "None") + " if " + val(b, "IF", "False") + " else " + val(b, "ELSE", "None") + ")",
      math_single: b => {
        const v = val(b, "NUM", "0"), op = field(b, "OP");
        if (op === "NEG") return "(-" + v + ")";
        if (op === "ABS") return "abs(" + v + ")";
        needMath = true;
        return { ROOT: "math.sqrt", LN: "math.log", LOG10: "math.log10",
                 EXP: "math.exp", POW10: "10 ** " }[op] === "10 ** "
          ? "(10 ** " + v + ")"
          : ({ ROOT: "math.sqrt", LN: "math.log", LOG10: "math.log10", EXP: "math.exp" }[op] || "abs") + "(" + v + ")";
      },
      math_trig: b => {
        needMath = true;
        const v = val(b, "NUM", "0"), op = field(b, "OP").toLowerCase();
        return "math." + op + "(math.radians(" + v + "))";
      },
      math_constant: b => {
        const k = field(b, "CONSTANT");
        if (k === "INFINITY") return "float('inf')";
        needMath = true;
        return { PI: "math.pi", E: "math.e", SQRT2: "math.sqrt(2)",
                 SQRT1_2: "math.sqrt(0.5)", GOLDEN_RATIO: "((1 + math.sqrt(5)) / 2)" }[k] || "math.pi";
      },
      math_number_property: b => {
        const v = val(b, "NUMBER_TO_CHECK", "0"), k = field(b, "PROPERTY");
        if (k === "EVEN") return "(" + v + " % 2 == 0)";
        if (k === "ODD") return "(" + v + " % 2 == 1)";
        if (k === "POSITIVE") return "(" + v + " > 0)";
        if (k === "NEGATIVE") return "(" + v + " < 0)";
        if (k === "DIVISIBLE_BY") return "(" + v + " % " + val(b, "DIVISOR", "1") + " == 0)";
        return "(" + v + " == int(" + v + "))";
      },
      math_round: b => {
        const v = val(b, "NUM", "0"), k = field(b, "OP");
        if (k === "ROUNDUP") { needMath = true; return "math.ceil(" + v + ")"; }
        if (k === "ROUNDDOWN") { needMath = true; return "math.floor(" + v + ")"; }
        return "round(" + v + ")";
      },
      math_on_list: b => {
        const v = val(b, "LIST", "[]");
        return { SUM: "sum", MIN: "min", MAX: "max" }[field(b, "OP")]
          ? ({ SUM: "sum", MIN: "min", MAX: "max" }[field(b, "OP")]) + "(" + v + ")"
          : "(sum(" + v + ") / len(" + v + "))";
      },
      math_modulo: b => "(" + val(b, "DIVIDEND", "0") + " % " + val(b, "DIVISOR", "1") + ")",
      math_constrain: b =>
        "min(max(" + val(b, "VALUE", "0") + ", " + val(b, "LOW", "0") + "), " + val(b, "HIGH", "100") + ")",
      math_random_float: () => { needRandom = true; return "random.random()"; },
      text_isEmpty: b => "(len(" + val(b, "VALUE", "''") + ") == 0)",
      text_indexOf: b =>
        "(" + val(b, "VALUE", "''") + ".find(" + val(b, "FIND", "''") + ") + 1)",
      text_charAt: b => {
        const v = val(b, "VALUE", "''"), w = field(b, "WHERE");
        if (w === "FIRST") return v + "[0]";
        if (w === "LAST") return v + "[-1]";
        return v + "[" + val(b, "AT", "1") + " - 1]";
      },
      text_getSubstring: b =>
        val(b, "STRING", "''") + "[" + val(b, "AT1", "1") + " - 1:" + val(b, "AT2", "1") + "]",
      text_changeCase: b => {
        const v = val(b, "TEXT", "''");
        return v + "." + ({ UPPERCASE: "upper", LOWERCASE: "lower", TITLECASE: "title" }[field(b, "CASE")] || "upper") + "()";
      },
      text_trim: b => val(b, "TEXT", "''") + "." +
        ({ LEFT: "lstrip", RIGHT: "rstrip", BOTH: "strip" }[field(b, "MODE")] || "strip") + "()",
      lists_isEmpty: b => "(len(" + val(b, "VALUE", "[]") + ") == 0)",
      lists_repeat: b => "([" + val(b, "ITEM", "None") + "] * " + val(b, "NUM", "1") + ")",
      lists_indexOf: b => "(" + val(b, "VALUE", "[]") + ".index(" + val(b, "FIND", "None") + ") + 1)",
      lists_getIndex: b => {
        const v = val(b, "VALUE", "[]"), w = field(b, "WHERE");
        if (w === "RANDOM") { needRandom = true; return "random.choice(" + v + ")"; }
        if (w === "FIRST") return v + "[0]";
        if (w === "LAST") return v + "[-1]";
        return v + "[" + val(b, "AT", "1") + " - 1]";
      },
      lists_getSublist: b =>
        val(b, "LIST", "[]") + "[" + val(b, "AT1", "1") + " - 1:" + val(b, "AT2", "1") + "]",
      lists_split: b => {
        const v = val(b, "INPUT", "''");
        return field(b, "MODE") === "SPLIT"
          ? v + ".split(" + val(b, "DELIM", "','") + ")"
          : val(b, "DELIM", "','") + ".join(" + v + ")";
      },
      lists_sort: b => "sorted(" + val(b, "LIST", "[]") + ")",

      /* ---- 함수 ---- */
      procedures_callreturn: b => pyCall(b),
      /* ---- 쉬움 수준 ---- */
      ez_seen: b => ({ seeFace: "len(vision('face', camera())) > 0", seeHand: "count(vision('hand', camera())) > 0",
                       seePerson: "has(vision('object', camera()), 'person')" })[field(b, "WHAT")] || "False",
      ez_hand: b => "has(vision('hand', camera()), " + q(field(b, "G")) + ")",
      ez_emo: b => "(first(vision('face_attr', camera()), 'name_en') == " + q(field(b, "E")) + ")",
      ez_who: b => "has(vision('who', camera(), info=''), " + q(field(b, "NAME")) + ")",
      ez_score: () => { needScore = true; return "score"; },
      /* ---- 무대 · 입력 — 무대 캐릭터는 블록 화면 전용 ---- */
      ev_ask: b => "input(" + val(b, "Q", "''") + ")",
      ev_key: () => "False  # 키보드: 블록 화면 전용",
      ev_clicked: () => "False  # 무대 클릭: 블록 화면 전용",
      ev_mouse: () => "0  # 마우스: 블록 화면 전용",
      sp_xy: () => "0  # 캐릭터: 블록 화면 전용",
      sp_touch: () => "False  # 캐릭터: 블록 화면 전용",
      sp_edge: () => "False  # 캐릭터: 블록 화면 전용",
      /* ---- 결과 · 기록 (themaker 의 같은 이름 함수) ---- */
      res_of: b => "vision(" + q(field(b, "KIND")) + ", " + img(b, "IMG") + ")",
      res_custom: b => "vision(" + q("my:" + field(b, "MODEL")) + ", " + img(b, "IMG") + ")",
      res_file: b => "detect(" + q(field(b, "FILE")) + ", " + img(b, "IMG") + ")",
      res_count: b => "count(" + val(b, "RES", "[]") + ")",
      res_names: b => "names(" + val(b, "RES", "[]") + ")",
      res_nth: b => "nth(" + val(b, "RES", "[]") + ", " + val(b, "N", "1") + ", " + q(field(b, "KEY")) + ")",
      res_has: b => "has(" + val(b, "RES", "[]") + ", " + val(b, "NAME", "''") + ")",
      res_pick: b => (field(b, "WHICH") === "biggest" ? "biggest(" : "best(") + val(b, "RES", "[]") + ", " + q(field(b, "KEY")) + ")",
      res_pose: b => "pose_" + field(b, "AXIS") + "(" + val(b, "RES", "[]") + ", " + q(field(b, "PART")) + ", " + val(b, "WHO", "1") + ")",
      tm_timer: () => "timer()",
      dt_rows: b => "len(table(" + q(field(b, "TABLE")) + "))",
      dt_recall: b => "recall(" + q(field(b, "KEY")) + ", 0)",
      ai_rag: b => "chat(" + val(b, "Q", "''") + ", db=" + q(field(b, "DB")) + ")",

      /* ---- 사진 가져오기 ---- */
      ai_capture: () => "camera()",
      ai_upload: () => "load('사진.jpg')",

      /* ---- AI 로 보기 ---- */
      ai_objects: b => "names_of(vision('object', " + img(b, "IMG") + "))",
      ai_custom: b => "first_name(vision('my:" + field(b, "MODEL") + "', " + img(b, "IMG") + "))",
      ai_detect_file: b =>
        "first_name(detect(" + q(field(b, "FILE")) + ", " + img(b, "IMG") + "))",
      ai_face: b => {
        const w = field(b, "WHAT");
        if (w === "dir") return "first_of(vision('distance', " + img(b, "IMG") + "), 'direction')";
        return "first_of(vision('face_attr', " + img(b, "IMG") + "), " + q(w) + ")";
      },
      ai_face_count: b => "len(vision('face', " + img(b, "IMG") + "))",
      ai_hand: b => "first_of(vision('hand', " + img(b, "IMG") + "), 'gesture')",
      ai_face_dist: b => "first_of(vision('distance', " + img(b, "IMG") + "), 'distance')",
      ai_who: b => "face_who(" + img(b, "IMG") + ")",
      ai_ocr: b => "texts_of(vision('ocr', " + img(b, "IMG") + "))",
      ai_qr: b => "first_of(vision('qr', " + img(b, "IMG") + "), 'data')",
      ai_chat: b => "chat(" + val(b, "Q", "''") + ")",
      ai_ask: b => "vision('look', " + img(b, "IMG") + ", prompt=" + val(b, "Q", "''") + ")['answer']",
      ai_transform: b =>
        "vision(" + q(pick(M_TRANS, field(b, "KIND"))) + ", " + img(b, "IMG") + ")",
      ai_listen: b => "listen(" + field(b, "SEC") + ")",
      bd_ask: b => "board_ask(" + val(b, "TEXT", "''") + ", " + field(b, "SEC") + ")",
      bd_read: b => "board_read(" + field(b, "SEC") + ")",
      bd_ok: () => "board_connected()",

      /* ---- 사진 편집 (아홉 칸) ---- */
      ed_resize: b => "resize(" + img(b, "IMG") + ", " + num(b, "F", 2) + ")",
      ed_rotate: b => "rotate(" + img(b, "IMG") + ", " + num(b, "DEG", 90) + ")",
      ed_flip: b => "flip(" + img(b, "IMG") + ", " + q(pick(M_FLIP, field(b, "DIR"), "h")) + ")",
      ed_crop: b => "crop(" + img(b, "IMG") + ", " + q(pick(M_CROP, field(b, "PART"), "mc")) + ")",
      ed_merge: b => "attach(" + img(b, "A") + ", " + img(b, "B") + ", " +
        q(pick(M_MERGE, field(b, "DIR"), "h")) + ")",
      ed_overlay: b => "put_on(" + img(b, "A") + ", " + img(b, "B") + ", " +
        q(pick(M_SIZE, field(b, "SIZE"), "half")) + ", " + q(field(b, "POS")) + ")",
      ed_tone: b => "adjust(" + img(b, "IMG") + ", " + q(field(b, "WHAT")) + ", " + num(b, "V", 0) + ")",
      ed_filter: b => "img_filter(" + img(b, "IMG") + ", " + q(field(b, "F")) + ")",
      ed_text: b => "draw_text(" + img(b, "IMG") + ", " + val(b, "TXT", "''") + ", " +
        q(field(b, "POS")) + ", " + num(b, "SIZE", 40) + ", " + q(colName(field(b, "COL"))) + ")",
      ed_text_rot: b => "draw_text(" + img(b, "IMG") + ", " + val(b, "TXT", "''") + ", " +
        q(field(b, "POS")) + ", 44, 'black', " + num(b, "DEG", 0) + ")",
      ed_rect: b => "draw_rect(" + img(b, "IMG") + ", " + q(field(b, "POS")) + ", " +
        q(pick(M_FILL, field(b, "FILL"), "line")) + ", " + q(colName(field(b, "COL"))) + ")",
      ed_circle: b => "draw_circle(" + img(b, "IMG") + ", " + q(field(b, "POS")) + ", " +
        q(pick(M_FILL, field(b, "FILL"), "line")) + ", " + q(colName(field(b, "COL"))) + ")",
      ed_line: b => "draw_line(" + img(b, "IMG") + ", " + q(field(b, "P1")) + ", " +
        q(field(b, "P2")) + ", " + q(colName(field(b, "COL"))) + ")",
      ed_size_of: b => "size_of(" + img(b, "IMG") + ", " + q(pick(M_WH, field(b, "WHAT"), "w")) + ")",
      ed_color_at: b => "color_at(" + img(b, "IMG") + ", " + q(field(b, "POS")) + ")",
      ed_main_color: b => "main_color(" + img(b, "IMG") + ")",
      ed_crop_detected: b => {
        if (!hasResult) { needCam = true; return "crop_found(img, vision('face', img))"; }
        return "crop_found(" + lastShown + ", r)";
      },
      ed_sticker: b => "put_sticker(" + img(b, "A") + ", " + img(b, "B") + ")",

      /* ---- 사진 편집 (좌표) ---- */
      edx_crop: b => "crop_xy(" + img(b, "IMG") + ", " + num(b, "X", 0) + ", " + num(b, "Y", 0) +
        ", " + num(b, "W", 100) + ", " + num(b, "H", 100) + ")",
      edx_text: b => "draw_text_xy(" + img(b, "IMG") + ", " + val(b, "TXT", "''") + ", " +
        num(b, "X", 20) + ", " + num(b, "Y", 20) + ", " + num(b, "SIZE", 40) + ", " +
        q(colName(field(b, "COL"))) + ", " + num(b, "DEG", 0) + ")",
      edx_rect: b => "draw_rect_xy(" + img(b, "IMG") + ", " + num(b, "X", 0) + ", " + num(b, "Y", 0) +
        ", " + num(b, "W", 100) + ", " + num(b, "H", 100) + ", " +
        q(pick(M_FILL, field(b, "FILL"), "line")) + ", " + q(colName(field(b, "COL"))) + ")",
      edx_circle: b => "draw_circle_xy(" + img(b, "IMG") + ", " + num(b, "X", 100) + ", " +
        num(b, "Y", 100) + ", " + num(b, "R", 50) + ", " +
        q(pick(M_FILL, field(b, "FILL"), "line")) + ", " + q(colName(field(b, "COL"))) + ")",
      edx_line: b => "draw_line_xy(" + img(b, "IMG") + ", " + num(b, "X1", 0) + ", " + num(b, "Y1", 0) +
        ", " + num(b, "X2", 100) + ", " + num(b, "Y2", 100) + ", " + q(colName(field(b, "COL"))) + ")",
      edx_overlay: b => "put_on_xy(" + img(b, "A") + ", " + img(b, "B") + ", " +
        num(b, "X", 0) + ", " + num(b, "Y", 0) + ", " + num(b, "S", 1) + ")",
      edx_color: b => "color_at_xy(" + img(b, "IMG") + ", " + num(b, "X", 0) + ", " + num(b, "Y", 0) + ")",
    };

    /* 블록이 쓰는 값 -> themaker 가 받는 값. 이름이 서로 다르므로 여기서 옮긴다. */
    const M_FLIP  = { flipH: "h", flipV: "v" };
    const M_MERGE = { sideH: "h", sideV: "v" };
    const M_CROP  = { center: "mc", left: "ml", right: "mr", top: "tc", bottom: "bc" };
    const M_SIZE  = { small: "small", mid: "half", big: "big" };
    const M_FILL  = { fill: "fill", hollow: "line" };
    const M_WH    = { width: "w", height: "h" };
    const M_NOTE  = { "262": "도", "294": "레", "330": "미", "349": "파",
                      "392": "솔", "440": "라", "494": "시", "523": "높은도" };
    /* 블록의 효과음 10종 -> themaker 의 4종에서 가장 가까운 것 */
    const M_BEEP  = { beepOk: "ok", beepNo: "error", sndSiren: "buzz", sndLaser: "ding",
                      sndCoin: "ding", sndJump: "ding", sndDrum: "buzz", sndClap: "ok",
                      sndChime: "ding", sndFanfare: "ok" };
    /* 인식 종류 -> vision() 기능 이름 */
    const M_MODE  = { face: "face", hand: "hand", dist: "distance", objects: "object",
                      ocr: "ocr", qr: "qr" };
    const M_TRANS = { portrait: "bg_remove", sr: "sr" };
    const pick = (map, v, dflt) => map[v] || dflt || v;
    let needRandom = false, needMath = false;

    /* 블록의 색은 #rrggbb 로 온다 — themaker 가 아는 이름으로 바꾼다 */
    function colName(hex) {
      const map = { "#e0342e": "red", "#1f5f7a": "blue", "#f4c522": "yellow",
                    "#2fa35c": "green", "#ffffff": "white", "#26262e": "black" };
      const k = String(hex || "").toLowerCase();
      return map[k] || (k.startsWith("#") ? k : (k || "red"));   // 모르는 색은 #코드 그대로
    }

    function pyCall(b) {
      const args = [];
      for (let i = 0; b.getInput("ARG" + i); i++) args.push(val(b, "ARG" + i, "None"));
      return pyName(b.getFieldValue("NAME")) + "(" + args.join(", ") + ")";
    }
    function pyDef(b, ind) {
      const p = " ".repeat(ind),
            params = (b.arguments_ || (b.getVarModels ? b.getVarModels().map(v => v.name) : [])).map(pyName);
      const out = [p + "def " + pyName(b.getFieldValue("NAME")) + "(" + params.join(", ") + "):"];
      /* 함수 안에서 값을 바꾸는 바깥 변수는 global 로 — 안 쓰면 파이썬은 새 지역 변수로 본다 */
      const sets = new Set();
      b.getDescendants(false).forEach(d => {
        if (["variables_set", "math_change", "text_append"].includes(d.type)) sets.add(pyName(d.getField("VAR").getText()));
      });
      params.forEach(x => sets.delete(x));
      if (sets.size) out.push(p + "    global " + [...sets].join(", "));
      const first = b.getInputTargetBlock("STACK");
      const inner = first ? chain(first, ind + 4) : "";
      if (inner.split("\n").some(l => l.trim() && !l.trim().startsWith("#"))) out.push(inner);
      else { if (inner) out.push(inner); if (!b.getInput("RETURN")) out.push(p + "    pass"); }
      if (b.getInput("RETURN")) out.push(p + "    return " + val(b, "RETURN", "None"));
      return out.join("\n") + "\n";
    }
    function pyName(name) {
      const s = String(name).trim().replace(/[^\wㄱ-ㅎ가-힣]/g, "_");
      return /^[0-9]/.test(s) ? "v_" + s : (s || "x");
    }

    function expr(b) {
      const f = E[b.type];
      if (f) return f(b);
      return "None  # " + b.type + " (파이썬에 아직 없어요)";
    }

    /* ---- 문장 블록 ---- */
    function stmt(b, ind) {
      const p = " ".repeat(ind);
      const out = [];
      const T = b.type;

      if (T === "ai_detect_draw") {
        hasResult = true;
        lastShown = img(b, "IMG");
        out.push(p + "r = vision(" + q(pick(M_MODE, field(b, "MODE"))) + ", " + lastShown + ")");
        out.push(p + "show(" + lastShown + ", r)");
      } else if (T === "ai_face_register") {
        out.push(p + "face_register(" + val(b, "NAME", "''") + ", " + img(b, "IMG") + ")");
      } else if (T === "st_say") {
        out.push(p + "speak(" + val(b, "TEXT", "''")
                 + voiceArg(field(b, "V"), field(b, "S")) + ")");
      } else if (T === "bd_send") {
        out.push(p + "board_send(" + val(b, "TEXT", "''") + ")");
      } else if (T === "st_show_image") {
        lastShown = img(b, "IMG");         // 무대에 보인 것을 기억 (저장·박스가 이걸 쓴다)
        out.push(p + "show(" + lastShown + ")");
      } else if (T === "st_boxes") {
        if (lastRes) {
          out.push(p + "show(" + lastShown + ", " + lastRes + ")");
        } else if (hasResult) {
          out.push(p + "show(" + lastShown + ", r)");
        } else {                          // 앞에서 인식한 적이 없으면 여기서 한 번 한다
          needCam = true;
          out.push(p + "r = vision('object', img)");
          out.push(p + "show(img, r)");
        }
      } else if (T === "st_clear") {
        return "";                       // 파이썬에는 화면 칸이 없다 — 조용히 건너뛴다
      } else if (T === "procedures_defnoreturn" || T === "procedures_defreturn") {
        out.push(pyDef(b, ind));
      } else if (T === "procedures_callnoreturn") {
        out.push(p + pyCall(b));
      } else if (T === "procedures_ifreturn") {
        out.push(p + "if " + val(b, "CONDITION", "False") + ":");
        out.push(p + "    return" + (b.getInput("VALUE") ? " " + val(b, "VALUE", "None") : ""));
      } else if (T === "ez_add") {
        needScore = true;
        out.push(p + "score = score + " + val(b, "N", "1"));
        out.push(p + "print('score', score)");
      } else if (T === "ez_reset") {
        needScore = true;
        out.push(p + "score = 0");
      } else if (T === "ez_put" || T === "ez_move" || T === "ez_place" || T === "ez_random" || T === "ez_follow") {
        out.push(p + "# " + T + " — 무대 캐릭터는 블록 화면 전용");
      } else if (T === "st_show_text") {
        out.push(p + "print(" + val(b, "TEXT", "''") + ")");
      } else if (T === "ev_forever") {
        needTime = true;
        const fps = Math.max(0.1, Math.min(30, Number(num(b, "FPS", 10)) || 10));
        out.push(p + "while True:");
        const inner = b.getInputTargetBlock("DO");
        if (inner) out.push(chain(inner, ind + 4));
        out.push(p + "    time.sleep(" + (Math.round(1000 / fps) / 1000) + ")");
      } else if (T === "sp_put" || T === "sp_goto" || T === "sp_move" || T === "sp_size" ||
                 T === "sp_show" || T === "st_cam_view") {
        out.push(p + "# " + T + " — 무대 캐릭터 · 카메라 화면은 블록 화면 전용");
      } else if (T === "tm_reset") {
        out.push(p + "reset_timer()");
      } else if (T === "dt_record") {
        out.push(p + "record(" + q(field(b, "TABLE")) + ", " + val(b, "V", "''") + ")");
      } else if (T === "dt_save") {
        out.push(p + "print(save_table(" + q(field(b, "TABLE")) + "))");
      } else if (T === "dt_remember") {
        out.push(p + "remember(" + q(field(b, "KEY")) + ", " + val(b, "V", "0") + ")");
      } else if (T === "st_save_stage") {
        out.push(p + "save(" + img(b, "IMG") + ", 'themaker.jpg')");
      } else if (T === "st_wait") {
        needTime = true;
        out.push(p + "time.sleep(" + num(b, "SEC", 1) + ")");
      } else if (T === "st_note") {
        out.push(p + "play_note(" + q(pick(M_NOTE, field(b, "N"), "도")) + ", " + num(b, "B", 1) + ")");
      } else if (T === "st_beep") {
        out.push(p + "beep(" + q(pick(M_BEEP, field(b, "K"), "ok")) + ")");
      } else if (T === "st_melody") {
        out.push(p + "play_melody(" + val(b, "M", "''") + ", " + field(b, "T") + ")");
      } else if (T === "st_freq") {
        out.push(p + "play_hz(" + num(b, "F", 440) + ", " + num(b, "S", 0.5) + ")");
      } else if (T === "ev_wait_face") {
        needTime = true;
        out.push(p + "while not vision('face', camera()):");
        out.push(p + "    time.sleep(0.3)");
      } else if (T === "ev_wait_hand") {
        needTime = true;
        out.push(p + "while first_of(vision('hand', camera()), 'gesture_en') != " + q(field(b, "G")) + ":");
        out.push(p + "    time.sleep(0.3)");
      } else if (T === "ev_wait_custom") {
        needTime = true;
        out.push(p + "while first_name(vision('my:" + field(b, "MODEL") + "', camera())) != " +
                 val(b, "LABEL", "''") + ":");
        out.push(p + "    time.sleep(0.3)");
      } else if (T === "controls_repeat_ext" || T === "controls_repeat") {
        const n = b.getInputTargetBlock("TIMES") ? val(b, "TIMES", "5") : (field(b, "TIMES") || "5");
        out.push(p + "for i in range(" + n + "):");
        out.push(body(b, "DO", ind + 4, p));
      } else if (T === "controls_whileUntil") {
        const cond = val(b, "BOOL", "True");
        out.push(p + "while " + (field(b, "MODE") === "UNTIL" ? "not " + cond : cond) + ":");
        out.push(body(b, "DO", ind + 4, p));
      } else if (T === "controls_if") {
        let n = 0;
        while (b.getInput("IF" + n)) {
          out.push(p + (n === 0 ? "if " : "elif ") + val(b, "IF" + n, "False") + ":");
          out.push(body(b, "DO" + n, ind + 4, p));
          n++;
        }
        if (b.getInput("ELSE")) {
          out.push(p + "else:");
          out.push(body(b, "ELSE", ind + 4, p));
        }
      } else if (T === "controls_forEach") {
        out.push(p + pyName(b.getField("VAR").getText()) + " = None");
        out.push(p + "for " + pyName(b.getField("VAR").getText()) + " in " + val(b, "LIST", "[]") + ":");
        out.push(body(b, "DO", ind + 4, p));
      } else if (T === "variables_set") {
        const name = pyName(b.getField("VAR").getText());
        const vb = b.getInputTargetBlock("VALUE");
        if (vb && /^res_(of|custom|file)$/.test(vb.type)) {
          /* 결과를 변수에 담으면 그 사진도 img 에 둔다 — [박스 그리기] 가 같은 사진 · 같은 결과를 보여 주게 */
          const ib = vb.getInputTargetBlock("IMG");
          if (!ib || ib.type === "ai_capture") {
            if (ib) out.push(p + "img = " + expr(ib));
            else needCam = true;
            lastShown = "img";
          } else {
            lastShown = expr(ib);
          }
          out.push(p + name + " = " + expr(vb).replace(/, (?:camera\(\)|img)\)$/, ", " + lastShown + ")"));
          lastRes = name;
        } else {
          out.push(p + name + " = " + val(b, "VALUE", "None"));
        }
      } else if (T === "math_change") {
        const v = pyName(b.getField("VAR").getText());
        out.push(p + v + " = " + v + " + " + val(b, "DELTA", "1"));
      } else if (T === "controls_flow_statements") {
        out.push(p + (field(b, "FLOW") === "BREAK" ? "break" : "continue"));
      } else if (T === "controls_for") {
        const v = pyName(b.getField("VAR").getText());
        out.push(p + "for " + v + " in range(" + val(b, "FROM", "1") + ", "
                 + val(b, "TO", "10") + " + 1, " + val(b, "BY", "1") + "):");
        out.push(body(b, "DO", ind + 4, p));
      } else if (T === "text_print") {
        out.push(p + "print(" + val(b, "TEXT", "''") + ")");
      } else if (T === "text_append") {
        const v = pyName(b.getField("VAR").getText());
        out.push(p + v + " = str(" + v + ") + str(" + val(b, "TEXT", "''") + ")");
      } else if (T === "lists_setIndex") {
        const L = val(b, "LIST", "[]"), w = field(b, "WHERE"), it = val(b, "TO", "None");
        const idx = w === "FIRST" ? "0" : w === "LAST" ? "-1" : val(b, "AT", "1") + " - 1";
        if (field(b, "MODE") === "INSERT") out.push(p + L + ".insert(" + idx + ", " + it + ")");
        else out.push(p + L + "[" + idx + "] = " + it);
      } else {
        out.push(p + "# " + T + " (파이썬에 아직 없어요)");
      }
      return out.join("\n");
    }

    let lastShown = "img";                 // 무대에 마지막으로 보인 사진
    let hasResult = false;                 // r(인식 결과) 이 만들어졌는지
    let lastRes = "";                      // 결과 블록을 담은 마지막 변수 이름
    /* speak() 의 기본값과 같으면 인자를 생략한다 — 코드가 짧아야 읽힌다 */
    function voiceArg(voice, speedKey) {
      const speed = RT_SPEED[speedKey] || 1.05;
      const parts = [];
      if (voice && voice !== "F1") parts.push("voice='" + voice + "'");
      if (Math.abs(speed - 1.05) > 0.01) parts.push("speed=" + speed);
      return parts.length ? ", " + parts.join(", ") : "";
    }

    function body(b, name, ind, p) {
      const first = b.getInputTargetBlock(name);
      if (!first) return p + "    pass";
      const c = chain(first, ind);
      /* 안에 블록 화면 전용 블록(주석)만 있으면 파이썬 문법이 깨진다 — pass 를 붙인다 */
      if (!c.split("\n").some(l => l.trim() && !l.trim().startsWith("#"))) return (c ? c + "\n" : "") + p + "    pass";
      return c;
    }

    function chain(b, ind) {
      const lines = [];
      let cur = b;
      while (cur) {
        const one = stmt(cur, ind);
        if (one !== "") lines.push(one);   // 파이썬에 없는 블록은 줄을 만들지 않는다
        cur = cur.getNextBlock();
      }
      return lines.join("\n");
    }

    return {
      generate(workspace) {
        needTime = false; needCam = false; needRandom = false; needMath = false; needScore = false;
        lastShown = "img"; hasResult = false; lastRes = "";
        /* 함수(def)를 먼저 — 파이썬은 쓰기 전에 정의돼 있어야 한다 */
        const isDef = b => /^procedures_def/.test(b.type);
        const all = workspace.getTopBlocks(true).filter(b => !b.outputConnection);
        const tops = all.filter(isDef).concat(all.filter(b => !isDef(b)));
        const bodyLines = tops.map(b => chain(b, 0)).filter(s => s.trim()).join("\n");
        if (!bodyLines.trim()) return "from themaker import *\n\n# 블록을 조립해 보세요\n";

        const head = ["from themaker import *"];
        if (needTime) head.push("import time");
        if (needRandom) head.push("import random");
        if (needMath) head.push("import math");
        head.push("");

        /* 도우미는 실제로 쓴 것만 — 안 쓰는 함수가 붙으면 코드가 길어 보인다 */
        const used = [];
        const wanted = HELP_ORDER.filter(name => new RegExp("\\b" + name + "\\s*\\(").test(bodyLines));
        for (const name of HELP_ORDER) {
          if (wanted.includes(name) ||
              (name === "first_of" && (wanted.includes("first_name")))) used.push(name);
        }
        if (used.length) {
          head.push(used.map(n => HELPERS[n].trim()).join("\n\n"));
          head.push("");
        }
        if (needCam) { head.push("img = camera()          # 사진 한 장"); head.push(""); }
        if (needScore) { head.push("score = 0"); head.push(""); }
        return head.join("\n") + bodyLines + "\n";
      },
    };
  })();

  /* 블록이 쓰는 편의 기능 — 만든 코드에 필요한 것만 함께 넣는다 */
  const HELP_ORDER = ["first_of", "first_name", "names_of", "texts_of"];
  const HELPERS = {
    first_of: `
def first_of(result, key, default=""):
    """인식 결과에서 첫 번째 것의 값 하나만 꺼내요."""
    items = result.get("object", result) if isinstance(result, dict) else result
    if isinstance(items, list) and items:
        return items[0].get(key, default)
    return default
`,
    first_name: `
def first_name(result):
    """첫 번째로 찾은 것의 이름."""
    return first_of(result, "name")
`,
    names_of: `
def names_of(result):
    """찾은 것들의 이름 목록."""
    items = []
    if isinstance(result, dict):
        for val in result.values():
            if isinstance(val, list):
                items += val
    elif isinstance(result, list):
        items = result
    return [it.get("name", "") for it in items if isinstance(it, dict)]
`,
    texts_of: `
def texts_of(result):
    """읽은 글자들을 한 줄로."""
    return " ".join(it.get("text", "") for it in result if isinstance(it, dict))
`,
  };

  const RT_SPEED = { slow: 0.85, normal: 1.05, fast: 1.35 };

  (function () {

      const orig = G.forBlock[type];
      if (!orig) return;
      G.forBlock[type] = function (b, gen) {
        const code = orig.call(this, b, gen);
        const name = G.getVariableName ? G.getVariableName(b.getFieldValue("VAR"))
                                       : b.getField("VAR").getText();
        const js = JSON.stringify(b.getField("VAR").getText());
        return code + `RT.varSet(${js}, ${name});\n`;
      };
    });

  function toolboxFor(level) {
    if (level === "easy") return buildToolboxEasy();
    const tb = buildToolbox();
    if (level === "all") return tb;
    tb.contents = tb.contents.filter(c => !c.lvAll).map(c => !c.contents ? c : Object.assign({}, c, {
      contents: c.contents.filter(x => !(x.type && BASIC_HIDE.has(x.type)) &&

    return tb;

  (function registerCategory() {
    class ElCategory extends Blockly.ToolboxCategory {
      createIconDom_() {
        const s = document.createElement("span");
        s.className = "elCatIcon";
        const k = this.toolboxItemDef_ && this.toolboxItemDef_.ic;
        if (CAT_IC[k]) s.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' + CAT_IC[k] + "</svg>";
        return s;
      }
      addColourBorder_(colour) { if (this.rowDiv_ && colour) this.rowDiv_.style.setProperty("--cat", colour); }
      setSelected(on) { super.setSelected(on); if (this.rowDiv_) this.rowDiv_.style.backgroundColor = ""; }
    }
    Blockly.registry.register(Blockly.registry.Type.TOOLBOX_ITEM, Blockly.ToolboxCategory.registrationName, ElCategory, true);
  })();

  const shade = (hex, k) => {                  // 기본 블록의 밝은/어두운 짝 (그림자 블록·테두리)
    const n = parseInt(hex.slice(1), 16), f = c => Math.round(k > 0 ? c + (255 - c) * k : c * (1 + k));
    return "#" + [n >> 16, n >> 8 & 255, n & 255].map(c => f(c).toString(16).padStart(2, "0")).join("");
  };
  const style = hex => ({ colourPrimary: hex, colourSecondary: shade(hex, 0.35), colourTertiary: shade(hex, -0.2) });
  const THEME = Blockly.Theme.defineTheme("appTheme", {
    base: Blockly.Themes.Classic,
    fontStyle: { family: '"Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif', weight: "bold", size: 13 },
    blockStyles: {
      logic_blocks: style(C_CORE.logic), loop_blocks: style(C_CORE.loop), math_blocks: style(C_CORE.math),
      text_blocks: style(C_CORE.text), list_blocks: style(C_CORE.list), colour_blocks: style("#B34FB8"),
      variable_blocks: style(C_CORE.var), variable_dynamic_blocks: style(C_CORE.var), procedure_blocks: style(C_CORE.func),

  /* 블록 수준 — 쉬움 · 기본 · 전체. 고른 것은 이 PC 에 남고, 작품을 저장할 때 같이 적힌다 */
  var LEVEL = "all";                   // 처음 기본값 — 지금까지처럼 모든 블록
  try { const v = localStorage.getItem("vapi-blk-level"); if (["easy", "basic", "all"].includes(v)) LEVEL = v; } catch (e) {}
  const WS_OPTS = {
    media: "/blockly/media/",              // 오프라인용 (휴지통·확대축소 아이콘, 효과음)

  };
  /* Blockly 는 글자 폭을 재서 블록 크기를 정한다 — Pretendard 가 늦게 오면 한 번 다시 재게 한다 */
  if (document.fonts && document.fonts.load) {
    document.fonts.load('700 13px "Pretendard"', "가A").then(faces => {
      if (!faces.length || typeof ws === "undefined" || !ws) return;
      ws.setTheme(THEME);

  let ws = Blockly.inject("blocklyDiv", Object.assign({ toolbox: toolboxFor(LEVEL) }, WS_OPTS));
  /* 내가 만든 AI 목록 (드롭다운은 열 때마다 최신 목록을 읽음) · 가져다 둔 모델 파일 목록.
     초안을 되살리는 일은 이 둘을 기다린다 — 목록이 비어 있으면 드롭다운 값이 첫 항목으로 바뀐다. */
  const listsReady = Promise.all([loadCustomModels(), loadModelFiles(), loadDbList()]);

  /* 작업 칸 크기가 바뀌면 블록판을 다시 그린다.
     Blockly 는 만들 때의 크기를 기억하므로, 손잡이로 끌어 칸만 넓혀도 캔버스는
     옛 크기 그대로다(끌어도 안 늘어나는 것처럼 보인다). 손잡이 모듈이 흘려 주는
     resize 를 받아 svgResize 로 맞춘다. */
  window.addEventListener("resize", () => { if (ws) Blockly.svgResize(ws); });

  /* ---------------- 예제 프로그램 (C8) ---------------- */
  /* Blockly serialization JSON. 문구는 t() 로 채워 한/영을 따른다. */
  function EXAMPLES() {
    const B = (type, extra) => Object.assign({ type: type }, extra || {});
    const shadowNum = v => ({ shadow: { type: "math_number", fields: { NUM: v } } });
    const shadowTxt = v => ({ shadow: { type: "text", fields: { TEXT: v } } });
    const chain = arr => {                       // 순차 블록 연결
      for (let i = arr.length - 1; i > 0; i--) arr[i - 1].next = { block: arr[i] };
      return arr[0];
    };
    const CLEAR = () => B("st_clear");           // 모든 예제는 무대를 지우고 시작한다
    const VG = n => B("variables_get", { fields: { VAR: { name: n } } });
    const SET = (n, blk) => B("variables_set",
      { fields: { VAR: { name: n } }, inputs: { VALUE: { block: blk } } });
    const PR = blk => B("text_print", { inputs: { TEXT: { block: blk } } });
    const MV = (name, dir) => B("ez_move", { fields: { NAME: name, DIR: dir, AMT: "aBig" } });
    const NOTE = (hz, beats) => B("st_note", { fields: { N: hz }, inputs: { B: shadowNum(beats || 1) } });
    return [
      { id: "greet", name: t("ex_greet"), desc: t("ex_greet_d"),
        state: { blocks: { languageVersion: 0, blocks: [ chain([
          CLEAR(),
          B("ev_wait_face"),
          B("st_say", { inputs: { TEXT: shadowTxt(t("sh_hello")) } }),
          B("st_beep", { fields: { K: "beepOk" } }),
        ]) ] } } },
      { id: "who", name: t("ex_who"), desc: t("ex_who_d"),
        state: { blocks: { languageVersion: 0, blocks: [ chain([
          CLEAR(),
          B("st_cam_view", { fields: { MODE: "cmMirror" } }),
          B("variables_set", { fields: { VAR: { name: t("v_who") } },
            inputs: { VALUE: { block: B("ev_ask", { inputs: { Q: shadowTxt(t("sh_whoAsk")) } }) } } }),
          B("st_show_text", { inputs: { TEXT: shadowTxt(t("sh_whoLook")) } }),
          B("st_wait", { inputs: { SEC: shadowNum(2) } }),
          B("ai_face_register", { inputs: { IMG: { block: B("ai_capture") }, NAME: { block: VG(t("v_who")) } } }),
          B("ev_forever", { inputs: { FPS: shadowNum(1), DO: { block: chain([
            B("variables_set", { fields: { VAR: { name: t("v_seen") } },
              inputs: { VALUE: { block: B("ai_who", { inputs: { IMG: { block: B("ai_capture") } } }) } } }),
            B("controls_if", { extraState: { hasElse: true }, inputs: {
              IF0: { block: B("logic_compare", { fields: { OP: "NEQ" },
                inputs: { A: { block: VG(t("v_seen")) }, B: shadowTxt("") } }) },
              DO0: { block: chain([
                B("st_show_text", { inputs: { TEXT: { block: B("text_join", { extraState: { itemCount: 2 },
                  inputs: { ADD0: { block: VG(t("v_seen")) }, ADD1: shadowTxt(t("sh_whoHi")) } }) } } }),
                B("st_say", { inputs: { TEXT: { block: B("text_join", { extraState: { itemCount: 2 },
                  inputs: { ADD0: { block: VG(t("v_seen")) }, ADD1: shadowTxt(t("sh_whoHi")) } }) } } }),
                B("st_wait", { inputs: { SEC: shadowNum(3) } }) ]) },
              ELSE: { block: B("st_show_text", { inputs: { TEXT: shadowTxt(t("sh_whoUnknown")) } }) } } }),
          ]) } } }),
        ]) ] } } },
      { id: "rps", name: t("ex_rps"), desc: t("ex_rps_d"),
        state: { blocks: { languageVersion: 0, blocks: [ chain([
          CLEAR(),
          B("st_say", { inputs: { TEXT: shadowTxt(t("o_rps") + "!") } }),
          B("st_wait", { inputs: { SEC: shadowNum(1) } }),
          /* 손 모양으로 낸다 — 브이=가위, 주먹=바위, 손바닥=보.
             컴퓨터는 목록에서 무작위로 고르고, 승패는 [만약]·[그리고]·[=] 로 직접 짠다. */
          B("variables_set", { fields: { VAR: { name: "나" } },
            inputs: { VALUE: { block: B("ai_hand",
              { inputs: { IMG: { block: B("ai_capture") } } }) } } }),
          B("variables_set", { fields: { VAR: { name: "컴퓨터" } },
            inputs: { VALUE: { block: B("lists_getIndex",
              { fields: { MODE: "GET", WHERE: "RANDOM" },
                inputs: { VALUE: { block: B("lists_create_with", {
                  extraState: { itemCount: 3 },
                  inputs: { ADD0: shadowTxt(t("g_Victory")),
                            ADD1: shadowTxt(t("g_Closed_Fist")),

  /* 카메라는 「사진 찍기」 블록이 돌 때만 켠다 — 파이썬 화면과 같은 방식이다.
     전에는 화면을 열자마자 웹캠이 무대에 계속 흘렀다. 코딩 도구인데 카메라가
     늘 켜져 있으면 무엇을 찍은 건지 무대만 봐서는 알 수 없고, 카메라 불도 계속
     켜져 있다. 찍은 사진을 무대에 놓고, 실행이 끝나면 카메라를 끈다. */
  async function ensureCam() {
    if (cam.srcObject && cam.videoWidth) return;
    if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) throw fail("m_noCam");
    if (!cam.srcObject) {
      try {
        cam.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
      } catch (e) { throw fail("m_noCam"); }
    }
    /* 첫 프레임이 올 때까지 — 안 기다리면 검은 사진이 찍힌다 */
    for (let i = 0; i < 40 && !cam.videoWidth; i++) await sleep(50);
    if (!cam.videoWidth) throw fail("m_camNotReady");
  }
  function stopCam() {
    const s = cam.srcObject;
    if (!s) return;
    try { s.getTracks().forEach(tr => tr.stop()); } catch (e) {}
    cam.srcObject = null;
  }
  const LOG_MAX = 300;                     // 오래 도는 프로그램에서 기록이 끝없이 쌓이지 않게
  function log(msg) {
    const d = document.createElement("div");
    d.textContent = String(msg);
    logBox.appendChild(d);
    while (logBox.childElementCount > LOG_MAX) logBox.removeChild(logBox.firstElementChild);
    logBox.scrollTop = logBox.scrollHeight;
  }
  /* 블록이 던지는 오류 — 화면 말 + 키. 키로 오류 코드(BK-…)를 고른다 (lib/errcodes.js) */
  function fail(key, extra) {
    const e = new Error(t(key) + (extra != null ? String(extra) : ""));
    e.elKey = key;
    return e;
  }
  /* 실행 상태 칩 — 실행 중 00:03 · 끝남 · 3초 · 오류 BK-CAM · 정지됨 (파이썬 화면 · 파이보 IDE 와 같은 뜻) */
  let chipT0 = 0, chipTimer = null;
  function paintChip(kind, code) {
    const c = document.getElementById("runChip");
    if (!c) return;
    clearInterval(chipTimer); chipTimer = null;
    const mmss = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
    c.hidden = false;
    if (kind === "running") {
      chipT0 = Date.now();
      const tick = () => { c.className = "runchip running"; c.textContent = t("ch_run") + " " + mmss(Math.floor((Date.now() - chipT0) / 1000)); };
      tick(); chipTimer = setInterval(tick, 1000);
    } else if (kind === "done") { c.className = "runchip done"; c.textContent = t("ch_done") + " · " + Math.max(1, Math.round((Date.now() - chipT0) / 1000)) + t("m_sec"); }
    else if (kind === "error") { c.className = "runchip error"; c.textContent = t("ch_err") + (code ? " " + code : ""); }
    else { c.className = "runchip stopped"; c.textContent = t("ch_stop"); }
  }

  /* ---------------- 업로드 사진 ---------------- */
  let uploadedURL = null;
  document.getElementById("uploadButton").addEventListener("click", () =>
    document.getElementById("uploadFile").click());
  document.getElementById("uploadFile").addEventListener("change", function () {
    const f = this.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = e => {
      const im = new Image();
      im.onload = () => {
        // 최대 1280px로 축소해 좌표계를 고정 (박스 좌표 = 이 크기 기준)
        const scale = Math.min(1, 1280 / Math.max(im.width, im.height));
        const c = document.createElement("canvas");
        c.width = Math.round(im.width * scale);
        c.height = Math.round(im.height * scale);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        uploadedURL = c.toDataURL("image/jpeg", 0.9);
        shotImg.src = uploadedURL; shotImg.style.display = "block"; updateEmpty();
        document.getElementById("uploadHint").textContent = t("uploadReady") + " (" + f.name + ")";
      };
      im.src = e.target.result;
    };
    rd.readAsDataURL(f);
  });

  /* ---------------- AI 헬퍼 (서버 호출) ---------------- */
  function dataURLtoBlob(u) {
    const [h, b64] = u.split(","), mime = h.match(/data:(.*?);/)[1];
    const bin = atob(b64), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }
  // 무대 사진 교체: 새 그림을 먼저 디코딩한 뒤 바꾼다.
  // 같은 그림이면 그대로 두어 불필요한 리페인트를 막는다.
  let shownURL = null;
  async function swapShot(url) {
    if (shownURL === url && shotImg.style.display === "block") return;
    const im = new Image();
    im.src = url;
    try {
      if (im.decode) await im.decode();
      else await new Promise(r => { im.onload = r; im.onerror = r; });
    } catch (e) { /* 디코딩 실패해도 아래에서 그냥 교체 */ }
    shotImg.src = url;
    shotImg.style.display = "block";
    shownURL = url;
