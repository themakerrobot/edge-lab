  /* ---------------- 디바이스 HUD ---------------- */
  let DEVICE_OF = {};                       // 서비스명 -> 실행 디바이스 (서버 실측값)
  const DEV_N = { CPU: 0, GPU: 0, NPU: 0 };
  let devCalls = 0;
  const chipOf = d => document.getElementById("chip" + String(d || "").toUpperCase());

  /* 모델 로딩 전에는 디바이스 표가 비어 있다 — 준비될 때까지 다시 물어본다. */
  (async function initDevbar() {
    try {
      const info = await (await fetch("/system")).json();
      DEVICE_OF = info.device_of || {};
      (info.devices || []).forEach(d => {
        const el = chipOf(d);
        if (el) el.classList.add("on");
      });
      if (info.ready) return;
    } catch (e) { /* 서버가 아직 못 뜬 경우 */ }
    setTimeout(initDevbar, 1500);
  })();

  /* 장치 표시는 상태 오버레이(lib/sysbar.js)가 맡는다.
     그쪽이 fetch 를 지켜보다가 스스로 칩을 켜고 끄므로 여기서는 아무것도 안 한다.
     예전에는 이 페이지가 자기 띠(.devbar)의 칩을 직접 켰는데, 그 띠를 오버레이로
     옮기면서 선택자가 아무것도 못 찾게 됐다(그래서 불이 안 들어왔다). */
  function devBusy(dev) {}
  function devIdle() {}
  function devReport(dev, ms) {
    dev = String(dev || "").toUpperCase();
    devCalls++;
    /* 오버레이(lib/sysbar.js)가 못 떴어도 실행은 계속되어야 한다 —
       옛 sysbar.js 가 브라우저 캐시에 남으면 이 칸들이 없어서
       여기서 죽고 블록 실행 전체가 "오류" 로 끝났었다. */
    const put = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
    put("devCalls", devCalls);
    put("devLast", ms + " ms");
    put("devExec", dev || "--");
    if (DEV_N[dev] !== undefined) {
      DEV_N[dev]++;
      const st = document.getElementById("st" + dev);
      if (st) st.textContent = " " + ms + "ms ×" + DEV_N[dev];
    }
  }

  async function dims(url) {
    return new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res({ w: im.naturalWidth, h: im.naturalHeight });
      im.onerror = rej;
      im.src = url;
    });
  }
  async function post(path, imgURL, params) {
    if (!imgURL) throw fail("m_noImage");
    await RT.aiGate();                       // 최소 간격 + 정지 확인
    AI.lastImg = imgURL;
    AI.lastDim = await dims(imgURL);
    let url = "/" + path;
    const qs = Object.assign({ lang: LANG }, params || {});   // 서버 VLM 응답 언어
    url += "?" + new URLSearchParams(qs).toString();
    const fd = new FormData();
    fd.append("uploadFile", dataURLtoBlob(imgURL), "image.jpg");
    devBusy(DEVICE_OF[path.split("/")[1]]);   // 호출 직전에 해당 칩만 점멸
    let res;
    try {
      res = await fetch(url, { method: "POST", body: fd,
                               signal: RT.abort ? RT.abort.signal : undefined });
    } catch (e) {
      devIdle();
      if (e && e.name === "AbortError") throw "STOP";  // 정지 버튼이 fetch를 끊음
      throw e;
    }
    devIdle();
    const j = await res.json();
    if (j.result !== "ok") throw fail("m_aiError", (j.data || t("m_fail")));
    RT.lastElapsed = j.elapsed_ms || 0;
    devReport(j.device, j.elapsed_ms || 0);   // 서버가 보고한 실제 실행 디바이스
    return j.data;
  }

  /* 결과 블록 — 파이썬 themaker 의 items · count · nth · has · best · biggest · pose_x 와 같은 규칙 */
  const RES_EP = { object: "object/object_search", face: "face/face_detect", face_attr: "face/face_analyze",
                   hand: "object/hand", ocr: "code/ocr", qr: "code/barcode",
                   pose: "object/object_pose", mask: "face/mask_detect", who: "face/who" };
  /* 누구인지는 이름만 쓴다 — 나이 · 감정 같은 얼굴 정보는 계산하지 않게 (빠르다) */
  const RES_PARAMS = { who: { info: "" } };
  const RES = {
    list(d, kind, frac) {
      const arr = Array.isArray(d) ? d : (d && Array.isArray(d.object) ? d.object : []);
      return arr.filter(it => it && typeof it === "object").map(it => {
        const b = Array.isArray(it.box) && it.box.length >= 4 ? it.box.map(v => Math.round(+v || 0)) : [0, 0, 0, 0];
        let sc = +(it.percent != null ? it.percent : it.score) || 0;
        if (frac) sc *= 100;                        // 내 AI 는 0~1 로 준다 — 다른 것과 같이 %
        const nm = [it.name, it.gesture, it.text, it.data, it.emotion].find(v => v != null && v !== "");
        return Object.assign({}, it, {
          name: nm != null ? String(nm) : (it.points ? t("r_person") : (it.box ? t("r_face") : "")),
          name_en: String(it.name_en || it.gesture_en || it.emotion_en || ""),
          score: Math.round(sc * 10) / 10,
          x: Math.round((b[0] + b[2]) / 2), y: Math.round((b[1] + b[3]) / 2), w: b[2] - b[0], h: b[3] - b[1],
          box: [b[0], b[1], b[2], b[3]] });
      });
    },
    rows(r) { return Array.isArray(r) ? r.filter(it => it && typeof it === "object") : []; },
    count(r) { return RES.rows(r).length; },
    names(r) { return RES.rows(r).map(it => it.name); },
    _empty(key) { return key === "name" ? "" : 0; },
    nth(r, n, key) {
      const rows = RES.rows(r), i = Math.floor(+n || 0);
      if (i < 1 || i > rows.length) return RES._empty(key);
      const v = rows[i - 1][key];
      return v == null ? RES._empty(key) : v;
    },
    _same(it, name) {
      const k = String(name).trim().toLowerCase();
      return k !== "" && (String(it.name).toLowerCase() === k || String(it.name_en || "").toLowerCase() === k);
    },
    has(r, name) { return RES.rows(r).some(it => RES._same(it, name)); },
    pick(r, which, key) {
      const rows = RES.rows(r);
      if (!rows.length) return RES._empty(key);
      const f = which === "biggest" ? (it => it.w * it.h) : (it => it.score);
      const top = rows.reduce((a, c) => (f(c) > f(a) ? c : a));
      return top[key] == null ? RES._empty(key) : top[key];
    },
    pose(r, who, part, axis) {
      const rows = RES.rows(r), i = POSE_PARTS.indexOf(part), w = Math.floor(+who || 0);
      if (i < 0 || w < 1 || w > rows.length) return -1;
      const pts = rows[w - 1].points || [], conf = rows[w - 1].conf || [];
      if (!pts[i]) return -1;
      if (conf.length > i && conf[i] < (i <= 4 ? 0.4 : 0.5)) return -1;   // 잘 안 보이는 점은 없는 것으로
      return Math.round(+pts[i][axis === "y" ? 1 : 0] || 0);
    },
  };

  const COLOR = { face: "#1f5f7a", objects: "#2e9e5b", text: "#e08a1e", custom: "#b4451c" };
  const COLORS = { face: "#1f5f7a", objects: "#2e8b57", text: "#d97b2b", custom: "#b4451c" };
  const AI = {
    lastBoxes: [],
    layers: { img: null, items: [] },
    addLayer(img, items, color) {
      // 같은 사진이면 누적, 사진이 바뀌면 새로 시작 (사진 원본은 절대 수정하지 않음)
      if (AI.layers.img !== img) AI.layers = { img: img, items: [] };
      AI.layers.items.push(...items.map(it => ({ ...it, color })));
      AI.lastBoxes = items;
    },
    _setBoxes(img, boxes, color) {
      // 같은 사진에 대한 인식은 누적, 사진이 바뀌면 새로 시작
      if (AI.lastImg !== undefined && AI._boxImg === img) {
        AI.lastBoxes = AI.lastBoxes.concat(boxes.map(b => ({ ...b, color })));
      } else {
        AI.lastBoxes = boxes.map(b => ({ ...b, color }));
      }
      AI._boxImg = img;
    },
    async capture() {
      await ensureCam();
      const c = document.createElement("canvas");
      c.width = 640; c.height = 480;
      const cx = c.getContext("2d");
      if (RT._camMode === "cmMirror") { cx.translate(640, 0); cx.scale(-1, 1); }   // 화면과 같은 쪽으로
      cx.drawImage(cam, 0, 0, 640, 480);
      const url = c.toDataURL("image/jpeg", 0.85);
      // 찍은 사진을 무대에 놓는다 — 무엇을 찍었는지 보여야 한다.
      // [카메라 화면] 을 켜 두었으면 이미 움직이는 화면이 보이므로 사진으로 덮지 않는다.
      if (!RT._camMode || RT._camMode === "cmOff") await swapShot(url);
      else AI.lastDim = { w: 640, h: 480 };
      return url;
    },
    uploaded() {
      if (!uploadedURL) throw fail("m_needUpload");
      return uploadedURL;
    },
    async detectFile(img, name) {
      if (!name) throw fail("m_noFile");
      const d = await post("object/detect_file", img, { model: name });
      const objs = (d && d.object) || [];
      AI._setBoxes(img, objs.map(o => ({ box: o.box, label: o.name })), COLOR.custom);
      return objs.length ? objs[0].name : t("r_none");
    },
    /* ---- 결과 블록: 찾은 것을 같은 모양({name, score %, x, y, w, h, box, name_en})의 목록으로 ---- */
    async result(img, kind) {
      const ep = RES_EP[kind];
      if (!ep) throw fail("m_aiError", kind);
      const d = await post(ep, img, RES_PARAMS[kind]);
      const rows = RES.list(d, kind, false);
      AI._setBoxes(img, rows.filter(o => o.w > 0).map(o => ({ box: o.box, label: o.name })),
                   kind === "ocr" || kind === "qr" ? COLOR.text : kind === "object" ? COLOR.objects : COLOR.face);
      return rows;
    },
    async resultCustom(img, slug) {
      if (!slug) throw fail("m_noCustom");
      return RES.list(await post("custom/predict", img, { model: slug }), "custom", true);
    },
    async resultFile(img, name) {
      if (!name) throw fail("m_noFile");
      const rows = RES.list(await post("object/detect_file", img, { model: name }), "file", false);
      AI._setBoxes(img, rows.map(o => ({ box: o.box, label: o.name })), COLOR.custom);
      return rows;
    },
    async rag(db, q) {
      const text = String(q || "").trim();
      if (!db) throw fail("m_noDb");
      if (!text) return "";
      await RT.aiGate();
      devBusy(DEVICE_OF["chat_ask"] || "GPU");
      try {
        const r = await fetch("/chat/rag?" + new URLSearchParams({ db, prompt: text, lang: LANG }),
                              { method: "POST", signal: RT.abort ? RT.abort.signal : undefined });
        const j = await r.json();
        if (j.result !== "ok") throw fail("m_aiError", (j.data || t("m_fail")));
        devReport(j.device, j.elapsed_ms || 0);
        return j.data.answer;
      } catch (e) {
        if (e && e.name === "AbortError") throw "STOP";
        throw e;
      } finally { devIdle(); }
    },
    async custom(img, slug) {
      if (!slug) throw fail("m_noCustom");
      const d = await post("custom/predict", img, { model: slug });
      return (d && d.length) ? d[0].name : t("r_none");
    },
    async objects(img) {
      const d = await post("object/object_search", img);
      const all = d.object || [];              // 사람도 이 목록에 함께 온다
      AI._setBoxes(img, all.map(o => ({ box: o.box, label: o.name })), COLOR.objects);
      return all.map(o => o.name);
    },
    async face(img, what) {
      const d = await post("face/face_analyze", img);
      const pick = f => {                    // 질문한 항목의 값 (라벨/반환 공용)
        if (what === "emotion") return f.emotion;
        if (what === "age") return f.age + t("r_ageSuffix");
        if (what === "gender") return f.gender;
        return ((f.pos && f.pos.direction) || t("r_front"));   // 서버가 낱말로 준다
      };
      if (!d.length) { AI._setBoxes(img, [], COLOR.face); return what === "age" ? 0 : t("r_none"); }
      AI._setBoxes(img, d.map(f => ({ box: f.box, label: String(pick(f)) })), COLOR.face);
      return what === "age" ? d[0].age : pick(d[0]);
    },
    async faceCount(img) {
      const d = await post("face/face_detect", img);
      AI._setBoxes(img, d.map(f => ({ box: f.box, label: t("r_face") })), COLOR.face);
      return d.length;
    },
    async ocr(img) {
      const d = await post("code/ocr", img);
      AI._setBoxes(img, d.map(t => ({ box: t.box, label: t.text })), COLOR.text);
      return d.map(t => t.text).join(" ");
    },
    async qr(img) {
      const d = await post("code/barcode", img);
      AI._setBoxes(img, d.map(b => ({ box: b.box, label: "QR" })), COLOR.text);
      return d.length ? d[0].data : "";
    },
    async hand(img) {
      const d = await post("object/hand", img);
      const name = x => x.gesture;
      AI.addLayer(img, d.map(x => ({ box: x.box, label: name(x) })), COLORS.custom);
      return d.length ? name(d[0]) : t("r_none");
    },
    /* 누구인지 — 얼굴 AI 와 같은 명단(작업폴더 face/facedb.json). 알아본 사람 중 가장 큰 얼굴의 이름, 없으면 "" */
    async who(img) {
      const d = await post("face/who", img, { info: "" });
      AI._setBoxes(img, d.map(f => ({ box: f.box, label: f.name })), COLOR.face);
      const known = d.filter(f => f.known);
      if (!known.length) return "";
      const area = f => (f.box[2] - f.box[0]) * (f.box[3] - f.box[1]);
      return known.reduce((a, c) => (area(c) > area(a) ? c : a)).name;
    },
    async faceRegister(img, name) {
      const n = String(name == null ? "" : name).trim();
      if (!n) throw fail("m_aiError", t("sh_whoAsk"));
      const d = await post("face/register", img, { name: n });
      AI._setBoxes(img, [{ box: d.box, label: d.name + " ✓" }], COLOR.face);
      return d.name;
    },
    async faceDist(img) {
      const d = await post("face/mesh", img);
      AI.addLayer(img, d.map(f => ({ box: f.box, label: f.distance + "cm" })), COLORS.face);
      return d.length ? d[0].distance : 0;
    },
    async listen(sec) { return RT.listen(sec); },
    async ask(img, q) {
      const d = await post("vlm/look", img, { prompt: q });
      return d.answer;
    },
    async chat(q) {
      /* 사진 없이 글로만 묻는다 — 업로드가 없으니 post() 대신 직접 부른다 */
      const text = String(q || "").trim();
      if (!text) return "";
      await RT.aiGate();
      devBusy(DEVICE_OF["chat_ask"] || "GPU");
      try {
        const r = await fetch("/chat/ask?" + new URLSearchParams({ prompt: text, lang: LANG }),
                              { method: "POST",
                                signal: RT.abort ? RT.abort.signal : undefined });
        const j = await r.json();
        if (j.result !== "ok") throw fail("m_aiError", (j.data || t("m_fail")));
        RT.lastElapsed = j.elapsed_ms || 0;
        devReport(j.device, j.elapsed_ms || 0);
        return j.data.answer;
      } finally { devIdle(); }
    },
    async transform(img, kind) {
      const d = await post("gan/" + kind, img);
      return "data:image/jpeg;base64," + d;
    },
    async detectDraw(img, mode) {
      if (mode === "face") await AI.faceCount(img);
      else if (mode === "hand") await AI.hand(img);
      else if (mode === "dist") await AI.faceDist(img);
      else if (mode === "objects") await AI.objects(img);
      else if (mode === "ocr") await AI.ocr(img);
      else if (mode === "qr") await AI.qr(img);
      await RT.drawBoxes();
    },
    async detectDraw(img, mode) {
      if (mode === "face") await AI.faceCount(img);
      else if (mode === "hand") await AI.hand(img);
      else if (mode === "dist") await AI.faceDist(img);
      else if (mode === "objects") await AI.objects(img);
      else if (mode === "ocr") await AI.ocr(img);
      else if (mode === "qr") await AI.qr(img);
      await RT.drawBoxes();
    },
  };

  /* ---------------- 실행기 (RT) ---------------- */
  /* ---------------- 사진 편집 (canvas — 오프라인, 서버 불필요) ---------------- */
  const ED = (() => {
    const load = url => new Promise((res, rej) => {
      if (!url) { rej(t("m_noImage")); return; }
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = () => rej(t("m_noImage"));
      im.src = url;
    });
    const MAXPX = 1600;                       // 확대를 반복해도 폭주하지 않게 상한
    const out = c => c.toDataURL("image/jpeg", 0.9);
    const make = (w, h) => {
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h));
      return c;
    };
    /* 아홉 칸 위치 -> 좌표 (0~1) */
    const P9 = { tl:[.12,.12], tc:[.5,.12], tr:[.88,.12],
                 ml:[.12,.5],  mc:[.5,.5],  mr:[.88,.5],
                 bl:[.12,.88], bc:[.5,.88], br:[.88,.88] };

    return {
      async resize(url, f) {
        f = Math.max(0.1, Math.min(8, Number(f) || 1));
        const im = await load(url);
        if (f > 1) {
          /* 확대 = 디지털 줌: 가운데 1/f 영역을 잘라 원래 크기로 키운다 (가까이 보인다) */
          const w = im.width / f, h = im.height / f;
          const c = make(im.width, im.height);
          c.getContext("2d").drawImage(im, (im.width - w) / 2, (im.height - h) / 2,
                                       w, h, 0, 0, c.width, c.height);
          return out(c);
        }
        /* 축소 = 해상도 줄이기: 화면에 다시 키워 보여주면 흐릿해진다 (화질 실험용) */
        const c = make(Math.max(8, im.width * f), Math.max(8, im.height * f));
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        return out(c);
      },
      async rotate(url, deg) {
        const im = await load(url);
        const r = (Number(deg) || 0) * Math.PI / 180;
        const w = im.width, h = im.height;
        const W = Math.abs(w * Math.cos(r)) + Math.abs(h * Math.sin(r));
        const H = Math.abs(w * Math.sin(r)) + Math.abs(h * Math.cos(r));
        const c = make(W, H), g = c.getContext("2d");
        g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
        g.translate(c.width / 2, c.height / 2); g.rotate(r);
        g.drawImage(im, -w / 2, -h / 2);
        return out(c);
      },
      async flip(url, dir) {
        const im = await load(url);
        const c = make(im.width, im.height), g = c.getContext("2d");
        if (dir === "flipV") { g.translate(0, c.height); g.scale(1, -1); }
        else { g.translate(c.width, 0); g.scale(-1, 1); }
        g.drawImage(im, 0, 0);
        return out(c);
      },
      async crop(url, part) {
        const im = await load(url);
        const w = im.width, h = im.height;
        const R = { left:   [0, 0, w / 2, h],    right:  [w / 2, 0, w / 2, h],
                    top:    [0, 0, w, h / 2],    bottom: [0, h / 2, w, h / 2],
                    center: [w / 4, h / 4, w / 2, h / 2] }[part] || [0, 0, w, h];
        const c = make(R[2], R[3]);
        c.getContext("2d").drawImage(im, R[0], R[1], R[2], R[3], 0, 0, R[2], R[3]);
        return out(c);
      },
      async merge(a, b, dir) {
        const A = await load(a), B = await load(b);
        let c, g;
        if (dir === "sideV") {                 // 아래로: 너비를 맞춘다
          const w = Math.min(Math.max(A.width, B.width), MAXPX);
          const ah = A.height * w / A.width, bh = B.height * w / B.width;
          c = make(w, ah + bh); g = c.getContext("2d");
          g.drawImage(A, 0, 0, w, ah); g.drawImage(B, 0, ah, w, bh);
        } else {                               // 옆으로: 높이를 맞춘다
          const h = Math.min(Math.max(A.height, B.height), MAXPX);
          const aw = A.width * h / A.height, bw = B.width * h / B.height;
          c = make(aw + bw, h); g = c.getContext("2d");
          g.drawImage(A, 0, 0, aw, h); g.drawImage(B, aw, 0, bw, h);
        }
        return out(c);
      },
      async overlay(a, b, size, pos) {
        const A = await load(a), B = await load(b);
        const c = make(A.width, A.height), g = c.getContext("2d");
        g.drawImage(A, 0, 0);
        const f = { small: .22, mid: .35, big: .5 }[size] || .3;
        const bw = A.width * f, bh = B.height * bw / B.width;
        const [px, py] = P9[pos] || P9.br;
        const x = px * A.width - bw / 2, y = py * A.height - bh / 2;
        g.drawImage(B, Math.max(0, Math.min(x, A.width - bw)),
                       Math.max(0, Math.min(y, A.height - bh)), bw, bh);
        return out(c);
      },
      async tone(url, what, v) {
        v = Math.max(-100, Math.min(100, Number(v) || 0));
        const im = await load(url);
        const c = make(im.width, im.height), g = c.getContext("2d");
        const f = { bright: "brightness", contrast: "contrast", saturate: "saturate" }[what];
        g.filter = f + "(" + (100 + v) + "%)";
        g.drawImage(im, 0, 0);
        return out(c);
      },
      async filter(url, name) {
        const im = await load(url);
        const c = make(im.width, im.height), g = c.getContext("2d");
        g.filter = { gray: "grayscale(100%)", sepia: "sepia(90%)",
                     invert: "invert(100%)", blur: "blur(4px)" }[name] || "none";
        g.drawImage(im, 0, 0);
        return out(c);
      },
      async text(url, txt, pos, size, color, deg) {
        const im = await load(url);
        const c = make(im.width, im.height), g = c.getContext("2d");
        g.drawImage(im, 0, 0);
        txt = String(txt == null ? "" : txt);
        size = Math.max(8, Math.min(200, Number(size) || 40));
        const [px, py] = P9[pos] || P9.mc;
        g.save();
        g.translate(px * c.width, py * c.height);
        g.rotate((Number(deg) || 0) * Math.PI / 180);
        g.font = "bold " + size + 'px Pretendard, "Malgun Gothic", sans-serif';
        g.textAlign = "center"; g.textBaseline = "middle";
        g.lineWidth = Math.max(2, size / 10);
        g.strokeStyle = "rgba(255,255,255,.85)";   // 어떤 배경에서도 읽히게 흰 테두리
        g.strokeText(txt, 0, 0);
        g.fillStyle = color || "#26262e";
        g.fillText(txt, 0, 0);
        g.restore();
        return out(c);
      },
      async shape(url, kind, fill, pos, color, p2) {
        const im = await load(url);
        const c = make(im.width, im.height), g = c.getContext("2d");
        g.drawImage(im, 0, 0);
        const S = Math.min(c.width, c.height);
        g.lineWidth = Math.max(3, S * 0.012);
        g.strokeStyle = g.fillStyle = color || "#e0342e";
        const [px, py] = P9[pos] || P9.mc;
        const x = px * c.width, y = py * c.height;
        if (kind === "line") {
          const [qx, qy] = P9[p2] || P9.br;
          g.beginPath(); g.moveTo(x, y);
          g.lineTo(qx * c.width, qy * c.height); g.stroke();
        } else if (kind === "circle") {
          g.beginPath(); g.arc(x, y, S * 0.16, 0, Math.PI * 2);
          fill === "fill" ? g.fill() : g.stroke();
        } else {                               // rect
          const w = S * 0.34, h = S * 0.26;
          fill === "fill" ? g.fillRect(x - w / 2, y - h / 2, w, h)
                          : g.strokeRect(x - w / 2, y - h / 2, w, h);
        }
        return out(c);
      },
      async sizeOf(url, what) {
        const im = await load(url);
        return what === "height" ? im.height : im.width;
      },

      /* ---- 픽셀 / 색 (컴퓨터에게 사진은 숫자) ---- */
      _ctxOf(im) {
        const c = make(im.width, im.height);
        const g = c.getContext("2d", { willReadFrequently: true });
        g.drawImage(im, 0, 0);
        return g;
      },
      _colorName(r, g, b) {
        const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
        if (mx < 50) return t("c_black");
        if (mn > 205 && mx - mn < 35) return t("c_white");
        if (mx - mn < 28) return t("c_gray");
        const d = mx - mn;
        let h = 0;
        if (mx === r) h = ((g - b) / d + 6) % 6;
        else if (mx === g) h = (b - r) / d + 2;
        else h = (r - g) / d + 4;
        h *= 60;
        if (h < 20 || h >= 335) return t("c_red");
        if (h < 45) return t("c_orange");
        if (h < 70) return t("c_yellow");
        if (h < 165) return t("c_green");
        if (h < 200) return t("c_cyan");
        if (h < 260) return t("c_blue");
        return t("c_purple");
      },
      async colorAt(url, pos) {
        const im = await load(url);
        const g = ED._ctxOf(im);
        const [px, py] = P9[pos] || P9.mc;
        /* 한 픽셀은 노이즈가 심하므로 5×5 평균을 쓴다 */
        const x = Math.round(px * im.width), y = Math.round(py * im.height);
        const d = g.getImageData(Math.max(0, x - 2), Math.max(0, y - 2), 5, 5).data;
        let r = 0, gg = 0, b = 0, n = d.length / 4;
        for (let i = 0; i < d.length; i += 4) { r += d[i]; gg += d[i + 1]; b += d[i + 2]; }
        return ED._colorName(r / n, gg / n, b / n);
      },
      async colorAtXY(url, x, y) {
        const im = await load(url);
        const g = ED._ctxOf(im);
        x = Math.max(0, Math.min(im.width - 1, Math.round(Number(x) || 0)));
        y = Math.max(0, Math.min(im.height - 1, Math.round(Number(y) || 0)));
        const d = g.getImageData(x, y, 1, 1).data;
        return ED._colorName(d[0], d[1], d[2]);
      },
      async mainColor(url) {
        const im = await load(url);
        const c = make(48, 48);                     // 축소해서 세면 충분하다
        const g = c.getContext("2d", { willReadFrequently: true });
        g.drawImage(im, 0, 0, 48, 48);
        const d = g.getImageData(0, 0, 48, 48).data;
        const cnt = {};
        for (let i = 0; i < d.length; i += 4) {
          const name = ED._colorName(d[i], d[i + 1], d[i + 2]);
          cnt[name] = (cnt[name] || 0) + 1;
        }
        return Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0] || t("c_gray");
      },

      /* ---- 상급생용: 픽셀 좌표 직접 입력 ---- */
      async cropXY(url, x, y, w, h) {
        const im = await load(url);
        x = Math.max(0, Math.min(im.width - 1, Number(x) || 0));
        y = Math.max(0, Math.min(im.height - 1, Number(y) || 0));
        w = Math.max(1, Math.min(im.width - x, Number(w) || 1));
        h = Math.max(1, Math.min(im.height - y, Number(h) || 1));
        const c = make(w, h);
        c.getContext("2d").drawImage(im, x, y, w, h, 0, 0, w, h);
        return out(c);
      },
      async textXY(url, txt, x, y, size, color, deg) {
        const im = await load(url);
        const c = make(im.width, im.height), g = c.getContext("2d");
        g.drawImage(im, 0, 0);
        size = Math.max(8, Math.min(300, Number(size) || 40));
        g.save();
        g.translate(Number(x) || 0, Number(y) || 0);
        g.rotate((Number(deg) || 0) * Math.PI / 180);
        g.font = "bold " + size + 'px Pretendard, "Malgun Gothic", sans-serif';
        g.textAlign = "left"; g.textBaseline = "top";
        g.lineWidth = Math.max(2, size / 10);
        g.strokeStyle = "rgba(255,255,255,.85)";
        g.strokeText(String(txt == null ? "" : txt), 0, 0);
        g.fillStyle = color || "#26262e";
        g.fillText(String(txt == null ? "" : txt), 0, 0);
        g.restore();
        return out(c);
      },
      async rectXY(url, x, y, w, h, fill, color) {
        const im = await load(url);
        const c = make(im.width, im.height), g = c.getContext("2d");
        g.drawImage(im, 0, 0);
        g.lineWidth = Math.max(2, Math.min(c.width, c.height) * 0.008);
        g.strokeStyle = g.fillStyle = color || "#e0342e";
        fill === "fill" ? g.fillRect(+x || 0, +y || 0, +w || 1, +h || 1)
                        : g.strokeRect(+x || 0, +y || 0, +w || 1, +h || 1);
        return out(c);
      },
      async circleXY(url, x, y, r, fill, color) {
        const im = await load(url);
        const c = make(im.width, im.height), g = c.getContext("2d");
        g.drawImage(im, 0, 0);
        g.lineWidth = Math.max(2, Math.min(c.width, c.height) * 0.008);
        g.strokeStyle = g.fillStyle = color || "#e0342e";
        g.beginPath(); g.arc(+x || 0, +y || 0, Math.max(1, +r || 1), 0, Math.PI * 2);
        fill === "fill" ? g.fill() : g.stroke();
        return out(c);
      },
      async lineXY(url, x1, y1, x2, y2, color) {
        const im = await load(url);
        const c = make(im.width, im.height), g = c.getContext("2d");
        g.drawImage(im, 0, 0);
        g.lineWidth = Math.max(2, Math.min(c.width, c.height) * 0.008);
        g.strokeStyle = color || "#e0342e";
        g.beginPath(); g.moveTo(+x1 || 0, +y1 || 0); g.lineTo(+x2 || 0, +y2 || 0); g.stroke();
        return out(c);
      },
      async overlayXY(a, b, x, y, w) {
        const A = await load(a), B = await load(b);
        const c = make(A.width, A.height), g = c.getContext("2d");
        g.drawImage(A, 0, 0);
        w = Math.max(4, Number(w) || 100);
        g.drawImage(B, +x || 0, +y || 0, w, B.height * w / B.width);
        return out(c);
      },

      /* ---- 인식 결과와 연계 ---- */
      async cropDetected(which) {
        if (!AI._boxImg || !AI.lastBoxes || !AI.lastBoxes.length) throw fail("m_noDetect");
        const i = which === "last" ? AI.lastBoxes.length - 1 : 0;
        const [x1, y1, x2, y2] = AI.lastBoxes[i].box;
        return ED.cropXY(AI._boxImg, x1, y1, Math.max(1, x2 - x1), Math.max(1, y2 - y1));
      },
      async stickerOnFaces(img, sticker) {
        const d = await post("face/face_detect", img);
        if (!d.length) return img;                  // 얼굴이 없으면 원본 그대로
        const A = await load(img), B = await load(sticker);
        const c = make(A.width, A.height), g = c.getContext("2d");
        g.drawImage(A, 0, 0);
        d.forEach(f => {
          const [x1, y1, x2, y2] = f.box;
          const w = (x2 - x1) * 1.15;
          const h = B.height * w / B.width;
          g.drawImage(B, x1 - (w - (x2 - x1)) / 2, y1 - h * 0.15, w, h);

        return out(c);
      },

  })();

  /* 편집 블록 사용 통계 */

  const RT = {
    stopFlag: false, iter: 0, lastElapsed: 0,

       속도는 모델 처리 시간이 정한다. 요청 사이 간격만 조금 둔다(서버·화면이 숨 쉴 틈) */
    AI_MIN_GAP: 100,
    async aiGate() {
      if (RT.stopFlag) throw "STOP";
      const gap = Date.now() - RT.lastAiAt;
      if (gap < RT.AI_MIN_GAP) await sleep(RT.AI_MIN_GAP - gap);  // 서버 연타 방지

    async step(id) {

    },
    /* ---- 계속 반복: 1초에 fps 번. 한 바퀴가 늦으면 기다리지 않고 바로 다음 바퀴 ---- */
    frame(fps) {
      RT._fast = true;
      const gap = 1000 / Math.max(0.1, Math.min(30, +fps || 10));
      let last = 0;
      return { async next() {
        if (RT.stopFlag) throw "STOP";
        const wait = last + gap - performance.now();
        await sleep(Math.max(0, wait));
        if (RT.stopFlag) throw "STOP";
        last = performance.now();
      } };
    },
    /* ---- 무대 ---- */

      await ensureCam();

    mouse(axis) { return Math.round(axis === "y" ? RT._mouse.y : RT._mouse.x); },
    async ask(q) {

    ez: {
      score: 0,
      _p9: { tl: [77, 58], tc: [320, 58], tr: [563, 58], ml: [77, 240], mc: [320, 240], mr: [563, 240],
             bl: [77, 422], bc: [320, 422], br: [563, 422] },
      put(name, look, pos) { const q = RT.ez._p9[pos] || [320, 240]; RT.sp.put(name, look, q[0], q[1]); },
      place(name, pos) { const q = RT.ez._p9[pos] || [320, 240]; RT.sp.go(name, q[0], q[1]); },
      move(name, dir, amt) {
        const d = amt === "aBig" ? 60 : 20;
        const v = { dRight: [d, 0], dLeft: [-d, 0], dUp: [0, -d], dDown: [0, d] }[dir] || [0, 0];
        RT.sp.move(name, v[0], v[1]);
      },
      random(name) { RT.sp.go(name, 60 + Math.random() * 520, 60 + Math.random() * 360); },
      /* 같은 바퀴 안에서 '손 모양이 ~인가?' 를 여러 번 물어도 사진 · AI 는 한 번만 —
         0.2초 안에 같은 것을 다시 물으면 방금 결과를 그대로 쓴다 */
      _cache: {},
      async _look(kind) {
        const c = RT.ez._cache[kind], now = performance.now();
        if (c && now - c.t < 200) return c.r;
        const r = await AI.result(await AI.capture(), kind);
        RT.ez._cache[kind] = { t: performance.now(), r };
        return r;
      },
      async follow(name, what) {
        const r = await RT.ez._look(what === "seeFace" ? "face" : "hand");
        if (r.length) RT.sp.go(name, r[0].x, r[0].y);
      },
      async seen(what) {
        if (what === "seePerson") return RES.has(await RT.ez._look("object"), "person");

      },
      async hand(g) { return RES.has(await RT.ez._look("hand"), g); },
      async who(name) { return RES.has((await RT.ez._look("who")).filter(it => it.known), name); },
      async emo(e) {

      _show() { RT.showText(t("sh_scoreLbl") + RT.ez.score); },

      reset() { RT.ez.score = 0; RT.ez._show(); },
    },
    /* ---- 캐릭터 (무대 좌표 0~640 · 0~480) ---- */
    sp: {
      _all: {},
      _get(name) {
        const k = String(name);
        let o = RT.sp._all[k];
        if (!o) {
          const el = document.createElement("div");
          el.className = "sp"; spritesEl.appendChild(el);
          o = RT.sp._all[k] = { x: 320, y: 240, size: 60, look: "lkStar", shown: true, el };
          RT.sp._look(o);

        return o;
      },
      _look(o) {

        if (g.startsWith("/")) o.el.innerHTML = '<img src="' + g + '" alt="">';
        else o.el.textContent = g;

      },
      _draw(o) {
        o.el.style.left = (o.x / 6.4) + "%";
        o.el.style.top = (o.y / 4.8) + "%";
        o.el.style.fontSize = (o.size / 6.4 * 0.86) + "cqw";
        const im = o.el.querySelector("img");
        if (im) im.style.width = (o.size / 6.4) + "cqw";
        o.el.style.display = o.shown ? "" : "none";
      },
      _n(v, d) { v = +v; return isFinite(v) ? v : d; },
      put(name, look, x, y) {
        const o = RT.sp._get(name);
        o.look = look; o.x = RT.sp._n(x, 320); o.y = RT.sp._n(y, 240); o.shown = true;
        RT.sp._look(o);
      },
      go(name, x, y) { const o = RT.sp._get(name); o.x = RT.sp._n(x, o.x); o.y = RT.sp._n(y, o.y); RT.sp._draw(o); },
      move(name, dx, dy) { const o = RT.sp._get(name); o.x += RT.sp._n(dx, 0); o.y += RT.sp._n(dy, 0); RT.sp._draw(o); },
      size(name, s) { const o = RT.sp._get(name); o.size = Math.max(4, Math.min(640, RT.sp._n(s, 60))); RT.sp._draw(o); },
      show(name, mode) {
        const k = String(name), o = RT.sp._all[k];
        if (!o) return;
        if (mode === "svRemove") { o.el.remove(); delete RT.sp._all[k]; return; }
        o.shown = mode !== "svHide"; RT.sp._draw(o);
      },
      xy(name, axis) { const o = RT.sp._all[String(name)]; return o ? Math.round(axis === "y" ? o.y : o.x) : 0; },
      touch(a, b) {
        const A = RT.sp._all[String(a)], B = RT.sp._all[String(b)];
        if (!A || !B || !A.shown || !B.shown || A === B) return false;
        return Math.hypot(A.x - B.x, A.y - B.y) < (A.size + B.size) / 2 * 0.8;   // 둥근 모양으로 본다
      },
      edge(name) {
        const o = RT.sp._all[String(name)];

    /* 반복 횟수도 세지 않는다. 블록이 없는 빈 반복이 화면을 얼리지 않게 100번마다 차례를 넘긴다
       (블록이 있으면 RT.step 이 이미 한 줄마다 쉰다) */
    async loopTrap() {
      if (RT.stopFlag) throw "STOP";
      if (++RT.iter % 100 === 0) await sleep(0);
    },
    async say(text, voice, speed) {
      text = String(text);
      RT.voice = voice || RT.voice || "F1";
      RT.speed = speed || RT.speed || "normal";
      bubble.textContent = text; bubble.style.display = "block";
      log(t("m_say") + text);
      if (await RT._sayServer(text)) return;   // 온디바이스 TTS(Supertonic)
      await RT._sayBrowser(text);              // 안 되면 브라우저 음성으로
    },
    /* 서버 TTS — 성공하면 true. 첫 호출은 모델을 여느라 몇 초 걸린다. */
    async _sayServer(text) {
      if (RT._ttsOff) return false;
      try {
        const r = await fetch("/speech/tts", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, lang: LANG === "en" ? "en" : "ko",
                                 voice: RT.voice || "F1",
                                 speed: RT_SPEED[RT.speed] || 1.05 }),
        });
        if (!r.ok || !(r.headers.get("Content-Type") || "").includes("audio")) {
          RT._ttsOff = true;                   // 모델이 없으면 다시 시도하지 않는다
          return false;
        }
        const buf = await r.arrayBuffer();
        if (!RT._audio) RT._audio = new (window.AudioContext || window.webkitAudioContext)();
        const a = RT._audio;
        const src = a.createBufferSource();
        src.buffer = await a.decodeAudioData(buf);
        src.connect(a.destination);
        RT._voiceSrc = src;
        await new Promise(res => { src.onended = res; src.start(); });
        RT._voiceSrc = null;
        return true;
      } catch (e) {
        RT._ttsOff = true;
        return false;
      }
    },
    _sayBrowser(text) {
      return new Promise(res => {
        try {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = t("tts");
          u.onend = res; u.onerror = res;
          speechSynthesis.cancel();
          speechSynthesis.speak(u);
          setTimeout(res, Math.max(1500, text.length * 250));  // 안전 타임아웃
        } catch (e) { res(); }
      });
    },
    /* 마이크로 듣고 글자로 바꾸기 (음성 인식) */
    async listen(seconds) {
      const sec = Math.max(1, Math.min(10, Number(seconds) || 4));
      log(t("m_listen") + sec + t("m_sec"));
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        throw fail("m_noMic");
      }
      try {
        const wav = await RT._record(stream, sec);
        const fd = new FormData();
        fd.append("uploadFile", new Blob([wav], { type: "audio/wav" }), "a.wav");
        const r = await fetch("/speech/stt?lang=" + (LANG === "en" ? "en" : "ko"),
                              { method: "POST", body: fd });
        const j = await r.json();
        if (j.result !== "ok") { const e = fail("m_sttFail"); if (j.data) e.message = String(j.data); throw e; }
        const text = (j.data && j.data.text) || "";
        log(t("m_heard") + text);
        return text;
      } finally {
        stream.getTracks().forEach(tr => tr.stop());
      }
    },
    /* 마이크 소리를 WAV(16bit 모노) 로 만든다 — 서버가 WAV 만 받는다 */
    async _record(stream, seconds) {
      if (!RT._audio) RT._audio = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = RT._audio;
      await ctx.resume();
      const src = ctx.createMediaStreamSource(stream);
      const node = ctx.createScriptProcessor(4096, 1, 1);
      const chunks = [];
      node.onaudioprocess = e => chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
      src.connect(node); node.connect(ctx.destination);
      await new Promise(res => setTimeout(res, seconds * 1000));
      node.disconnect(); src.disconnect(); node.onaudioprocess = null;

      const total = chunks.reduce((n, c) => n + c.length, 0);
      const pcm = new Float32Array(total);
      let at = 0;
      for (const c of chunks) { pcm.set(c, at); at += c.length; }

      const sr = ctx.sampleRate;
      const buf = new ArrayBuffer(44 + pcm.length * 2);
      const dv = new DataView(buf);
      const put = (off, str) => { for (let i = 0; i < str.length; i++) dv.setUint8(off + i, str.charCodeAt(i)); };
      put(0, "RIFF"); dv.setUint32(4, 36 + pcm.length * 2, true); put(8, "WAVEfmt ");
      dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
      dv.setUint32(24, sr, true); dv.setUint32(28, sr * 2, true);
      dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
      put(36, "data"); dv.setUint32(40, pcm.length * 2, true);
      for (let i = 0; i < pcm.length; i++) {
        const v = Math.max(-1, Math.min(1, pcm[i]));
        dv.setInt16(44 + i * 2, v * 32767, true);
      }
      return buf;
    },
    _stopVoice() {
      try { speechSynthesis.cancel(); } catch (e) {}
      try { if (RT._voiceSrc) { RT._voiceSrc.stop(); RT._voiceSrc = null; } } catch (e) {}
    },
    showText(v) {
      const s = String(v == null ? "" : v);
      if (bigText.textContent === s) return;      // 계속 반복 안에서 같은 글자면 기록을 쌓지 않는다
      bigText.textContent = s; log(t("m_show") + s);
    },
    _audio: null,
    _tone(freq, sec, type) {
      /* Web Audio — 오프라인에서도 동작한다 */
      try {
        if (!RT._audio) RT._audio = new (window.AudioContext || window.webkitAudioContext)();
        const a = RT._audio, o = a.createOscillator(), g = a.createGain();
        o.type = type || "sine"; o.frequency.value = freq;
        g.gain.setValueAtTime(0.25, a.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + sec);
        o.connect(g); g.connect(a.destination);
        o.start(); o.stop(a.currentTime + sec);
      } catch (e) { /* 소리가 안 나도 프로그램은 계속 */ }
    },
    async note(freq, beats) {
      const sec = Math.max(0.1, Math.min(4, (Number(beats) || 1) * 0.4));
      RT._tone(freq, sec);
      await sleep(sec * 1000);
    },
    _noise(sec, lp) {
      /* 화이트 노이즈 — 박수·치직 계열 */
      try {
        if (!RT._audio) RT._audio = new (window.AudioContext || window.webkitAudioContext)();
        const a = RT._audio, n = Math.floor(a.sampleRate * sec);
        const buf = a.createBuffer(1, n, a.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
        const src = a.createBufferSource(); src.buffer = buf;
        const g = a.createGain(); g.gain.value = 0.3;
        if (lp) {
          const f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = lp;
          src.connect(f); f.connect(g);
        } else { src.connect(g); }
        g.connect(a.destination); src.start();
      } catch (e) {}
    },
    _sweep(f0, f1, sec, type) {
      /* 주파수 스윕 — 사이렌·레이저·코인 계열 */
      try {
        if (!RT._audio) RT._audio = new (window.AudioContext || window.webkitAudioContext)();
        const a = RT._audio, o = a.createOscillator(), g = a.createGain();
        o.type = type || "sine";
        o.frequency.setValueAtTime(f0, a.currentTime);
        o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), a.currentTime + sec);
        g.gain.setValueAtTime(0.25, a.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + sec);
        o.connect(g); g.connect(a.destination);
        o.start(); o.stop(a.currentTime + sec);
      } catch (e) {}
    },
    async beep(kind) {
      switch (kind) {
        case "beepNo":     RT._tone(180, 0.35, "square"); await sleep(380); break;
        case "sndSiren":   RT._sweep(600, 1200, 0.4); await sleep(400);
                           RT._sweep(1200, 600, 0.4); await sleep(430); break;
        case "sndLaser":   RT._sweep(1400, 120, 0.25, "sawtooth"); await sleep(280); break;
        case "sndCoin":    RT._tone(988, 0.09, "square"); await sleep(90);
                           RT._tone(1319, 0.25, "square"); await sleep(270); break;
        case "sndJump":    RT._sweep(220, 880, 0.22, "square"); await sleep(250); break;
        case "sndDrum":    RT._sweep(160, 45, 0.28); RT._noise(0.08, 900); await sleep(300); break;
        case "sndClap":    RT._noise(0.12, 2500); await sleep(160);
                           RT._noise(0.1, 2500); await sleep(140); break;
        case "sndChime":   RT._tone(880, 0.7); RT._tone(1320, 0.7); RT._tone(1760, 0.5);
                           await sleep(700); break;
        case "sndFanfare": for (const f of [523, 659, 784]) { RT._tone(f, 0.16, "triangle"); await sleep(150); }
                           RT._tone(1047, 0.5, "triangle"); await sleep(520); break;
        default:           RT._tone(660, 0.12); await sleep(130);
                           RT._tone(880, 0.18); await sleep(200);
      }
    },
    async melody(text, tempo) {
      /* "도미솔 솔 도2" / "c e g g c2" — 공백은 쉼표 */
      const beat = 60000 / (Number(tempo) || 120);
      const N = { "도": 262, "레": 294, "미": 330, "파": 349, "솔": 392, "라": 440,
                  "시": 494, "c": 262, "d": 294, "e": 330, "f": 349, "g": 392,
                  "a": 440, "b": 494 };
      const toks = [];
      const str = String(text == null ? "" : text).toLowerCase();
      /* 한 글자 음 + 뒤의 2(옥타브 위) 를 토큰으로 자른다 */
      for (let i = 0; i < str.length; i++) {
        const ch = str[i];
        if (ch === " ") { toks.push(null); continue; }
        if (N[ch] !== undefined) {
          let f = N[ch];
          if (str[i + 1] === "2") { f *= 2; i++; }
          toks.push(f);
        } else if (ch !== "2") { toks.push(undefined); }
      }
      const bad = toks.filter(x => x === undefined).length;
      if (bad) log(t("m_badNote") + bad);
      for (const f of toks) {
        if (RT.stopFlag) throw "STOP";
        if (f) RT._tone(f, beat / 1000 * 0.9);
        await sleep(beat);
      }
    },
    async freq(f, sec) {
      f = Math.max(20, Math.min(20000, Number(f) || 440));
      sec = Math.max(0.05, Math.min(5, Number(sec) || 0.5));
      RT._tone(f, sec);
      await sleep(sec * 1000);
    },
    varSet(name, val) {
      /* C10: 실행 중 변수 값을 무대 옆에 보여준다 */
      RT._vars = RT._vars || {};
      RT._vars[name] = Array.isArray(val) ? RT._show(val) : val;
      const box = document.getElementById("varsBox");
      const body = document.getElementById("varsBody");
      if (!box || !body) return;
      box.style.display = "block";
      const vc = document.getElementById("varsCount");
      if (vc) vc.textContent = Object.keys(RT._vars).length;
      body.innerHTML = Object.keys(RT._vars).map(k =>
        "<div><b>" + k.replace(/&/g,"&amp;").replace(/</g,"&lt;") + "</b> = " +
        String(RT._vars[k]).replace(/&/g,"&amp;").replace(/</g,"&lt;").slice(0, 60) + "</div>").join("");
    },
    /* ---- 시간 · 표 · 기억 (파이썬 timer · record · save_table · remember 와 같은 규칙) ---- */
    res: RES,
    timer() { return Math.round((Date.now() - (RT._t0 || Date.now())) / 10) / 100; },
    resetTimer() { RT._t0 = Date.now(); },
    record(name, v) {
      const vals = Array.isArray(v) ? v : [v];
      if (vals.some(x => typeof x === "string" && x.startsWith("data:image"))) throw fail("m_noImgInTable");
      RT._tables = RT._tables || {};
      (RT._tables[name] = RT._tables[name] || []).push([RT.timer()].concat(
        vals.map(x => (x && typeof x === "object") ? (x.name != null ? x.name : JSON.stringify(x)) : x)));
    },
    rows(name) { return ((RT._tables || {})[name] || []).length; },
    async saveTable(name) {
      /* 파이썬 작품 폴더에 CSV 로 둔다(파이썬 save_table 과 같은 곳) — 키오스크 창에서는 내려받기가 안 보여서 */
      const rows = (RT._tables || {})[name] || [];
      const width = rows.reduce((m, r) => Math.max(m, r.length), 1);
      const cell = v => { const s = String(v == null ? "" : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
      const head = ["time"].concat(Array.from({ length: width - 1 }, (_, i) => "value" + (i + 1)));
      const csv = [head].concat(rows).map(r => r.map(cell).join(",")).join("\r\n") + "\r\n";
      const r = await fetch("/blocks/table", { method: "POST", headers: { "Content-Type": "application/json" },
                                               body: JSON.stringify({ name: String(name), csv }) });
      const j = await r.json();
      if (j.result !== "ok") throw fail("m_saveFail", j.data);
      log(t("m_savedCsv") + j.data.saved);
    },
    _memKey(k) { return "vapi-blk-mem:" + (BLOCK_NAME || "-") + ":" + k; },
    remember(k, v) {
      if (typeof v === "string" && v.startsWith("data:image")) throw fail("m_noImgInTable");
      try { localStorage.setItem(RT._memKey(k), JSON.stringify(v)); } catch (e) { /* 저장이 막혀 있으면 이번 실행에서만 */ }
      (RT._mem = RT._mem || {})[k] = v;
    },
    recall(k) {
      try {
        const s = localStorage.getItem(RT._memKey(k));
        if (s != null) return JSON.parse(s);
      } catch (e) { /* 아래로 */ }
      const m = (RT._mem || {})[k];
      return m == null ? 0 : m;
    },
    print(v) {
      /* 리스트는 보기 좋게 콤마로 */
      if (Array.isArray(v)) v = RT._show(v);
      log("▷ " + String(v));
    },
    _show(arr) {
      /* 결과 목록은 이름만 — [object Object] 가 보이지 않게 */
      return arr.map(x => (x && typeof x === "object") ? (x.name != null ? x.name : JSON.stringify(x)) : x).join(", ");
    },
    saveStage(img) {
      const url = img || shownURL;           /* 준 사진이 있으면 그것, 없으면 지금 보이는 것 */
      if (!url) { log(t("m_noImage")); return; }
      const a = document.createElement("a");
      a.href = url;
      a.download = "themaker-" + new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-") + ".jpg";
      a.click();
      log(t("m_saved"));
    },
    async waitUntil(kind, want) {
      /* 조건이 될 때까지 웹캠을 계속 본다. 60초가 지나면 멈춘다. */
      const t0 = Date.now();
      while (Date.now() - t0 < 60000) {
        if (RT.stopFlag) throw "STOP";
        const img = await AI.capture();
        try {
          if (kind === "face") {
            const d = await post("face/face_detect", img);
            if (d.length > 0) return true;
          } else if (kind === "hand") {
            const d = await post("object/hand", img);
            if (d.length && (!want || d[0].gesture_en === want)) return true;
          } else if (kind === "custom") {
            const d = await post("custom/predict", img, { model: want.slug });
            if (d.length && d[0].name === want.label && d[0].score >= 0.6) return true;
          }
        } catch (e) { /* 인식 실패 프레임은 넘어간다 */ }
        await sleep(250);
      }
      log(t("m_waitTimeout"));
      return false;
    },
    async showImage(u) {
      if (!u) return;
      await swapShot(u);                        // 디코딩 후 교체 → 깜빡임 없음
      // 방금 인식한 그 사진을 다시 보여주는 경우엔 박스를 지우지 않는다.
      // (인식하고 박스 그리기 → 사진 보여주기 순서에서 박스가 깜빡이는 원인)
      if (u !== AI.lastImg) octx.clearRect(0, 0, overlay.width, overlay.height);
    },
    async drawBoxes() {
      if (!AI.lastImg || !AI.lastDim) { log(t("m_needDetect")); return; }
      // 분석했던 그 프레임을 배경으로 표시 → 박스와 대상이 항상 일치
      await swapShot(AI.lastImg);
      const { w, h } = AI.lastDim;
      overlay.width = w; overlay.height = h;        // 캔버스 좌표계 = 사진 좌표계
      const k = Math.max(1, w / 640);               // 사진 크기에 비례한 선/글자 굵기
      octx.clearRect(0, 0, w, h);
      octx.lineWidth = 3 * k;
      octx.font = (18 * k) + "px Pretendard, 'Malgun Gothic', sans-serif";
      AI.lastBoxes.forEach(({ box, label, color }) => {
        const c = color || "#1f5f7a";
        const [x1, y1, x2, y2] = box;
        octx.strokeStyle = c;
        octx.strokeRect(x1, y1, x2 - x1, y2 - y1);
        const tw = octx.measureText(label).width;
        octx.fillStyle = c;
        octx.fillRect(x1, Math.max(0, y1 - 24 * k), tw + 12 * k, 24 * k);
        octx.fillStyle = "#fff";
        octx.fillText(label, x1 + 6 * k, Math.max(18 * k, y1 - 6 * k));
      });
    },
    clearStage() {
      AI.lastBoxes = []; AI._boxImg = null;
      RT.sp.clear();
      askBox.classList.remove("on");
      octx.clearRect(0, 0, overlay.width, overlay.height);
      bigText.textContent = ""; bubble.style.display = "none";
      shotImg.style.display = "none";
      shownURL = null;
    },
    /* 보드 — 포트는 서버가 쥐고 있다(/board/*). 보드 앱에서 연결해 두면 여기서는 보내고 받기만 한다.
       _bseq: 이 실행이 어디까지 읽었는지 — 실행을 누르기 전에 들어온 줄은 읽지 않는다 */
    async _bpost(url, body) {
      if (RT.stopFlag) throw "STOP";
      const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
                                   body: JSON.stringify(body), signal: RT.abort ? RT.abort.signal : undefined });
      const j = await r.json();
      if (RT.stopFlag) throw "STOP";
      if (!j || j.result !== "ok") throw String((j && j.data) || "board");
      return j.data;
    },
    async boardCursor() {
      if (RT._bseq == null) {
        const j = await (await fetch("/board/status")).json();
        RT._bseq = (j.data && j.data.seq) || 0;
      }
      return RT._bseq;
    },
    async boardSend(text) {
      await RT.boardCursor();
      await RT._bpost("/board/send", { text: String(text) });
      log(t("m_board") + text);
    },
    async boardAsk(text, sec) {
      await RT.boardCursor();
      const d = await RT._bpost("/board/ask", { text: String(text), timeout: Number(sec) });
      RT._bseq = Math.max(RT._bseq, d.seq || 0);
      log(t("m_board") + text + "   " + (d.reply != null ? t("m_boardRx") + d.reply : t("m_boardNone")));
      return d.reply == null ? "" : d.reply;
    },
    async boardRead(sec) {
      const d = await RT._bpost("/board/read", { after: await RT.boardCursor(), timeout: Number(sec) });
      RT._bseq = d.seq;
      if (d.line != null) log(t("m_boardRx") + d.line);
      return d.line == null ? "" : d.line;
    },
    async boardOk() {
      try { const j = await (await fetch("/board/status")).json(); return !!(j.data && j.data.connected); }
      catch (e) { return false; }
    },
    async wait(s) {
      const until = Date.now() + Number(s) * 1000;
      while (Date.now() < until) {
        if (RT.stopFlag) throw "STOP";
        await sleep(50);
      }
    },
  };

  /* ---------------- 실행/정지 ---------------- */
  G.STATEMENT_PREFIX = "await RT.step(%1);\n";
  /* 함수 — 안의 블록이 모두 await 를 쓰므로 함수도 async 로 만들고, 부르는 쪽은 await 로 기다린다.
     (그냥 두면 함수 블록을 하나만 써도 프로그램 전체가 SyntaxError 로 안 돈다) */
  ["procedures_defreturn", "procedures_defnoreturn"].forEach(tp => {
    const orig = G.forBlock[tp];
    G.forBlock[tp] = function (b, g) {
      const r = orig.call(this, b, g);
      const key = "%" + g.getProcedureName(b.getFieldValue("NAME"));
      if (g.definitions_[key]) g.definitions_[key] = g.definitions_[key].replace(/(^|\n)function /, "$1async function ");
      return r;
    };
  });
  {
    const callR = G.forBlock["procedures_callreturn"], callN = G.forBlock["procedures_callnoreturn"];
    G.forBlock["procedures_callreturn"] = function (b, g) {
      const r = callR.call(this, b, g);
      return ["(await " + r[0] + ")", Order.ATOMIC];

    G.forBlock["procedures_callnoreturn"] = function (b, g) { return "await " + callN.call(this, b, g); };

  const runButton = document.getElementById("runButton");

  const KEYMAP = { " ": "kySpace", ArrowLeft: "kyLeft", ArrowRight: "kyRight", ArrowUp: "kyUp", ArrowDown: "kyDown" };
  const keyName = e => KEYMAP[e.key] || (e.key && e.key.length === 1 ? e.key.toLowerCase() : "");
  const typing = e => /^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || "") || (e.target && e.target.isContentEditable);
  window.addEventListener("keydown", e => {

    RT._keys.add(k);
    if (KEYMAP[e.key]) { e.preventDefault(); e.stopPropagation(); }
  }, true);

  /* ---------------- 초안 자동 저장 ---------------- */
  /* [저장] 을 안 눌러도 지금 블록을 이 컴퓨터(localStorage)에 계속 적어 두고, 다음에 열면
     되살린다 — 파이썬(pycode-draft)·가르치기와 같은 방식이다. 셸(/)에서 창을 닫거나,
     언어를 바꿔 창이 새로 뜨거나, 실수로 껐을 때 짜던 블록이 사라지지 않게.
     작업 폴더에 파일로 남기는 [저장] 과는 별개다. var 인 것은 setLang 이 이 구역보다
     먼저 watchDraft 를 부를 수 있어서다(영어 화면으로 시작할 때). */
  var DRAFT_KEY = "blocks-draft";
  var draftReady = false;              // 되살리기 전에는 적지 않는다 — 빈 작업판이 지난 초안을 덮지 않게
  var draftTimer = null;
  function writeDraft() {
    clearTimeout(draftTimer); draftTimer = null;
    if (!draftReady || !ws) return;
    try {
      const state = saveState();
      localStorage.setItem(DRAFT_KEY, JSON.stringify({ state: state, name: BLOCK_NAME }));
    } catch (e) { /* 저장 공간이 모자라도 작업은 계속된다 */ }
  }
  function queueDraft() { clearTimeout(draftTimer); draftTimer = setTimeout(writeDraft, 400); }
  function watchDraft(w) {
    if (w.__draftWatched) return;

    w.addChangeListener(e => { if (!e.isUiEvent) queueDraft(); });
  }
  watchDraft(ws);
  window.addEventListener("pagehide", writeDraft);

  /* 다른 앱이 부탁한 것 — 셸 알림의 [블록에 넣기], 내 작품의 [열기].
     ?open=작품이름 → 그 작품을 연다 · ?add=custom:모델 → 그 AI 블록을 놓는다.
     초안을 되살린 뒤에 한다 — 하던 블록 위에 더하거나, 물어보고 바꾼다. */
  function fromUrl() {
    let q;
    try { q = new URLSearchParams(location.search); } catch (e) { return; }
    const open = q.get("open"), add = q.get("add");
    if (!open && !add) return;
    try { history.replaceState(null, "", location.pathname); } catch (e) {}   // 새로고침 때 또 하지 않게
    if (open) openWork(open);
    else if (add.indexOf("custom:") === 0) addCustom(add.slice(7));
  }
  async function openWork(name) {
    if (ws.getAllBlocks(false).length && BLOCK_NAME !== name &&
        !confirm(t("m_askOpen").replace("{n}", name))) return;
    try {
      const r = await (await fetch("/blocks/work?name=" + encodeURIComponent(name))).json();
      if (r.result !== "ok") throw new Error(r.data);
      Blockly.serialization.workspaces.load(JSON.parse(r.data.state), ws);
      BLOCK_NAME = r.data.name;
      showBlockFile();
      log(t("m_loaded") + r.data.name);
    } catch (e) { alert(t("m_readFail") + (e.message || e)); }
  }
  function addCustom(slug) {
    const m = CUSTOM_MODELS.filter(x => x.slug === slug)[0];
    if (!m) { log(t("m_noModel") + slug); return; }
    try {
      const b = ws.newBlock("ai_custom");
      b.setFieldValue(slug, "MODEL");
      /* 바로 쓸 수 있게 「웹캠에서 사진 찍기」 를 끼워 둔다 */
      const cap = ws.newBlock("ai_capture");
      b.getInput("IMG").connection.connect(cap.outputConnection);
      [b, cap].forEach(x => { x.initSvg(); x.render(); });
      /* 하던 블록 아래에 놓는다 — 위에 겹치면 무엇이 새로 왔는지 안 보인다. 없으면 보이는 곳 왼쪽 위 */
      const others = ws.getTopBlocks(false).filter(x => x !== b);
      if (others.length) {
        const box = ws.getBlocksBoundingBox();
        b.moveBy(box.left, box.bottom + 40);
      } else {
        const v = ws.getMetricsManager().getViewMetrics(true);
        b.moveBy(v.left + 40, v.top + 40);
      }
      b.select();
      ws.centerOnBlock(b.id);
      log(t("m_added").replace("{n}", m.title || slug));
    } catch (e) { console.error(e); log(t("m_error") + e); }
  }

  /* ---------------- 저장/불러오기 ---------------- */
  /* 저장은 작업 폴더(blocks)로 간다 — 파이썬 화면과 같은 규약이다.
     예전에는 내려받기 폴더로 파일을 떨어뜨려서, 아이가 어디 갔는지 못 찾았고
     작업 폴더를 USB 로 옮겨도 블록 작품은 따라가지 않았다. */
  function showBlockFile() {
    const el = document.getElementById("curFile");
    if (el) el.textContent = BLOCK_NAME ? "— " + BLOCK_NAME : "— " + t("newFile");
  }

  document.getElementById("saveButton").addEventListener("click", async () => {
    /* 이름이 있으면 묻지 않고 그 작품에 덮어쓴다 */
    const name = BLOCK_NAME || prompt(t("savePrompt"), "");
    if (!name) return;
    const state = saveState();
    try {
      const j = await (await fetch("/blocks/save", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: name, state: JSON.stringify(state, null, 2) }),
      })).json();
      if (j.result !== "ok") throw new Error(j.data);
      BLOCK_NAME = j.data.saved;
      showBlockFile();
      queueDraft();                    // 초안에도 이름을 적는다 — 되살렸을 때 같은 작품에 이어 저장되게
      log(t("m_savedAs") + j.data.saved);
    } catch (e) { alert(t("m_saveFail") + (e.message || e)); }
  });

  document.getElementById("loadButton").addEventListener("click", async () => {
    /* 불러오기 = 탐색기 창을 띄워 작품 폴더에서 고른다.
       창이 안 되는 PC 에서는 아래 목록 방식으로 물러선다. */
    try {
      const r = await (await fetch("/system/pick_file", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ kind: "blocks" }),
      })).json();
      if (r.result === "ok") {
        if (r.data.canceled) return;
        loadState(JSON.parse(r.data.text));
        BLOCK_NAME = r.data.name;
        showBlockFile();
        log(t("m_loaded") + r.data.name);
        return;
      }
    } catch (e) {}

    try {
      const j = await (await fetch("/blocks/works")).json();
      const list = j.data || [];
      if (!list.length) { alert(t("m_noWorks")); return; }
      const pick = prompt(t("m_pickWork") + "\n\n" +
        list.map((w, i) => (i + 1) + ". " + w.name).join("\n"), "1");
      const n = parseInt(pick, 10);
      if (!n || n < 1 || n > list.length) return;
      const w = list[n - 1];
      const r = await (await fetch("/blocks/work?name=" + encodeURIComponent(w.name))).json();
      if (r.result !== "ok") throw new Error(r.data);
      loadState(JSON.parse(r.data.state));
      BLOCK_NAME = r.data.name;
      showBlockFile();
      log(t("m_loaded") + w.name);
    } catch (e) { alert(t("m_readFail") + (e.message || e)); }
  });
  document.getElementById("loadFile").addEventListener("change", function () {
    const f = this.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = e => {
      try {
        loadState(JSON.parse(e.target.result));
        log(t("m_loaded") + f.name);
      } catch (err) { alert(t("m_readFail") + err); }
    };
    rd.readAsText(f);
    this.value = "";
  });

  </script>
