<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="txtTitleTag">AI 블록 코딩</title>
  <link href="/fonts/fonts.css" rel="stylesheet">
  <style>
    :root {
      --paper: #faf8f0; --rule: rgba(59,93,214,.10); --box: #fff;
      --ink: #26262e; --ink-2: #6d6c66;
      --pen-blue: #2b4bd8; --pen-blue-d: #1f3ab0; --pen-red: #d94141;
      --line: #cdcabc; --line-d: #26262e; --r: 6px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
      color: var(--ink); background-color: var(--paper);
      background-image: repeating-linear-gradient(transparent 0, transparent 27px, var(--rule) 27px, var(--rule) 28px);
      font-family: "Gowun Dodum", "Apple SD Gothic Neo", system-ui, sans-serif;
      padding: 12px; gap: 10px;
    }
    button, select {
      font-family: inherit; font-size: .95rem; color: var(--ink); background: #fff;
      border: 1.5px solid var(--line); border-radius: var(--r); padding: 7px 14px; cursor: pointer;
    }
    button:hover { border-color: var(--pen-blue); }

    /* 디바이스 HUD */
    .devbar {
      display: flex; align-items: center; gap: 6px 12px; flex-wrap: wrap;
      background: #1b1c22; border: 1.5px solid #0f1014; border-radius: 6px;
      padding: 6px 12px; margin-bottom: 8px;
      font-family: "Menlo", "Consolas", ui-monospace, monospace;
      font-size: .74rem; letter-spacing: .02em; color: #cfd2da;
    }
    .devbar .brand { color: #8f95a3; }
    .devbar .brand b { color: #eaecf1; letter-spacing: .08em; }
    .devbar .chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: #24262e; border: 1px solid #33363f; border-radius: 999px;
      padding: 2px 10px; color: #6f7480;
    }
    .devbar .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: #3d424e; }
    .devbar .chip.on { color: #b9bec9; border-color: #3f7d55; }
    .devbar .chip.on .dot { background: #46d17f; box-shadow: 0 0 7px rgba(70,209,127,.75); }
    .devbar .chip.busy { border-color: #7d6a3f; color: #f2d99a; }
    .devbar .chip.busy .dot { background: #e8b13d; animation: devblink 1s infinite; }
    .devbar .chip .st { color: #6f7480; font-variant-numeric: tabular-nums; }
    .devbar .chip.on .st { color: #8f95a3; }
    @keyframes devblink { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .devbar .chip.busy .dot { animation: none; } }
    .devbar .meter { margin-left: auto; display: flex; gap: 12px; }
    .devbar .meter .k { color: #8f95a3; }
    .devbar .meter .v { color: #46d17f; font-variant-numeric: tabular-nums; }

    .header {
      flex: 0 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      background: var(--box); border: 2px solid var(--line-d); border-radius: 3px;
      box-shadow: 2px 2px 0 rgba(38,38,46,.12); padding: 10px 16px;
    }
    .h-title { display: flex; flex-direction: column; }
    .h-title .eyebrow { font-size: .7rem; letter-spacing: .14em; color: var(--ink-2); }
    .h-title .title { font-family: "Gowun Batang", serif; font-size: 1.3rem; font-weight: 700; }
    .h-title .title .od { font-size: .8rem; color: var(--pen-red); }
    .h-tools { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    #runButton { background: var(--pen-blue); border-color: var(--pen-blue); color: #fff; font-weight: 700; padding: 8px 26px; }
    #runButton:hover { background: var(--pen-blue-d); }
    #runButton:disabled { background: #b9b7ac; border-color: #b9b7ac; cursor: wait; }
    #stopButton { border-color: var(--pen-red); color: var(--pen-red); font-weight: 700; }
    a.back { font-size: .88rem; color: var(--pen-blue-d); text-decoration: none; margin-right: 4px; }
    a.back:hover { text-decoration: underline; }

    .main { flex: 1 1 auto; min-height: 0; display: flex; gap: 12px; }
    .work {
      flex: 1.25 1 0; min-width: 0; display: flex; flex-direction: column;
      background: var(--box); border: 1.5px solid var(--line); border-radius: var(--r); overflow: hidden;
    }
    .panel-head {
      flex: 0 0 auto; display: flex; align-items: center; gap: 9px;
      padding: 10px 16px; border-bottom: 1.5px dashed var(--line);
      font-family: "Gowun Batang", serif; font-weight: 700;
    }
    #blocklyDiv { flex: 1 1 auto; min-height: 0; }

    .stage-panel {
      flex: 1 1 0; min-width: 380px; display: flex; flex-direction: column;
      background: var(--box); border: 1.5px solid var(--line); border-radius: var(--r); overflow: hidden;
    }
    .stage-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .stage {
      position: relative; width: 100%; aspect-ratio: 4/3; max-height: 60vh;
      background: #191a1f; border: 1.5px solid var(--line-d); border-radius: 4px; overflow: hidden;
      flex: 0 0 auto; align-self: center;
    }
    .stage video, .stage canvas, .stage img.shot {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
    }
    .stage img.shot { display: none; background: #191a1f; }
    #bigText {
      position: absolute; left: 0; right: 0; bottom: 10%; text-align: center;
      font-family: "Gowun Batang", serif; font-size: 2rem; font-weight: 700; color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,.75); padding: 0 12px; word-break: keep-all;
    }
    #bubble {
      position: absolute; top: 10px; left: 10px; max-width: 75%;
      background: #fff; border: 2px solid var(--line-d); border-radius: 12px; border-bottom-left-radius: 2px;
      padding: 8px 14px; font-size: 1rem; display: none;
    }
    .stage-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .stage-tools .hint { font-size: .8rem; color: var(--ink-2); }
    #logBox {
      flex: 0 0 auto; background: #fdfcf8; border: 1.5px solid var(--line); border-radius: var(--r);
      padding: 8px 12px; font-family: "Menlo","Consolas",ui-monospace,monospace; font-size: .78rem;
      max-height: 120px; overflow-y: auto; color: #3a3a42; white-space: pre-wrap;
    }
    #logBox:empty::before { content: "실행하면 진행 상황이 여기에 적혀요."; color: #a3a094; }
    html[lang="en"] #logBox:empty::before { content: "Run your blocks and progress shows up here."; }
    details.codeview { flex: 0 0 auto; }
    details.codeview summary { cursor: pointer; font-family: "Gowun Batang", serif; font-weight: 700; font-size: .9rem; color: var(--ink-2); }
    details.codeview pre {
      margin-top: 6px; background: #fdfcf8; border: 1.5px solid var(--line); border-radius: var(--r);
      padding: 10px; font-size: .75rem; max-height: 180px; overflow: auto; white-space: pre-wrap;
    }
    @media (max-width: 900px) {
      body { overflow: auto; height: auto; min-height: 100dvh; }
      .main { flex-direction: column; }
      #blocklyDiv { height: 60vh; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="h-title">
      <span class="eyebrow" id="txtEyebrow">인공지능 · 컴퓨터 비전 · 인터넷 없이 내 컴퓨터에서 실행돼요</span>
      <span class="title"><span id="txtTitle">AI 블록 코딩</span> <span class="od">(On-Device)</span></span>
    </div>
    <div class="h-tools">
      <a class="back" href="/" style="
        display:inline-flex;align-items:center;gap:7px;background:#fff;
        border:1.5px solid var(--line-d);color:var(--ink);font-weight:600;
        padding:8px 14px;border-radius:var(--r);text-decoration:none;font-size:.95rem;">
        &#9998; <span id="txtBack">체험 실습</span></a>
      <button id="langButton" title="한국어 / English">EN</button>
      <button id="saveButton">저장</button>
      <button id="loadButton">불러오기</button>
      <input type="file" id="loadFile" accept=".json" style="display:none">
      <button id="stopButton">정지</button>
      <button id="runButton"><span id="runLabel">실행 ▶</span></button>
    </div>
  </div>

  <div class="devbar" id="devbar">
    <span class="brand"><b>VAPI-OD</b> · on-device</span>
    <span class="chip" id="chipCPU"><span class="dot"></span>CPU<span class="st" id="stCPU"></span></span>
    <span class="chip" id="chipGPU"><span class="dot"></span>GPU<span class="st" id="stGPU"></span></span>
    <span class="chip" id="chipNPU"><span class="dot"></span>NPU<span class="st" id="stNPU"></span></span>
    <span class="meter">
      <span><span class="k">last</span> <span class="v" id="devLast">--</span></span>
      <span><span class="k">exec</span> <span class="v" id="devExec">--</span></span>
      <span><span class="k">calls</span> <span class="v" id="devCalls">0</span></span>
    </span>
  </div>

  <div class="main">
    <div class="work">
      <div class="panel-head" id="txtWorkHead">블록을 조립해요</div>
      <div id="blocklyDiv"></div>
    </div>

    <div class="stage-panel">
      <div class="panel-head" id="txtStageHead">무대</div>
      <div class="stage-body">
        <div class="stage" id="stage">
          <video id="cam" autoplay playsinline muted></video>
          <img class="shot" id="shotImg" alt="">
          <canvas id="overlay" width="640" height="480"></canvas>
          <div id="bigText"></div>
          <div id="bubble"></div>
        </div>
        <div class="stage-tools">
          <button id="uploadButton">사진 올리기</button>
          <input type="file" id="uploadFile" accept="image/*" style="display:none">
          <span class="hint" id="uploadHint">「업로드한 사진」 블록에서 사용돼요</span>
        </div>
        <div id="logBox"></div>
        <details class="codeview">
          <summary id="txtCodeView">만들어진 코드 보기 (JavaScript)</summary>
          <pre id="codeView"></pre>
        </details>
      </div>
    </div>
  </div>

  <script src="/blockly/blocks_compressed.js"></script>

  /* ---------------- 툴박스 ---------------- */

  const WS_OPTS = {
    media: "/blockly/media/",              // 오프라인용 (휴지통·확대축소 아이콘, 효과음)

  /* ---------------- 언어 전환 ---------------- */
  function applyStaticText() {
    const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
    document.documentElement.lang = LANG;
    document.title = t("titleTag");
    set("txtTitle", t("title"));        set("txtEyebrow", t("eyebrow"));
    set("txtBack", t("back"));          set("saveButton", t("save"));

  function setLang(lang) {
    if (lang === LANG) return;
    LANG = lang;
    try { localStorage.setItem("vapiLang", lang); } catch (e) {}

    // Blockly 기본 메시지 교체
    Object.assign(Blockly.Msg, lang === "en" ? window.MSG_EN : window.MSG_KO);

  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {

    logBox.textContent += (logBox.textContent ? "\n" : "") + msg;

  /* ---------------- 업로드 사진 ---------------- */
  let uploadedURL = null;
  document.getElementById("uploadButton").addEventListener("click", () =>
    document.getElementById("uploadFile").click());
  document.getElementById("uploadFile").addEventListener("change", function () {
    const f = this.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = e => {
      const im = new Image();
      im.onload = () => {
        // 최대 1280px로 축소해 좌표계를 고정 (박스 좌표 = 이 크기 기준)
        const scale = Math.min(1, 1280 / Math.max(im.width, im.height));
        const c = document.createElement("canvas");
        c.width = Math.round(im.width * scale);
        c.height = Math.round(im.height * scale);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        uploadedURL = c.toDataURL("image/jpeg", 0.9);
        shotImg.src = uploadedURL; shotImg.style.display = "block";
        document.getElementById("uploadHint").textContent = t("uploadReady") + " (" + f.name + ")";
      };
      im.src = e.target.result;
    };
    rd.readAsDataURL(f);
  });

  /* ---------------- AI 헬퍼 (vapi-od 호출) ---------------- */
  function dataURLtoBlob(u) {
    const [h, b64] = u.split(","), mime = h.match(/data:(.*?);/)[1];
    const bin = atob(b64), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }
  // 무대 사진 교체: 새 그림을 먼저 디코딩한 뒤 바꾼다.
  // 같은 그림이면 그대로 두어 불필요한 리페인트를 막는다.
  let shownURL = null;
  async function swapShot(url) {
    if (shownURL === url && shotImg.style.display === "block") return;
    const im = new Image();
    im.src = url;
    try {
      if (im.decode) await im.decode();
      else await new Promise(r => { im.onload = r; im.onerror = r; });
    } catch (e) { /* 디코딩 실패해도 아래에서 그냥 교체 */ }
    shotImg.src = url;
    shotImg.style.display = "block";
    shownURL = url;
  }

  /* ---------------- 디바이스 HUD ---------------- */
  let DEVICE_OF = {};                       // 서비스명 -> 실행 디바이스 (서버 실측값)
  const DEV_N = { CPU: 0, GPU: 0, NPU: 0 };
  let devCalls = 0;
  const chipOf = d => document.getElementById("chip" + String(d || "").toUpperCase());

  (async function initDevbar() {
    try {
      const info = await (await fetch("/system")).json();
      DEVICE_OF = info.device_of || {};
      (info.devices || []).forEach(d => {
        const el = chipOf(d);
        if (el) el.classList.add("on");
      });
    } catch (e) { /* 오프라인 초기화 실패는 무시 */ }
  })();

  function devBusy(dev) {
    document.querySelectorAll(".devbar .chip").forEach(c => c.classList.remove("busy"));
    const el = chipOf(dev);
    if (el) el.classList.add("busy");
  }
  function devIdle() {
    document.querySelectorAll(".devbar .chip").forEach(c => c.classList.remove("busy"));
  }
  function devReport(dev, ms) {
    dev = String(dev || "").toUpperCase();
    devCalls++;
    document.getElementById("devCalls").textContent = devCalls;
    document.getElementById("devLast").textContent = ms + " ms";
    document.getElementById("devExec").textContent = dev || "--";
    if (DEV_N[dev] !== undefined) {
      DEV_N[dev]++;
      const st = document.getElementById("st" + dev);
      if (st) st.textContent = " " + ms + "ms ×" + DEV_N[dev];
    }
  }

  async function dims(url) {
    return new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res({ w: im.naturalWidth, h: im.naturalHeight });
      im.onerror = rej;
      im.src = url;
    });
  }
  async function post(path, imgURL, params) {
    if (!imgURL) throw t("m_noImage");
    await RT.aiGate();                       // 호출 상한 + 최소 간격 + 정지 확인
    AI.lastImg = imgURL;
    AI.lastDim = await dims(imgURL);
    let url = "/" + path;
    const qs = Object.assign({ lang: LANG }, params || {});   // 서버 VLM 응답 언어
    url += "?" + new URLSearchParams(qs).toString();
    const fd = new FormData();
    fd.append("uploadFile", dataURLtoBlob(imgURL), "image.jpg");
    devBusy(DEVICE_OF[path.split("/")[1]]);   // 호출 직전에 해당 칩만 점멸
    let res;
    try {
      res = await fetch(url, { method: "POST", body: fd,
                               signal: RT.abort ? RT.abort.signal : undefined });
    } catch (e) {
      devIdle();
      if (e && e.name === "AbortError") throw "STOP";  // 정지 버튼이 fetch를 끊음
      throw e;
    }
    devIdle();
    const j = await res.json();
    if (j.result !== "ok") throw t("m_aiError") + (j.data || t("m_fail"));
    RT.lastElapsed = j.elapsed_ms || 0;
    devReport(j.device, j.elapsed_ms || 0);   // 서버가 보고한 실제 실행 디바이스
    return j.data;
  }

  const COLOR = { face: "#2b4bd8", objects: "#2e9e5b", text: "#e08a1e", custom: "#d94141" };
  const COLORS = { face: "#2b4bd8", objects: "#2e8b57", text: "#d97b2b", custom: "#d94141" };
  const AI = {
    lastBoxes: [],
    layers: { img: null, items: [] },
    addLayer(img, items, color) {
      // 같은 사진이면 누적, 사진이 바뀌면 새로 시작 (사진 원본은 절대 수정하지 않음)
      if (AI.layers.img !== img) AI.layers = { img: img, items: [] };
      AI.layers.items.push(...items.map(it => ({ ...it, color })));
      AI.lastBoxes = items;
    },
    _setBoxes(img, boxes, color) {
      // 같은 사진에 대한 인식은 누적, 사진이 바뀌면 새로 시작
      if (AI.lastImg !== undefined && AI._boxImg === img) {
        AI.lastBoxes = AI.lastBoxes.concat(boxes.map(b => ({ ...b, color })));
      } else {
        AI.lastBoxes = boxes.map(b => ({ ...b, color }));
      }
      AI._boxImg = img;
    },
    async capture() {
      if (!cam.videoWidth) throw t("m_camNotReady");
      const c = document.createElement("canvas");
      c.width = 640; c.height = 480;
      c.getContext("2d").drawImage(cam, 0, 0, 640, 480);
      // 사진 찍기는 값을 만드는 블록이다. 무대 표시는 바꾸지 않는다.
      // (여기서 라이브뷰로 되돌리면 변환 결과 ↔ 웹캠이 번갈아 보여 깜빡인다)
      return c.toDataURL("image/jpeg", 0.85);
    },
    uploaded() {
      if (!uploadedURL) throw t("m_needUpload");
      return uploadedURL;
    },
    async detectOne(img, mode) {
      const d = await post("object/object_custom_e", img, { detect_mode: mode });
      const objs = (d && d.object) || [];
      AI._setBoxes(img, objs.map(o => ({ box: o.box, label: ko(o.name) })), COLOR.custom);
      return objs.length ? ko(objs[0].name) : t("r_none");
    },
    async objects(img) {
      const d = await post("object/object_search_e", img);
      const all = [...(d.person || []), ...(d.object || [])];
      AI._setBoxes(img, all.map(o => ({ box: o.box, label: o.name })), COLOR.objects);
      return all.map(o => o.name);
    },
    async face(img, what) {
      const d = await post("face/face_analyze_e", img);
      const pick = f => {                    // 질문한 항목의 값 (라벨/반환 공용)
        if (what === "emotion") return f.emotion;
        if (what === "age") return f.age + t("r_ageSuffix");
        if (what === "gender") return f.gender;
        const dir = (f.pos && f.pos.direction) || "";
        if (dir === "CC") return t("r_front");
        return ((DIR_KO[dir[0]] || "") + " " + (DIR_KO[dir[1]] || "")).trim() || t("r_front");
      };
      if (!d.length) { AI._setBoxes(img, [], COLOR.face); return what === "age" ? 0 : t("r_none"); }
      AI._setBoxes(img, d.map(f => ({ box: f.box, label: String(pick(f)) })), COLOR.face);
      return what === "age" ? d[0].age : pick(d[0]);
    },
    async faceCount(img) {
      const d = await post("face/face_detect_e", img);
      AI._setBoxes(img, d.map(f => ({ box: f.box, label: t("r_face") })), COLOR.face);
      return d.length;
    },
    async ocr(img) {
      const d = await post("code/ocr", img);
      AI._setBoxes(img, d.map(t => ({ box: t.box, label: t.text })), COLOR.text);
      return d.map(t => t.text).join(" ");
    },
    async qr(img) {
      const d = await post("code/barcode", img);
      AI._setBoxes(img, d.map(b => ({ box: b.box, label: "QR" })), COLOR.text);
      return d.length ? d[0].data : "";
    },
    async ask(img, q) {
      const d = await post("vlm/vlm_inference_e", img, { prompt: q });
      return d.answer;
    },
    async guess(img, kind) {
      if (kind === "place") {
        const d = await post("caption/caption_place_e", img);
        return d.environment + " " + d.category;
      }
      if (kind === "time") {
        const d = await post("caption/caption_time_e", img);
        return TIME_KO[d.time] || d.time;
      }
      if (kind === "weather") {
        const d = await post("caption/caption_weather_e", img);
        return WEATHER_KO[d.weather] || d.weather;
      }
      const d = await post("caption/caption_tag_e", img);
      return d.tag;
    },
    async transform(img, kind) {
      const d = await post("gan/" + kind, img);
      return "data:image/jpeg;base64," + d;
    },
    async detectDraw(img, mode) {
      if (mode === "face") await AI.faceCount(img);
      else if (mode === "objects") await AI.objects(img);
      else if (mode === "ocr") await AI.ocr(img);
      else if (mode === "qr") await AI.qr(img);
      else await AI.detectOne(img, mode);
      await RT.drawBoxes();
    },
    async detectDraw(img, mode) {
      if (mode === "face") await AI.faceCount(img);
      else if (mode === "objects") await AI.objects(img);
      else if (mode === "ocr") await AI.ocr(img);
      else if (mode === "qr") await AI.qr(img);
      else await AI.detectOne(img, mode);
      await RT.drawBoxes();
    },
    beats(a, b) {
      const R = RPS[LANG];                       // [가위, 바위, 보]
      const w = {}; w[R[0]] = R[2]; w[R[1]] = R[0]; w[R[2]] = R[1];
      return w[a] === b;
    },
    randomRps() { return RPS[LANG][Math.floor(Math.random() * 3)]; },
  };

  /* ---------------- 실행기 (RT) ---------------- */
  const RT = {
    stopFlag: false, iter: 0, lastElapsed: 0,
    abort: null, aiCalls: 0, lastAiAt: 0,
    AI_CALL_LIMIT: 50, AI_MIN_GAP: 300,
    async aiGate() {
      if (RT.stopFlag) throw "STOP";
      if (++RT.aiCalls > RT.AI_CALL_LIMIT)
        throw t("m_tooManyAI").replace("%1", RT.AI_CALL_LIMIT);
      const gap = Date.now() - RT.lastAiAt;
      if (gap < RT.AI_MIN_GAP) await sleep(RT.AI_MIN_GAP - gap);  // 서버 연타 방지
      if (RT.stopFlag) throw "STOP";
      RT.lastAiAt = Date.now();
    },
    async step(id) {
      if (RT.stopFlag) throw "STOP";
      ws.highlightBlock(id);
      await sleep(30);                          // 진행이 눈에 보이는 최소 템포
    },
    loopTrap() {
      if (RT.stopFlag) throw "STOP";
      if (++RT.iter > 5000) throw t("m_tooManyLoop");
    },
    async say(text) {
      text = String(text);
      bubble.textContent = text; bubble.style.display = "block";
      log(t("m_say") + text);
      await new Promise(res => {
        try {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = t("tts");
          u.onend = res; u.onerror = res;
          speechSynthesis.cancel();
          speechSynthesis.speak(u);
          setTimeout(res, Math.max(1500, text.length * 250));  // 안전 타임아웃
        } catch (e) { res(); }
      });
    },
    showText(v) { bigText.textContent = String(v); log(t("m_show") + v); },
    async showImage(u) {
      if (!u) return;
      await swapShot(u);                        // 디코딩 후 교체 → 깜빡임 없음
      octx.clearRect(0, 0, overlay.width, overlay.height);
    },
    async drawBoxes() {
      if (!AI.lastImg || !AI.lastDim) { log(t("m_needDetect")); return; }
      // 분석했던 그 프레임을 배경으로 표시 → 박스와 대상이 항상 일치
      await swapShot(AI.lastImg);
      const { w, h } = AI.lastDim;
      overlay.width = w; overlay.height = h;        // 캔버스 좌표계 = 사진 좌표계
      const k = Math.max(1, w / 640);               // 사진 크기에 비례한 선/글자 굵기
      octx.clearRect(0, 0, w, h);
      octx.lineWidth = 3 * k;
      octx.font = (18 * k) + "px 'Gowun Dodum', sans-serif";
      AI.lastBoxes.forEach(({ box, label, color }) => {
        const c = color || "#2b4bd8";
        const [x1, y1, x2, y2] = box;
        octx.strokeStyle = c;
        octx.strokeRect(x1, y1, x2 - x1, y2 - y1);
        const tw = octx.measureText(label).width;
        octx.fillStyle = c;
        octx.fillRect(x1, Math.max(0, y1 - 24 * k), tw + 12 * k, 24 * k);
        octx.fillStyle = "#fff";
        octx.fillText(label, x1 + 6 * k, Math.max(18 * k, y1 - 6 * k));
      });
    },
    clearStage() {
      AI.lastBoxes = []; AI._boxImg = null;
      octx.clearRect(0, 0, overlay.width, overlay.height);
      bigText.textContent = ""; bubble.style.display = "none";
      shotImg.style.display = "none";
      shownURL = null;
    },
    async wait(s) {
      const until = Date.now() + Number(s) * 1000;
      while (Date.now() < until) {
        if (RT.stopFlag) throw "STOP";
        await sleep(50);
      }
    },
  };

  /* ---------------- 실행/정지 ---------------- */
  G.STATEMENT_PREFIX = "await RT.step(%1);\n";
  G.INFINITE_LOOP_TRAP = "RT.loopTrap();\n";
  G.addReservedWords("AI,RT");

  const runButton = document.getElementById("runButton");
  const runLabel = document.getElementById("runLabel");
  const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor;

  document.getElementById("runButton").addEventListener("click", async () => {
    if (runButton.disabled) return;
    RT.stopFlag = false; RT.iter = 0;
    RT.aiCalls = 0; RT.lastAiAt = 0;
    RT.abort = new AbortController();
    logBox.textContent = "";
    RT.clearStage();
    runButton.disabled = true; runLabel.textContent = t("running");
    let code = "";
    try {
      code = G.workspaceToCode(ws);
      document.getElementById("codeView").textContent = code || t("m_noBlocks");
      if (!code.trim()) { log(t("m_assembleFirst")); return; }
      log(t("m_start"));
      const fn = new AsyncFunction("AI", "RT", code);
      await fn(AI, RT);
      log(t("m_done"));
    } catch (e) {
      if (e === "STOP") log(t("m_stopped"));
      else { log(t("m_error") + e); console.error(e, "\n--- code ---\n" + code); }
    } finally {
      ws.highlightBlock(null);
      runButton.disabled = false; runLabel.textContent = t("run");
    }
  });
  document.getElementById("stopButton").addEventListener("click", () => {
    RT.stopFlag = true;
    if (RT.abort) RT.abort.abort();          // 진행 중인 AI 요청 즉시 끊기
    speechSynthesis.cancel();
  });

  /* ---------------- 저장/불러오기 ---------------- */
  document.getElementById("saveButton").addEventListener("click", () => {
    const state = Blockly.serialization.workspaces.save(ws);
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.download = "ai-blocks-" + new Date().toISOString().slice(0, 10) + ".json";
    a.href = URL.createObjectURL(blob);
    a.click();
  });
  document.getElementById("loadButton").addEventListener("click", () =>
    document.getElementById("loadFile").click());
  document.getElementById("loadFile").addEventListener("change", function () {
    const f = this.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = e => {
      try {
        Blockly.serialization.workspaces.load(JSON.parse(e.target.result), ws);
        log(t("m_loaded") + f.name);
      } catch (err) { alert(t("m_readFail") + err); }
    };
    rd.readAsText(f);
    this.value = "";
  });
  </script>
</body>
