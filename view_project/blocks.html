<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="txtTitleTag">블록 코딩 — The Maker</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link href="/fonts/fonts.css" rel="stylesheet">
  <script>
    /* 밝은 곳 모드: 화면이 그려지기 전에 적용해야 깜빡이지 않는다 */
    try { if (localStorage.getItem("vapi-hc") === "1")
            document.documentElement.classList.add("hc"); } catch (e) {}

  <style>
    :root {
      --paper: #fbf7ef; --rule: transparent; --box: #fff;
      --ink: #2a2620; --ink-2: #4a423a;
      --cyan: #1f5f7a; --cyan-d: #17475c;
      --pen-blue: #1f5f7a; --pen-blue-d: #12455c; --pen-red: #b4451c;
      --line: #9a8f7d; --line-d: #4a3f2e; --r: 6px;
    }

    /* ===== 밝은 곳 모드 (설정에서 켠다) =====
       색 토큰만 덮어써서 대비를 끌어올린다. 배치는 그대로다. */
    html.hc {
      --paper:    #fffdf8;
      --box:      #ffffff;
      --ink:      #1a1712;
      --ink-2:    #332d26;
      --cyan:     #114558;
      --cyan-d:   #0c3444;
      --pen-blue: #123f52;
      --pen-blue-d:#0a2c3a;
      --pen-red:  #8f3312;
      --line:     #7a6f5d;
      --line-d:   #2e281c;
    }
    html.hc body { background-image: none; }          /* 배경 무늬 제거 */
    html.hc .sysbar { background: #fffdf6; }
    html.hc select, html.hc input, html.hc button,
    html.hc .panel, html.hc .q, html.hc .card { border-width: 2px; }
    html.hc .panel-head { border-width: 3px; }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
      color: var(--ink); background-color: var(--paper);

      font-family: "Gowun Dodum", "Apple SD Gothic Neo", system-ui, sans-serif;
      padding: var(--sp-2, 8px); gap: var(--sp-2, 8px);
    }
    button, select {
      font-family: inherit; font-size: .95rem; color: var(--ink); background: #fff;
      border: 1.5px solid var(--line); border-radius: var(--r); padding: 7px 14px; cursor: pointer;
    }
    button:hover { border-color: var(--pen-blue); }

    /* 디바이스 HUD */

    .header {
      flex: 0 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      background: var(--box); border: 2px solid var(--line-d); border-radius: 3px;
      box-shadow: 0 1px 0 rgba(44,74,124,.18); padding: 5px 12px;
    }
    .h-title { display: flex; flex-direction: column; }
    .h-title .eyebrow { font-size: 0.82rem; letter-spacing: .14em; color: var(--ink-2); }
    .h-title .title { font-family: "Gowun Batang", serif; font-size: 1.15rem; font-weight: 700; }
    .h-title .title .od { font-size: 0.82rem; color: var(--pen-red); }
    .h-tools {
      margin-left: auto; display: flex; flex-direction: row;
      gap: 8px; align-items: center; flex-wrap: wrap;
    }
    .customIcon { width: 1.2em; margin-right: 6px; text-align: center; font-size: 0.95rem; }
    #runButton { background: var(--pen-blue); border-color: var(--pen-blue); color: #fff; font-weight: 700; }
    #runButton:hover { background: var(--pen-blue-d); }
    #runButton:disabled { background: #b9b7ac; border-color: #b9b7ac; cursor: wait; }
    #stopButton { border-color: var(--pen-red); color: var(--pen-red); font-weight: 700; }
    a.back { font-size: .88rem; color: var(--pen-blue-d); text-decoration: none; margin-right: 4px; }
    a.back:hover { text-decoration: underline; }

    .work {
      flex: 1.25 1 0; min-width: 0; display: flex; flex-direction: column;
      background: var(--box); border: 1.5px solid var(--line); border-radius: var(--r); overflow: hidden;
    }
    /* 문항 상자와 작업 버튼을 한 줄에 둔다 (버튼은 오른쪽 끝) */
    .stage-tools {
      margin: var(--sp-1, 4px) 12px var(--sp-1, 4px) auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .work-tools {
      margin: var(--sp-1, 4px) 12px var(--sp-1, 4px) auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    
    #blocklyDiv { flex: 1 1 auto; min-height: 0; }

    .stage-panel {
      flex: 1 1 0; min-width: 380px; display: flex; flex-direction: column;
      background: var(--box); border: 1.5px solid var(--line); border-radius: var(--r); overflow: hidden;
    }
    .stage-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: var(--sp-2, 8px); display: flex; flex-direction: column; gap: var(--sp-2, 8px); }
    .stage {
      position: relative; width: 100%; aspect-ratio: 4/3; max-height: 60vh;
      background: #191a1f; border: 1.5px solid var(--line-d); border-radius: 4px; overflow: hidden;
      flex: 0 0 auto; align-self: center;
    }
    .stage video, .stage canvas, .stage img.shot {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
    }
    .stage img.shot { display: none; background: #191a1f; }
    #bigText {
      position: absolute; left: 0; right: 0; bottom: 10%; text-align: center;
      font-family: "Gowun Batang", serif; font-size: 2rem; font-weight: 700; color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,.75); padding: 0 12px; word-break: keep-all;
    }
    #bubble {
      position: absolute; top: 10px; left: 10px; max-width: 75%;
      background: #fff; border: 2px solid var(--line-d); border-radius: 12px; border-bottom-left-radius: 2px;
      padding: 8px 14px; font-size: 1rem; display: none;
    }
    .stage-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    
    #logBox {
      flex: 0 0 auto; background: #fdfcf8; border: 1.5px solid var(--line); border-radius: var(--r);
      padding: 8px 12px; font-family: "Menlo","Consolas",ui-monospace,monospace; font-size: 0.82rem;
      max-height: 120px; overflow-y: auto; color: #3a3a42; white-space: pre-wrap;
    }
    #logBox:empty::before { content: "실행하면 진행 상황이 여기에 적혀요."; color: #6b6255; }
    html[lang="en"] #logBox:empty::before { content: "Run your blocks and progress shows up here."; }
    details.codeview { flex: 0 0 auto; }
    details.codeview summary { cursor: pointer; font-family: "Gowun Batang", serif; font-weight: 700; font-size: .9rem; color: var(--ink-2); }
    details.codeview pre {
      margin-top: 6px; background: #fdfcf8; border: 1.5px solid var(--line); border-radius: var(--r);
      padding: 10px; font-size: 0.82rem; max-height: 180px; overflow: auto; white-space: pre-wrap;
    }
    @media (max-width: 900px) {
      body { overflow: auto; height: auto; min-height: 100dvh; }
      .main { flex-direction: column; }
      #blocklyDiv { height: 60vh; }
    }
  </style>
  <link rel="stylesheet" href="/lib/ui.css">
</head>
<body data-density="work">
  <div class="header">
    <div class="h-subject" style="flex-direction:row;align-items:center;gap:10px;">
      <img src="/assets/pibo-prof.png" alt="" style="height:30px;flex:0 0 auto;">
      <span class="title" title="인터넷 없이 내 컴퓨터에서 실행돼요"><span id="txtTitle">블록</span> <span class="od" style="font-size:.78rem;color:var(--pen-red);vertical-align:middle;">(On-Device)</span></span>
    </div>
    <div class="h-tools">
      <button id="langButton" title="한국어 / English" style="min-width:46px;">EN</button>
    </div>
  </div>

  <div class="main-container" data-split="h" data-split-key="blocks">
    <div class="work" data-min="340">
      <div class="panel-head">
        <div class="q"><span class="qnum">1</span><span class="qtext" id="txtWorkHead">블록을 조립해요</span></div>
        <!-- 지금 어느 작품을 고치는 중인지 — 저장하면 이 이름으로 덮어쓴다 -->
        <span id="curFile" style="font-size:.86rem;color:var(--ink-2);margin-left:8px;
              max-width:22ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
        <div class="work-tools">
          <button id="newButton">새로 만들기</button>
          <button id="saveButton">저장</button>
          <button id="loadButton">불러오기</button>
          <input type="file" id="loadFile" accept=".json" style="display:none">
          <button id="runButton"><i class="fa-solid fa-flag" aria-hidden="true"></i> <span id="runLabel">시작</span></button>
          <button id="stopButton">정지</button>
        </div>
      </div>
      <div id="blocklyDiv"></div>
    </div>

    <div class="stage-panel" data-min="360">
      <div class="panel-head">
        <div class="q"><span class="qnum">2</span><span class="qtext" id="txtStageHead">결과를 확인해요</span></div>
        <div class="stage-tools">
          <button id="exampleButton">예제</button>
          <button id="clearButton">지우기</button>
        </div>
      </div>
      <div class="stage-body">
        <div class="stage" id="stage">
          <video id="cam" autoplay playsinline muted></video>
          <img class="shot" id="shotImg" alt="">
          <canvas id="overlay" width="640" height="480"></canvas>
          <div id="bigText"></div>
          <div id="bubble"></div>
        </div>
        <div class="stage-tools">
          <button id="uploadButton">사진 올리기</button>
          <input type="file" id="uploadFile" accept="image/*" style="display:none">
          <span class="hint" id="uploadHint">「업로드한 사진」 블록에서 사용돼요</span>
        </div>
        <div id="varsBox" style="display:none;border:1.5px dashed var(--line);
             border-radius:var(--r);padding:6px 10px;font-size:.82rem;background:#fffdf6;">
          <b id="txtVarsTitle" style="color:var(--ink-2);font-size:0.82rem;">변수 값</b>
          <div id="varsBody" style="font-variant-numeric:tabular-nums;"></div>
        </div>
        <div id="logBox"></div>
        <details class="codeview" id="codeDetails">
          <summary id="txtCodeView">파이썬 코드로 보기</summary>
          <div style="display:flex;gap:6px;margin:6px 0;">
            <button id="pyCopy" style="border:1.5px solid var(--line);background:#fff;
              border-radius:6px;padding:3px 12px;cursor:pointer;font-family:inherit;
              font-size:.82rem;">복사</button>
            <button id="pyOpen" style="border:1.5px solid var(--line);background:#fff;
              border-radius:6px;padding:3px 12px;cursor:pointer;font-family:inherit;
              font-size:.82rem;">파이썬 페이지에서 열기</button>
          </div>
          <pre id="codeView"></pre>
        </details>
      </div>
    </div>
  </div>

      <div id="exList" style="display:flex;flex-direction:column;gap:8px;"></div>
    </div>
  </div>

  const t = k => (I18N[LANG] && I18N[LANG][k] !== undefined) ? I18N[LANG][k] : I18N.ko[k];

  /* =======================================================================
     블록 -> 파이썬 변환
     화면에서 도는 JS 와 별개로, themaker 라이브러리를 쓰는 파이썬을 만든다.
     파이썬 페이지에 붙여넣으면 그대로 돌아간다.
     ======================================================================= */
  const PY = (() => {
    const q = s => "'" + String(s).replace(/\\/g, "\\\\").replace(/'/g, "\\'") + "'";
    let needTime = false, needCam = false;

    /* 값 블록 -> 파이썬 식 */
    function val(block, name, dflt) {
      const t = block.getInputTargetBlock(name);
      if (!t) return dflt;
      return expr(t);
    }
    function field(b, n) { return b.getFieldValue(n); }
    function num(b, n, d) { const t = b.getInputTargetBlock(n); return t ? expr(t) : String(d); }

    /* 이미지 인자 — 안 꽂혀 있으면 방금 찍은 사진을 쓴다 */
    function img(b, name) {
      const t = b.getInputTargetBlock(name);
      if (t) return expr(t);
      needCam = true;
      return "img";
    }

    const E = {
      /* ---- 값 ---- */
      text: b => q(field(b, "TEXT")),
      math_number: b => String(Number(field(b, "NUM")) || 0),
      logic_boolean: b => (field(b, "BOOL") === "TRUE" ? "True" : "False"),
      variables_get: b => pyName(b.getField("VAR").getText()),
      text_join: b => {
        const n = b.inputList.filter(i => i.name.startsWith("ADD")).length;
        const parts = [];
        for (let i = 0; i < n; i++) {
          const v = val(b, "ADD" + i, "''");
          /* 이미 글자면 str() 로 감싸지 않는다 — 코드가 읽기 쉬워진다 */
          parts.push(/^'.*'$/.test(v) ? v : "str(" + v + ")");
        }
        return parts.length ? parts.join(" + ") : "''";
      },
      math_arithmetic: b => {
        const op = { ADD: "+", MINUS: "-", MULTIPLY: "*", DIVIDE: "/", POWER: "**" }[field(b, "OP")] || "+";
        return "(" + val(b, "A", "0") + " " + op + " " + val(b, "B", "0") + ")";
      },
      logic_compare: b => {
        const op = { EQ: "==", NEQ: "!=", LT: "<", LTE: "<=", GT: ">", GTE: ">=" }[field(b, "OP")] || "==";
        return "(" + val(b, "A", "0") + " " + op + " " + val(b, "B", "0") + ")";
      },
      logic_operation: b =>
        "(" + val(b, "A", "False") + (field(b, "OP") === "AND" ? " and " : " or ") + val(b, "B", "False") + ")",
      logic_negate: b => "(not " + val(b, "BOOL", "False") + ")",
      math_random_int: b => { needRandom = true; return "random.randint(" + val(b, "FROM", "1") + ", " + val(b, "TO", "10") + ")"; },
      text_length: b => "len(" + val(b, "VALUE", "''") + ")",
      lists_length: b => "len(" + val(b, "VALUE", "[]") + ")",
      lists_create_with: b => {
        const n = b.inputList.filter(i => i.name.startsWith("ADD")).length;
        const parts = [];
        for (let i = 0; i < n; i++) parts.push(val(b, "ADD" + i, "None"));
        return "[" + parts.join(", ") + "]";
      },
      logic_null: () => "None",
      logic_ternary: b =>
        "(" + val(b, "THEN", "None") + " if " + val(b, "IF", "False") + " else " + val(b, "ELSE", "None") + ")",
      math_single: b => {
        const v = val(b, "NUM", "0"), op = field(b, "OP");
        if (op === "NEG") return "(-" + v + ")";
        if (op === "ABS") return "abs(" + v + ")";
        needMath = true;
        return { ROOT: "math.sqrt", LN: "math.log", LOG10: "math.log10",
                 EXP: "math.exp", POW10: "10 ** " }[op] === "10 ** "
          ? "(10 ** " + v + ")"
          : ({ ROOT: "math.sqrt", LN: "math.log", LOG10: "math.log10", EXP: "math.exp" }[op] || "abs") + "(" + v + ")";
      },
      math_trig: b => {
        needMath = true;
        const v = val(b, "NUM", "0"), op = field(b, "OP").toLowerCase();
        return "math." + op + "(math.radians(" + v + "))";
      },
      math_constant: b => {
        const k = field(b, "CONSTANT");
        if (k === "INFINITY") return "float('inf')";
        needMath = true;
        return { PI: "math.pi", E: "math.e", SQRT2: "math.sqrt(2)",
                 SQRT1_2: "math.sqrt(0.5)", GOLDEN_RATIO: "((1 + math.sqrt(5)) / 2)" }[k] || "math.pi";
      },
      math_number_property: b => {
        const v = val(b, "NUMBER_TO_CHECK", "0"), k = field(b, "PROPERTY");
        if (k === "EVEN") return "(" + v + " % 2 == 0)";
        if (k === "ODD") return "(" + v + " % 2 == 1)";
        if (k === "POSITIVE") return "(" + v + " > 0)";
        if (k === "NEGATIVE") return "(" + v + " < 0)";
        if (k === "DIVISIBLE_BY") return "(" + v + " % " + val(b, "DIVISOR", "1") + " == 0)";
        return "(" + v + " == int(" + v + "))";
      },
      math_round: b => {
        const v = val(b, "NUM", "0"), k = field(b, "OP");
        if (k === "ROUNDUP") { needMath = true; return "math.ceil(" + v + ")"; }
        if (k === "ROUNDDOWN") { needMath = true; return "math.floor(" + v + ")"; }
        return "round(" + v + ")";
      },
      math_on_list: b => {
        const v = val(b, "LIST", "[]");
        return { SUM: "sum", MIN: "min", MAX: "max" }[field(b, "OP")]
          ? ({ SUM: "sum", MIN: "min", MAX: "max" }[field(b, "OP")]) + "(" + v + ")"
          : "(sum(" + v + ") / len(" + v + "))";
      },
      math_modulo: b => "(" + val(b, "DIVIDEND", "0") + " % " + val(b, "DIVISOR", "1") + ")",
      math_constrain: b =>
        "min(max(" + val(b, "VALUE", "0") + ", " + val(b, "LOW", "0") + "), " + val(b, "HIGH", "100") + ")",
      math_random_float: () => { needRandom = true; return "random.random()"; },
      text_isEmpty: b => "(len(" + val(b, "VALUE", "''") + ") == 0)",
      text_indexOf: b =>
        "(" + val(b, "VALUE", "''") + ".find(" + val(b, "FIND", "''") + ") + 1)",
      text_charAt: b => {
        const v = val(b, "VALUE", "''"), w = field(b, "WHERE");
        if (w === "FIRST") return v + "[0]";
        if (w === "LAST") return v + "[-1]";
        return v + "[" + val(b, "AT", "1") + " - 1]";
      },
      text_getSubstring: b =>
        val(b, "STRING", "''") + "[" + val(b, "AT1", "1") + " - 1:" + val(b, "AT2", "1") + "]",
      text_changeCase: b => {
        const v = val(b, "TEXT", "''");
        return v + "." + ({ UPPERCASE: "upper", LOWERCASE: "lower", TITLECASE: "title" }[field(b, "CASE")] || "upper") + "()";
      },
      text_trim: b => val(b, "TEXT", "''") + "." +
        ({ LEFT: "lstrip", RIGHT: "rstrip", BOTH: "strip" }[field(b, "MODE")] || "strip") + "()",
      lists_isEmpty: b => "(len(" + val(b, "VALUE", "[]") + ") == 0)",
      lists_repeat: b => "([" + val(b, "ITEM", "None") + "] * " + val(b, "NUM", "1") + ")",
      lists_indexOf: b => "(" + val(b, "VALUE", "[]") + ".index(" + val(b, "FIND", "None") + ") + 1)",
      lists_getIndex: b => {
        const v = val(b, "VALUE", "[]"), w = field(b, "WHERE");
        if (w === "RANDOM") { needRandom = true; return "random.choice(" + v + ")"; }
        if (w === "FIRST") return v + "[0]";
        if (w === "LAST") return v + "[-1]";
        return v + "[" + val(b, "AT", "1") + " - 1]";
      },
      lists_getSublist: b =>
        val(b, "LIST", "[]") + "[" + val(b, "AT1", "1") + " - 1:" + val(b, "AT2", "1") + "]",
      lists_split: b => {
        const v = val(b, "INPUT", "''");
        return field(b, "MODE") === "SPLIT"
          ? v + ".split(" + val(b, "DELIM", "','") + ")"
          : val(b, "DELIM", "','") + ".join(" + v + ")";
      },
      lists_sort: b => "sorted(" + val(b, "LIST", "[]") + ")",

      /* ---- 사진 가져오기 ---- */
      ai_depth_map: b => "vision('depth', " + img(b, "IMG") + ", place=" + q(field(b, "PLACE")) + ")",
      ai_depth_at: b => "depth_at(" + img(b, "IMG") + ", " + num(b, "X", 0) + ", " + num(b, "Y", 0)
                        + ", " + q(field(b, "PLACE")) + ")",
      ai_capture: () => "camera()",
      ai_upload: () => "load('사진.jpg')",

      /* ---- AI 로 보기 ---- */
      ai_objects: b => "names_of(vision('object', " + img(b, "IMG") + "))",
      ai_custom: b => "first_name(vision('my:" + field(b, "MODEL") + "', " + img(b, "IMG") + "))",
      ai_detect_file: b =>
        "first_name(detect(" + q(field(b, "FILE")) + ", " + img(b, "IMG") + "))",
      ai_face: b => {
        const w = field(b, "WHAT");
        if (w === "dir") return "first_of(vision('distance', " + img(b, "IMG") + "), 'direction')";
        return "first_of(vision('face_attr', " + img(b, "IMG") + "), " + q(w) + ")";
      },
      ai_face_count: b => "len(vision('face', " + img(b, "IMG") + "))",
      ai_hand: b => "first_of(vision('hand', " + img(b, "IMG") + "), 'gesture')",
      ai_face_dist: b => "first_of(vision('distance', " + img(b, "IMG") + "), 'distance')",
      ai_ocr: b => "texts_of(vision('ocr', " + img(b, "IMG") + "))",
      ai_qr: b => "first_of(vision('qr', " + img(b, "IMG") + "), 'data')",
      ai_chat: b => "chat(" + val(b, "Q", "''") + ")",
      ai_ask: b => "vision('look', " + img(b, "IMG") + ", prompt=" + val(b, "Q", "''") + ")['answer']",
      ai_transform: b =>
        "vision(" + q(pick(M_TRANS, field(b, "KIND"))) + ", " + img(b, "IMG") + ")",
      ai_listen: b => "listen(" + field(b, "SEC") + ")",

      /* ---- 사진 편집 (아홉 칸) ---- */
      ed_resize: b => "resize(" + img(b, "IMG") + ", " + num(b, "F", 2) + ")",
      ed_rotate: b => "rotate(" + img(b, "IMG") + ", " + num(b, "DEG", 90) + ")",
      ed_flip: b => "flip(" + img(b, "IMG") + ", " + q(pick(M_FLIP, field(b, "DIR"), "h")) + ")",
      ed_crop: b => "crop(" + img(b, "IMG") + ", " + q(pick(M_CROP, field(b, "PART"), "mc")) + ")",
      ed_merge: b => "attach(" + img(b, "A") + ", " + img(b, "B") + ", " +
        q(pick(M_MERGE, field(b, "DIR"), "h")) + ")",
      ed_overlay: b => "put_on(" + img(b, "A") + ", " + img(b, "B") + ", " +
        q(pick(M_SIZE, field(b, "SIZE"), "half")) + ", " + q(field(b, "POS")) + ")",
      ed_tone: b => "adjust(" + img(b, "IMG") + ", " + q(field(b, "WHAT")) + ", " + num(b, "V", 0) + ")",
      ed_filter: b => "img_filter(" + img(b, "IMG") + ", " + q(field(b, "F")) + ")",
      ed_text: b => "draw_text(" + img(b, "IMG") + ", " + val(b, "TXT", "''") + ", " +
        q(field(b, "POS")) + ", " + num(b, "SIZE", 40) + ", " + q(colName(field(b, "COL"))) + ")",
      ed_text_rot: b => "draw_text(" + img(b, "IMG") + ", " + val(b, "TXT", "''") + ", " +
        q(field(b, "POS")) + ", 44, 'black', " + num(b, "DEG", 0) + ")",
      ed_rect: b => "draw_rect(" + img(b, "IMG") + ", " + q(field(b, "POS")) + ", " +
        q(pick(M_FILL, field(b, "FILL"), "line")) + ", " + q(colName(field(b, "COL"))) + ")",
      ed_circle: b => "draw_circle(" + img(b, "IMG") + ", " + q(field(b, "POS")) + ", " +
        q(pick(M_FILL, field(b, "FILL"), "line")) + ", " + q(colName(field(b, "COL"))) + ")",
      ed_line: b => "draw_line(" + img(b, "IMG") + ", " + q(field(b, "P1")) + ", " +
        q(field(b, "P2")) + ", " + q(colName(field(b, "COL"))) + ")",
      ed_size_of: b => "size_of(" + img(b, "IMG") + ", " + q(pick(M_WH, field(b, "WHAT"), "w")) + ")",
      ed_color_at: b => "color_at(" + img(b, "IMG") + ", " + q(field(b, "POS")) + ")",
      ed_main_color: b => "main_color(" + img(b, "IMG") + ")",
      ed_crop_detected: b => {
        if (!hasResult) { needCam = true; return "crop_found(img, vision('face', img))"; }
        return "crop_found(" + lastShown + ", r)";
      },
      ed_sticker: b => "put_sticker(" + img(b, "A") + ", " + img(b, "B") + ")",

      /* ---- 사진 편집 (좌표) ---- */
      edx_crop: b => "crop_xy(" + img(b, "IMG") + ", " + num(b, "X", 0) + ", " + num(b, "Y", 0) +
        ", " + num(b, "W", 100) + ", " + num(b, "H", 100) + ")",
      edx_text: b => "draw_text_xy(" + img(b, "IMG") + ", " + val(b, "TXT", "''") + ", " +
        num(b, "X", 20) + ", " + num(b, "Y", 20) + ", " + num(b, "SIZE", 40) + ", " +
        q(colName(field(b, "COL"))) + ", " + num(b, "DEG", 0) + ")",
      edx_rect: b => "draw_rect_xy(" + img(b, "IMG") + ", " + num(b, "X", 0) + ", " + num(b, "Y", 0) +
        ", " + num(b, "W", 100) + ", " + num(b, "H", 100) + ", " +
        q(pick(M_FILL, field(b, "FILL"), "line")) + ", " + q(colName(field(b, "COL"))) + ")",
      edx_circle: b => "draw_circle_xy(" + img(b, "IMG") + ", " + num(b, "X", 100) + ", " +
        num(b, "Y", 100) + ", " + num(b, "R", 50) + ", " +
        q(pick(M_FILL, field(b, "FILL"), "line")) + ", " + q(colName(field(b, "COL"))) + ")",
      edx_line: b => "draw_line_xy(" + img(b, "IMG") + ", " + num(b, "X1", 0) + ", " + num(b, "Y1", 0) +
        ", " + num(b, "X2", 100) + ", " + num(b, "Y2", 100) + ", " + q(colName(field(b, "COL"))) + ")",
      edx_overlay: b => "put_on_xy(" + img(b, "A") + ", " + img(b, "B") + ", " +
        num(b, "X", 0) + ", " + num(b, "Y", 0) + ", " + num(b, "S", 1) + ")",
      edx_color: b => "color_at_xy(" + img(b, "IMG") + ", " + num(b, "X", 0) + ", " + num(b, "Y", 0) + ")",
    };

    /* 블록이 쓰는 값 -> themaker 가 받는 값. 이름이 서로 다르므로 여기서 옮긴다. */
    const M_FLIP  = { flipH: "h", flipV: "v" };
    const M_MERGE = { sideH: "h", sideV: "v" };
    const M_CROP  = { center: "mc", left: "ml", right: "mr", top: "tc", bottom: "bc" };
    const M_SIZE  = { small: "small", mid: "half", big: "big" };
    const M_FILL  = { fill: "fill", hollow: "line" };
    const M_WH    = { width: "w", height: "h" };
    const M_NOTE  = { "262": "도", "294": "레", "330": "미", "349": "파",
                      "392": "솔", "440": "라", "494": "시", "523": "높은도" };
    /* 블록의 효과음 10종 -> themaker 의 4종에서 가장 가까운 것 */
    const M_BEEP  = { beepOk: "ok", beepNo: "error", sndSiren: "buzz", sndLaser: "ding",
                      sndCoin: "ding", sndJump: "ding", sndDrum: "buzz", sndClap: "ok",
                      sndChime: "ding", sndFanfare: "ok" };
    /* 인식 종류 -> vision() 기능 이름 */
    const M_MODE  = { face: "face", hand: "hand", dist: "distance", objects: "object",
                      ocr: "ocr", qr: "qr" };
    const M_TRANS = { portrait: "bg_remove", sr: "sr" };   // 깊이 지도는 ai_depth_map 이 따로 낸다
    const pick = (map, v, dflt) => map[v] || dflt || v;
    let needRandom = false, needMath = false;

    /* 블록의 색은 #rrggbb 로 온다 — themaker 가 아는 이름으로 바꾼다 */
    function colName(hex) {
      const map = { "#e0342e": "red", "#1f5f7a": "blue", "#f4c522": "yellow",
                    "#2fa35c": "green", "#ffffff": "white", "#26262e": "black" };
      const k = String(hex || "").toLowerCase();
      return map[k] || (k.startsWith("#") ? k : (k || "red"));   // 모르는 색은 #코드 그대로
    }

    function pyName(name) {
      const s = String(name).trim().replace(/[^\wㄱ-ㅎ가-힣]/g, "_");
      return /^[0-9]/.test(s) ? "v_" + s : (s || "x");
    }

    function expr(b) {
      const f = E[b.type];
      if (f) return f(b);
      return "None  # " + b.type + " (파이썬에 아직 없어요)";
    }

    /* ---- 문장 블록 ---- */
    function stmt(b, ind) {
      const p = " ".repeat(ind);
      const out = [];
      const T = b.type;

      if (T === "ai_detect_draw") {
        hasResult = true;
        lastShown = img(b, "IMG");
        out.push(p + "r = vision(" + q(pick(M_MODE, field(b, "MODE"))) + ", " + lastShown + ")");
        out.push(p + "show(" + lastShown + ", r)");
      } else if (T === "st_say") {
        out.push(p + "speak(" + val(b, "TEXT", "''")
                 + voiceArg(field(b, "V"), field(b, "S")) + ")");
      } else if (T === "st_show_image") {
        lastShown = img(b, "IMG");         // 무대에 보인 것을 기억 (저장·박스가 이걸 쓴다)
        out.push(p + "show(" + lastShown + ")");
      } else if (T === "st_boxes") {
        if (hasResult) {
          out.push(p + "show(" + lastShown + ", r)");
        } else {                          // 앞에서 인식한 적이 없으면 여기서 한 번 한다
          needCam = true;
          out.push(p + "r = vision('object', img)");
          out.push(p + "show(img, r)");
        }
      } else if (T === "flag_event") {
        return "";                       // 시작 모자는 표시용 — 파이썬 코드로 남기지 않는다
      } else if (T === "st_clear") {
        return "";                       // 파이썬에는 화면 칸이 없다 — 조용히 건너뛴다
      } else if (T === "st_save_stage") {
        out.push(p + "save(" + img(b, "IMG") + ", 'themaker.jpg')");
      } else if (T === "st_wait") {
        needTime = true;
        out.push(p + "time.sleep(" + num(b, "SEC", 1) + ")");
      } else if (T === "st_note") {
        out.push(p + "play_note(" + q(pick(M_NOTE, field(b, "N"), "도")) + ", " + num(b, "B", 1) + ")");
      } else if (T === "st_beep") {
        out.push(p + "beep(" + q(pick(M_BEEP, field(b, "K"), "ok")) + ")");
      } else if (T === "st_melody") {
        out.push(p + "play_melody(" + val(b, "M", "''") + ", " + field(b, "T") + ")");
      } else if (T === "st_freq") {
        out.push(p + "play_hz(" + num(b, "F", 440) + ", " + num(b, "S", 0.5) + ")");
      } else if (T === "ev_wait_face") {
        needTime = true;
        out.push(p + "while not vision('face', camera()):");
        out.push(p + "    time.sleep(0.3)");
      } else if (T === "ev_wait_hand") {
        needTime = true;
        out.push(p + "while first_of(vision('hand', camera()), 'gesture_en') != " + q(field(b, "G")) + ":");
        out.push(p + "    time.sleep(0.3)");
      } else if (T === "ev_wait_custom") {
        needTime = true;
        out.push(p + "while first_name(vision('my:" + field(b, "MODEL") + "', camera())) != " +
                 val(b, "LABEL", "''") + ":");
        out.push(p + "    time.sleep(0.3)");
      } else if (T === "controls_repeat_ext" || T === "controls_repeat") {
        const n = b.getInputTargetBlock("TIMES") ? val(b, "TIMES", "5") : (field(b, "TIMES") || "5");
        out.push(p + "for i in range(" + n + "):");
        out.push(body(b, "DO", ind + 4, p));
      } else if (T === "controls_whileUntil") {
        const cond = val(b, "BOOL", "True");
        out.push(p + "while " + (field(b, "MODE") === "UNTIL" ? "not " + cond : cond) + ":");
        out.push(body(b, "DO", ind + 4, p));
      } else if (T === "controls_if") {
        let n = 0;
        while (b.getInput("IF" + n)) {
          out.push(p + (n === 0 ? "if " : "elif ") + val(b, "IF" + n, "False") + ":");
          out.push(body(b, "DO" + n, ind + 4, p));
          n++;
        }
        if (b.getInput("ELSE")) {
          out.push(p + "else:");
          out.push(body(b, "ELSE", ind + 4, p));
        }
      } else if (T === "controls_forEach") {
        out.push(p + pyName(b.getField("VAR").getText()) + " = None");
        out.push(p + "for " + pyName(b.getField("VAR").getText()) + " in " + val(b, "LIST", "[]") + ":");
        out.push(body(b, "DO", ind + 4, p));
      } else if (T === "variables_set") {
        out.push(p + pyName(b.getField("VAR").getText()) + " = " + val(b, "VALUE", "None"));
      } else if (T === "math_change") {
        const v = pyName(b.getField("VAR").getText());
        out.push(p + v + " = " + v + " + " + val(b, "DELTA", "1"));
      } else if (T === "controls_flow_statements") {
        out.push(p + (field(b, "FLOW") === "BREAK" ? "break" : "continue"));
      } else if (T === "controls_for") {
        const v = pyName(b.getField("VAR").getText());
        out.push(p + "for " + v + " in range(" + val(b, "FROM", "1") + ", "
                 + val(b, "TO", "10") + " + 1, " + val(b, "BY", "1") + "):");
        out.push(body(b, "DO", ind + 4, p));
      } else if (T === "text_print") {
        out.push(p + "print(" + val(b, "TEXT", "''") + ")");
      } else if (T === "text_append") {
        const v = pyName(b.getField("VAR").getText());
        out.push(p + v + " = str(" + v + ") + str(" + val(b, "TEXT", "''") + ")");
      } else if (T === "lists_setIndex") {
        const L = val(b, "LIST", "[]"), w = field(b, "WHERE"), it = val(b, "TO", "None");
        const idx = w === "FIRST" ? "0" : w === "LAST" ? "-1" : val(b, "AT", "1") + " - 1";
        if (field(b, "MODE") === "INSERT") out.push(p + L + ".insert(" + idx + ", " + it + ")");
        else out.push(p + L + "[" + idx + "] = " + it);
      } else {
        out.push(p + "# " + T + " (파이썬에 아직 없어요)");
      }
      return out.join("\n");
    }

    let lastShown = "img";                 // 무대에 마지막으로 보인 사진
    let hasResult = false;                 // r(인식 결과) 이 만들어졌는지
    /* speak() 의 기본값과 같으면 인자를 생략한다 — 코드가 짧아야 읽힌다 */
    function voiceArg(voice, speedKey) {
      const speed = RT_SPEED[speedKey] || 1.05;
      const parts = [];
      if (voice && voice !== "F1") parts.push("voice='" + voice + "'");
      if (Math.abs(speed - 1.05) > 0.01) parts.push("speed=" + speed);
      return parts.length ? ", " + parts.join(", ") : "";
    }

    function body(b, name, ind, p) {
      const first = b.getInputTargetBlock(name);
      if (!first) return p + "    pass";
      return chain(first, ind);
    }

    function chain(b, ind) {
      const lines = [];
      let cur = b;
      while (cur) {
        const one = stmt(cur, ind);
        if (one !== "") lines.push(one);   // 파이썬에 없는 블록은 줄을 만들지 않는다
        cur = cur.getNextBlock();
      }
      return lines.join("\n");
    }

    return {
      generate(workspace) {
        needTime = false; needCam = false; needRandom = false; needMath = false;
        lastShown = "img"; hasResult = false;
        const tops = workspace.getTopBlocks(true).filter(b => !b.outputConnection);
        const bodyLines = tops.map(b => chain(b, 0)).filter(s => s.trim()).join("\n");
        if (!bodyLines.trim()) return "from themaker import *\n\n# 블록을 조립해 보세요\n";

        const head = ["from themaker import *"];
        if (needTime) head.push("import time");
        if (needRandom) head.push("import random");
        if (needMath) head.push("import math");
        head.push("");

        /* 도우미는 실제로 쓴 것만 — 안 쓰는 함수가 붙으면 코드가 길어 보인다 */
        const used = [];
        const wanted = HELP_ORDER.filter(name => new RegExp("\\b" + name + "\\s*\\(").test(bodyLines));
        for (const name of HELP_ORDER) {
          if (wanted.includes(name) ||
              (name === "first_of" && (wanted.includes("first_name")))) used.push(name);
        }
        if (used.length) {
          head.push(used.map(n => HELPERS[n].trim()).join("\n\n"));
          head.push("");
        }
        if (needCam) { head.push("img = camera()          # 사진 한 장"); head.push(""); }
        return head.join("\n") + bodyLines + "\n";
      },
    };
  })();

  /* 블록이 쓰는 편의 기능 — 만든 코드에 필요한 것만 함께 넣는다 */
  const HELP_ORDER = ["first_of", "first_name", "names_of", "texts_of"];
  const HELPERS = {
    first_of: `
def first_of(result, key, default=""):
    """인식 결과에서 첫 번째 것의 값 하나만 꺼내요."""
    items = result.get("object", result) if isinstance(result, dict) else result
    if isinstance(items, list) and items:
        return items[0].get(key, default)
    return default
`,
    first_name: `
def first_name(result):
    """첫 번째로 찾은 것의 이름."""
    return first_of(result, "name")
`,
    names_of: `
def names_of(result):
    """찾은 것들의 이름 목록."""
    items = []
    if isinstance(result, dict):
        for val in result.values():
            if isinstance(val, list):
                items += val
    elif isinstance(result, list):
        items = result
    return [it.get("name", "") for it in items if isinstance(it, dict)]
`,
    texts_of: `
def texts_of(result):
    """읽은 글자들을 한 줄로."""
    return " ".join(it.get("text", "") for it in result if isinstance(it, dict))
`,
  };

  const RT_SPEED = { slow: 0.85, normal: 1.05, fast: 1.35 };
  const RPS = { ko: ["가위", "바위", "보"], en: ["scissors", "rock", "paper"] };

  /* ---------------- 내가 만든 AI 목록 (드롭다운 소스) ---------------- */
  let CUSTOM_MODELS = [];
  async function loadCustomModels() {
    try {
      const j = await (await fetch("/custom/models")).json();
      if (j.result === "ok" && Array.isArray(j.data)) CUSTOM_MODELS = j.data;
    } catch (e) { /* 목록이 없어도 나머지 블록은 정상 동작 */ }
  }

  /* 가져다 둔 모델 파일 목록 — 폴더에 넣기만 하면 드롭다운에 나온다 */
  let MODEL_FILES = [];
  async function loadModelFiles() {
    try {
      const j = await (await fetch("/object/model_files")).json();
      if (j.result === "ok" && Array.isArray(j.data.files)) MODEL_FILES = j.data.files;
    } catch (e) { /* 폴더가 없어도 나머지 블록은 정상 동작 */ }
  }

  /* ---------------- 커스텀 블록 정의 ---------------- */
  /* 색은 hex 로 직접 정한다. 예전에는 숫자 색조(hue)만 줬는데, Blockly 가 거기에
     기본 채도 0.45·명도 0.65 를 곱해 어둡게 눌러 버려 교실 화면이 칙칙했다.
     아래 값이 그대로 블록 색이 되고, 툴박스 칩도 같은 값을 쓴다.
     흰 글씨가 얹히므로 너무 옅게 가지 않는다 — 명도를 더 올리려면 글씨 대비부터 볼 것. */
  /* 파이보 랩(pibo-lab)·실물 파이보 IDE 의 'modest' 테마와 색을 맞춘다 —
     세 제품이 한 브랜드로 보이게 하려는 것이고, 아이가 시뮬에서 실물로 넘어갈 때
     같은 색의 같은 블록을 보게 된다. 값을 바꾸려면 세 곳을 함께 고칠 것. */
  const B_LOGIC = "#B098CB",   // 논리
        B_LOOP  = "#85B687",   // 반복
        B_MATH  = "#2196F3",   // 수학
        B_TEXT  = "#FFAA08",   // 텍스트
        B_LIST  = "#4DB6AC",   // 목록
        B_VAR   = "#EF9A9A",   // 변수
        B_FUNC  = "#C7BCB8";   // 함수
  /* 커스텀 묶음도 파이보 쪽 color_type 표에서 가져온다 (device·motion·speech…) */
  const C_AI    = "#6E92B7",   // AI 인식      (파이보 recognition)
        C_VLM   = "#8dc3d2",   // AI 언어      (파이보 speech)
        C_JUDGE = "#a39c7D",   // (예비)       (파이보 vision)
        C_SOUND = "#7dc37D",   // 소리         (파이보 audio)
        C_EVENT = "#E5B900";   // 이벤트       (파이보 start)
  /* 이미지 계열 — 예전엔 세 카테고리가 C_EDIT 하나를 함께 써서 구분이 안 됐다. */
  const C_IMG   = "#8da2c3",   // 이미지        (파이보 oled)
        C_EDIT  = "#d3b28d",   // 이미지 바꾸기 (파이보 device)
        C_DRAW  = "#CC9988",   // 이미지 그리기 (파이보 utils)
        C_EDITX = "#d38d62";   // 이미지(좌표)  (파이보 motion)
  const IMG = { type: "input_value", name: "IMG", check: "String" };
  const opt = keys => keys.map(k => [t("o_" + k), k]);
  const POS9 = () => opt(["tl", "tc", "tr", "ml", "mc", "mr", "bl", "bc", "br"]);
  const EDCOLORS = () => [
    [t("o_cRed"), "#e0342e"], [t("o_cBlue"), "#1f5f7a"], [t("o_cYellow"), "#f4c522"],
    [t("o_cGreen"), "#2fa35c"], [t("o_cWhite"), "#ffffff"], [t("o_cBlack"), "#26262e"],
    [t("o_cCyan"), "#1f5f7a"]];

  function defineBlocks() {
    Blockly.defineBlocksWithJsonArray([
      /* 시작 블록 — 위에 붙일 자리가 없어(previousStatement 없음) 모자로 그려진다.
         disable-top-blocks 플러그인이 이 모자에 매달리지 않은 덩어리를 꺼 버리므로,
         여기에 붙은 것만 실행된다. 파이보 랩·실물 파이보 IDE 의 flag_event 와 같은 이름. */
      { type: "flag_event", message0: "%1 " + t("b_flag"), nextStatement: null,
        args0: [{ type: "field_image", src: "/assets/svg/flag-solid.svg",
                  width: 22, height: 22, alt: "flag" }],
        inputsInline: true, colour: C_EVENT, tooltip: t("b_flag_tip") },
      // 입력
      { type: "ai_capture", message0: t("b_capture"), output: "String", colour: C_IMG,
        tooltip: t("b_capture_tip") },
      { type: "ai_upload", message0: t("b_upload"), output: "String", colour: C_IMG,
        tooltip: t("b_upload_tip") },
      // AI 인식
      { type: "ai_detect_draw", message0: t("b_detect_draw"),
        previousStatement: null, nextStatement: null, colour: C_AI,
        args0: [ IMG, { type: "field_dropdown", name: "MODE", options: opt(
          ["face","hand","dist","objects","ocr","qr"]) } ],
        tooltip: t("b_detect_draw_tip") },
      { type: "ai_objects", message0: t("b_objects"), output: "Array", colour: C_AI,
        args0: [ IMG ], tooltip: t("b_objects_tip") },
      /* --- 사진 편집 (브라우저 canvas — 서버 불필요) --- */
      { type: "ed_resize", message0: t("b_resize"), output: "String", colour: C_EDIT,
        args0: [ IMG, { type: "input_value", name: "F", check: "Number" } ],
        inputsInline: true, tooltip: t("b_resize_tip") },
      { type: "ed_rotate", message0: t("b_rotate"), output: "String", colour: C_EDIT,
        args0: [ IMG, { type: "input_value", name: "DEG", check: "Number" } ],
        inputsInline: true, tooltip: t("b_rotate_tip") },
      { type: "ed_flip", message0: t("b_flip"), output: "String", colour: C_EDIT,
        args0: [ IMG, { type: "field_dropdown", name: "DIR",
          options: () => opt(["flipH", "flipV"]) } ],
        inputsInline: true },
      { type: "ed_crop", message0: t("b_crop"), output: "String", colour: C_EDIT,
        args0: [ IMG, { type: "field_dropdown", name: "PART",
          options: () => opt(["center", "left", "right", "top", "bottom"]) } ],
        inputsInline: true, tooltip: t("b_crop_tip") },
      { type: "ed_merge", message0: t("b_merge"), output: "String", colour: C_EDIT,
        args0: [ { type: "input_value", name: "A", check: "String" },
                 { type: "input_value", name: "B", check: "String" },
                 { type: "field_dropdown", name: "DIR",
                   options: () => opt(["sideH", "sideV"]) } ],
        inputsInline: true, tooltip: t("b_merge_tip") },
      { type: "ed_overlay", message0: t("b_overlay"), output: "String", colour: C_EDIT,
        args0: [ { type: "input_value", name: "A", check: "String" },
                 { type: "input_value", name: "B", check: "String" },
                 { type: "field_dropdown", name: "SIZE",
                   options: () => opt(["small", "mid", "big"]) },
                 { type: "field_dropdown", name: "POS", options: () => POS9() } ],
        inputsInline: true, tooltip: t("b_overlay_tip") },
      { type: "ed_tone", message0: t("b_tone"), output: "String", colour: C_EDIT,
        args0: [ IMG, { type: "field_dropdown", name: "WHAT",
                   options: () => opt(["bright", "contrast", "saturate"]) },
                 { type: "input_value", name: "V", check: "Number" } ],
        inputsInline: true, tooltip: t("b_tone_tip") },
      { type: "ed_filter", message0: t("b_filter"), output: "String", colour: C_EDIT,

  function makeTheme() {

          logic_blocks:     { colourPrimary: B_LOGIC, colourSecondary: "#EDE7F6", colorTertiary: "#B39DDB" },
          loop_blocks:      { colourPrimary: B_LOOP,  colourSecondary: "#E8F5E9", colorTertiary: "#66BB6A" },
          math_blocks:      { colourPrimary: B_MATH,  colourSecondary: "#1E88E5", colorTertiary: "#0D47A1" },
          text_blocks:      { colourPrimary: B_TEXT,  colourSecondary: "#555555", colorTertiary: "#FF8F00" },
          list_blocks:      { colourPrimary: B_LIST,  colourSecondary: "#B2DFDB", colorTertiary: "#009688" },
          colour_blocks:    { colourPrimary: "#DFADB2", colourSecondary: "#FFEBEE", colorTertiary: "#EF9A9A" },
          variable_blocks:  { colourPrimary: B_VAR,   colourSecondary: "#EF9A9A", colorTertiary: "#EF5350" },
          variable_dynamic_blocks: { colourPrimary: B_VAR, colourSecondary: "#EF9A9A", colorTertiary: "#EF5350" },
          procedure_blocks: { colourPrimary: B_FUNC,  colourSecondary: "#EFEBE9", colorTertiary: "#BCAAA4" },
        },
        componentStyles: {
          workspaceBackgroundColour: "#fbf7ef",   // 화면과 같은 따뜻한 종이색
          toolboxBackgroundColour: "#f3efe4",
          flyoutBackgroundColour: "#efe9db",
          flyoutOpacity: 0.5,
          insertionMarkerOpacity: 0.5,
          scrollbarOpacity: 0.5,
          selectedGlowColour: "#000000",
          selectedGlowSize: 0.5,
          replacementGlowColour: "#000000",
        },
      });
    } catch (e) {
      console.warn("[blocks] 테마를 못 만들어 기본 색으로 갑니다:", e);
      return undefined;

  /* Blockly serialization JSON. 문구는 t() 로 채워 한/영을 따른다. */
  function EXAMPLES() {
    const B = (type, extra) => Object.assign({ type: type }, extra || {});
    const shadowNum = v => ({ shadow: { type: "math_number", fields: { NUM: v } } });
    const shadowTxt = v => ({ shadow: { type: "text", fields: { TEXT: v } } });
    const chain = arr => {                       // 순차 블록 연결
      for (let i = arr.length - 1; i > 0; i--) arr[i - 1].next = { block: arr[i] };
      return arr[0];
    };
    /* 예제의 맨 바깥 줄기에만 [시작] 모자를 얹는다. chain() 은 반복·만약 안쪽
       줄기에도 쓰이는데, 모자는 문장 입력 안에 못 들어가 거기 얹으면 예제가 깨진다. */
    const top = arr => chain([B("flag_event")].concat(arr));
    const CLEAR = () => B("st_clear");           // 모든 예제는 무대를 지우고 시작한다
    const VG = n => B("variables_get", { fields: { VAR: { name: n } } });
    const SET = (n, blk) => B("variables_set",
      { fields: { VAR: { name: n } }, inputs: { VALUE: { block: blk } } });
    const PR = blk => B("text_print", { inputs: { TEXT: { block: blk } } });
    return [
      { id: "greet", name: t("ex_greet"), desc: t("ex_greet_d"),
        state: { blocks: { languageVersion: 0, blocks: [ top([
          CLEAR(),
          B("ev_wait_face"),
          B("st_say", { inputs: { TEXT: shadowTxt(t("sh_hello")) } }),
          B("st_beep", { fields: { K: "beepOk" } }),
        ]) ] } } },
      { id: "rps", name: t("ex_rps"), desc: t("ex_rps_d"),
        state: { blocks: { languageVersion: 0, blocks: [ top([
          CLEAR(),
          B("st_say", { inputs: { TEXT: shadowTxt(t("o_rps") + "!") } }),
          B("st_wait", { inputs: { SEC: shadowNum(1) } }),
          /* 손 모양으로 낸다 — 브이=가위, 주먹=바위, 손바닥=보.
             컴퓨터는 목록에서 무작위로 고르고, 승패는 [만약]·[그리고]·[=] 로 직접 짠다. */
          B("variables_set", { fields: { VAR: { name: "나" } },
            inputs: { VALUE: { block: B("ai_hand",
              { inputs: { IMG: { block: B("ai_capture") } } }) } } }),
          B("variables_set", { fields: { VAR: { name: "컴퓨터" } },
            inputs: { VALUE: { block: B("lists_getIndex",
              { fields: { MODE: "GET", WHERE: "RANDOM" },
                inputs: { VALUE: { block: B("lists_create_with", {
                  extraState: { itemCount: 3 },
                  inputs: { ADD0: shadowTxt(t("g_Victory")),
                            ADD1: shadowTxt(t("g_Closed_Fist")),
                            ADD2: shadowTxt(t("g_Open_Palm")) } }) } } }) } } }),
          PR(B("variables_get", { fields: { VAR: { name: "컴퓨터" } } })),
          B("controls_if", { extraState: { hasElse: true },
            inputs: {
              IF0: { block: B("logic_operation", { fields: { OP: "AND" },
                inputs: {
                  A: { block: B("logic_compare", { fields: { OP: "EQ" }, inputs: {
                    A: { block: B("variables_get", { fields: { VAR: { name: "나" } } }) },
                    B: shadowTxt(t("g_Victory")) } }) },
                  B: { block: B("logic_compare", { fields: { OP: "EQ" }, inputs: {
                    A: { block: B("variables_get", { fields: { VAR: { name: "컴퓨터" } } }) },
                    B: shadowTxt(t("g_Open_Palm")) } }) } } }) },
              DO0: { block: chain([
                B("st_say", { inputs: { TEXT: shadowTxt(t("sh_win")) } }),
                B("st_beep", { fields: { K: "sndFanfare" } }),
              ]) },
              ELSE: { block: B("st_beep", { fields: { K: "beepNo" } }) },
            } }),
        ]) ] } } },
      /* 내가 가르친 AI 로 분류하기 — [가르치기]에서 학습한 모델을 쓴다 */
      { id: "mymodel", name: t("ex_mymodel"), desc: t("ex_mymodel_d"),
        state: { blocks: { languageVersion: 0, blocks: [ top([
          CLEAR(),
          B("variables_set", { fields: { VAR: { name: "사진" } },
            inputs: { VALUE: { block: B("ai_capture") } } }),
          B("variables_set", { fields: { VAR: { name: "답" } },
            inputs: { VALUE: { block: B("ai_custom",
              { inputs: { IMG: { block: VG("사진") } } }) } } }),
          PR(B("variables_get", { fields: { VAR: { name: "답" } } })),
          B("st_say", { inputs: { TEXT: { block: B("variables_get",

  /* ---------------- 파이썬 코드로 보기 (오른쪽 아래 패널) ---------------- */
  let PY_TEXT = "";
  function refreshPython() {
    try {
      PY_TEXT = PY.generate(ws);
    } catch (e) {
      console.error(e);
      PY_TEXT = "# 코드를 만들지 못했어요: " + e;
    }
    const box = document.getElementById("codeView");
    if (box) box.textContent = PY_TEXT;
    return PY_TEXT;
  }
  document.getElementById("codeDetails").addEventListener("toggle", e => {
    if (e.target.open) { refreshPython(); if (window.vapiStat) vapiStat("python_view"); }
  });
  document.getElementById("pyCopy").addEventListener("click", async () => {
    refreshPython();
    try {
      await navigator.clipboard.writeText(PY_TEXT);
      const el = document.getElementById("pyCopy");
      const old = el.textContent;
      el.textContent = t("pyCopied");
      setTimeout(() => { el.textContent = old; }, 1500);
    } catch (e) {}
  });
  document.getElementById("pyOpen").addEventListener("click", () => {
    refreshPython();
    try { sessionStorage.setItem("vapi-py-from-blocks", PY_TEXT); } catch (e) {}
    location.href = "/code?from=blocks";
  });

  const exModal = document.getElementById("exModal");
  document.getElementById("exampleButton").addEventListener("click", () => {
    const list = document.getElementById("exList");
    list.innerHTML = "";
    EXAMPLES().forEach(ex => {
      const el = document.createElement("button");
      el.style.cssText = "text-align:left;border:1.5px solid var(--line);background:#fff;" +
        "border-radius:6px;padding:10px 12px;cursor:pointer;font-family:inherit;";
      el.innerHTML = "<b>" + ex.name + "</b><div style='font-size:0.82rem;color:var(--ink-2);'>" +
        ex.desc + "</div>";
      el.addEventListener("click", () => {
        try {
          Blockly.serialization.workspaces.load(ex.state, ws);
          if (window.vapiStat) vapiStat("example_loaded");
          exModal.style.display = "none";
        } catch (e) { console.error(e); log(t("m_error") + e); }
      });
      list.appendChild(el);
    });
    exModal.style.display = "flex";
  });
  document.getElementById("exClose").addEventListener("click", () =>
    exModal.style.display = "none");
  exModal.addEventListener("click", e => { if (e.target === exModal) exModal.style.display = "none"; });

    set("exampleButton", t("btn_examples"));
    set("clearButton", t("btn_clear"));
    set("pyCopy", t("pyCopy")); set("pyOpen", t("pyOpen"));
