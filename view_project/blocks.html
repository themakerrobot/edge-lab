    set("txtWorkHead", t("workHead"));  set("txtStageHead", t("stageHead"));
    set("uploadButton", t("upload"));   set("uploadHint", t("uploadHint"));
    set("txtCodeView", t("codeView"));
  }

  function setLang(lang) {
    if (lang === LANG) return;
    LANG = lang;
    try { localStorage.setItem("vapiLang", lang); } catch (e) {}

    // Blockly 기본 메시지 교체
    Object.assign(Blockly.Msg, lang === "en" ? window.MSG_EN : window.MSG_KO);

    // 작업 내용 보존 -> 블록/툴박스 재정의 -> 복원
    const state = Blockly.serialization.workspaces.save(ws);
    ws.dispose();
    defineBlocks();
    ws = Blockly.inject("blocklyDiv", Object.assign({ toolbox: buildToolbox() }, WS_OPTS));
    armDisableOrphans(ws);
    Blockly.serialization.workspaces.load(state, ws);

    applyStaticText();
  }

  document.getElementById("langButton").addEventListener("click",
    () => setLang(LANG === "ko" ? "en" : "ko"));

  // 저장된 언어가 영어면 초기 진입 시 한 번 적용
  if (LANG === "en") { const cur = LANG; LANG = "ko"; setLang(cur); }
  else applyStaticText();

  /* ---------------- 무대 요소 ---------------- */
  const cam = document.getElementById("cam");
  const shotImg = document.getElementById("shotImg");
  const overlay = document.getElementById("overlay");
  const octx = overlay.getContext("2d");
  const bigText = document.getElementById("bigText");
  const bubble = document.getElementById("bubble");
  const logBox = document.getElementById("logBox");
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  /* [지우기] — 무대(사진·글씨·박스)와 진행 기록을 함께 비운다.
     블록은 그대로 둔다(그건 [새로 만들기]가 하는 일). RT.clearStage 는 아래에서
     만들어지지만 누를 때 찾으므로 순서는 문제되지 않는다. */
  document.getElementById("clearButton").addEventListener("click", () => {
    try { RT.clearStage(); } catch (e) {}
    logBox.innerHTML = "";
    const vars = document.getElementById("varsBox");
    if (vars) { vars.style.display = "none"; }
  });

  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } })
      .then(s => { cam.srcObject = s; })
      .catch(() => log(t("m_noCam")));
  }
  function log(msg) {
    logBox.textContent += (logBox.textContent ? "\n" : "") + msg;
    logBox.scrollTop = logBox.scrollHeight;
  }

  /* ---------------- 업로드 사진 ---------------- */
  let uploadedURL = null;
  document.getElementById("uploadButton").addEventListener("click", () =>
    document.getElementById("uploadFile").click());
  document.getElementById("uploadFile").addEventListener("change", function () {
    const f = this.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = e => {
      const im = new Image();
      im.onload = () => {
        // 최대 1280px로 축소해 좌표계를 고정 (박스 좌표 = 이 크기 기준)
        const scale = Math.min(1, 1280 / Math.max(im.width, im.height));
        const c = document.createElement("canvas");
        c.width = Math.round(im.width * scale);
        c.height = Math.round(im.height * scale);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        uploadedURL = c.toDataURL("image/jpeg", 0.9);
        shotImg.src = uploadedURL; shotImg.style.display = "block";
        document.getElementById("uploadHint").textContent = t("uploadReady") + " (" + f.name + ")";
      };
      im.src = e.target.result;
    };
    rd.readAsDataURL(f);
  });

  /* ---------------- AI 헬퍼 (vapi-od 호출) ---------------- */
  function dataURLtoBlob(u) {
    const [h, b64] = u.split(","), mime = h.match(/data:(.*?);/)[1];
    const bin = atob(b64), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }
  // 무대 사진 교체: 새 그림을 먼저 디코딩한 뒤 바꾼다.
  // 같은 그림이면 그대로 두어 불필요한 리페인트를 막는다.
  let shownURL = null;
  async function swapShot(url) {
    if (shownURL === url && shotImg.style.display === "block") return;
    const im = new Image();
    im.src = url;
    try {
      if (im.decode) await im.decode();
      else await new Promise(r => { im.onload = r; im.onerror = r; });
    } catch (e) { /* 디코딩 실패해도 아래에서 그냥 교체 */ }
    shotImg.src = url;
    shotImg.style.display = "block";
    shownURL = url;
  }

  /* ---------------- 디바이스 HUD ---------------- */
  let DEVICE_OF = {};                       // 서비스명 -> 실행 디바이스 (서버 실측값)
  const DEV_N = { CPU: 0, GPU: 0, NPU: 0 };
  let devCalls = 0;
  const chipOf = d => document.getElementById("chip" + String(d || "").toUpperCase());

  /* 모델 로딩 전에는 디바이스 표가 비어 있다 — 준비될 때까지 다시 물어본다. */
  (async function initDevbar() {
    try {
      const info = await (await fetch("/system")).json();
      DEVICE_OF = info.device_of || {};
      (info.devices || []).forEach(d => {
        const el = chipOf(d);
        if (el) el.classList.add("on");
      });
      if (info.ready) return;
    } catch (e) { /* 서버가 아직 못 뜬 경우 */ }
    setTimeout(initDevbar, 1500);
  })();

  /* 장치 표시는 상태 오버레이(lib/sysbar.js)가 맡는다.
     그쪽이 fetch 를 지켜보다가 스스로 칩을 켜고 끄므로 여기서는 아무것도 안 한다.
     예전에는 이 페이지가 자기 띠(.devbar)의 칩을 직접 켰는데, 그 띠를 오버레이로
     옮기면서 선택자가 아무것도 못 찾게 됐다(그래서 불이 안 들어왔다). */
  function devBusy(dev) {}
  function devIdle() {}
  function devReport(dev, ms) {
    dev = String(dev || "").toUpperCase();
    devCalls++;
    /* 오버레이(lib/sysbar.js)가 못 떴어도 실행은 계속되어야 한다 —
       옛 sysbar.js 가 브라우저 캐시에 남으면 이 칸들이 없어서
       여기서 죽고 블록 실행 전체가 "오류" 로 끝났었다. */
    const put = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
    put("devCalls", devCalls);
    put("devLast", ms + " ms");
    put("devExec", dev || "--");
    if (DEV_N[dev] !== undefined) {
      DEV_N[dev]++;
      const st = document.getElementById("st" + dev);
      if (st) st.textContent = " " + ms + "ms ×" + DEV_N[dev];
    }
  }

  async function dims(url) {
    return new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res({ w: im.naturalWidth, h: im.naturalHeight });
      im.onerror = rej;
      im.src = url;
    });
  }
  async function post(path, imgURL, params) {
    if (!imgURL) throw t("m_noImage");
    await RT.aiGate();                       // 호출 상한 + 최소 간격 + 정지 확인
    AI.lastImg = imgURL;
    AI.lastDim = await dims(imgURL);
    let url = "/" + path;
    const qs = Object.assign({ lang: LANG }, params || {});   // 서버 VLM 응답 언어
    url += "?" + new URLSearchParams(qs).toString();
    const fd = new FormData();
    fd.append("uploadFile", dataURLtoBlob(imgURL), "image.jpg");
    devBusy(DEVICE_OF[path.split("/")[1]]);   // 호출 직전에 해당 칩만 점멸
    let res;
    try {
      res = await fetch(url, { method: "POST", body: fd,
                               signal: RT.abort ? RT.abort.signal : undefined });
    } catch (e) {
      devIdle();
      if (e && e.name === "AbortError") throw "STOP";  // 정지 버튼이 fetch를 끊음
      throw e;
    }
    devIdle();
    const j = await res.json();
    if (j.result !== "ok") throw t("m_aiError") + (j.data || t("m_fail"));
    RT.lastElapsed = j.elapsed_ms || 0;
    devReport(j.device, j.elapsed_ms || 0);   // 서버가 보고한 실제 실행 디바이스
    return j.data;
  }

  const COLOR = { face: "#1f5f7a", objects: "#2e9e5b", text: "#e08a1e", custom: "#b4451c" };
  const COLORS = { face: "#1f5f7a", objects: "#2e8b57", text: "#d97b2b", custom: "#b4451c" };
  const AI = {
    lastBoxes: [],
    layers: { img: null, items: [] },
    addLayer(img, items, color) {
      // 같은 사진이면 누적, 사진이 바뀌면 새로 시작 (사진 원본은 절대 수정하지 않음)
      if (AI.layers.img !== img) AI.layers = { img: img, items: [] };
      AI.layers.items.push(...items.map(it => ({ ...it, color })));
      AI.lastBoxes = items;
    },
    _setBoxes(img, boxes, color) {
      // 같은 사진에 대한 인식은 누적, 사진이 바뀌면 새로 시작
      if (AI.lastImg !== undefined && AI._boxImg === img) {
        AI.lastBoxes = AI.lastBoxes.concat(boxes.map(b => ({ ...b, color })));
      } else {
        AI.lastBoxes = boxes.map(b => ({ ...b, color }));
      }
      AI._boxImg = img;
    },
    async capture() {
      if (!cam.videoWidth) throw t("m_camNotReady");
      const c = document.createElement("canvas");
      c.width = 640; c.height = 480;
      c.getContext("2d").drawImage(cam, 0, 0, 640, 480);
      // 사진 찍기는 값을 만드는 블록이다. 무대 표시는 바꾸지 않는다.
      // (여기서 라이브뷰로 되돌리면 변환 결과 ↔ 웹캠이 번갈아 보여 깜빡인다)
      return c.toDataURL("image/jpeg", 0.85);
    },
    uploaded() {
      if (!uploadedURL) throw t("m_needUpload");
      return uploadedURL;
    },
    async detectFile(img, name) {
      if (!name) throw t("m_noFile");
      const d = await post("object/detect_file", img, { model: name });
      const objs = (d && d.object) || [];
      AI._setBoxes(img, objs.map(o => ({ box: o.box, label: o.name })), COLOR.custom);
      return objs.length ? objs[0].name : t("r_none");
    },
    async custom(img, slug) {
      if (!slug) throw t("m_noCustom");
      const d = await post("custom/predict", img, { model: slug });
      return (d && d.length) ? d[0].name : t("r_none");
    },
    async objects(img) {
      const d = await post("object/object_search", img);
      const all = d.object || [];              // 사람도 이 목록에 함께 온다
      AI._setBoxes(img, all.map(o => ({ box: o.box, label: o.name })), COLOR.objects);
      return all.map(o => o.name);
    },
    async face(img, what) {
      const d = await post("face/face_analyze", img);
      const pick = f => {                    // 질문한 항목의 값 (라벨/반환 공용)
        if (what === "emotion") return f.emotion;
        if (what === "age") return f.age + t("r_ageSuffix");
        if (what === "gender") return f.gender;
        return ((f.pos && f.pos.direction) || t("r_front"));   // 서버가 낱말로 준다
      };
      if (!d.length) { AI._setBoxes(img, [], COLOR.face); return what === "age" ? 0 : t("r_none"); }
      AI._setBoxes(img, d.map(f => ({ box: f.box, label: String(pick(f)) })), COLOR.face);
      return what === "age" ? d[0].age : pick(d[0]);
    },
    async faceCount(img) {
      const d = await post("face/face_detect", img);
      AI._setBoxes(img, d.map(f => ({ box: f.box, label: t("r_face") })), COLOR.face);
      return d.length;
    },
    async ocr(img) {
      const d = await post("code/ocr", img);
      AI._setBoxes(img, d.map(t => ({ box: t.box, label: t.text })), COLOR.text);
      return d.map(t => t.text).join(" ");
    },
    async qr(img) {
      const d = await post("code/barcode", img);
      AI._setBoxes(img, d.map(b => ({ box: b.box, label: "QR" })), COLOR.text);
      return d.length ? d[0].data : "";
    },
    async hand(img) {
      const d = await post("object/hand", img);
      const name = x => x.gesture;
      AI.addLayer(img, d.map(x => ({ box: x.box, label: name(x) })), COLORS.custom);
      return d.length ? name(d[0]) : t("r_none");
    },
    async faceDist(img) {
      const d = await post("face/mesh", img);
      AI.addLayer(img, d.map(f => ({ box: f.box, label: f.distance + "cm" })), COLORS.face);
      return d.length ? d[0].distance : 0;
    },
    async listen(sec) { return RT.listen(sec); },
    async ask(img, q) {
      const d = await post("vlm/look", img, { prompt: q });
      return d.answer;
    },
    async chat(q) {
      /* 사진 없이 글로만 묻는다 — 업로드가 없으니 post() 대신 직접 부른다 */
      const text = String(q || "").trim();
      if (!text) return "";
      await RT.aiGate();
      devBusy(DEVICE_OF["chat_ask"] || "GPU");
      try {
        const r = await fetch("/chat/ask?" + new URLSearchParams({ prompt: text, lang: LANG }),
                              { method: "POST",
                                signal: RT.abort ? RT.abort.signal : undefined });
        const j = await r.json();
        if (j.result !== "ok") throw t("m_aiError") + (j.data || t("m_fail"));
        RT.lastElapsed = j.elapsed_ms || 0;
        devReport(j.device, j.elapsed_ms || 0);
        return j.data.answer;
      } finally { devIdle(); }
    },
    async depthMap(img, place) {
      const d = await post("gan/depth", img, { place: place });
      return "data:image/jpeg;base64," + d;
    },
    async depthAt(img, x, y, place) {
      /* 그 자리까지의 거리(m). 어림값이라 계측기가 아니다 —
         실내/바깥 모델이 갈리므로 place 를 그대로 넘긴다. */
      const d = await post("gan/distance", img, { x: Math.round(x), y: Math.round(y), place: place });
      AI.addLayer(img, [{ box: [d.x - 8, d.y - 8, d.x + 8, d.y + 8], label: d.meter + "m" }], COLORS.face);
      return d.meter;
    },
    async transform(img, kind) {
      const d = await post("gan/" + kind, img);
      return "data:image/jpeg;base64," + d;
    },
    async detectDraw(img, mode) {
      if (mode === "face") await AI.faceCount(img);
      else if (mode === "hand") await AI.hand(img);
      else if (mode === "dist") await AI.faceDist(img);
      else if (mode === "objects") await AI.objects(img);
      else if (mode === "ocr") await AI.ocr(img);
      else if (mode === "qr") await AI.qr(img);
      await RT.drawBoxes();
    },
    async detectDraw(img, mode) {
      if (mode === "face") await AI.faceCount(img);
      else if (mode === "hand") await AI.hand(img);
      else if (mode === "dist") await AI.faceDist(img);
      else if (mode === "objects") await AI.objects(img);
      else if (mode === "ocr") await AI.ocr(img);
      else if (mode === "qr") await AI.qr(img);
      await RT.drawBoxes();
    },
  };

  /* ---------------- 실행기 (RT) ---------------- */
  /* ---------------- 사진 편집 (canvas — 오프라인, 서버 불필요) ---------------- */
  const ED = (() => {
    const load = url => new Promise((res, rej) => {
      if (!url) { rej(t("m_noImage")); return; }
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = () => rej(t("m_noImage"));
      im.src = url;
    });
    const MAXPX = 1600;                       // 확대를 반복해도 폭주하지 않게 상한
    const out = c => c.toDataURL("image/jpeg", 0.9);
    const make = (w, h) => {
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h));
      return c;
    };
    /* 아홉 칸 위치 -> 좌표 (0~1) */
    const P9 = { tl:[.12,.12], tc:[.5,.12], tr:[.88,.12],
                 ml:[.12,.5],  mc:[.5,.5],  mr:[.88,.5],
                 bl:[.12,.88], bc:[.5,.88], br:[.88,.88] };

    return {
      async resize(url, f) {
        f = Math.max(0.1, Math.min(8, Number(f) || 1));
        const im = await load(url);
        if (f > 1) {
          /* 확대 = 디지털 줌: 가운데 1/f 영역을 잘라 원래 크기로 키운다 (가까이 보인다) */
          const w = im.width / f, h = im.height / f;
          const c = make(im.width, im.height);
          c.getContext("2d").drawImage(im, (im.width - w) / 2, (im.height - h) / 2,
                                       w, h, 0, 0, c.width, c.height);
          return out(c);
        }
        /* 축소 = 해상도 줄이기: 화면에 다시 키워 보여주면 흐릿해진다 (화질 실험용) */
        const c = make(Math.max(8, im.width * f), Math.max(8, im.height * f));
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        return out(c);
      },
      async rotate(url, deg) {
        const im = await load(url);
        const r = (Number(deg) || 0) * Math.PI / 180;
        const w = im.width, h = im.height;
        const W = Math.abs(w * Math.cos(r)) + Math.abs(h * Math.sin(r));
        const H = Math.abs(w * Math.sin(r)) + Math.abs(h * Math.cos(r));
        const c = make(W, H), g = c.getContext("2d");
        g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
        g.translate(c.width / 2, c.height / 2); g.rotate(r);
        g.drawImage(im, -w / 2, -h / 2);
        return out(c);
      },
      async flip(url, dir) {
        const im = await load(url);
        const c = make(im.width, im.height), g = c.getContext("2d");
        if (dir === "flipV") { g.translate(0, c.height); g.scale(1, -1); }
        else { g.translate(c.width, 0); g.scale(-1, 1); }
        g.drawImage(im, 0, 0);
        return out(c);
      },
      async crop(url, part) {
        const im = await load(url);
        const w = im.width, h = im.height;
        const R = { left:   [0, 0, w / 2, h],    right:  [w / 2, 0, w / 2, h],
                    top:    [0, 0, w, h / 2],    bottom: [0, h / 2, w, h / 2],
                    center: [w / 4, h / 4, w / 2, h / 2] }[part] || [0, 0, w, h];
        const c = make(R[2], R[3]);
        c.getContext("2d").drawImage(im, R[0], R[1], R[2], R[3], 0, 0, R[2], R[3]);
        return out(c);
      },
      async merge(a, b, dir) {
        const A = await load(a), B = await load(b);
        let c, g;
        if (dir === "sideV") {                 // 아래로: 너비를 맞춘다
          const w = Math.min(Math.max(A.width, B.width), MAXPX);
          const ah = A.height * w / A.width, bh = B.height * w / B.width;
          c = make(w, ah + bh); g = c.getContext("2d");
          g.drawImage(A, 0, 0, w, ah); g.drawImage(B, 0, ah, w, bh);
        } else {                               // 옆으로: 높이를 맞춘다
          const h = Math.min(Math.max(A.height, B.height), MAXPX);
          const aw = A.width * h / A.height, bw = B.width * h / B.height;
          c = make(aw + bw, h); g = c.getContext("2d");
          g.drawImage(A, 0, 0, aw, h); g.drawImage(B, aw, 0, bw, h);
        }
        return out(c);
      },
      async overlay(a, b, size, pos) {
        const A = await load(a), B = await load(b);
        const c = make(A.width, A.height), g = c.getContext("2d");
        g.drawImage(A, 0, 0);
        const f = { small: .22, mid: .35, big: .5 }[size] || .3;
        const bw = A.width * f, bh = B.height * bw / B.width;
        const [px, py] = P9[pos] || P9.br;
        const x = px * A.width - bw / 2, y = py * A.height - bh / 2;
        g.drawImage(B, Math.max(0, Math.min(x, A.width - bw)),
                       Math.max(0, Math.min(y, A.height - bh)), bw, bh);
        return out(c);
      },
      async tone(url, what, v) {
        v = Math.max(-100, Math.min(100, Number(v) || 0));
        const im = await load(url);
        const c = make(im.width, im.height), g = c.getContext("2d");
        const f = { bright: "brightness", contrast: "contrast", saturate: "saturate" }[what];
        g.filter = f + "(" + (100 + v) + "%)";
        g.drawImage(im, 0, 0);
        return out(c);
      },
      async filter(url, name) {
        const im = await load(url);
        const c = make(im.width, im.height), g = c.getContext("2d");
        g.filter = { gray: "grayscale(100%)", sepia: "sepia(90%)",
                     invert: "invert(100%)", blur: "blur(4px)" }[name] || "none";
        g.drawImage(im, 0, 0);
        return out(c);
      },
      async text(url, txt, pos, size, color, deg) {
        const im = await load(url);
        const c = make(im.width, im.height), g = c.getContext("2d");
        g.drawImage(im, 0, 0);
        txt = String(txt == null ? "" : txt);
        size = Math.max(8, Math.min(200, Number(size) || 40));
        const [px, py] = P9[pos] || P9.mc;
        g.save();
        g.translate(px * c.width, py * c.height);
        g.rotate((Number(deg) || 0) * Math.PI / 180);
        g.font = "bold " + size + 'px "Gowun Dodum", sans-serif';
        g.textAlign = "center"; g.textBaseline = "middle";
        g.lineWidth = Math.max(2, size / 10);
        g.strokeStyle = "rgba(255,255,255,.85)";   // 어떤 배경에서도 읽히게 흰 테두리
        g.strokeText(txt, 0, 0);
        g.fillStyle = color || "#26262e";
        g.fillText(txt, 0, 0);
        g.restore();
        return out(c);
      },
      async shape(url, kind, fill, pos, color, p2) {
        const im = await load(url);
        const c = make(im.width, im.height), g = c.getContext("2d");
        g.drawImage(im, 0, 0);
        const S = Math.min(c.width, c.height);
        g.lineWidth = Math.max(3, S * 0.012);
        g.strokeStyle = g.fillStyle = color || "#e0342e";
        const [px, py] = P9[pos] || P9.mc;
        const x = px * c.width, y = py * c.height;
        if (kind === "line") {
          const [qx, qy] = P9[p2] || P9.br;
          g.beginPath(); g.moveTo(x, y);
          g.lineTo(qx * c.width, qy * c.height); g.stroke();
        } else if (kind === "circle") {
          g.beginPath(); g.arc(x, y, S * 0.16, 0, Math.PI * 2);
          fill === "fill" ? g.fill() : g.stroke();
        } else {                               // rect
          const w = S * 0.34, h = S * 0.26;
          fill === "fill" ? g.fillRect(x - w / 2, y - h / 2, w, h)
                          : g.strokeRect(x - w / 2, y - h / 2, w, h);
        }
        return out(c);
      },
      async sizeOf(url, what) {
        const im = await load(url);
        return what === "height" ? im.height : im.width;
      },

      /* ---- 픽셀 / 색 (컴퓨터에게 사진은 숫자) ---- */
      _ctxOf(im) {
        const c = make(im.width, im.height);
        const g = c.getContext("2d", { willReadFrequently: true });
        g.drawImage(im, 0, 0);
        return g;
      },
      _colorName(r, g, b) {
        const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
        if (mx < 50) return t("c_black");
        if (mn > 205 && mx - mn < 35) return t("c_white");
        if (mx - mn < 28) return t("c_gray");
        const d = mx - mn;
        let h = 0;
        if (mx === r) h = ((g - b) / d + 6) % 6;
        else if (mx === g) h = (b - r) / d + 2;
        else h = (r - g) / d + 4;
        h *= 60;
        if (h < 20 || h >= 335) return t("c_red");
        if (h < 45) return t("c_orange");
        if (h < 70) return t("c_yellow");
        if (h < 165) return t("c_green");
        if (h < 200) return t("c_cyan");
        if (h < 260) return t("c_blue");
        return t("c_purple");
      },
      async colorAt(url, pos) {
        const im = await load(url);
        const g = ED._ctxOf(im);
        const [px, py] = P9[pos] || P9.mc;
        /* 한 픽셀은 노이즈가 심하므로 5×5 평균을 쓴다 */
        const x = Math.round(px * im.width), y = Math.round(py * im.height);
        const d = g.getImageData(Math.max(0, x - 2), Math.max(0, y - 2), 5, 5).data;
        let r = 0, gg = 0, b = 0, n = d.length / 4;
        for (let i = 0; i < d.length; i += 4) { r += d[i]; gg += d[i + 1]; b += d[i + 2]; }
        return ED._colorName(r / n, gg / n, b / n);
      },
      async colorAtXY(url, x, y) {
        const im = await load(url);
        const g = ED._ctxOf(im);
        x = Math.max(0, Math.min(im.width - 1, Math.round(Number(x) || 0)));
        y = Math.max(0, Math.min(im.height - 1, Math.round(Number(y) || 0)));
        const d = g.getImageData(x, y, 1, 1).data;
        return ED._colorName(d[0], d[1], d[2]);
      },
      async mainColor(url) {
        const im = await load(url);
        const c = make(48, 48);                     // 축소해서 세면 충분하다
        const g = c.getContext("2d", { willReadFrequently: true });
        g.drawImage(im, 0, 0, 48, 48);
        const d = g.getImageData(0, 0, 48, 48).data;
        const cnt = {};
        for (let i = 0; i < d.length; i += 4) {
          const name = ED._colorName(d[i], d[i + 1], d[i + 2]);
          cnt[name] = (cnt[name] || 0) + 1;
        }
        return Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0] || t("c_gray");
      },

      /* ---- 상급생용: 픽셀 좌표 직접 입력 ---- */
      async cropXY(url, x, y, w, h) {
        const im = await load(url);
        x = Math.max(0, Math.min(im.width - 1, Number(x) || 0));
        y = Math.max(0, Math.min(im.height - 1, Number(y) || 0));
        w = Math.max(1, Math.min(im.width - x, Number(w) || 1));
        h = Math.max(1, Math.min(im.height - y, Number(h) || 1));
        const c = make(w, h);
        c.getContext("2d").drawImage(im, x, y, w, h, 0, 0, w, h);
        return out(c);
      },
      async textXY(url, txt, x, y, size, color, deg) {
        const im = await load(url);
        const c = make(im.width, im.height), g = c.getContext("2d");
        g.drawImage(im, 0, 0);
        size = Math.max(8, Math.min(300, Number(size) || 40));
        g.save();
        g.translate(Number(x) || 0, Number(y) || 0);
        g.rotate((Number(deg) || 0) * Math.PI / 180);
        g.font = "bold " + size + 'px "Gowun Dodum", sans-serif';
        g.textAlign = "left"; g.textBaseline = "top";
        g.lineWidth = Math.max(2, size / 10);
        g.strokeStyle = "rgba(255,255,255,.85)";
        g.strokeText(String(txt == null ? "" : txt), 0, 0);
        g.fillStyle = color || "#26262e";
        g.fillText(String(txt == null ? "" : txt), 0, 0);
        g.restore();
        return out(c);
      },
      async rectXY(url, x, y, w, h, fill, color) {
        const im = await load(url);
        const c = make(im.width, im.height), g = c.getContext("2d");
        g.drawImage(im, 0, 0);
        g.lineWidth = Math.max(2, Math.min(c.width, c.height) * 0.008);
        g.strokeStyle = g.fillStyle = color || "#e0342e";
        fill === "fill" ? g.fillRect(+x || 0, +y || 0, +w || 1, +h || 1)
                        : g.strokeRect(+x || 0, +y || 0, +w || 1, +h || 1);
        return out(c);
      },
      async circleXY(url, x, y, r, fill, color) {
        const im = await load(url);
        const c = make(im.width, im.height), g = c.getContext("2d");
        g.drawImage(im, 0, 0);
        g.lineWidth = Math.max(2, Math.min(c.width, c.height) * 0.008);
        g.strokeStyle = g.fillStyle = color || "#e0342e";
        g.beginPath(); g.arc(+x || 0, +y || 0, Math.max(1, +r || 1), 0, Math.PI * 2);
        fill === "fill" ? g.fill() : g.stroke();
        return out(c);
      },
      async lineXY(url, x1, y1, x2, y2, color) {
        const im = await load(url);
        const c = make(im.width, im.height), g = c.getContext("2d");
        g.drawImage(im, 0, 0);
        g.lineWidth = Math.max(2, Math.min(c.width, c.height) * 0.008);
        g.strokeStyle = color || "#e0342e";
        g.beginPath(); g.moveTo(+x1 || 0, +y1 || 0); g.lineTo(+x2 || 0, +y2 || 0); g.stroke();
        return out(c);
      },
      async overlayXY(a, b, x, y, w) {
        const A = await load(a), B = await load(b);
        const c = make(A.width, A.height), g = c.getContext("2d");
        g.drawImage(A, 0, 0);
        w = Math.max(4, Number(w) || 100);
        g.drawImage(B, +x || 0, +y || 0, w, B.height * w / B.width);
        return out(c);
      },

      /* ---- 인식 결과와 연계 ---- */
      async cropDetected(which) {
        if (!AI._boxImg || !AI.lastBoxes || !AI.lastBoxes.length) throw t("m_noDetect");
        const i = which === "last" ? AI.lastBoxes.length - 1 : 0;
        const [x1, y1, x2, y2] = AI.lastBoxes[i].box;
        return ED.cropXY(AI._boxImg, x1, y1, Math.max(1, x2 - x1), Math.max(1, y2 - y1));
      },
      async stickerOnFaces(img, sticker) {
        const d = await post("face/face_detect", img);
        if (!d.length) return img;                  // 얼굴이 없으면 원본 그대로
        const A = await load(img), B = await load(sticker);
        const c = make(A.width, A.height), g = c.getContext("2d");
        g.drawImage(A, 0, 0);
        d.forEach(f => {
          const [x1, y1, x2, y2] = f.box;
          const w = (x2 - x1) * 1.15;
          const h = B.height * w / B.width;
          g.drawImage(B, x1 - (w - (x2 - x1)) / 2, y1 - h * 0.15, w, h);
        });
        return out(c);
      },
    };
  })();

  /* 편집 블록 사용 통계 */
  (function () {
    Object.keys(ED).forEach(k => {
      const f = ED[k];
      ED[k] = function () {
        if (window.vapiStat) vapiStat("edit_used");
        return f.apply(ED, arguments);
      };
    });
  })();

  const RT = {
    stopFlag: false, iter: 0, lastElapsed: 0,
    abort: null, aiCalls: 0, lastAiAt: 0,
    AI_CALL_LIMIT: 50, AI_MIN_GAP: 300,
    async aiGate() {
      if (RT.stopFlag) throw "STOP";
      if (++RT.aiCalls > RT.AI_CALL_LIMIT)
        throw t("m_tooManyAI").replace("%1", RT.AI_CALL_LIMIT);
      const gap = Date.now() - RT.lastAiAt;
      if (gap < RT.AI_MIN_GAP) await sleep(RT.AI_MIN_GAP - gap);  // 서버 연타 방지
      if (RT.stopFlag) throw "STOP";
      RT.lastAiAt = Date.now();
    },
    async step(id) {
      if (RT.stopFlag) throw "STOP";
      ws.highlightBlock(id);
      await sleep(30);                          // 진행이 눈에 보이는 최소 템포
    },
    loopTrap() {
      if (RT.stopFlag) throw "STOP";
      if (++RT.iter > 5000) throw t("m_tooManyLoop");
    },
    async say(text, voice, speed) {
      text = String(text);
      RT.voice = voice || RT.voice || "F1";
      RT.speed = speed || RT.speed || "normal";
      bubble.textContent = text; bubble.style.display = "block";
      log(t("m_say") + text);
      if (await RT._sayServer(text)) return;   // 온디바이스 TTS(Supertonic)
      await RT._sayBrowser(text);              // 안 되면 브라우저 음성으로
    },
    /* 서버 TTS — 성공하면 true. 첫 호출은 모델을 여느라 몇 초 걸린다. */
    async _sayServer(text) {
      if (RT._ttsOff) return false;
      try {
        const r = await fetch("/speech/tts", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, lang: LANG === "en" ? "en" : "ko",
                                 voice: RT.voice || "F1",
                                 speed: RT_SPEED[RT.speed] || 1.05 }),
        });
        if (!r.ok || !(r.headers.get("Content-Type") || "").includes("audio")) {
          RT._ttsOff = true;                   // 모델이 없으면 다시 시도하지 않는다
          return false;
        }
        const buf = await r.arrayBuffer();
        if (!RT._audio) RT._audio = new (window.AudioContext || window.webkitAudioContext)();
        const a = RT._audio;
        const src = a.createBufferSource();
        src.buffer = await a.decodeAudioData(buf);
        src.connect(a.destination);
        RT._voiceSrc = src;
        await new Promise(res => { src.onended = res; src.start(); });
        RT._voiceSrc = null;
        return true;
      } catch (e) {
        RT._ttsOff = true;
        return false;
      }
    },
    _sayBrowser(text) {
      return new Promise(res => {
        try {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = t("tts");
          u.onend = res; u.onerror = res;
          speechSynthesis.cancel();
          speechSynthesis.speak(u);
          setTimeout(res, Math.max(1500, text.length * 250));  // 안전 타임아웃
        } catch (e) { res(); }
      });
    },
    /* 마이크로 듣고 글자로 바꾸기 (음성 인식) */
    async listen(seconds) {
      const sec = Math.max(1, Math.min(10, Number(seconds) || 4));
      log(t("m_listen") + sec + t("m_sec"));
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        throw t("m_noMic");
      }
      try {
        const wav = await RT._record(stream, sec);
        const fd = new FormData();
        fd.append("uploadFile", new Blob([wav], { type: "audio/wav" }), "a.wav");
        const r = await fetch("/speech/stt?lang=" + (LANG === "en" ? "en" : "ko"),
                              { method: "POST", body: fd });
        const j = await r.json();
        if (j.result !== "ok") throw (j.data || t("m_sttFail"));
        const text = (j.data && j.data.text) || "";
        log(t("m_heard") + text);
        return text;
      } finally {
        stream.getTracks().forEach(tr => tr.stop());
      }
    },
    /* 마이크 소리를 WAV(16bit 모노) 로 만든다 — 서버가 WAV 만 받는다 */
    async _record(stream, seconds) {
      if (!RT._audio) RT._audio = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = RT._audio;
      await ctx.resume();
      const src = ctx.createMediaStreamSource(stream);
      const node = ctx.createScriptProcessor(4096, 1, 1);
      const chunks = [];
      node.onaudioprocess = e => chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
      src.connect(node); node.connect(ctx.destination);
      await new Promise(res => setTimeout(res, seconds * 1000));
      node.disconnect(); src.disconnect(); node.onaudioprocess = null;

      const total = chunks.reduce((n, c) => n + c.length, 0);
      const pcm = new Float32Array(total);
      let at = 0;
      for (const c of chunks) { pcm.set(c, at); at += c.length; }

      const sr = ctx.sampleRate;
      const buf = new ArrayBuffer(44 + pcm.length * 2);
      const dv = new DataView(buf);
      const put = (off, str) => { for (let i = 0; i < str.length; i++) dv.setUint8(off + i, str.charCodeAt(i)); };
      put(0, "RIFF"); dv.setUint32(4, 36 + pcm.length * 2, true); put(8, "WAVEfmt ");
      dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
      dv.setUint32(24, sr, true); dv.setUint32(28, sr * 2, true);
      dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
      put(36, "data"); dv.setUint32(40, pcm.length * 2, true);
      for (let i = 0; i < pcm.length; i++) {
        const v = Math.max(-1, Math.min(1, pcm[i]));
        dv.setInt16(44 + i * 2, v * 32767, true);
      }
      return buf;
    },
    _stopVoice() {
      try { speechSynthesis.cancel(); } catch (e) {}
      try { if (RT._voiceSrc) { RT._voiceSrc.stop(); RT._voiceSrc = null; } } catch (e) {}
    },
    showText(v) { bigText.textContent = String(v); log(t("m_show") + v); },
    _audio: null,
    _tone(freq, sec, type) {
      /* Web Audio — 오프라인에서도 동작한다 */
      try {
        if (!RT._audio) RT._audio = new (window.AudioContext || window.webkitAudioContext)();
        const a = RT._audio, o = a.createOscillator(), g = a.createGain();
        o.type = type || "sine"; o.frequency.value = freq;
        g.gain.setValueAtTime(0.25, a.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + sec);
        o.connect(g); g.connect(a.destination);
        o.start(); o.stop(a.currentTime + sec);
      } catch (e) { /* 소리가 안 나도 프로그램은 계속 */ }
    },
    async note(freq, beats) {
      const sec = Math.max(0.1, Math.min(4, (Number(beats) || 1) * 0.4));
      RT._tone(freq, sec);
      await sleep(sec * 1000);
    },
    _noise(sec, lp) {
      /* 화이트 노이즈 — 박수·치직 계열 */
      try {
        if (!RT._audio) RT._audio = new (window.AudioContext || window.webkitAudioContext)();
        const a = RT._audio, n = Math.floor(a.sampleRate * sec);
        const buf = a.createBuffer(1, n, a.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
        const src = a.createBufferSource(); src.buffer = buf;
        const g = a.createGain(); g.gain.value = 0.3;
        if (lp) {
          const f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = lp;
          src.connect(f); f.connect(g);
        } else { src.connect(g); }
        g.connect(a.destination); src.start();
      } catch (e) {}
    },
    _sweep(f0, f1, sec, type) {
      /* 주파수 스윕 — 사이렌·레이저·코인 계열 */
      try {
        if (!RT._audio) RT._audio = new (window.AudioContext || window.webkitAudioContext)();
        const a = RT._audio, o = a.createOscillator(), g = a.createGain();
        o.type = type || "sine";
        o.frequency.setValueAtTime(f0, a.currentTime);
        o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), a.currentTime + sec);
        g.gain.setValueAtTime(0.25, a.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + sec);
        o.connect(g); g.connect(a.destination);
        o.start(); o.stop(a.currentTime + sec);
      } catch (e) {}
    },
    async beep(kind) {
      switch (kind) {
        case "beepNo":     RT._tone(180, 0.35, "square"); await sleep(380); break;
        case "sndSiren":   RT._sweep(600, 1200, 0.4); await sleep(400);
                           RT._sweep(1200, 600, 0.4); await sleep(430); break;
        case "sndLaser":   RT._sweep(1400, 120, 0.25, "sawtooth"); await sleep(280); break;
        case "sndCoin":    RT._tone(988, 0.09, "square"); await sleep(90);
                           RT._tone(1319, 0.25, "square"); await sleep(270); break;
        case "sndJump":    RT._sweep(220, 880, 0.22, "square"); await sleep(250); break;
        case "sndDrum":    RT._sweep(160, 45, 0.28); RT._noise(0.08, 900); await sleep(300); break;
        case "sndClap":    RT._noise(0.12, 2500); await sleep(160);
                           RT._noise(0.1, 2500); await sleep(140); break;
        case "sndChime":   RT._tone(880, 0.7); RT._tone(1320, 0.7); RT._tone(1760, 0.5);
                           await sleep(700); break;
        case "sndFanfare": for (const f of [523, 659, 784]) { RT._tone(f, 0.16, "triangle"); await sleep(150); }
                           RT._tone(1047, 0.5, "triangle"); await sleep(520); break;
        default:           RT._tone(660, 0.12); await sleep(130);
                           RT._tone(880, 0.18); await sleep(200);
      }
    },
    async melody(text, tempo) {
      /* "도미솔 솔 도2" / "c e g g c2" — 공백은 쉼표 */
      const beat = 60000 / (Number(tempo) || 120);
      const N = { "도": 262, "레": 294, "미": 330, "파": 349, "솔": 392, "라": 440,
                  "시": 494, "c": 262, "d": 294, "e": 330, "f": 349, "g": 392,
                  "a": 440, "b": 494 };
      const toks = [];
      const str = String(text == null ? "" : text).toLowerCase();
      /* 한 글자 음 + 뒤의 2(옥타브 위) 를 토큰으로 자른다 */
      for (let i = 0; i < str.length; i++) {
        const ch = str[i];
        if (ch === " ") { toks.push(null); continue; }
        if (N[ch] !== undefined) {
          let f = N[ch];
          if (str[i + 1] === "2") { f *= 2; i++; }
          toks.push(f);
        } else if (ch !== "2") { toks.push(undefined); }
      }
      const bad = toks.filter(x => x === undefined).length;
      if (bad) log(t("m_badNote") + bad);
      for (const f of toks) {
        if (RT.stopFlag) throw "STOP";
        if (f) RT._tone(f, beat / 1000 * 0.9);
        await sleep(beat);
      }
    },
    async freq(f, sec) {
      f = Math.max(20, Math.min(20000, Number(f) || 440));
      sec = Math.max(0.05, Math.min(5, Number(sec) || 0.5));
      RT._tone(f, sec);
      await sleep(sec * 1000);
    },
    varSet(name, val) {
      /* C10: 실행 중 변수 값을 무대 옆에 보여준다 */
      RT._vars = RT._vars || {};
      RT._vars[name] = Array.isArray(val) ? val.join(", ") : val;
      const box = document.getElementById("varsBox");
      const body = document.getElementById("varsBody");
      if (!box || !body) return;
      box.style.display = "block";
      body.innerHTML = Object.keys(RT._vars).map(k =>
        "<div><b>" + k.replace(/&/g,"&amp;").replace(/</g,"&lt;") + "</b> = " +
        String(RT._vars[k]).replace(/&/g,"&amp;").replace(/</g,"&lt;").slice(0, 60) + "</div>").join("");
    },
    print(v) {
      /* 리스트는 보기 좋게 콤마로 */
      if (Array.isArray(v)) v = v.join(", ");
      log("▷ " + String(v));
    },
    saveStage(img) {
      const url = img || shownURL;           /* 준 사진이 있으면 그것, 없으면 지금 보이는 것 */
      if (!url) { log(t("m_noImage")); return; }
      const a = document.createElement("a");
      a.href = url;
      a.download = "themaker-" + new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-") + ".jpg";
      a.click();
      log(t("m_saved"));
    },
    async waitUntil(kind, want) {
      /* 조건이 될 때까지 웹캠을 계속 본다. 60초가 지나면 멈춘다.
         이 안의 인식은 호출 제한(50회)에 세지 않는다 — 기다림 자체가 목적이라서다. */
      const t0 = Date.now();
      while (Date.now() - t0 < 60000) {
        if (RT.stopFlag) throw "STOP";
        const img = await AI.capture();
        const before = RT.aiCalls;
        try {
          if (kind === "face") {
            const d = await post("face/face_detect", img);
            if (d.length > 0) return true;
          } else if (kind === "hand") {
            const d = await post("object/hand", img);
            if (d.length && (!want || d[0].gesture_en === want)) return true;
          } else if (kind === "custom") {
            const d = await post("custom/predict", img, { model: want.slug });
            if (d.length && d[0].name === want.label && d[0].score >= 0.6) return true;
          }
        } catch (e) { /* 인식 실패 프레임은 넘어간다 */ }
        finally { RT.aiCalls = before; }        // 대기 중 인식은 상한에 안 센다
        await sleep(250);
      }
      log(t("m_waitTimeout"));
      return false;
    },
    async showImage(u) {
      if (!u) return;
      await swapShot(u);                        // 디코딩 후 교체 → 깜빡임 없음
      // 방금 인식한 그 사진을 다시 보여주는 경우엔 박스를 지우지 않는다.
      // (인식하고 박스 그리기 → 사진 보여주기 순서에서 박스가 깜빡이는 원인)
      if (u !== AI.lastImg) octx.clearRect(0, 0, overlay.width, overlay.height);
    },
    async drawBoxes() {
      if (!AI.lastImg || !AI.lastDim) { log(t("m_needDetect")); return; }
      // 분석했던 그 프레임을 배경으로 표시 → 박스와 대상이 항상 일치
      await swapShot(AI.lastImg);
      const { w, h } = AI.lastDim;
      overlay.width = w; overlay.height = h;        // 캔버스 좌표계 = 사진 좌표계
      const k = Math.max(1, w / 640);               // 사진 크기에 비례한 선/글자 굵기
      octx.clearRect(0, 0, w, h);
      octx.lineWidth = 3 * k;
      octx.font = (18 * k) + "px 'Gowun Dodum', sans-serif";
      AI.lastBoxes.forEach(({ box, label, color }) => {
        const c = color || "#1f5f7a";
        const [x1, y1, x2, y2] = box;
        octx.strokeStyle = c;
        octx.strokeRect(x1, y1, x2 - x1, y2 - y1);
        const tw = octx.measureText(label).width;
        octx.fillStyle = c;
        octx.fillRect(x1, Math.max(0, y1 - 24 * k), tw + 12 * k, 24 * k);
        octx.fillStyle = "#fff";
        octx.fillText(label, x1 + 6 * k, Math.max(18 * k, y1 - 6 * k));
      });
    },
    clearStage() {
      AI.lastBoxes = []; AI._boxImg = null;
      octx.clearRect(0, 0, overlay.width, overlay.height);
      bigText.textContent = ""; bubble.style.display = "none";
      shotImg.style.display = "none";
      shownURL = null;
    },
    async wait(s) {
      const until = Date.now() + Number(s) * 1000;
      while (Date.now() < until) {
        if (RT.stopFlag) throw "STOP";
        await sleep(50);
      }
    },
  };

  /* ---------------- 실행/정지 ---------------- */
  G.STATEMENT_PREFIX = "await RT.step(%1);\n";
  G.INFINITE_LOOP_TRAP = "RT.loopTrap();\n";
  G.addReservedWords("AI,RT");

  const runButton = document.getElementById("runButton");
  const runLabel = document.getElementById("runLabel");
  const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor;

  document.getElementById("runButton").addEventListener("click", async () => {
    if (runButton.disabled) return;
    RT.stopFlag = false; RT.iter = 0;
    RT.voice = "F1"; RT.speed = "normal";   // 목소리·빠르기는 실행마다 기본값으로
    RT.aiCalls = 0; RT.lastAiAt = 0;
    RT.abort = new AbortController();
    RT._vars = {};
    document.getElementById("varsBox").style.display = "none";
    logBox.textContent = "";
    RT.clearStage();
    runButton.disabled = true; runLabel.textContent = t("running");
    let code = "";
    try {
      code = G.workspaceToCode(ws);          // 화면에서 도는 것 (블록 실행용)
      refreshPython();                        // 아래 패널에는 파이썬을 보여 준다
      if (!code.trim()) { log(t("m_assembleFirst")); return; }
      log(t("m_start"));
      if (window.vapiStat) vapiStat("block_run");
      const fn = new AsyncFunction("AI", "RT", "ED", code);
      await fn(AI, RT, ED);
      log(t("m_done"));
      if (window.vapiStat) vapiStat("block_done");
    } catch (e) {
      if (e === "STOP") { log(t("m_stopped")); if (window.vapiStat) vapiStat("block_stopped"); }
      else {
        log(t("m_error") + e); console.error(e, "\n--- code ---\n" + code);
        if (window.vapiStat) vapiStat("block_error");
      }
    } finally {
      ws.highlightBlock(null);
      runButton.disabled = false; runLabel.textContent = t("run");
    }
  });
  document.getElementById("stopButton").addEventListener("click", () => {
    RT.stopFlag = true;
    if (RT.abort) RT.abort.abort();          // 진행 중인 AI 요청 즉시 끊기
    RT._stopVoice();
  });

  /* ---------------- 새로 만들기 (블록 전부 지우기) ---------------- */
  document.getElementById("newButton").addEventListener("click", () => {
    if (ws.getTopBlocks(false).length && !confirm(t("m_askNew"))) return;
    ws.clear();                       // 블록 전부 지우기
    BLOCK_NAME = "";                  // 새 작품이 된다 (다음 저장 때 이름을 묻는다)
    showBlockFile();
    RT.stopFlag = true;               // 돌고 있으면 멈추고
    if (RT.abort) RT.abort.abort();
    RT._stopVoice();
    RT.clearStage();                  // 무대·기록도 함께 비운다
    log(t("m_newOk"));
  });

  /* ---------------- 저장/불러오기 ---------------- */
  /* 저장은 작업 폴더(blocks)로 간다 — 파이썬 화면과 같은 규약이다.
     예전에는 내려받기 폴더로 파일을 떨어뜨려서, 아이가 어디 갔는지 못 찾았고
     작업 폴더를 USB 로 옮겨도 블록 작품은 따라가지 않았다. */
  function showBlockFile() {
    const el = document.getElementById("curFile");
    if (el) el.textContent = BLOCK_NAME ? "— " + BLOCK_NAME : "— " + t("newFile");
  }

  document.getElementById("saveButton").addEventListener("click", async () => {
    /* 이름이 있으면 묻지 않고 그 작품에 덮어쓴다 */
    const name = BLOCK_NAME || prompt(t("savePrompt"), "");
    if (!name) return;
    const state = Blockly.serialization.workspaces.save(ws);
    try {
      const j = await (await fetch("/blocks/save", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: name, state: JSON.stringify(state, null, 2) }),
      })).json();
      if (j.result !== "ok") throw new Error(j.data);
      BLOCK_NAME = j.data.saved;
      showBlockFile();
      log(t("m_savedAs") + j.data.saved);
    } catch (e) { alert(t("m_saveFail") + (e.message || e)); }
  });

  document.getElementById("loadButton").addEventListener("click", async () => {
    /* 불러오기 = 탐색기 창을 띄워 작품 폴더에서 고른다.
       창이 안 되는 PC 에서는 아래 목록 방식으로 물러선다. */
    try {
      const r = await (await fetch("/system/pick_file", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ kind: "blocks" }),
      })).json();
      if (r.result === "ok") {
        if (r.data.canceled) return;
        Blockly.serialization.workspaces.load(JSON.parse(r.data.text), ws);
        BLOCK_NAME = r.data.name;
        showBlockFile();
        log(t("m_loaded") + r.data.name);
        return;
      }
    } catch (e) {}

    try {
      const j = await (await fetch("/blocks/works")).json();
      const list = j.data || [];
      if (!list.length) { alert(t("m_noWorks")); return; }
      const pick = prompt(t("m_pickWork") + "\n\n" +
        list.map((w, i) => (i + 1) + ". " + w.name).join("\n"), "1");
      const n = parseInt(pick, 10);
      if (!n || n < 1 || n > list.length) return;
      const w = list[n - 1];
      const r = await (await fetch("/blocks/work?name=" + encodeURIComponent(w.name))).json();
      if (r.result !== "ok") throw new Error(r.data);
      Blockly.serialization.workspaces.load(JSON.parse(r.data.state), ws);
      BLOCK_NAME = r.data.name;
      showBlockFile();
      log(t("m_loaded") + w.name);
    } catch (e) { alert(t("m_readFail") + (e.message || e)); }
  });
  document.getElementById("loadFile").addEventListener("change", function () {
    const f = this.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = e => {
      try {
        Blockly.serialization.workspaces.load(JSON.parse(e.target.result), ws);
        log(t("m_loaded") + f.name);
      } catch (err) { alert(t("m_readFail") + err); }
    };
    rd.readAsText(f);
    this.value = "";
  });

  </script>
  <script src="/lib/usage.js" data-page="blocks"></script>
  <script src="/lib/nav.js"></script>
  <script src="/lib/sysbar.js"></script>
