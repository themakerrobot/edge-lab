  <style>
    /* 타자 연습 — 한글(두벌식)·영어 자판. 자리 연습 → 낱말 → 문장 → 낱말 비 게임.
     *
     * 자리 연습은 입력칸 없이 e.code(누른 자판의 자리)로 본다 — 한/영 상태와 상관없이
     * "어느 손가락으로 어느 자리를 눌렀는지"만 본다. 낱말·문장·게임은 입력칸에 치고
     * 운영체제의 한글 입력기(IME)로 글자가 조합된다. 그래서 제출은 keyup 에서 본다:
     * 조합 중에 Enter 를 누르면 keydown 은 조합을 끝내는 데 쓰이고(isComposing),
     * keyup 때에야 입력칸에 완성된 글자가 들어 있다.
     *
     * 타수는 한글이면 자모 수(ㅘ·ㄳ 은 2타), 영어면 글자 수로 센다. 기록은 이 컴퓨터에만(localStorage).
     */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --ok: #2f8a4c; --bad: #c2412a; --f1: #f4dde6; --f2: #fbe8c8; --f3: #dcefd6; --f4: #d6e7f4; }
    html.hc { --ok: #1f6e38; --bad: #9e2e19; }
    body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; color: var(--ink); background: var(--paper);
           font-family: "Gowun Dodum", "Apple SD Gothic Neo", system-ui, sans-serif; line-height: 1.5;
           padding: var(--sp-2, 8px); gap: var(--sp-2, 8px); }
    button, input { font-family: inherit; color: var(--ink); }
    .btn { border: 1.5px solid var(--line-d); background: #fff; font-weight: 600; padding: 7px 13px; border-radius: var(--r); cursor: pointer;
           font-size: .92rem; min-height: 40px; }
    .btn.primary { background: var(--pen-blue); border-color: var(--pen-blue-d); color: #fff; }
    .panel.side { flex: 0 0 270px; } .panel.main { flex: 1 1 auto; }
    .hint { font-size: var(--fs-side, 13px); color: var(--ink-2); }
    .st { font-weight: 700; font-size: var(--fs-head, 14px); color: var(--cyan-d); }
    .sec { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; border-top: 1.5px dashed var(--line); }
    .sec[hidden] { display: none; }
    .seg { display: flex; border: 1.5px solid var(--line-d); border-radius: var(--r); overflow: hidden; }
    .seg button { flex: 1; border: 0; background: #fff; min-height: var(--tap, 48px); font-size: 1rem; font-weight: 600; cursor: pointer; }
    .seg button + button { border-left: 1.5px solid var(--line-d); }
    .seg button.on { background: var(--pen-blue); color: #fff; }
    .modes { display: flex; flex-direction: column; gap: 6px; }
    .modes button { display: flex; flex-direction: column; align-items: flex-start; min-height: var(--tap, 48px); padding: 7px 12px; text-align: left;
                    border: 1.5px solid var(--line); border-radius: var(--r); background: #fff; cursor: pointer; }
    .modes button b { font-size: 1rem; } .modes button small { font-size: var(--fs-side, 13px); color: var(--ink-2); }
    .modes button.on { border-color: var(--cyan); background: var(--cyan-bg); }
    .lessons { display: flex; flex-wrap: wrap; gap: 6px; }
    .lessons button { border: 1.5px solid var(--line); background: #fff; border-radius: 16px; padding: 4px 12px; min-height: 36px; cursor: pointer; font-size: .9rem; }
    .lessons button.on { border-color: var(--pen-blue); background: var(--pen-blue); color: #fff; }
    .best { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: var(--fs-side, 13px); }
    .best b { font-family: Menlo, Consolas, monospace; font-weight: 700; text-align: right; }

    .stats { display: flex; gap: 10px; flex-wrap: wrap; }
    .stat { flex: 1 1 110px; border: 1.5px solid var(--line); border-radius: var(--r); background: #fff; padding: 6px 10px; }
    .stat small { display: block; font-size: var(--fs-side, 13px); color: var(--ink-2); }
    .stat b { font-family: Menlo, Consolas, monospace; font-size: 1.35rem; }
    .imewarn { background: #fdecc8; border: 1.5px solid #e0a030; border-radius: var(--r); padding: 6px 10px; font-weight: 600; }

    /* 자리 연습 */
    .keysview { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; outline: none; }
    .target { font-size: 5rem; line-height: 1; font-weight: 700; min-width: 1.4em; text-align: center; padding: 10px 26px; border-radius: 16px;
              background: #fff; border: 2px solid var(--line); }
    .target.bad { animation: shake .25s; border-color: var(--bad); }
    @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    .queue { font-size: 1.5rem; letter-spacing: .4em; color: var(--ink-2); min-height: 2rem; }
    .finger { font-weight: 700; color: var(--cyan-d); min-height: 1.5rem; }
    .kb { display: flex; flex-direction: column; gap: 6px; user-select: none; }
    .kb .r { display: flex; gap: 6px; }
    .kb .r:nth-child(2) { margin-left: 22px; } .kb .r:nth-child(3) { margin-left: 50px; }
    .kb .k { width: 54px; height: 54px; border-radius: 9px; border: 1.5px solid var(--line); display: flex; flex-direction: column;
             align-items: center; justify-content: center; font-size: 1.15rem; font-weight: 700; position: relative; }
    .kb .k small { position: absolute; left: 5px; top: 2px; font-size: 10px; font-weight: 400; color: var(--ink-2); }
    .kb .k.f1 { background: var(--f1); } .kb .k.f2 { background: var(--f2); } .kb .k.f3 { background: var(--f3); } .kb .k.f4 { background: var(--f4); }
    .kb .k.home::after { content: ""; position: absolute; bottom: 6px; width: 12px; height: 2px; background: var(--ink-2); border-radius: 1px; }
    .kb .k.on { outline: 4px solid var(--pen-blue); outline-offset: 1px; background: var(--pen-blue); color: #fff; }
    .kb .k.on small { color: #dfe9ef; }
    .kb .k.dim { opacity: .35; }
    .kb .k.wide { width: 120px; font-size: .85rem; font-weight: 600; }
    .kb .k.space { width: 330px; font-size: .85rem; font-weight: 600; }
    .kb .r.last { justify-content: center; margin-left: 0; }

    /* 낱말·문장 */
    .typeview { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
    .line { font-size: 2.4rem; font-weight: 700; letter-spacing: .02em; text-align: center; min-height: 3.4rem; word-break: keep-all; }
    .line.sent { font-size: 1.8rem; }
    .line span.ok { color: var(--ok); } .line span.no { color: #fff; background: var(--bad); border-radius: 4px; }
    .line span.now { text-decoration: underline 3px var(--pen-blue); text-underline-offset: 6px; }
    .next { color: var(--ink-2); font-size: 1.1rem; min-height: 1.6rem; }
    .inp { width: min(640px, 100%); font-size: 1.8rem; padding: 10px 14px; border: 2px solid var(--line-d); border-radius: 10px; text-align: center; background: #fff; }
    .inp:focus { outline: 3px solid var(--cyan-bg); border-color: var(--cyan); }
    .bar { width: min(640px, 100%); height: 10px; border-radius: 5px; background: #ece5d6; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .15s; }

    /* 게임 */
    .rain { position: relative; overflow: hidden; border: 1.5px solid var(--line); border-radius: var(--r);
            background: linear-gradient(#eaf2f6, #fbf7ef 80%); min-height: 240px; }
    .rain { flex: 1 1 auto; }
    .rain .w { position: absolute; top: 0; left: 0; padding: 3px 12px; border-radius: 14px; background: #fff; border: 1.5px solid var(--line-d);
               font-size: 1.35rem; font-weight: 700; white-space: nowrap; will-change: transform; }
    .rain .w.hit { background: var(--ok); color: #fff; border-color: var(--ok); transition: opacity .3s, transform .3s; opacity: 0; }
    .rain .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: #b99d7a; }
    .rain .msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
                 background: rgba(251,247,239,.86); text-align: center; font-size: 1.1rem; }
    .rain .msg[hidden] { display: none; }
    .rain .msg b { font-size: 2rem; }
    .hearts { letter-spacing: 2px; color: var(--bad); font-size: 1.25rem; }
    .result { text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; }
    .result b { font-size: 1.6rem; }
    .result .new { color: var(--ok); font-weight: 700; }

    @media (max-width: 1439px) { .panel.side { flex-basis: 240px; } .kb .k { width: 48px; height: 48px; } .kb .k.space { width: 280px; } }
    @media (max-width: 1023px) { .main-container { flex-direction: column; } .panel.side, .panel.main { flex: 0 0 auto; }
                                 .panel, .panel-body { overflow: visible; } body { overflow: auto; height: auto; } .rain { height: 360px; } }

      $("inp").style.alignSelf = "center";
      $("inp").placeholder = t("wordPh");
      $("gGo").addEventListener("click", goGame);
      var inp = $("inp");
      inp.addEventListener("paste", function (e) { e.preventDefault(); });
      inp.addEventListener("input", function () { checkIme(inp.value); });
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") e.preventDefault(); });
      inp.addEventListener("keyup", function (e) { if (!e.isComposing && (e.key === "Enter" || e.key === " ")) shoot(); });
    }
    function goGame() {
      $("gMsg").hidden = true; run.on = true; run.last = performance.now(); run.spawn = 0;
      $("inp").focus();
      requestAnimationFrame(tickGame);
    }
    function tickGame(now) {
      if (!run || run.kind !== "game" || !run.on) return;
      if (run.paused) { run.last = now; requestAnimationFrame(tickGame); return; }
      var dt = Math.min(0.1, (now - run.last) / 1000); run.last = now;
      var rain = $("rain"), H = rain.clientHeight, W = rain.clientWidth;
      var speed = 26 + run.level * 7, every = Math.max(1.0, 2.8 - run.level * 0.22);
      run.spawn -= dt;
      if (run.spawn <= 0) {
        run.spawn = every;
        var pool = WORDS[kbl].filter(function (w) { return !run.words.some(function (x) { return x.text === w; }); });
        var el = document.createElement("div"); el.className = "w";
        el.textContent = pool[(Math.random() * pool.length) | 0];
        rain.appendChild(el);
        var x = Math.random() * Math.max(10, W - el.offsetWidth - 10) + 5;
        run.words.push({ el: el, text: el.textContent, x: x, y: -30 });
      }
      for (var i = run.words.length - 1; i >= 0; i--) {
        var w = run.words[i];
        w.y += speed * dt;
        w.el.style.transform = "translate(" + w.x + "px," + w.y + "px)";
        if (w.y > H - 40) {
          w.el.remove(); run.words.splice(i, 1);
          run.life--;
          $("sLife").textContent = "♥♥♥♥♥".slice(0, Math.max(0, run.life)) + "♡♡♡♡♡".slice(0, 5 - Math.max(0, run.life));
          if (run.life <= 0) return overGame();
        }
      }
      requestAnimationFrame(tickGame);
    }
    function shoot() {
      var inp = $("inp"), v = inp.value.trim(); inp.value = ""; $("imeWarn").hidden = true;
      if (!v || !run || !run.on) return;
      var hit = null;
      run.words.forEach(function (w) { if (w.text === v && (!hit || w.y > hit.y)) hit = w; });   // 같은 낱말이면 땅에 가까운 것부터
      if (!hit) return;
      run.words.splice(run.words.indexOf(hit), 1);
      hit.el.classList.add("hit");
      setTimeout(function () { hit.el.remove(); }, 300);
      run.popped++; run.score += strokes(v) * 10 * run.level;
      run.level = 1 + Math.floor(run.popped / 8);
      $("sScore").textContent = run.score; $("sLevel").textContent = run.level;
    }
    function overGame() {
      run.on = false;
      run.words.forEach(function (w) { w.el.remove(); });
      var isNew = putBest("game", run.score);
      var m = $("gMsg"); m.hidden = false;
      m.innerHTML = "<b>" + esc(t("gameOver")) + "</b><div>" + esc(t("gameScore").replace("{s}", run.score).replace("{n}", run.popped)) + "</div>" +
        (isNew ? '<div class="new" style="color:var(--ok);font-weight:700">' + esc(t("newBest")) + "</div>" : "") +
        '<button class="btn primary" type="button" id="gAgain">' + esc(t("again")) + "</button>";
      $("gAgain").addEventListener("click", start);
      if (window.vapiStat) vapiStat("typing_game");
    }

    /* ── 고르기 ── */
    var MODES = [["keys", "mKeys", "mKeysD"], ["words", "mWords", "mWordsD"], ["sent", "mSent", "mSentD"], ["game", "mGame", "mGameD"]];
    function paintSide() {
      Array.prototype.forEach.call($("kbSeg").children, function (b) { b.classList.toggle("on", b.getAttribute("data-kb") === kbl); });
      $("modes").innerHTML = MODES.map(function (m) {
        return '<button type="button" data-m="' + m[0] + '"' + (m[0] === mode ? ' class="on"' : "") + "><b>" + esc(t(m[1])) + "</b><small>" + esc(t(m[2])) + "</small></button>";
      }).join("");
      $("lessons").innerHTML = [1, 2, 3, 4, 5, 6].map(function (n) {
        var name = n === 6 ? t(kbl === "ko" ? "L6ko" : "L6en") : t("L" + n);
        return '<button type="button" data-l="' + n + '"' + (n === lesson ? ' class="on"' : "") + ">" + esc(name) + "</button>";
      }).join("");
      $("lessonSec").hidden = mode !== "keys";
      var m = MODES.filter(function (x) { return x[0] === mode; })[0];
      $("modeTitle").textContent = t(m[1]) + " · " + (kbl === "ko" ? "한글" : "English");
      paintBest();
    }
    function stop() {
      if (run && run.kind === "game") { run.on = false; }
      run = null;
      $("imeWarn").hidden = true; $("stage").style.alignItems = "";
    }
    function start() {
      stop(); paintSide();
      if (mode === "keys") startKeys(); else if (mode === "game") startGame(); else startType(mode);
    }
    $("kbSeg").addEventListener("click", function (e) {
      var b = e.target.closest("[data-kb]"); if (!b) return;
      kbl = b.getAttribute("data-kb");
      try { localStorage.setItem("el-typing-kb", kbl); } catch (err) {}
      start();
    });
    $("modes").addEventListener("click", function (e) { var b = e.target.closest("[data-m]"); if (b) { mode = b.getAttribute("data-m"); start(); } });
    $("lessons").addEventListener("click", function (e) { var b = e.target.closest("[data-l]"); if (b) { lesson = +b.getAttribute("data-l"); start(); } });
    $("stage").addEventListener("click", function (e) {
      if (e.target.closest("button")) return;
      var f = $("inp") || $("keysView"); if (f) f.focus();      // 어디를 눌러도 치던 곳으로
    });

    /* 가려지면 낱말 비를 멈춘다 — 보지 못하는 사이에 목숨이 줄지 않게. 다시 보이면 이어서 */
    if (window.EL_WIN) {
      EL_WIN.onHide(function () { if (run && run.kind === "game") run.paused = true; });
      EL_WIN.onShow(function () { if (run && run.kind === "game") { run.paused = false; var i = $("inp"); if (i) i.focus(); } });
    }

    $("langButton").addEventListener("click", function () {
      try { localStorage.setItem("vapiLang", LANG === "ko" ? "en" : "ko"); } catch (e) {}
      location.reload();
    });
    document.title = t("title"); $("langButton").textContent = t("lang");
    $("txtQ1").textContent = t("q1"); $("txtLesson").textContent = t("lesson"); $("txtBest").textContent = t("best");
    start();
    window.EL_TYPING = { get run() { return run; }, strokes: strokes };      // 시험용
  })();
  </script>
  <script src="/lib/shell.js"></script>
  <script src="/lib/usage.js" data-page="typing"></script>
  <i id="el-built" hidden></i>
</body>
</html>
