<head>

  <style>
    /* 피아노 — 건반·드럼·박자기·녹음을 한 화면에. 소리는 전부 브라우저가 그 자리에서 만든다
     * (Web Audio 발진기 + 잡음). 녹음 파일(샘플)이 없어서 인터넷도 서버 AI 도 필요 없다.
     *
     * 건반은 두 옥타브(도4~시5). 마우스·손가락(여러 개)·키보드 두 줄로 친다.
     * 따라 치기는 다음에 칠 건반을 반짝이고, 맞는 건반을 눌러야 한 칸 넘어간다 — 박자는 안 본다.
     * 노래는 저작권이 끝난 민요·고전만 넣었다.
     */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --c0: #d9483b; --c2: #e88327; --c4: #d6b21f; --c5: #3f9a4a; --c7: #2f7fc4; --c9: #4a55b0; --c11: #8a4fa8;
            --hit: #ffd35c; --hit-d: #c99a12; --good: #3a9a55; --bad: #c2412a; }
    html.hc { --hit: #ffc933; --good: #237a3b; --bad: #9e2e19; }
    body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; color: var(--ink); background: var(--paper);
           font-family: "Gowun Dodum", "Apple SD Gothic Neo", system-ui, sans-serif; line-height: 1.5;
           padding: var(--sp-2, 8px); gap: var(--sp-2, 8px); }
    button, input { font-family: inherit; color: var(--ink); }
    .btn { border: 1.5px solid var(--line-d); background: #fff; font-weight: 600; padding: 4px 12px; border-radius: var(--r); cursor: pointer;
           font-size: .92rem; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
    .btn.primary { background: var(--pen-blue); border-color: var(--pen-blue-d); color: #fff; }
    .btn.rec { color: var(--pen-red); border-color: var(--pen-red); }
    .btn.rec.on { background: var(--pen-red); color: #fff; }
    .btn.on { background: var(--cyan-bg); border-color: var(--cyan); color: var(--cyan-d); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn svg { width: 16px; height: 16px; flex: 0 0 auto; }
    .btn.sq { width: 40px; padding: 0; }
    .panel-head .btn { min-height: 32px; }

    .panel.side { flex: 0 0 272px; } .panel.play { flex: 1 1 auto; } .panel.more { flex: 0 0 290px; }
    .st { font-weight: 700; font-size: var(--fs-head, 14px); color: var(--cyan-d); display: flex; align-items: center; gap: 6px; }
    .st .sp { flex: 1; }
    .hint { font-size: var(--fs-side, 13px); color: var(--ink-2); }
    .sec { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; border-top: 1.5px dashed var(--line); }
    .sec:first-child { padding-top: 0; border-top: 0; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .num { font-family: Menlo, Consolas, monospace; font-size: var(--fs-mono, 13px); }
    .keymap { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center; font-size: var(--fs-side, 13px); color: var(--ink-2); }
    .keymap > span:nth-child(odd) { white-space: nowrap; }
    kbd { font-family: Menlo, Consolas, monospace; font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
          padding: 0 4px; background: #fff; }

    /* 악기 — 넷 중 하나 */
    .inst { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .inst button { min-height: var(--tap, 48px); border: 1.5px solid var(--line); border-radius: var(--r); background: #fff; cursor: pointer;
                   display: flex; align-items: center; gap: 8px; padding: 4px 10px; font-size: .98rem; font-weight: 600; }
    .inst button svg { width: 26px; height: 26px; flex: 0 0 auto; }
    .inst button.on { border-color: var(--cyan); background: var(--cyan-bg); color: var(--cyan-d); box-shadow: inset 0 0 0 1px var(--cyan); }

    .seg { display: inline-flex; border: 1.5px solid var(--line-d); border-radius: var(--r); overflow: hidden; }
    .seg button { border: 0; background: #fff; padding: 0 12px; min-height: 40px; font-size: .92rem; font-weight: 600; cursor: pointer; }
    .seg button + button { border-left: 1.5px solid var(--line-d); }
    .seg button.on { background: var(--pen-blue); color: #fff; }
    .lr { display: flex; align-items: center; gap: 8px; }
    .lr > span:first-child { flex: 0 0 auto; min-width: 58px; font-size: var(--fs-side, 13px); font-weight: 600; }
    .lr .grow1 { flex: 1; min-width: 0; }
    input[type=range] { width: 100%; accent-color: var(--pen-blue); height: 28px; cursor: pointer; }
    .val { min-width: 34px; text-align: right; }

    /* 박자기 */
    .bpm { font-family: Menlo, Consolas, monospace; font-size: 1.5rem; font-weight: 700; min-width: 56px; text-align: center; }
    .beats { display: flex; gap: 6px; }
    .beats i { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); background: #fff; transition: background .05s; }
    .beats i.on { background: var(--pen-blue); border-color: var(--pen-blue-d); }
    .beats i.on.acc { background: var(--pen-red); border-color: var(--pen-red); }

    /* 따라 치기 띠 */
    .follow { border: 1.5px solid var(--line); border-radius: var(--r); background: #fffdf8; padding: 6px 8px; display: flex; flex-direction: column; gap: 6px; }
    .follow .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .follow .top b { font-size: 1.02rem; }
    .follow .top .sp { flex: 1; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; max-height: 69px; overflow-y: auto; position: relative; }
    .chips span { min-width: 34px; padding: 2px 6px; border-radius: 8px; border: 1.5px solid var(--line); background: #fff; text-align: center;
                  font-weight: 700; font-size: .95rem; border-bottom-width: 4px; }
    .chips span.done { opacity: .45; background: #e6f3e8; }
    .chips span.cur { background: var(--hit); border-color: var(--hit-d); transform: translateY(-1px); }
    .chips span.wrong { background: #f7d4cb; border-color: var(--bad); }
    .chips span.gap { margin-right: 10px; }
    /* 높은 옥타브는 음 이름 위에 점 — 악보에서 높은 도를 적는 방식 (CDE 는 숫자가 붙어 필요 없다) */
    body[data-names=ko] .wk.hi .nm, body[data-names=ko] .chips span.hi { position: relative; }
    body[data-names=ko] .wk.hi .nm::before, body[data-names=ko] .chips span.hi::before {
      content: ""; position: absolute; left: 50%; top: -3px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: currentColor; }
    body[data-names=ko] .chips span.hi::before { top: 1px; width: 4px; height: 4px; margin-left: -2px; }
    .done-msg { color: var(--good); font-weight: 700; }

    /* 건반 */
    .kbwrap { display: flex; min-height: 190px; }
    .kb { position: relative; flex: 1; display: flex; touch-action: none; user-select: none; -webkit-user-select: none; max-height: 470px;
          border-top: 6px solid #3b332a; border-radius: 4px; }
    .wk { flex: 1 1 0; min-width: 0; position: relative; background: #fff; border: 1.5px solid var(--line-d); border-top: 0; margin-left: -1.5px;
          border-radius: 0 0 10px 10px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 2px;
          padding-bottom: 8px; cursor: pointer; }
    .wk:first-child { margin-left: 0; }
    .wk::after { content: ""; position: absolute; left: 18%; right: 18%; bottom: 3px; height: 4px; border-radius: 2px; background: var(--pc, transparent); }
    .wk .nm { font-weight: 700; font-size: 1.05rem; line-height: 1.1; }
    .wk .lt, .bk .lt { font-family: Menlo, Consolas, monospace; font-size: 12px; color: var(--ink-2); min-height: 16px; white-space: nowrap; }
    .bk { position: absolute; top: 0; height: 60%; width: calc(100% / 14 * .62); transform: translateX(-50%); z-index: 2;
          background: linear-gradient(#3a332c, #1e1a16); border: 1.5px solid #120f0c; border-top: 0; border-radius: 0 0 6px 6px;
          display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 6px; cursor: pointer; }
    .bk .lt { color: #e9e2d4; }
    .bk .nm { color: #cfc6b5; font-size: 11px; font-weight: 700; }
    .wk.on { background: var(--cyan-bg); box-shadow: inset 0 -6px 0 var(--cyan); }
    .bk.on { background: linear-gradient(#2c5d73, #17475c); }
    .wk.next { background: #fff1c7; box-shadow: inset 0 0 0 3px var(--hit-d); animation: nx 1s ease-in-out infinite; }
    .bk.next { background: linear-gradient(#e0a92a, #b47f0c); animation: nx 1s ease-in-out infinite; }
    @keyframes nx { 50% { filter: brightness(1.07); } }
    @media (prefers-reduced-motion: reduce) { .wk.next, .bk.next { animation: none; } }

    /* 드럼 */
    .drums { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
    .drums button { min-height: 64px; border-radius: 12px; border: 1.5px solid var(--line-d); background: #fff; cursor: pointer; touch-action: none;
                    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; font-weight: 700; font-size: .98rem;
                    border-bottom-width: 4px; user-select: none; }
    .drums button small { font-family: Menlo, Consolas, monospace; font-size: 12px; color: var(--ink-2); font-weight: 400; }
    .drums button.hit { transform: translateY(2px); border-bottom-width: 2px; background: var(--hit); }

    /* 녹음 · 칸 */
    .recst { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: var(--r); background: #f4efe4; font-size: var(--fs-side, 13px); min-height: 36px; }
    .recst .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); flex: 0 0 auto; }
    .recst.rec .dot { background: var(--pen-red); animation: bl 1s steps(2) infinite; }
    .recst.play .dot { background: var(--good); }
    @keyframes bl { 50% { opacity: .2; } }
    .recrow { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .recrow .btn { min-height: var(--tap, 48px); padding: 4px 6px; }
    .slots { display: flex; flex-direction: column; gap: 4px; }
    .slot { display: flex; align-items: center; gap: 6px; }
    .slot .nm { flex: 1; min-width: 0; font-size: var(--fs-side, 13px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .slot .nm b { font-weight: 700; margin-right: 4px; }
    .slot .btn { min-height: 36px; padding: 2px 10px; font-size: .88rem; }

    /* 노래 고르기 */
    .songs { display: flex; flex-direction: column; gap: 6px; }
    .songs button { display: flex; align-items: center; gap: 8px; min-height: var(--tap, 48px); padding: 4px 10px; text-align: left;
                    border: 1.5px solid var(--line); border-radius: var(--r); background: #fff; cursor: pointer; }
    .songs button b { display: block; font-size: .98rem; font-weight: 600; }
    .songs button small { display: block; font-size: var(--fs-side, 13px); color: var(--ink-2); }
    .songs button svg { width: 22px; height: 22px; flex: 0 0 auto; color: var(--cyan-d); }
    .songs button.on { border-color: var(--cyan); background: var(--cyan-bg); }
    .songs button:hover { background: var(--hover-bg); } .songs button.on:hover { background: var(--cyan-bg); }

    #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px;
             border-radius: 10px; font-size: .95rem; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 5; }
    #toast.on { opacity: 1; }

    @media (max-width: 1439px) { .panel.side { flex-basis: 256px; } .panel.more { flex-basis: 270px; } }
    @media (max-width: 1023px) { .main-container { flex-direction: column; } .panel.side, .panel.more, .panel.play { flex: 0 0 auto; }
                                 .panel, .panel-body { overflow: visible; } body { overflow: auto; height: auto; }
                                 .panel.play { order: -1; } .kbwrap { height: 260px; } .drums { grid-template-columns: repeat(3, 1fr); } }
  </style>

<body data-density="explore">
  <div class="titlebar">
    <a class="tb-brand" href="/" title="인터넷 없이 내 컴퓨터에서 실행돼요"><img src="/assets/pibo-logo.png" alt=""><b>edge-lab</b></a>
    <span class="tb-sep"></span><span class="tb-app" id="txtTitle"></span>
    <div class="h-tools"><button id="langButton" title="한국어 / English">EN</button></div>
  </div>
  <div class="shell-body"><div class="workbench"><div class="main-container">

    <div class="panel side">
      <div class="panel-head"><span class="q"><span class="qnum">1</span><span class="qtext" id="txtQ1"></span></span></div>
      <div class="panel-body">
        <div class="sec">
          <div class="st" id="txtInst"></div>
          <div class="inst" id="inst"></div>
        </div>
        <div class="sec">
          <div class="lr"><span id="txtVol"></span><input class="grow1" type="range" id="vol" min="0" max="100" step="1"><span class="num val" id="volVal"></span></div>
          <div class="lr"><span id="txtSus"></span><button class="btn grow1" type="button" id="susBtn"></button></div>
          <div class="lr"><span id="txtNames"></span>
            <div class="seg" id="nameSeg"><button type="button" data-n="ko">도레미</button><button type="button" data-n="en">CDE</button></div></div>
          <div class="lr"><span id="txtOct"></span>
            <button class="btn sq" type="button" id="octDown" aria-label="-">&minus;</button>
            <span class="num val" id="octVal" style="text-align:center"></span>
            <button class="btn sq" type="button" id="octUp" aria-label="+">+</button>
            <span class="hint"><kbd>←</kbd> <kbd>→</kbd></span></div>
        </div>
        <div class="sec">
          <div class="st"><span id="txtMetro"></span><span class="sp"></span><div class="beats" id="beats"></div></div>
          <div class="lr">
            <button class="btn sq" type="button" id="bpmDown" aria-label="-">&minus;</button>
            <input class="grow1" type="range" id="bpm" min="60" max="180" step="1">
            <button class="btn sq" type="button" id="bpmUp" aria-label="+">+</button>
          </div>
          <div class="row">
            <span class="bpm" id="bpmVal"></span><span class="hint">BPM</span><span style="flex:1"></span>
            <div class="seg" id="beatSeg"><button type="button" data-b="2">2</button><button type="button" data-b="3">3</button><button type="button" data-b="4">4</button></div>
          </div>
          <button class="btn primary" type="button" id="metroBtn" style="min-height:var(--tap,48px)"></button>
        </div>
        <div class="sec">
          <div class="st" id="txtKeys"></div>
          <div class="keymap" id="keymap"></div>
        </div>
      </div>
    </div>

    <div class="panel play">
      <div class="panel-head"><span class="q"><span class="qnum">2</span><span class="qtext" id="txtQ2"></span></span></div>
      <div class="panel-body">
        <div class="follow" id="follow"></div>
        <div class="kbwrap grow"><div class="kb" id="kb"></div></div>
        <div class="st" id="txtDrums"></div>
        <div class="drums" id="drums"></div>
      </div>
    </div>

    <div class="panel more">
      <div class="panel-head"><span class="q"><span class="qnum">3</span><span class="qtext" id="txtQ3"></span></span></div>
      <div class="panel-body">
        <div class="sec">
          <div class="st" id="txtRec"></div>
          <div class="recrow">
            <button class="btn rec" type="button" id="recBtn"></button>
            <button class="btn" type="button" id="playBtn"></button>
            <button class="btn" type="button" id="clearBtn"></button>
          </div>
          <div class="recst" id="recSt"><span class="dot"></span><span id="recTxt"></span></div>
          <div class="slots" id="slots"></div>
        </div>
        <div class="sec">
          <div class="st" id="txtSongs"></div>
          <div class="songs" id="songs"></div>
        </div>
      </div>
    </div>

  </div></div></div>
  <div id="toast"></div>

      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "square"; o.frequency.value = acc ? 1760 : 1100;
      g.gain.setValueAtTime(acc ? .32 : .18, time); g.gain.exponentialRampToValueAtTime(.0005, time + .05);
      o.connect(g); g.connect(master); o.start(time); o.stop(time + .06);
    }
    function tick() {
      while (metro.next < ctx.currentTime + .12) {
        (function (b, when) {
          click(when, b === 0);
          metro.vis.push(setTimeout(function () { lightBeat(b); }, Math.max(0, (when - ctx.currentTime) * 1000)));
        })(metro.beat, metro.next);
        if (metro.vis.length > 16) metro.vis.shift();
        metro.count++;
        metro.beat = (metro.beat + 1) % set.beats;
        metro.next += 60 / set.bpm;
      }
    }
    function lightBeat(b) {
      Array.prototype.forEach.call($("beats").children, function (el, i) { el.className = i === b ? "on" + (i === 0 ? " acc" : "") : ""; });
    }
    function metroStart() {
      if (metro.on || !audio()) return;
      metro.on = true; metro.beat = 0; metro.next = ctx.currentTime + .06;
      metro.timer = setInterval(tick, 25); tick();
      paintMetro();
      if (window.vapiStat) vapiStat("piano_metro");
    }
    function metroStop() {
      if (!metro.on) return;
      metro.on = false; clearInterval(metro.timer);
      metro.vis.forEach(clearTimeout); metro.vis = [];
      lightBeat(-1); paintMetro();
    }
    function paintMetro() {
      $("metroBtn").innerHTML = (metro.on ? IC.stop : IC.play) + "<span>" + (metro.on ? t("stop") : t("start")) + "</span>";
      $("metroBtn").classList.toggle("primary", !metro.on);
      $("metroBtn").classList.toggle("on", metro.on);
    }
    function setBpm(v) { set.bpm = Math.max(60, Math.min(180, Math.round(v))); $("bpm").value = set.bpm; $("bpmVal").textContent = set.bpm; keep(); }
    $("metroBtn").addEventListener("click", function () { if (metro.on) metroStop(); else metroStart(); });
    $("bpm").addEventListener("input", function () { setBpm(+this.value); });
    $("bpmDown").addEventListener("click", function () { setBpm(set.bpm - 5); });
    $("bpmUp").addEventListener("click", function () { setBpm(set.bpm + 5); });
    $("beatSeg").addEventListener("click", function (e) {
      var b = e.target.closest("[data-b]"); if (!b) return;
      set.beats = +b.getAttribute("data-b"); metro.beat = 0; keep(); paintBeats();
    });

    /* ───────── 녹음 · 듣기 · 칸 ───────── */
    var rec = { on: false, t0: 0, ev: [], len: 0, timer: 0 };
    var pb = { on: false, timers: [], t0: 0, len: 0, tick: 0 };
    var SLOTS = 3, slots = [];
    try { slots = JSON.parse(localStorage.getItem("el-piano-rec") || "[]") || []; } catch (e) {}
    function notes(ev) { return ev.filter(function (x) { return x[1] !== 0; }).length; }
    function secs(ms) { return Math.round(ms / 100) / 10; }

    function recStart() {
      stopPlay();
      rec.on = true; rec.t0 = performance.now(); rec.ev = []; rec.len = 0;
      clearInterval(rec.timer); rec.timer = setInterval(paintRec, 250);
      paintRec();
    }
    function recStop() {
      if (!rec.on) return;
      /* 녹음 중에 누르고 있던 음은 여기서 떼 준다 — 듣기에서 끝없이 울리지 않게 */
      var now = Math.round(performance.now() - rec.t0), open = {};
      rec.ev.forEach(function (x) { if (x[1] === 1) open[x[2]] = (open[x[2]] || 0) + 1; else if (x[1] === 0 && open[x[2]]) open[x[2]]--; });
      Object.keys(open).forEach(function (m) { for (var i = 0; i < open[m]; i++) rec.ev.push([now, 0, +m]); });
      rec.on = false; rec.len = now; clearInterval(rec.timer);
      /* 첫 음 앞의 빈 시간은 잘라 낸다 — [녹음] 누르고 한참 뒤에 쳐도 바로 들리게 */
      if (rec.ev.length) {
        var first = rec.ev[0][0];
        rec.ev.forEach(function (x) { x[0] -= first; }); rec.len -= first;
        if (window.vapiStat) vapiStat("piano_rec");
      } else rec.len = 0;
      paintRec();
    }
    function play(ev, len, then) {
      stopPlay(); if (rec.on) recStop();
      if (!ev.length || !audio()) return;
      pb.on = true; pb.t0 = performance.now(); pb.len = len;
      ev.forEach(function (x) {
        pb.timers.push(setTimeout(function () {
          if (x[1] === 1) noteOn(x[2], "pb", x[3]);
          else if (x[1] === 0) noteOff(x[2], "pb");
          else drum(x[2], "pb");
        }, x[0]));
      });
      pb.timers.push(setTimeout(function () { stopPlay(); if (then) then(); }, len + 400));
      clearInterval(pb.tick); pb.tick = setInterval(paintRec, 250);
      paintRec();
    }
    function stopPlay() {
      pb.timers.forEach(clearTimeout); pb.timers = []; clearInterval(pb.tick);
      var was = pb.on; pb.on = false;
      allOff("pb");
      if (was) { paintRec(); paintFollow(); }
    }
    function paintRec() {
      var st = $("recSt"), n = notes(rec.ev);
      st.className = "recst" + (rec.on ? " rec" : pb.on ? " play" : "");
      $("recTxt").textContent = rec.on ? fmt(t("recOn"), { s: Math.floor((performance.now() - rec.t0) / 1000), n: n })
        : pb.on ? fmt(t("playing"), { s: Math.floor((performance.now() - pb.t0) / 1000) })
        : rec.ev.length ? fmt(t("recHas"), { n: n, s: secs(rec.len) }) : t("recEmpty");
      $("recBtn").innerHTML = (rec.on ? IC.stop : IC.rec) + "<span>" + (rec.on ? t("recStop") : t("recGo")) + "</span>";
      $("recBtn").classList.toggle("on", rec.on);
      $("playBtn").innerHTML = (pb.on ? IC.stop : IC.play) + "<span>" + (pb.on ? t("playStop") : t("play")) + "</span>";
      $("playBtn").disabled = !pb.on && (rec.on || !rec.ev.length);
      $("clearBtn").innerHTML = IC.trash + "<span>" + t("clear") + "</span>";
      $("clearBtn").disabled = rec.on || !rec.ev.length;
    }
    function paintSlots() {
      var h = "";
      for (var i = 0; i < SLOTS; i++) {
        var s = slots[i];
        h += '<div class="slot"><span class="nm"><b>' + fmt(t("slot"), { n: i + 1 }) + "</b>" +
             (s && s.ev ? fmt(t("recHas"), { n: notes(s.ev), s: secs(s.len) }) : t("slotEmpty")) + "</span>" +
             '<button class="btn" type="button" data-save="' + i + '">' + t("save") + "</button>" +
             '<button class="btn" type="button" data-load="' + i + '"' + (s && s.ev ? "" : " disabled") + ">" + t("load") + "</button></div>";
      }
      $("slots").innerHTML = h;
    }
    $("recBtn").addEventListener("click", function () { if (rec.on) recStop(); else recStart(); });
    $("playBtn").addEventListener("click", function () { if (pb.on) stopPlay(); else play(rec.ev, rec.len); });
    $("clearBtn").addEventListener("click", function () { stopPlay(); rec.ev = []; rec.len = 0; paintRec(); });
    $("slots").addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b) return;
      if (b.hasAttribute("data-save")) {
        var i = +b.getAttribute("data-save");
        if (rec.on) recStop();
        if (!rec.ev.length) { toast(t("nothing")); return; }
        if (slots[i] && slots[i].ev && !confirm(fmt(t("saveAsk"), { n: i + 1 }))) return;
        var keepOld = slots[i];
        slots[i] = { ev: rec.ev.slice(), len: rec.len, at: Date.now() };
        try { localStorage.setItem("el-piano-rec", JSON.stringify(slots)); toast(fmt(t("saved"), { n: i + 1 })); }
        catch (x) { slots[i] = keepOld; toast(t("full")); }
        paintSlots();
      } else if (b.hasAttribute("data-load")) {
        var s = slots[+b.getAttribute("data-load")]; if (!s || !s.ev) return;
        if (rec.on) recStop();
        stopPlay();
        rec.ev = s.ev.map(function (x) { return x.slice(); }); rec.len = s.len;
        paintRec(); toast(fmt(t("loaded"), { n: +b.getAttribute("data-load") + 1 }));
      }
    });

    /* ───────── 노래 따라 치기 ─────────
     * 음표는 "음이름+옥타브*박" — 박은 [들어 보기]에만 쓴다. | 는 마디 사이 띄우기.
     * 모두 저작권이 끝난 곡이다: 프랑스·독일·미국 민요, 베토벤(1824).
     * 환희의 송가는 낮은 솔까지 내려가서 한 옥타브 올려 두 옥타브 안에 넣었다. */
    var SONGS = [
      { id: "twinkle", from: "fr", n: "C4 C4 G4 G4 A4 A4 G4*2 | F4 F4 E4 E4 D4 D4 C4*2 | G4 G4 F4 F4 E4 E4 D4*2 | G4 G4 F4 F4 E4 E4 D4*2 | C4 C4 G4 G4 A4 A4 G4*2 | F4 F4 E4 E4 D4 D4 C4*2" },
      { id: "butterfly", from: "de", n: "G4 E4 E4*2 | F4 D4 D4*2 | C4 D4 E4 F4 | G4 G4 G4*2 | G4 E4 E4*2 | F4 D4 D4*2 | C4 E4 G4 G4 | E4 E4 E4*2" },
      { id: "plane", from: "us", n: "E4 D4 C4 D4 E4 E4 E4*2 | D4 D4 D4*2 E4 G4 G4*2 | E4 D4 C4 D4 E4 E4 E4*2 | D4 D4 E4 D4 C4*4" },
      { id: "joy", from: "bee", n: "E5 E5 F5 G5 G5 F5 E5 D5 C5 C5 D5 E5 E5*1.5 D5*.5 D5*2 | E5 E5 F5 G5 G5 F5 E5 D5 C5 C5 D5 E5 D5*1.5 C5*.5 C5*2 | " +
                                    "D5 D5 E5 C5 D5 E5*.5 F5*.5 E5 C5 D5 E5*.5 F5*.5 E5 D5 C5 D5 G4*2 | E5 E5 F5 G5 G5 F5 E5 D5 C5 C5 D5 E5 D5*1.5 C5*.5 C5*2" }
    ];
    var NOTE_I = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
    SONGS.forEach(function (s) {
      s.seq = [];
      s.n.split(/\s+/).forEach(function (tok) {
        if (tok === "|") { if (s.seq.length) s.seq[s.seq.length - 1].bar = true; return; }
        var r = /^([A-G])(#?)(\d)(?:\*([\d.]+))?$/.exec(tok); if (!r) return;
        s.seq.push({ m: 12 * (+r[3] + 1) + NOTE_I[r[1]] + (r[2] ? 1 : 0), b: r[4] ? +r[4] : 1 });
      });
    });
    var song = null, pos = 0, wrong = 0;
    function pickSong(id) {
      stopPlay();
      song = SONGS.filter(function (s) { return s.id === id; })[0] || null; pos = 0; wrong = 0;
      paintSongs(); paintFollow();
    }
    function paintSongs() {
      $("songs").innerHTML = SONGS.map(function (s) {
        return '<button type="button" data-s="' + s.id + '"' + (song && song.id === s.id ? ' class="on"' : "") + ">" + IC.note +
               "<span><b>" + t(s.id) + "</b><small>" + t(s.from) + "</small></span></button>";
      }).join("");
    }
    $("songs").addEventListener("click", function (e) { var b = e.target.closest("[data-s]"); if (b) pickSong(b.getAttribute("data-s")); });
    function paintFollow() {
      Array.prototype.forEach.call(kb.querySelectorAll(".next"), function (el) { el.classList.remove("next"); });
      var f = $("follow");
      if (!song) { f.innerHTML = '<div class="hint">' + t("noSong") + "</div>"; return; }
      var done = pos >= song.seq.length;
      f.innerHTML = '<div class="top"><b>' + t(song.id) + '</b><span class="num hint" id="step">' + fmt(t("step"), { i: Math.min(pos + 1, song.seq.length), n: song.seq.length }) + "</span>" +
        (done ? '<span class="done-msg">' + fmt(t("songDone"), { w: wrong }) + "</span>" : "") + '<span class="sp"></span>' +
        '<button class="btn" type="button" id="listenBtn">' + (pb.on ? IC.stop : IC.ear) + "<span>" + t("listen") + "</span></button>" +
        '<button class="btn" type="button" id="againBtn">' + IC.again + "<span>" + t("again") + "</span></button>" +
        '<button class="btn" type="button" id="quitBtn">' + t("quit") + "</button></div>" +
        '<div class="chips" id="chips">' + song.seq.map(function (x, i) {
          return '<span class="' + (i < pos ? "done" : i === pos ? "cur" : "") + (x.bar ? " gap" : "") + (x.m >= 72 ? " hi" : "") + '" style="border-bottom-color:var(--c' + WHITE[Math.min(6, WHITE.filter(function (w) { return w <= x.m % 12; }).length - 1)] + ')">' + nm(x.m) + "</span>";
        }).join("") + "</div>";
      if (!done) { var el = keyEl(song.seq[pos].m); if (el) el.classList.add("next"); }
      var chips = $("chips"), cur = chips.querySelector(".cur");
      if (cur) chips.scrollTop = Math.max(0, cur.offsetTop - 36);             // 지금 칠 음이 늘 보이게 — 두 줄 중 아랫줄에
    }
    $("follow").addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b || !song) return;
      if (b.id === "listenBtn") {
        if (pb.on) { stopPlay(); return; }
        var ev = [], at = 0, beat = 60000 / 100;                          // 들어 보기는 100 BPM 으로
        song.seq.forEach(function (x) { ev.push([at, 1, x.m, "piano"]); at += x.b * beat; ev.push([at - 40, 0, x.m]); });
        play(ev, at, paintFollow); paintFollow();
      } else if (b.id === "againBtn") { pos = 0; wrong = 0; paintFollow(); }
      else if (b.id === "quitBtn") { song = null; paintSongs(); paintFollow(); }
    });
    function follow(m) {
      if (!song || pos >= song.seq.length) return;
      if (m === song.seq[pos].m) {
        pos++;
        paintFollow();
        if (pos >= song.seq.length) { toast(t("bravo")); if (window.vapiStat) vapiStat("piano_song_done"); }
      } else {
        wrong++;
        var c = $("chips") && $("chips").children[pos];
        if (c) { c.classList.add("wrong"); setTimeout(function () { c.classList.remove("wrong"); }, 260); }
      }
    }

    var toastTimer = 0;
    function toast(msg) { var el = $("toast"); el.textContent = msg; el.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.remove("on"); }, 2200); }

    /* 가려지면 소리를 다 끈다 — 뒤에 깔린 창에서 박자기가 계속 똑딱이면 다른 앱을 쓸 수가 없다 */
    function quiet() { metroStop(); stopPlay(); if (rec.on) recStop(); allOff(); ptr = {}; }
    if (window.EL_WIN) EL_WIN.onHide(quiet);
    addEventListener("pagehide", quiet);

    $("langButton").addEventListener("click", function () {
      try { localStorage.setItem("vapiLang", LANG === "ko" ? "en" : "ko"); } catch (e) {}
      location.reload();
    });
    document.title = t("title"); $("langButton").textContent = t("lang");
    ["q1", "q2", "q3", "inst", "vol", "sus", "names", "oct", "metro", "drums", "rec", "songs", "keys"].forEach(function (k) {
      var id = "txt" + k.charAt(0).toUpperCase() + k.slice(1); if ($(id)) $(id).textContent = t(k);
    });
    function kbds(s) { return s.split(" ").map(function (x) { return x === "~" ? "~" : "<kbd>" + x + "</kbd>"; }).join(" "); }
    $("keymap").innerHTML = [["A ~ '", "kWhite"], ["W E T Y U O P", "kBlack"], ["Z ~ M", "kLow"], ["1 ~ 6", "kDrum"]].map(function (r) {
      return "<span>" + kbds(r[0]) + "</span><span>" + t(r[1]) + "</span>";
    }).join("");
    buildKeys(); paintSet(); paintBeats(); paintMetro(); paintRec(); paintSlots(); paintSongs(); paintFollow();

    window.EL_PIANO = {                                                     // 시험용
      get log() { return log; }, get drums() { return drumLog; },
      get held() { return Object.keys(held).map(Number); },
      get metro() { return { on: metro.on, bpm: set.bpm, beats: set.beats, count: metro.count }; },
      get rec() { return { on: rec.on, playing: pb.on, events: rec.ev.length, notes: notes(rec.ev), len: rec.len }; },
      get song() { return song ? { id: song.id, pos: pos, len: song.seq.length, wrong: wrong, next: pos < song.seq.length ? song.seq[pos].m : null } : null; },
      get slots() { return slots; }, get set() { return set; }, get shift() { return shift; },
      get ctx() { return ctx; },
      noteOn: noteOn, noteOff: noteOff, drum: drum, pickSong: pickSong, quiet: quiet
    };
  })();
  </script>
  <script src="/lib/shell.js"></script>
  <script src="/lib/usage.js" data-page="piano"></script>
  <i id="el-built" hidden></i>
</body>
</html>
