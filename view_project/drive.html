  <style>
    /* 자동차 가르치기 — 내가 운전하는 것을 보고 AI 가 따라 배운다 (모방 학습).
     *
     * 가르치기(/train)는 사진을 보여 주고 이름을 맞히게 한다. 여기서는 "행동"을 가르친다:
     * 차의 센서 숫자 7개와 그때 내가 누른 키를 짝지어 모으고, 작은 신경망이 그 짝을 배운다.
     * AI 가 운전하는 중에 키를 누르면 내가 끼어들고 그 장면도 모인다 — 고쳐 가르치기.
     * 계산은 전부 브라우저 안(lib/drive.js)이라 서버 AI 가 준비되기 전에도 된다.
     *
     * ml-lab 의 "운전" 활동(themakerrobot/ml-lab, MIT)을 이 저장소 화면에 맞게 다시 짰다.
     */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --road: #ddd5c4; --road-edge: #8f836e; --ground: #eef0e2; --go: #3a9a55; --bad: #c2412a; }
    html.hc { --road: #d2c8b3; --road-edge: #5e5443; --ground: #f4f6ea; --go: #237a3b; --bad: #9e2e19; }
    body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; color: var(--ink); background: var(--paper);
           font-family: "Gowun Dodum", "Apple SD Gothic Neo", system-ui, sans-serif; line-height: 1.5;
           padding: var(--sp-2, 8px); gap: var(--sp-2, 8px); }
    button, input, select { font-family: inherit; color: var(--ink); }
    .btn { border: 1.5px solid var(--line-d); background: #fff; font-weight: 600; padding: 7px 13px; border-radius: var(--r); cursor: pointer;
           font-size: .92rem; min-height: 40px; display: inline-flex; align-items: center; gap: 6px; }
    .btn.primary { background: var(--pen-blue); border-color: var(--pen-blue-d); color: #fff; }
    .btn.go { background: var(--go); border-color: var(--go); color: #fff; }
    .btn.on { background: var(--cyan-bg); border-color: var(--cyan); color: var(--cyan-d); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.wide { width: 100%; justify-content: center; min-height: var(--tap, 48px); font-size: 1rem; }
    .btn svg { width: 18px; height: 18px; }

    .panel.side { flex: 0 0 280px; } .panel.road { flex: 1 1 auto; } .panel.out { flex: 0 0 300px; }
    .st { font-weight: 700; font-size: var(--fs-head, 14px); color: var(--cyan-d); }
    .hint { font-size: var(--fs-side, 13px); color: var(--ink-2); }
    .sec { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; border-top: 1.5px dashed var(--line); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .num { font-family: Menlo, Consolas, monospace; font-size: var(--fs-mono, 13px); }

    /* 트랙 고르기 */
    .pick { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .pick button { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 64px; padding: 6px 4px; text-align: center;
                   border: 1.5px solid var(--line); border-radius: var(--r); background: #fff; cursor: pointer; font-size: .9rem; position: relative; }
    .pick button b { font-weight: 600; line-height: 1.2; }
    .pick button small { position: absolute; top: 3px; right: 5px; font-size: 11px; color: var(--pen-red); font-weight: 700; }
    .pick button small.race { color: var(--cyan-d); }
    .pick .ph { grid-column: 1 / -1; font-size: var(--fs-side, 13px); font-weight: 700; color: var(--ink-2); padding-top: 4px; }
    .pick button.on { border-color: var(--cyan); background: var(--cyan-bg); }
    .pick svg { width: 48px; height: 30px; flex: 0 0 auto; }

    /* 두세 개 중 하나 */
    .seg { display: inline-flex; border: 1.5px solid var(--line-d); border-radius: var(--r); overflow: hidden; }
    .seg button { border: 0; background: #fff; padding: 0 12px; min-height: 40px; font-size: .92rem; font-weight: 600; cursor: pointer; }
    .seg button + button { border-left: 1.5px solid var(--line-d); }
    .seg button.on { background: var(--pen-blue); color: #fff; }
    .seg.big { display: flex; } .seg.big button { flex: 1; min-height: var(--tap, 48px); font-size: 1rem; }
    .seg button:disabled { opacity: .4; cursor: not-allowed; }
    .grp { font-size: var(--fs-side, 13px); font-weight: 700; color: var(--ink-2); margin-top: 2px; }

    /* 막대 */
    .bar { display: flex; flex-direction: column; gap: 2px; }
    .bar .bl { display: flex; justify-content: space-between; font-size: var(--fs-side, 13px); }
    .bar .bt { height: 10px; border-radius: 5px; background: #ece5d6; overflow: hidden; }
    .bar .bf { height: 100%; background: var(--pen-blue); transition: width .12s; }
    .bar.top .bf { background: var(--go); } .bar.top .bl { font-weight: 700; }
    .ready { font-size: var(--fs-side, 13px); padding: 6px 8px; border-radius: var(--r); background: #f4efe4; }
    .ready.ok { background: #e3f1e6; color: #1e5b30; font-weight: 600; }

    /* 진행 단계 */
    .steps { display: flex; gap: 4px; margin-left: auto; font-size: var(--fs-side, 13px); }
    .steps span { padding: 2px 8px; border-radius: 12px; border: 1.5px solid var(--line); color: var(--ink-2); white-space: nowrap; }
    .steps span.done { border-color: var(--go); color: var(--go); }
    .steps span.on { border-color: var(--pen-blue); background: var(--pen-blue); color: #fff; font-weight: 700; }

    /* 트랙 */
    .stage { position: relative; display: flex; align-items: center; justify-content: center; min-height: 200px; }
    #cv { display: block; border-radius: var(--r); border: 1.5px solid var(--line); touch-action: none; }
    #overlay { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 12px 22px; border-radius: 10px;
               font-size: 1.3rem; font-weight: 700; color: #fff; display: none; align-items: center; gap: 8px; pointer-events: none; }
    #overlay.on { display: flex; } #overlay.good { background: rgba(35,122,59,.92); } #overlay.bad { background: rgba(158,46,25,.92); }
    #overlay svg { width: 26px; height: 26px; }
    .badge { font-family: Menlo, Consolas, monospace; font-weight: 700; padding: 4px 10px; border-radius: 12px; background: var(--cyan-bg); color: var(--cyan-d); }
    .padrow { display: flex; align-items: center; gap: 10px; }
    .pad { width: 84px; height: 56px; border-radius: 12px; border: 1.5px solid var(--line-d); background: #fff; cursor: pointer;
           display: grid; place-items: center; touch-action: none; user-select: none; }
    .pad svg { width: 30px; height: 30px; }
    .pad.on { background: var(--pen-blue); color: #fff; }
    .padrow .hint { flex: 1; text-align: center; }
    .pads2 { display: flex; flex-direction: column; gap: 6px; } .pads2 .pad { height: 40px; }
    .pads2[hidden] { display: none; }
    .board { display: flex; flex-direction: column; gap: 4px; font-size: var(--fs-side, 13px); }
    .board .ln { display: grid; grid-template-columns: 18px 1fr; column-gap: 6px; align-items: center; }
    .board .ln b { font-weight: 600; } .board .ln .d { grid-column: 2; color: var(--ink-2); }
    .board svg { width: 16px; height: 16px; display: block; }
    .board .tot { font-weight: 700; color: var(--cyan-d); padding-top: 4px; border-top: 1px dashed var(--line); }
    .board .ok { color: var(--go); } .board .no { color: var(--bad); }

    /* 배우기 */
    .prg .lb { display: flex; justify-content: space-between; font-size: var(--fs-side, 13px); }
    .prg .tr { height: 10px; border-radius: 5px; background: #ece5d6; overflow: hidden; }
    .prg .fl { height: 100%; width: 0; background: var(--go); }
    #chart { width: 100%; height: 110px; display: block; border: 1.5px solid var(--line); border-radius: var(--r); background: #fff; }
    .legend { display: flex; gap: 14px; font-size: var(--fs-side, 13px); }
    .legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; }
    .sensor { display: grid; grid-template-columns: 42px 1fr 40px; gap: 6px; align-items: center; font-size: var(--fs-side, 13px); }
    .sensor .bt { height: 8px; border-radius: 4px; background: #ece5d6; overflow: hidden; }
    .sensor .bf { height: 100%; background: var(--go); }
    .run { display: flex; gap: 6px; align-items: center; font-size: var(--fs-side, 13px); }
    .run b { font-weight: 600; } .run .ok { color: var(--go); } .run .no { color: var(--bad); }
    .run svg { width: 16px; height: 16px; flex: 0 0 auto; }

    #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px;
             border-radius: 10px; font-size: .95rem; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 5; }
    #toast.on { opacity: 1; }

    @media (max-width: 1439px) { .panel.side { flex-basis: 250px; } .panel.out { flex-basis: 270px; } }
    @media (max-width: 1023px) { .main-container { flex-direction: column; } .panel.side, .panel.out, .panel.road { flex: 0 0 auto; }
                                 .panel, .panel-body { overflow: visible; } body { overflow: auto; height: auto; } }
  </style>

  <link rel="stylesheet" href="/lib/shell.css">
</head>

    function thumb(tr) {

    /* ── 달리기 ── */
    var last = 0, acc = 0;

        overlay(IC.flag + " " + (pro() ? t("finishPro").replace("{n}", AI_LAPS).replace("{t}", f1(Math.min.apply(null, lt)))
                                       : t("finish").replace("{n}", AI_LAPS)), "good");
        logRun(true);
      }
    }

    function logRun(done) {

      M.runs.unshift({ ti: ti, done: done, prog: Math.max(0, car.progress), cutIns: cutIns,
                       best: lt.length ? Math.min.apply(null, lt) : null,
                       avg: lt.length ? lt.reduce(function (a, b) { return a + b; }, 0) / lt.length : null, vMax: car.vMax });
      M.runs.length = Math.min(M.runs.length, 6);
      paintRuns();
      if (window.vapiStat) vapiStat(done ? "drive_finish" : "drive_crash");
    }
    function runText(r) {
      var parts = [r.done ? t("done") : t("stopAt").replace("{n}", f1(r.prog))];
      if (r.best != null) parts.push(t("best").replace("{t}", f1(r.best)));
      if (r.avg != null && r.done) parts.push(t("avg").replace("{t}", f1(r.avg)));
      if (pro()) parts.push(t("top").replace("{v}", f1(r.vMax)));
      if (r.cutIns) parts.push(t("cut").replace("{n}", r.cutIns));
      return parts.join(" · ");
    }
    function paintRuns() {
      $("runLog").innerHTML = M.runs.length ? M.runs.map(function (r) {
        return '<div class="run"><span class="' + (r.done ? "ok" : "no") + '">' + (r.done ? IC.flag : IC.boom) + "</span><b>" + tname(built[r.ti]) + "</b>" +
          "<span>" + runText(r) + "</span></div>";
      }).join("") : '<div class="hint">' + t("none") + "</div>";
    }

    /* ── 배우기 ── */
    function paintTrain() {
      $("trainBtn").innerHTML = IC.learn + " " + (M.policy ? t("trainAgain") : t("train"));
      $("saveAiBtn").disabled = !M.policy || training;
      $("raceBtn").disabled = !M.policy || training || racing;
      $("raceBtn").innerHTML = IC.trophy + " " + (racing ? t("raceRunning") : t("raceRun"));
      if (training) return;
      $("prgLabel").textContent = M.policy ? t("learned").replace("{p}", M.lastAcc) : t("notYet");
    }
    $("trainBtn").addEventListener("click", function () {
      var Y = M.data.Y;
      if (new Set(Y.map(function (y) { return y % 3; })).size < 2) { toast(t("needTurn")); return; }
      if (pro() && new Set(Y.map(function (y) { return (y / 3) | 0; })).size < 2) { toast(t("needThr")); return; }
      if (running) stop();
      var m = M;                                      // 배우는 중에 모드를 못 바꾸지만, 바뀌어도 이 모드에 넣는다
      training = true; paintCounts(); paintTrain(); $("goBtn").disabled = true;
      $("prgLabel").textContent = t("learning"); setStep(2);
      var isPro = pro(), p = isPro ? new D.Policy(8, { heads: [3, 3] }) : new D.Policy(), X = m.data.X.slice(), YY = Y.slice(), e = 0, r = null;
      m.hist = [];
      (function epoch() {
        /* 세 에폭마다 화면에 한 번 돌려준다 — 막대와 그래프가 차오르는 게 보이게 */
        for (var k = 0; k < 3 && e < EPOCHS; k++, e++) { r = p.fitEpoch(X, YY, { balance: isPro }); m.hist.push(r); }
        var pct = Math.round(e / EPOCHS * 100);
        $("prgFill").style.width = pct + "%"; $("prgPct").textContent = pct + "%";
        drawChart();
        if (e < EPOCHS) { requestAnimationFrame(epoch); return; }
        m.policy = p; m.trainedOn = X.length; m.race = null; training = false; m.lastAcc = Math.round(r.acc * 100);
        $("prgPct").textContent = ""; $("goBtn").disabled = running;
        $("trainHint").textContent = t("learnedHint").replace("{n}", X.length);
        paintTrain(); paintCounts(); paintRace(); setStep(3); paintLive();
        if (window.vapiStat) vapiStat("drive_train");
        if (window.EL_WIN && EL_WIN.hidden) EL_WIN.notify(t("learned").replace("{p}", m.lastAcc), { actions: [{ label: t("title").replace(/^edge-lab — /, ""), href: "/drive" }] });
      })();
    });

    function drawChart() {
      var c = $("chart"), dpr = window.devicePixelRatio || 1, W = c.clientWidth, H = c.clientHeight;
      if (!W || !H) return;
      c.width = W * dpr; c.height = H * dpr;
      var g = c.getContext("2d"); g.scale(dpr, dpr); g.clearRect(0, 0, W, H);
      var hist = M.hist;
      if (hist.length < 2) return;
      var maxL = Math.max.apply(null, hist.map(function (h) { return h.loss; }));
      function line(vals, color) {
        g.strokeStyle = color; g.lineWidth = 2; g.beginPath();
        vals.forEach(function (v, i) {
          var x = 6 + i / (EPOCHS - 1) * (W - 12), y = H - 6 - v * (H - 12);
          if (i) g.lineTo(x, y); else g.moveTo(x, y);
        });
        g.stroke();
      }
      line(hist.map(function (h) { return h.acc; }), css("--pen-blue"));
      line(hist.map(function (h) { return h.loss / maxL; }), css("--pen-red"));
    }

    /* ── AI 파일 — 저장하면 다른 컴퓨터에서 불러와도 똑같이 운전한다 ── */
    $("saveAiBtn").addEventListener("click", function () {
      if (!M.policy) return;
      var now = new Date(), pad = function (n) { return (n < 10 ? "0" : "") + n; };
      var stamp = now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + "-" + pad(now.getHours()) + pad(now.getMinutes());
      var o = D.savePolicy(M.policy, { mode: mode, scenes: M.trainedOn, acc: M.lastAcc, saved: now.toISOString() });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify(o)], { type: "application/json" }));
      a.download = "car-ai-" + mode + "-" + stamp + ".json";     // 이름은 영문 — 한글 이름을 버리는 브라우저가 있다
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    });
    $("loadAiBtn").addEventListener("click", function () { if (!training && !racing) $("aiFile").click(); });
    $("aiFile").addEventListener("change", function () {
      var f = this.files && this.files[0]; this.value = "";
      if (!f) return;
      f.text().then(function (txt) {
        var o = JSON.parse(txt), pol = D.loadPolicy(o), m = o.mode === "pro" ? "pro" : "basic";
        if ((m === "pro") !== (pol.nIn === 8)) throw new Error("mode");
        if (running) stop();
        MODES[m].policy = pol; MODES[m].trainedOn = o.scenes | 0; MODES[m].lastAcc = o.acc != null ? o.acc : "—";
        MODES[m].hist = []; MODES[m].race = null;
        if (mode !== m) { mode = m; M = MODES[m]; }
        car.reset(track); lastSense = sense(); overlay("");
        $("prgFill").style.width = "100%"; $("prgPct").textContent = "";
        $("trainHint").textContent = t("learnedHint").replace("{n}", M.trainedOn);
        setStep(3); paintMode(); paintTrain(); paintWho(); paintCounts(); paintRuns(); paintRace(); paintLive(); drawChart(); draw();
        toast(t("loaded").replace("{mode}", t(m)).replace("{n}", M.trainedOn));
      }).catch(function (e) { toast(t("badFile").replace("{e}", e && e.message || e)); });
    });

    /* ── 대회 — 대회 트랙 3개를 화면 없이 AI 만 3바퀴씩. 트랙 하나마다 화면에 한 번 돌려준다 ── */
    var RACE = built.map(function (tr, i) { return i; }).filter(function (i) { return built[i].def.contest; });
    $("raceBtn").addEventListener("click", function () {
      if (!M.policy || training || racing) return;
      if (running) stop();
      racing = true; paintTrain(); paintCounts();
      var m = M, md = mode, out = [], k = 0;
      (function next() {
        if (k < RACE.length) {
          out.push({ ti: RACE[k], r: D.drive(built[RACE[k]], m.policy, md, AI_LAPS) });
          k++; setTimeout(next, 0); return;
        }
        m.race = out; racing = false;
        paintTrain(); paintCounts(); paintRace();
        if (window.vapiStat) vapiStat("drive_race");
      })();
    });
    function paintRace() {
      var b = $("raceBoard");
      $("txtRaceHint").textContent = M.race ? (pro() ? t("raceTiePro") : t("raceTieBasic")) : t("raceHint");
      if (!M.race) { b.innerHTML = '<div class="hint">' + (M.policy ? "" : t("raceNone")) + "</div>"; return; }
      var html = M.race.map(function (x) {
        var r = x.r, txt = r.ok ? t("done") : t("stopAt").replace("{n}", f1(r.prog));
        if (pro() && r.ok) txt += " · " + t("sec").replace("{n}", f1(r.t)) + " · " + t("best").replace("{t}", f1(r.best));
        if (pro()) txt += " · " + t("top").replace("{v}", f1(r.vMax));
        return '<div class="ln"><span class="' + (r.ok ? "ok" : "no") + '">' + (r.ok ? IC.flag : IC.boom) + "</span><b>" + tname(built[x.ti]) + '</b><span class="d">' + txt + "</span></div>";
      }).join("");
      var rs = M.race.map(function (x) { return x.r; });
      var tot = pro()
        ? t("raceTotPro").replace("{c}", rs.filter(function (r) { return r.ok; }).length)
            .replace("{t}", f1(rs.filter(function (r) { return r.ok; }).reduce(function (a, r) { return a + r.t; }, 0)))
            .replace("{v}", f1(Math.max.apply(null, rs.map(function (r) { return r.vMax; }))))
        : t("raceTotBasic").replace("{p}", f1(rs.reduce(function (a, r) { return a + r.prog; }, 0))).replace("{n}", M.trainedOn);
      b.innerHTML = html + '<div class="tot">' + tot + "</div>";
    }

    /* ── 오른쪽 실시간 ── */
    function paintLive() {
      if (!running) lastSense = sense();
      $("sensors").innerHTML = lastSense.map(function (v, i) {
        var label = i < D.RAY_DEG.length ? ((D.RAY_DEG[i] > 0 ? "+" : "") + D.RAY_DEG[i] + "°") : t("vName");
        return '<div class="sensor"><span class="num">' + label + '</span><div class="bt"><div class="bf" style="width:' +
          (v * 100) + '%"></div></div><span class="num">' + v.toFixed(2) + "</span></div>";
      }).join("");
      if (!M.policy) { $("choice").innerHTML = '<div class="hint">' + t("afterTrain") + "</div>"; return; }
      var P = M.policy.predict(lastSense);
      function group(off, names) {
        var best = 0;
        for (var k = 1; k < 3; k++) if (P[off + k] > P[off + best]) best = k;
        return names.map(function (nm, k) {
          var v = P[off + k];
          return '<div class="bar' + (k === best ? " top" : "") + '"><div class="bl"><span>' + t(nm) + '</span><span class="num">' +
            Math.round(v * 100) + '%</span></div><div class="bt"><div class="bf" style="width:' + (v * 100) + '%"></div></div></div>';
        }).join("");
      }
      $("choice").innerHTML = (pro() ? '<div class="grp">' + t("gDir") + "</div>" + group(0, ACT) + '<div class="grp">' + t("gThr") + "</div>" + group(3, THR)
                                     : group(0, ACT)) +
        (running && who === "ai" && lastByMe ? '<div class="hint">' + t("cutting") + "</div>" : "");
    }

    /* ── 그리기 ── 트랙은 바뀔 때만 따로 그려 두고 매 장면에는 복사만 한다 (교실 노트북 배려) */
    var cv = $("cv"), roadCache = null, scale = 1;
    function sizeCanvas() {
      var box = $("stage"), bw = box.clientWidth, bh = box.clientHeight, dpr = window.devicePixelRatio || 1;
      if (!bw || !bh) return;           // 아직 자리가 안 잡혔다(가려진 창 등) — ResizeObserver 가 다시 부른다
      var w = Math.min(bw, bh * D.WORLD_W / D.WORLD_H), h = w * D.WORLD_H / D.WORLD_W;
      cv.style.width = Math.floor(w) + "px"; cv.style.height = Math.floor(h) + "px";
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      scale = cv.width / D.WORLD_W;
      roadCache = null;
    }
    function renderRoad() {
      var c = document.createElement("canvas");
      c.width = cv.width; c.height = cv.height;
      var g = c.getContext("2d");
      g.fillStyle = css("--ground"); g.fillRect(0, 0, c.width, c.height);
      g.setTransform(scale, 0, 0, scale, 0, 0);
      function path() {
        g.beginPath();
        track.pts.forEach(function (p, i) { if (i) g.lineTo(p[0], p[1]); else g.moveTo(p[0], p[1]); });
        g.closePath();
      }
      g.lineJoin = "round";
      path(); g.strokeStyle = css("--road-edge"); g.lineWidth = track.def.width + 4; g.stroke();
      path(); g.strokeStyle = css("--road"); g.lineWidth = track.def.width; g.stroke();
      path(); g.strokeStyle = "#fff"; g.lineWidth = 1.5; g.setLineDash([8, 10]); g.stroke(); g.setLineDash([]);
      var x0 = track.pts[0][0], y0 = track.pts[0][1], th = track.start.th, nx = -Math.sin(th), ny = Math.cos(th);
      g.strokeStyle = css("--ink"); g.lineWidth = 4;                       // 출발선
      g.beginPath(); g.moveTo(x0 + nx * track.hw, y0 + ny * track.hw); g.lineTo(x0 - nx * track.hw, y0 - ny * track.hw); g.stroke();
      return c;
    }
    function draw() {
      if (!cv.width) sizeCanvas();
      if (!cv.width) return;
      if (!roadCache) roadCache = renderRoad();
      var g = cv.getContext("2d");
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.drawImage(roadCache, 0, 0);
      g.setTransform(scale, 0, 0, scale, 0, 0);
      g.strokeStyle = css("--go"); g.fillStyle = css("--go"); g.lineWidth = 1.2; g.globalAlpha = 0.7;   // 센서 광선
      lastSense.slice(0, D.RAY_DEG.length).forEach(function (v, i) {
        var a = car.th + D.RAY_DEG[i] * Math.PI / 180, r = v * D.RAY_MAX;
        var ex = car.x + Math.cos(a) * r, ey = car.y + Math.sin(a) * r;
        g.beginPath(); g.moveTo(car.x, car.y); g.lineTo(ex, ey); g.stroke();
        g.beginPath(); g.arc(ex, ey, 2.5, 0, Math.PI * 2); g.fill();
      });
      g.globalAlpha = 1;
      drawCar(g, car.crashed ? css("--bad") : (who === "ai" && !lastByMe ? css("--go") : css("--pen-blue")), car.crashed);
      /* 배지: 바퀴 · 달린 시간(게임 시간) · 고급은 지금 빠르기 */
      $("lapBadge").textContent = [t("laps").replace("{n}", f1(Math.max(0, car.progress))), t("sec").replace("{n}", f1(car.t))]
        .concat(pro() ? [t("times").replace("{n}", f1(car.v))] : []).join(" · ");
    }
    /* 차 — 위에서 내려다본 모양. 오른쪽(+x)이 앞이다. 그림만 이 크기고, 부딪힘 판정은 lib/drive.js 그대로
       (가운데 · 앞 9) — 차 끝이 길 가장자리에 살짝 걸쳐도 괜찮은 것은 그 때문이다 */
    function mix(hex, k) {                 // k>0 밝게, k<0 어둡게
      var n = parseInt(String(hex).replace("#", "").slice(0, 6), 16); if (isNaN(n)) return hex;
      var f = function (c) { return Math.round(k > 0 ? c + (255 - c) * k : c * (1 + k)); };
      return "rgb(" + f(n >> 16 & 255) + "," + f(n >> 8 & 255) + "," + f(n & 255) + ")";
    }
    function rr(g, x, y, w, h, r) {
      g.beginPath();
      g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
      g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
      g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
    }
    function drawCar(g, color, crashed) {
      g.save(); g.translate(car.x, car.y); g.rotate(car.th); g.scale(1.3, 1.3);   // 판 800 에 비해 작아 보여 조금 키운다(그림만)
      g.fillStyle = "rgba(20,20,20,.22)"; rr(g, -12, -6.2, 25, 14, 5); g.fill();          // 그림자
      g.fillStyle = "#1e2226";                                                             // 바퀴 넷
      [[-8.5, -7.6], [5, -7.6], [-8.5, 5.2], [5, 5.2]].forEach(function (w) { rr(g, w[0], w[1], 5.2, 2.4, 1); g.fill(); });
      g.fillStyle = color; g.strokeStyle = mix(color, -0.35); g.lineWidth = 0.9;           // 차체
      rr(g, -12.5, -6.3, 25, 12.6, 4.6); g.fill(); g.stroke();
      g.fillStyle = mix(color, 0.18); rr(g, 6.2, -5, 5.2, 10, 2.4); g.fill();              // 보닛
      g.fillStyle = mix(color, 0.3); rr(g, -6.5, -4.6, 9, 9.2, 2.2); g.fill();              // 지붕
      g.fillStyle = "#2c3e50";                                                             // 앞유리
      g.beginPath(); g.moveTo(2.6, -4.6); g.lineTo(6, -5.3); g.lineTo(6, 5.3); g.lineTo(2.6, 4.6); g.closePath(); g.fill();
      g.fillStyle = "rgba(255,255,255,.35)";
      g.beginPath(); g.moveTo(3.3, -3.8); g.lineTo(5, -4.2); g.lineTo(5, -1.2); g.lineTo(3.3, -1); g.closePath(); g.fill();
      g.fillStyle = "#34495e";                                                             // 뒷유리
      g.beginPath(); g.moveTo(-6.5, -4.2); g.lineTo(-9, -4.8); g.lineTo(-9, 4.8); g.lineTo(-6.5, 4.2); g.closePath(); g.fill();
      g.fillStyle = "#ffe27a"; rr(g, 11, -5, 1.8, 2.6, 0.8); g.fill(); rr(g, 11, 2.4, 1.8, 2.6, 0.8); g.fill();   // 전조등
      g.fillStyle = "#e74c3c"; rr(g, -12.8, -5, 1.4, 2.4, 0.6); g.fill(); rr(g, -12.8, 2.6, 1.4, 2.4, 0.6); g.fill(); // 미등
      if (crashed) {                                                                        // 쾅 — 앞에 번쩍
        g.strokeStyle = "#f5b301"; g.lineWidth = 1.6; g.lineCap = "round";
        for (var i = 0; i < 7; i++) {
          var a = -1.2 + i * 0.4;
          g.beginPath(); g.moveTo(15 + 2 * Math.cos(a), 5 * Math.sin(a)); g.lineTo(15 + 7 * Math.cos(a), 12 * Math.sin(a)); g.stroke();
        }
      }
      g.restore();
    }
    function overlay(html, kind) {
      var o = $("overlay");
      o.innerHTML = html; o.className = html ? "on " + (kind || "") : "";
    }
    new ResizeObserver(function () { sizeCanvas(); draw(); drawChart(); }).observe($("stage"));

    /* 가려지면 멈춘다 — 키보드가 이 창에 닿지 않으니 사람 운전은 곧게만 가다 부딪히고,
       AI 운전도 보는 사람이 없으면 의미가 없다. 눌린 키도 놓는다(가려지는 순간 keyup 을 못 받는다). */
    if (window.EL_WIN) EL_WIN.onHide(function () { if (running) stop(); releaseKeys(); });

    $("langButton").addEventListener("click", function () {
      try { localStorage.setItem("vapiLang", LANG === "ko" ? "en" : "ko"); } catch (e) {}
      location.reload();
    });
    setStep(1); paintText(); sizeCanvas(); draw();
    window.EL_DRIVE_PAGE = { get data() { return M.data; }, car: car, repaint: paintCounts, get policy() { return M.policy; },
                             get running() { return running; }, get step() { return step; }, get mode() { return mode; },
                             get race() { return M.race; } };
  })();
  </script>
  <script src="/lib/shell.js"></script>
  <script src="/lib/usage.js" data-page="drive"></script>
  <i id="el-built" hidden></i>
</body>
</html>
