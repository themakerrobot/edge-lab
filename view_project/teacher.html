<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>교사용 — vapi-od</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link href="/fonts/fonts.css" rel="stylesheet">
  <style>
    :root {
      --paper:#f5f8fb; --box:#fff; --ink:#26303c; --ink-2:#64707e;
      --cyan:#29b8e5; --cyan-d:#0f93c0; --pen-blue:#2b4bd8; --pen-blue-d:#1f3ab0;
      --pen-red:#d94141; --line:#ccd6e0; --line-d:#2c4a7c; --r:6px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      display:flex; flex-direction:column; height:100dvh; overflow:hidden;
      color:var(--ink); background:var(--paper);
      font-family:"Gowun Dodum","Apple SD Gothic Neo",system-ui,sans-serif;
      line-height:1.5; padding:12px; gap:10px;
    }
    a { color:var(--pen-blue-d); text-decoration:none; }
    select, input, button {
      font-family:inherit; font-size:.95rem; color:var(--ink); background:#fff;
      border:1.5px solid var(--line); border-radius:var(--r); padding:7px 11px; outline:none;
    }
    /* 머리표 */
    .header {
      flex:0 0 auto; display:flex; flex-wrap:wrap; align-items:stretch;
      background:var(--box); border:2px solid var(--line-d); border-radius:3px;
      box-shadow:0 1px 0 rgba(44,74,124,.18);
    }
    .header > div { display:flex; flex-direction:column; justify-content:center; padding:10px 16px; }
    .h-subject .eyebrow { font-size:.7rem; letter-spacing:.14em; color:var(--ink-2); }
    .h-subject .title { font-family:"Gowun Batang",serif; font-size:1.4rem; font-weight:700; line-height:1.2; }
    .h-tools { flex-direction:row !important; align-items:center; gap:8px; margin-left:auto; }
    .h-tools a, .h-tools button {
      display:inline-flex; align-items:center; gap:7px; background:#fff;
      border:1.5px solid var(--line-d); color:var(--ink); font-weight:600;
      padding:8px 14px; border-radius:var(--r); font-size:.95rem; cursor:pointer;
    }
    /* 상태바 */
    .sysbar {
      flex:0 0 auto; display:flex; align-items:center; gap:6px 14px; flex-wrap:wrap;
      background:#fffdf6; border:1.5px solid var(--line-d); border-radius:3px;
      padding:7px 14px; font-family:"Menlo","Consolas",ui-monospace,monospace;
      font-size:.76rem; letter-spacing:.02em; color:var(--ink-2);
      box-shadow:0 1px 0 rgba(44,74,124,.15); transform:rotate(-.25deg); position:relative;
    }
    .sysbar::before {
      content:""; position:absolute; top:-7px; left:26px; width:54px; height:13px;
      background:rgba(41,184,229,.38); border-left:1px solid rgba(38,38,46,.12);
      border-right:1px solid rgba(38,38,46,.12); transform:rotate(-2deg);
    }
    .sysbar .brand b { color:var(--ink); font-weight:700; letter-spacing:.08em; }
    .sysbar .sep { color:var(--line); }
    .sysbar .meter { margin-left:auto; display:flex; gap:12px; }
    .sysbar .meter .k { color:#a3a094; }
    .sysbar .meter .v { color:var(--pen-blue-d); font-weight:700; font-variant-numeric:tabular-nums; }
    /* 레이아웃 */
    .main-container { flex:1 1 auto; min-height:0; display:flex; gap:12px; max-width:2200px; margin:0 auto; width:100%; }
    .panel {
      flex:1 1 0; min-width:0; display:flex; flex-direction:column;
      background:var(--box); border:1.5px solid var(--line); border-radius:var(--r); overflow:hidden;
    }
    .panel-head {
      flex:0 0 auto; display:flex; align-items:center; gap:9px; flex-wrap:wrap;
      padding:11px 16px; border-bottom:1.5px dashed var(--line);
    }
    .panel-body { flex:1 1 auto; min-height:0; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
    .q { position:relative; border:2.5px solid var(--cyan); background:#fff; padding:6px 16px 6px 12px;
         border-radius:2px; display:inline-flex; align-items:center; gap:6px; }
    .q::after { content:""; position:absolute; left:14px; bottom:-12px;
                border:7px solid transparent; border-top:9px solid var(--cyan); }
    .qnum { font-family:"Gowun Dodum",sans-serif; font-weight:700; font-size:1.05rem; color:var(--cyan-d); }
    .qnum::after { content:"."; }
    .qtext { font-family:"Gowun Dodum",sans-serif; font-weight:700; font-size:1.02rem; color:var(--cyan-d); }
    .hint { color:var(--ink-2); font-size:.86rem; }
    .btn { border:1.5px solid var(--line-d); background:#fff; font-weight:600; padding:7px 13px;
           border-radius:var(--r); cursor:pointer; }
    .btn.primary { background:var(--pen-blue); border-color:var(--pen-blue-d); color:#fff; }
    .btn.danger { border-color:var(--pen-red); color:var(--pen-red); }
    .btn.sm { padding:4px 9px; font-size:.84rem; }
    .btn:disabled { opacity:.45; cursor:not-allowed; }
    /* 점검 목록 */
    .checks { display:flex; flex-direction:column; gap:6px; }
    .chk { display:flex; align-items:center; gap:10px; border:1.5px solid var(--line);
           border-radius:var(--r); padding:8px 12px; background:#fff; }
    .chk .mark { width:22px; height:22px; flex:0 0 auto; border-radius:50%; color:#fff;
                 display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:.8rem;
                 background:#c9d3dd; }
    .chk.ok .mark { background:var(--cyan); }
    .chk.no .mark { background:var(--pen-red); }
    .chk .key { font-weight:700; flex:0 0 150px; }
    .chk .detail { color:var(--ink-2); font-size:.84rem; word-break:break-all; }
    .chk.no .detail { color:var(--pen-red); }
    .camwrap { border:1.5px solid var(--line-d); border-radius:var(--r); overflow:hidden; background:#000; max-width:320px; }
    .camwrap video { width:100%; display:block; aspect-ratio:4/3; object-fit:cover; }
    /* 목록 */
    table { width:100%; border-collapse:collapse; font-size:.9rem; }
    th, td { border-bottom:1px dashed var(--line); padding:7px 6px; text-align:left; }
    th { color:var(--ink-2); font-weight:700; font-size:.82rem; }
    td .lbl { color:var(--ink-2); font-size:.8rem; }
    .empty { color:var(--ink-2); font-size:.88rem; padding:10px 0; }
    @media (max-width:860px) {
      body { height:auto; min-height:100dvh; overflow:auto; }
      .main-container { flex-direction:column; }
      .panel, .panel-body { overflow:visible; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="h-subject" style="flex-direction:row;align-items:center;gap:12px;">
      <img src="/assets/pibo-prof.png" alt="" style="height:44px;flex:0 0 auto;">
      <span style="display:flex;flex-direction:column;">
        <span class="eyebrow" id="txtEyebrow">인공지능 · 컴퓨터 비전 · 수업 준비와 학생 결과물 관리</span>
        <span class="title"><span id="txtTitle">교사용</span>
          <span style="font-size:.85rem;color:var(--pen-red);vertical-align:middle;">(On-Device)</span></span>
      </span>
    </div>
    <div class="h-tools">
      <a href="/">&#9998; <span id="txtHomeLink">체험 실습</span></a>
      <a href="/blocks">&#9632; <span id="txtBlocksLink">블록 코딩</span></a>
      <a href="/train">&#9679; <span id="txtTrainLink">모델 만들기</span></a>
      <button id="langButton" title="한국어 / English">EN</button>
    </div>
  </div>

  <div class="sysbar">
    <span class="brand"><b>VAPI-OD</b> · classroom console</span>
    <span class="sep">|</span>
    <span id="sysDevices">devices —</span>
    <span class="sep">|</span>
    <span id="sysNet">NETWORK: OFFLINE</span>
    <span class="meter">
      <span><span class="k">models</span> <span class="v" id="sysModels">0</span></span>
      <span><span class="k">works</span> <span class="v" id="sysWorks">0</span></span>
    </span>
  </div>

  <div class="main-container">
    <!-- 좌: 수업 전 점검 -->
    <div class="panel">
      <div class="panel-head">
        <span class="q"><span class="qnum">1</span><span class="qtext" id="txtQ1">수업 전 점검</span></span>
        <span style="margin-left:auto;display:flex;gap:8px;">
          <button class="btn" id="camBtn"><span id="txtCamBtn">웹캠 확인</span></button>
          <button class="btn primary" id="runBtn"><span id="txtRun">점검 실행</span></button>
        </span>
      </div>
      <div class="panel-body">
        <div class="hint" id="txtQ1Hint">
          수업 시작 5분 전에 한 번 눌러 주세요. 모델·디바이스·저장 폴더·웹캠을 한꺼번에 확인합니다.
        </div>
        <div class="checks" id="checks"><div class="empty" id="txtNotRun">아직 점검하지 않았어요.</div></div>
        <div class="camwrap" id="camwrap" style="display:none;">
          <video id="cam" autoplay muted playsinline></video>
        </div>
      </div>
    </div>

    <!-- 우: 학생 결과물 -->
    <div class="panel">
      <div class="panel-head">
        <span class="q"><span class="qnum">2</span><span class="qtext" id="txtQ2">학생 결과물</span></span>
        <span style="margin-left:auto;display:flex;gap:8px;">
          <button class="btn" id="refreshBtn"><span id="txtRefresh">새로고침</span></button>
          <button class="btn" id="exportBtn"><span id="txtExport">전체 내려받기</span></button>
          <button class="btn danger" id="clearBtn"><span id="txtClear">전체 초기화</span></button>
        </span>
      </div>
      <div class="panel-body">
        <div>
          <div class="hint" id="txtModelsTitle" style="margin-bottom:6px;">만든 AI</div>
          <table id="modelTable"></table>
        </div>
        <div>
          <div class="hint" id="txtWorksTitle" style="margin-bottom:6px;">저장된 작품 (사진 포함)</div>
          <table id="projTable"></table>
        </div>
      </div>
    </div>
  </div>

  <script>
  "use strict";
  let LANG = "ko";
  try { LANG = localStorage.getItem("vapiLang") || "ko"; } catch (e) {}
  const I18N = {
    ko: {
      titleTag: "교사용 — vapi-od", title: "교사용",
      eyebrow: "인공지능 · 컴퓨터 비전 · 수업 준비와 학생 결과물 관리",
      homeLink: "체험 실습", blocksLink: "블록 코딩", trainLink: "모델 만들기", langBtn: "EN",
      q1: "수업 전 점검", q2: "학생 결과물",
      q1hint: "수업 시작 5분 전에 한 번 눌러 주세요. 모델·디바이스·저장 폴더·웹캠을 한꺼번에 확인합니다.",
      run: "점검 실행", running: "점검 중...", camBtn: "웹캠 확인", camOff: "웹캠 끄기",
      refresh: "새로고침", export: "전체 내려받기", clear: "전체 초기화",
      modelsTitle: "만든 AI", worksTitle: "저장된 작품 (사진 포함)",
      notRun: "아직 점검하지 않았어요.", none: "아직 없어요.",
      colTitle: "이름", colInfo: "내용", colWhen: "만든 때", colAct: "",
      kBackbone: "특징 추출 모델", kPose: "손 인식(MediaPipe)", kStorage: "저장 현황",
      kWrite: "쓰기 권한", kCam: "웹캠",
      allOk: "모두 정상이에요. 수업을 시작해도 됩니다.",
      someBad: "문제가 있어요. 빨간 항목을 확인해 주세요.",
      camOk: "웹캠이 열렸어요.", camNo: "웹캠을 열 수 없어요. 권한을 확인해 주세요.",
      confirmClear: "학생이 만든 AI와 작품을 모두 지웁니다. 되돌릴 수 없어요. 계속할까요?",
      cleared: "%1개를 지웠어요.",
      err: "오류: ",
    },
    en: {
      titleTag: "Teacher — vapi-od", title: "Teacher",
      eyebrow: "AI · computer vision · class prep and student work",
      homeLink: "Vision Lab", blocksLink: "Block Coding", trainLink: "Make my AI", langBtn: "한국어",
      q1: "Pre-class check", q2: "Student work",
      q1hint: "Run this 5 minutes before class. It checks models, devices, storage and the webcam at once.",
      run: "Run check", running: "Checking...", camBtn: "Check webcam", camOff: "Webcam off",
      refresh: "Refresh", export: "Download all", clear: "Clear all",
      modelsTitle: "Trained AIs", worksTitle: "Saved work (with photos)",
      notRun: "Not checked yet.", none: "Nothing yet.",
      colTitle: "Name", colInfo: "Contents", colWhen: "Created", colAct: "",
      kBackbone: "Feature model", kPose: "Hand tracking (MediaPipe)", kStorage: "Storage",
      kWrite: "Write access", kCam: "Webcam",
      allOk: "All good. You can start the class.", someBad: "Something is wrong. Check the red rows.",
      camOk: "Webcam opened.", camNo: "Can't open the webcam. Check the permission.",
      confirmClear: "This deletes every AI and saved work by students. It cannot be undone. Continue?",
      cleared: "Deleted %1 items.",
      err: "Error: ",
    },
  };
  const t = (k, ...a) => {
    let v = (I18N[LANG][k] !== undefined ? I18N[LANG][k] : I18N.ko[k]) || k;
    a.forEach((x, i) => { v = v.split("%" + (i + 1)).join(x); });
    return v;
  };
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  /* ---------------- 상태바 ---------------- */
  (async function initSystem() {
    try {
      const info = await (await fetch("/system")).json();
      $("sysDevices").textContent = "devices " + ((info.devices || []).join(" ") || "—");
      $("sysNet").textContent = "NETWORK: OFFLINE  ·  OV " + ((info.runtime && info.runtime.openvino) || "");
    } catch (e) {}
  })();

  /* ---------------- 수업 전 점검 ---------------- */
  const KEY_NAME = k => {
    if (k === "backbone") return t("kBackbone");
    if (k === "pose") return t("kPose");
    if (k === "storage") return t("kStorage");
    if (k.indexOf("write:") === 0) return t("kWrite") + " " + k.slice(6);
    if (k === "camera") return t("kCam");
    return k;
  };
  function renderChecks(list) {
    $("checks").innerHTML = list.map(c =>
      '<div class="chk ' + (c.ok ? "ok" : "no") + '">' +
        '<span class="mark">' + (c.ok ? "✓" : "!") + '</span>' +
        '<span class="key">' + esc(KEY_NAME(c.key)) + '</span>' +
        '<span class="detail">' + esc(c.detail || "") + '</span>' +
      '</div>').join("");
  }
  let lastChecks = [];
  $("runBtn").addEventListener("click", async () => {
    $("runBtn").disabled = true; $("txtRun").textContent = t("running");
    try {
      const j = await (await fetch("/custom/selftest")).json();
      if (j.result !== "ok") throw new Error(j.data);
      lastChecks = j.data.checks.slice();
      /* 웹캠은 브라우저에서만 확인할 수 있으므로 별도로 붙인다. */
      let camOk = false, camDetail = "";
      try {
        const st = await navigator.mediaDevices.getUserMedia({ video: true });
        camOk = true;
        const tr = st.getVideoTracks()[0];
        camDetail = tr ? tr.label : "";
        st.getTracks().forEach(x => x.stop());
      } catch (e) { camDetail = String(e.message || e); }
      lastChecks.push({ key: "camera", ok: camOk, detail: camDetail });
      renderChecks(lastChecks);
      const allOk = lastChecks.every(c => c.ok);
      const head = document.createElement("div");
      head.className = "hint";
      head.style.color = allOk ? "var(--cyan-d)" : "var(--pen-red)";
      head.style.fontWeight = "700";
      head.textContent = allOk ? t("allOk") : t("someBad");
      $("checks").prepend(head);
    } catch (e) { alert(t("err") + (e.message || e)); }
    $("runBtn").disabled = false; $("txtRun").textContent = t("run");
  });

  let stream = null;
  $("camBtn").addEventListener("click", async () => {
    if (stream) {
      stream.getTracks().forEach(x => x.stop());
      stream = null; $("cam").srcObject = null;
      $("camwrap").style.display = "none";
      $("txtCamBtn").textContent = t("camBtn");
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
      $("cam").srcObject = stream;
      $("camwrap").style.display = "block";
      $("txtCamBtn").textContent = t("camOff");
    } catch (e) { alert(t("camNo")); }
  });

  /* ---------------- 학생 결과물 ---------------- */
  function table(el, rows, cols) {
    if (!rows.length) { el.innerHTML = '<tr><td class="empty">' + t("none") + '</td></tr>'; return; }
    el.innerHTML = "<tr>" + cols.map(c => "<th>" + esc(c) + "</th>").join("") + "</tr>";
    rows.forEach(r => el.appendChild(r));
  }
  async function loadAll() {
    let models = [], projects = [];
    try {
      const a = await (await fetch("/custom/models")).json();
      if (a.result === "ok") models = a.data;
      const b = await (await fetch("/custom/projects")).json();
      if (b.result === "ok") projects = b.data;
    } catch (e) { return; }
    $("sysModels").textContent = models.length;
    $("sysWorks").textContent = projects.length;

    const mrows = models.map(m => {
      const tr = document.createElement("tr");
      tr.innerHTML = "<td><b>" + esc(m.title) + "</b><div class='lbl'>" + esc(m.slug) + "</div></td>" +
        "<td class='lbl'>" + esc((m.labels || []).join(", ")) + " · " + esc(m.kind || "image") + "</td>" +
        "<td class='lbl'>" + esc(m.created || "") + "</td>";
      const td = document.createElement("td");
      const b = document.createElement("button");
      b.className = "btn sm danger"; b.textContent = "×";
      b.addEventListener("click", async () => {
        await fetch("/custom/models/" + encodeURIComponent(m.slug), { method: "DELETE" });
        loadAll();
      });
      td.appendChild(b); tr.appendChild(td);
      return tr;
    });
    table($("modelTable"), mrows, [t("colTitle"), t("colInfo"), t("colWhen"), ""]);

    const prows = projects.map(m => {
      const tr = document.createElement("tr");
      tr.innerHTML = "<td><b>" + esc(m.title) + "</b><div class='lbl'>" + esc(m.slug) + "</div></td>" +
        "<td class='lbl'>" + Math.round((m.size || 0) / 1024) + " KB</td>" +
        "<td class='lbl'>" + esc(m.saved || "") + "</td>";
      const td = document.createElement("td");
      const dl = document.createElement("a");
      dl.className = "btn sm"; dl.textContent = "↓";
      dl.href = "/custom/project/" + encodeURIComponent(m.slug);
      const b = document.createElement("button");
      b.className = "btn sm danger"; b.textContent = "×";
      b.addEventListener("click", async () => {
        await fetch("/custom/project/" + encodeURIComponent(m.slug), { method: "DELETE" });
        loadAll();
      });
      td.appendChild(dl); td.appendChild(b); tr.appendChild(td);
      return tr;
    });
    table($("projTable"), prows, [t("colTitle"), t("colInfo"), t("colWhen"), ""]);
  }
  $("refreshBtn").addEventListener("click", loadAll);
  $("exportBtn").addEventListener("click", () => { location.href = "/custom/export"; });
  $("clearBtn").addEventListener("click", async () => {
    if (!confirm(t("confirmClear"))) return;
    try {
      const j = await (await fetch("/custom/models?confirm=yes", { method: "DELETE" })).json();
      if (j.result !== "ok") throw new Error(j.data);
      alert(t("cleared", j.data.cleared));
      loadAll();
    } catch (e) { alert(t("err") + (e.message || e)); }
  });

  /* ---------------- 언어 ---------------- */
  (function applyStatic() {
    const set = (id, v) => { const el = $(id); if (el) el.textContent = v; };
    document.title = t("titleTag");
    set("txtTitle", t("title")); set("txtEyebrow", t("eyebrow"));
    set("txtHomeLink", t("homeLink")); set("txtBlocksLink", t("blocksLink"));
    set("txtTrainLink", t("trainLink")); set("langButton", t("langBtn"));
    set("txtQ1", t("q1")); set("txtQ2", t("q2")); set("txtQ1Hint", t("q1hint"));
    set("txtRun", t("run")); set("txtCamBtn", t("camBtn"));
    set("txtRefresh", t("refresh")); set("txtExport", t("export")); set("txtClear", t("clear"));
    set("txtModelsTitle", t("modelsTitle")); set("txtWorksTitle", t("worksTitle"));
    set("txtNotRun", t("notRun"));
  })();
  $("langButton").addEventListener("click", () => {
    try { localStorage.setItem("vapiLang", LANG === "ko" ? "en" : "ko"); } catch (e) {}
    location.reload();
  });

  loadAll();
  </script>
</body>
</html>
