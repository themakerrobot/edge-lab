<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>edge-lab — 사진 스튜디오</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link href="/fonts/fonts.css" rel="stylesheet">
  <script>
    try { if (localStorage.getItem("vapi-hc") === "1")
            document.documentElement.classList.add("hc"); } catch (e) {}
  </script>
  <link rel="stylesheet" href="/lib/tokens.css">
  <script src="/lib/embed.js"></script>
  <link rel="expect" href="#el-built" blocking="render">
  <style>
    /* 사진 스튜디오 — 찍거나 고른 사진을 GPU 로 바꿔 본다.
     *
     * 체험하기에도 같은 AI(배경 제거 · 화질 4배 · 깊이 지도)가 있지만 거기서는 16가지 중
     * 하나이고 결과가 JSON 옆에 붙는다. 여기서는 "사진 한 장을 이리저리 바꿔 보는 놀이" 가
     * 목적이다 — 원본과 결과를 나란히 두고, 결과를 다시 원본으로 삼아 이어 바꿀 수 있다
     * (배경을 지운 뒤 화질을 올리는 식). 서버 API 는 /gan/* 그대로다.
     */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; color: var(--ink); background: var(--paper);
           font-family: "Gowun Dodum", "Apple SD Gothic Neo", system-ui, sans-serif; line-height: 1.5;
           padding: var(--sp-2, 8px); gap: var(--sp-2, 8px); }
    button, input, select { font-family: inherit; color: var(--ink); }
    .btn { border: 1.5px solid var(--line-d); background: #fff; font-weight: 600; padding: 7px 13px; border-radius: var(--r); cursor: pointer; font-size: .92rem; }
    .btn.primary { background: var(--pen-blue); border-color: var(--pen-blue-d); color: #fff; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.on { background: var(--cyan-bg); border-color: var(--cyan); color: var(--cyan-d); }
    .panel.src { flex: 1 1 0; } .panel.out { flex: 1 1 0; }
    .tabs { display: flex; gap: 6px; }
    .stage { position: relative; flex: 1 1 auto; min-height: 240px; border: 1.5px dashed var(--line); border-radius: var(--r);
             background: #fff; display: grid; place-items: center; overflow: hidden; }
    .stage img, .stage video, .stage canvas { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
    .stage .msg { color: var(--ink-2); text-align: center; padding: 20px; font-size: .95rem; }
    .stage .msg img { height: 90px; margin: 0 auto 8px; }
    .stage.checker { background-color: #fff; background-image: linear-gradient(45deg, #eee 25%, transparent 25%), linear-gradient(-45deg, #eee 25%, transparent 25%),
                     linear-gradient(45deg, transparent 75%, #eee 75%), linear-gradient(-45deg, transparent 75%, #eee 75%);
                     background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0; }
    .fx { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .fx button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; border: 1.5px solid var(--line);
                 border-radius: 12px; background: #fff; cursor: pointer; font-weight: 700; font-size: .95rem; }
    .fx button small { font-weight: 400; font-size: .78rem; color: var(--ink-2); }
    .fx button:hover { border-color: var(--cyan); }
    .fx button.busy { border-color: var(--cyan); background: var(--cyan-bg); }
    .fx button:disabled { opacity: .45; cursor: not-allowed; }
    .fx svg { width: 26px; height: 26px; color: var(--cyan-d); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .hint { font-size: .85rem; color: var(--ink-2); }
    .meta { font-family: Menlo, Consolas, monospace; font-size: .8rem; color: var(--ink-2); }
    @media (max-width: 1023px) { .panel, .panel-body { overflow: visible; } .stage { min-height: 260px; } }
  </style>
  <link rel="stylesheet" href="/lib/ui.css">
  <link rel="stylesheet" href="/lib/shell.css">
</head>
<body data-density="explore">
  <div class="titlebar">
    <a class="tb-brand" href="/" title="인터넷 없이 내 컴퓨터에서 실행돼요"><img src="/assets/pibo-logo.png" alt=""><b>edge-lab</b></a>
    <span class="tb-sep"></span><span class="tb-app" id="txtTitle"></span>
    <div class="h-tools"><button id="langButton" title="한국어 / English">EN</button></div>
  </div>
  <div class="shell-body"><div class="workbench"><div class="main-container">

    <div class="panel src">
      <div class="panel-head">
        <span class="q"><span class="qnum">1</span><span class="qtext" id="txtQ1">사진 고르기</span></span>
        <span class="tabs" style="margin-left:auto">
          <button class="btn on" id="tabFile" type="button"></button>
          <button class="btn" id="tabCam" type="button"></button>
        </span>
      </div>
      <div class="panel-body">
        <div class="stage grow" id="srcStage"></div>
        <div class="row">
          <button class="btn" id="pickBtn" type="button"></button>
          <button class="btn primary" id="shotBtn" type="button" hidden></button>
          <span class="hint" id="srcHint"></span>
          <input type="file" id="fileIn" accept="image/*" hidden>
        </div>
      </div>
    </div>

    <div class="panel out">
      <div class="panel-head">
        <span class="q"><span class="qnum">2</span><span class="qtext" id="txtQ2">바꿔 보기</span></span>
      </div>
      <div class="panel-body">
        <div class="fx" id="fx"></div>
        <div class="stage grow" id="outStage"></div>
        <div class="row">
          <button class="btn" id="againBtn" type="button" disabled></button>
          <button class="btn" id="saveBtn" type="button" disabled></button>
          <span class="meta" id="meta"></span>
        </div>
      </div>
    </div>

  </div></div></div>

  <script src="/lib/icons.js"></script>
  <script>
  (function () {
    "use strict";
    var LANG = "ko";
    try { LANG = localStorage.getItem("vapiLang") === "en" ? "en" : "ko"; } catch (e) {}
    document.documentElement.lang = LANG;
    var I18N = {
      ko: { title: "edge-lab — 사진 스튜디오", lang: "EN", q1: "사진 고르기", q2: "바꿔 보기",
            file: "사진 파일", cam: "웹캠", pick: "사진 고르기", shot: "찍기", drop: "사진을 끌어다 놓거나 [사진 고르기] 를 누르세요",
            camHint: "[찍기] 를 누르면 그 장면을 써요", camFail: "웹캠을 쓸 수 없어요 — 사진 파일로 해 보세요",
            srcHint: "고른 사진은 이 컴퓨터 밖으로 나가지 않아요",
            bg: "배경 지우기", bgD: "사람·사물만 남겨요", sr: "화질 4배", srD: "작은 사진을 크게", depth: "깊이 지도", depthD: "가까울수록 밝게",
            outEmpty: "왼쪽에 사진을 고른 뒤 위 단추를 눌러 보세요", working: "바꾸는 중…",
            again: "이 결과로 이어 바꾸기", save: "결과 저장", fail: "바꾸지 못했어요: ", notReady: "AI 가 아직 준비 중이에요. 잠시 뒤에 해 보세요.",
            nDone: "사진이 다 바뀌었어요: ", nShow: "보러 가기", big: "사진이 커서 줄여서 보냈어요" },
      en: { title: "edge-lab — Photo studio", lang: "한", q1: "Pick a photo", q2: "Change it",
            file: "Photo file", cam: "Webcam", pick: "Choose photo", shot: "Take", drop: "Drop a photo here or press [Choose photo]",
            camHint: "Press [Take] to use that moment", camFail: "The webcam cannot be used — try a photo file",
            srcHint: "Your photo never leaves this computer",
            bg: "Remove background", bgD: "Keep only the subject", sr: "Upscale 4x", srD: "Make small photos big", depth: "Depth map", depthD: "Closer is brighter",
            outEmpty: "Pick a photo on the left, then press a button above", working: "Working…",
            again: "Keep changing this result", save: "Save result", fail: "Could not change it: ", notReady: "The AI is still loading. Try again in a moment.",
            nDone: "Your photo is ready: ", nShow: "Have a look", big: "The photo was large, so it was shrunk first" }
    };
    function t(k) { return I18N[LANG][k] !== undefined ? I18N[LANG][k] : I18N.ko[k]; }
    function $(id) { return document.getElementById(id); }
    var FX = [
      { key: "bg", api: "/gan/portrait", ic: "bg" },
      { key: "sr", api: "/gan/sr", ic: "sr", max: 640 },     // 4배라 원본이 크면 결과가 너무 커진다
      { key: "depth", api: "/gan/depth", ic: "depth" }
    ];
    var MAX = 1280;

    var srcBlob = null, outB64 = null, outName = "", stream = null, mode = "file", busy = false;

    function paintText() {
      document.title = t("title");
      $("langButton").textContent = t("lang");
      $("txtQ1").textContent = t("q1"); $("txtQ2").textContent = t("q2");
      $("tabFile").textContent = t("file"); $("tabCam").textContent = t("cam");
      $("pickBtn").textContent = t("pick"); $("shotBtn").textContent = t("shot");
      $("againBtn").textContent = t("again"); $("saveBtn").textContent = t("save");
      $("fx").innerHTML = FX.map(function (f) {
        return '<button type="button" data-fx="' + f.key + '">' + elIcon(f.ic) + t(f.key) + "<small>" + t(f.key + "D") + "</small></button>";
      }).join("");
      if (window.navRepaint) window.navRepaint();
    }

    /* ── 원본 ── */
    function showSrc(blob) {
      srcBlob = blob;
      var img = new Image();
      img.src = URL.createObjectURL(blob);
      $("srcStage").innerHTML = ""; $("srcStage").appendChild(img);
      $("srcHint").textContent = t("srcHint");
      paintFx();
    }
    function emptySrc() {
      $("srcStage").innerHTML = '<div class="msg"><img src="/assets/pibo-hello.png" alt="">' + t("drop") + "</div>";
    }
    /* 큰 사진은 줄여서 보낸다 — 화질 4배는 더 작게 */
    function shrink(blob, max) {
      return new Promise(function (res) {
        var img = new Image();
        img.onload = function () {
          var w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
          if (k >= 1) { res({ blob: blob, shrunk: false }); return; }
          var c = document.createElement("canvas");
          c.width = Math.round(w * k); c.height = Math.round(h * k);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          c.toBlob(function (b) { res({ blob: b, shrunk: true }); }, "image/jpeg", 0.92);
        };
        img.onerror = function () { res({ blob: blob, shrunk: false }); };
        img.src = URL.createObjectURL(blob);
      });
    }

    $("pickBtn").addEventListener("click", function () { $("fileIn").click(); });
    $("fileIn").addEventListener("change", function () { if (this.files[0]) showSrc(this.files[0]); this.value = ""; });
    ["dragover", "drop"].forEach(function (ev) {
      $("srcStage").addEventListener(ev, function (e) {
        e.preventDefault();
        if (ev === "drop" && e.dataTransfer.files[0] && /^image\//.test(e.dataTransfer.files[0].type)) { setMode("file"); showSrc(e.dataTransfer.files[0]); }
      });
    });
    document.addEventListener("paste", function (e) {
      var it = [].slice.call((e.clipboardData || {}).items || []).filter(function (x) { return /^image\//.test(x.type); })[0];
      if (it) { setMode("file"); showSrc(it.getAsFile()); }
    });

    /* ── 웹캠 — 웹캠 탭일 때만 켠다 ── */
    function camOn() {
      if (stream) return;
      navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } }).then(function (s) {
        if (mode !== "cam" || (window.EL_WIN && EL_WIN.hidden)) { s.getTracks().forEach(function (x) { x.stop(); }); return; }
        stream = s;
        var v = document.createElement("video");
        v.autoplay = true; v.muted = true; v.playsInline = true; v.srcObject = s; v.id = "camV";
        $("srcStage").innerHTML = ""; $("srcStage").appendChild(v);
        $("srcHint").textContent = t("camHint");
      }).catch(function () {
        $("srcStage").innerHTML = '<div class="msg">' + t("camFail") + "</div>";
      });
    }
    function camOff() {
      if (stream) stream.getTracks().forEach(function (x) { x.stop(); });
      stream = null;
    }
    function setMode(m) {
      mode = m;
      $("tabFile").classList.toggle("on", m === "file"); $("tabCam").classList.toggle("on", m === "cam");
      $("pickBtn").hidden = m !== "file"; $("shotBtn").hidden = m !== "cam";
      if (m === "cam") camOn();
      else { camOff(); if (srcBlob) showSrc(srcBlob); else emptySrc(); $("srcHint").textContent = srcBlob ? t("srcHint") : ""; }
    }
    $("tabFile").addEventListener("click", function () { setMode("file"); });
    $("tabCam").addEventListener("click", function () { setMode("cam"); });
    $("shotBtn").addEventListener("click", function () {
      var v = $("camV");
      if (!v || !v.videoWidth) return;
      var c = document.createElement("canvas");
      c.width = v.videoWidth; c.height = v.videoHeight;
      c.getContext("2d").drawImage(v, 0, 0);
      c.toBlob(function (b) { setMode("file"); showSrc(b); }, "image/jpeg", 0.92);
    });
    if (window.EL_WIN) {
      EL_WIN.onHide(camOff);
      EL_WIN.onShow(function () { if (mode === "cam") camOn(); });
    }

    /* ── 바꾸기 ── */
    function paintFx() {
      [].forEach.call($("fx").querySelectorAll("button"), function (b) { b.disabled = !srcBlob || busy; });
    }
    function emptyOut() { $("outStage").innerHTML = '<div class="msg">' + t("outEmpty") + "</div>"; $("outStage").classList.remove("checker"); }
    $("fx").addEventListener("click", function (e) {
      var b = e.target.closest("[data-fx]");
      if (!b || !srcBlob || busy) return;
      var f = FX.filter(function (x) { return x.key === b.getAttribute("data-fx"); })[0];
      run(f, b);
    });
    function run(f, btn) {
      busy = true; paintFx(); btn.classList.add("busy");
      $("outStage").innerHTML = '<div class="msg">' + t("working") + "</div>";
      $("meta").textContent = "";
      var t0 = performance.now();
      shrink(srcBlob, f.max || MAX).then(function (s) {
        var fd = new FormData();
        fd.append("uploadFile", s.blob, "image.jpg");
        return fetch(f.api, { method: "POST", body: fd }).then(function (r) {
          if (r.status === 503) throw new Error(t("notReady"));
          return r.json();
        }).then(function (j) {
          if (!j || j.result !== "ok") throw new Error(j && j.data);
          outB64 = j.data; outName = f.key;
          var img = new Image();
          img.src = "data:image/jpeg;base64," + outB64;
          $("outStage").innerHTML = ""; $("outStage").appendChild(img);
          $("outStage").classList.toggle("checker", f.key === "bg");
          $("meta").textContent = (j.device || "") + " · " + (j.elapsed_ms || Math.round(performance.now() - t0)) + " ms" + (s.shrunk ? " · " + t("big") : "");
          $("againBtn").disabled = $("saveBtn").disabled = false;
          if (window.vapiStat) vapiStat("studio_" + f.key);
          if (window.EL_WIN && EL_WIN.hidden) EL_WIN.notify(t("nDone") + t(f.key), { actions: [{ label: t("nShow"), href: "/studio" }] });
        });
      }).catch(function (err) {
        $("outStage").innerHTML = '<div class="msg">' + t("fail") + ((err && err.message) || err) + "</div>";
      }).then(function () { busy = false; btn.classList.remove("busy"); paintFx(); });
    }
    function b64Blob(b64) {
      var bin = atob(b64), u8 = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      return new Blob([u8], { type: "image/jpeg" });
    }
    $("againBtn").addEventListener("click", function () { if (outB64) { setMode("file"); showSrc(b64Blob(outB64)); } });
    $("saveBtn").addEventListener("click", function () {
      if (!outB64) return;
      var a = document.createElement("a");
      a.href = URL.createObjectURL(b64Blob(outB64));
      var d = new Date();
      a.download = "studio-" + outName + "-" + d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0") +
                   "-" + String(d.getHours()).padStart(2, "0") + String(d.getMinutes()).padStart(2, "0") + ".jpg";
      document.body.appendChild(a); a.click(); a.remove();
    });

    $("langButton").addEventListener("click", function () {
      try { localStorage.setItem("vapiLang", LANG === "ko" ? "en" : "ko"); } catch (e) {}
      location.reload();
    });

    paintText(); emptySrc(); emptyOut(); paintFx(); setMode("file");
  })();
  </script>
  <script src="/lib/shell.js"></script>
  <script src="/lib/usage.js" data-page="studio"></script>
  <i id="el-built" hidden></i>
</body>
</html>
