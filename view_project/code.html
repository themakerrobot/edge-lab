<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>파이썬 — The Maker</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link href="/fonts/fonts.css" rel="stylesheet">
  <link href="/lib/cm/codemirror.css" rel="stylesheet">
  <link href="/lib/cm/show-hint.css" rel="stylesheet">
  <style>
    /* ===== 디자인 토큰 : 다른 페이지와 동일 ===== */
    :root {
      --paper:    #f5f8fb;
      --box:      #ffffff;
      --ink:      #26303c;
      --ink-2:    #64707e;
      --cyan:     #29b8e5;
      --cyan-d:   #0f93c0;
      --pen-blue: #2b4bd8;
      --pen-blue-d:#1f3ab0;
      --pen-red:  #d94141;
      --line:     #ccd6e0;
      --line-d:   #2c4a7c;
      --r: 6px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
      color: var(--ink); background-color: var(--paper);
      font-family: "Gowun Dodum", "Apple SD Gothic Neo", system-ui, sans-serif;
      line-height: 1.5; padding: 12px; gap: 10px;
    }
    a { color: var(--pen-blue-d); text-decoration: none; }
    select, input, button {
      font-family: inherit; font-size: .95rem; color: var(--ink); background: #fff;
      border: 1.5px solid var(--line); border-radius: var(--r); padding: 7px 11px;
      outline: none; transition: border-color .12s, background .12s;
      cursor: pointer;
    }
    select:focus, input:focus { border-color: var(--pen-blue); }
    button:hover { background: var(--paper); }
    button:disabled { opacity: .45; cursor: not-allowed; }

    /* ===== 머리표 ===== */
    .header {
      flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: stretch;
      background: var(--box); border: 2px solid var(--line-d); border-radius: 3px;
      box-shadow: 0 1px 0 rgba(44,74,124,.18);
    }
    .header > div { display: flex; flex-direction: column; justify-content: center; padding: 10px 16px; }
    .eyebrow { font-size: .78rem; color: var(--ink-2); letter-spacing: .04em; }
    .title { font-family: "Gowun Dodum", sans-serif; font-weight: 700; font-size: 1.35rem; color: var(--ink); }
    .h-tools { flex-direction: row !important; align-items: center !important; gap: 8px; margin-left: auto; }

    /* ===== 시스템 상태바 ===== */
    .sysbar {
      flex: 0 0 auto; display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap;
      background: #fffdf6; border: 1.5px solid var(--line-d); border-radius: 3px;
      padding: 7px 14px;
      font-family: "Menlo", "Consolas", ui-monospace, monospace;
      font-size: .76rem; letter-spacing: .02em; color: var(--ink-2);
      box-shadow: 0 1px 0 rgba(44,74,124,.15);
      transform: rotate(-.25deg); position: relative;
    }
    .sysbar::before {
      content: ""; position: absolute; top: -7px; left: 26px; width: 54px; height: 13px;
      background: rgba(41,184,229,.38);
      border-left: 1px solid rgba(38,38,46,.12); border-right: 1px solid rgba(38,38,46,.12);
      transform: rotate(-2deg);
    }
    .sysbar .brand b { color: var(--ink); font-weight: 700; letter-spacing: .08em; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: #fff; border: 1.5px solid var(--line); border-radius: 999px;
      padding: 2px 10px; color: #a3a094;
    }
    .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: #d8d5c8; }
    .chip.on { color: var(--ink); border-color: var(--ink); }
    .chip.on .dot { background: var(--cyan); box-shadow: 0 0 5px rgba(41,184,229,.6); }
    .sep { color: var(--line-d); opacity: .5; }
    .meter { margin-left: auto; display: flex; gap: 14px; }
    .meter .k { color: #a3a094; } .meter .v { color: var(--ink); font-weight: 700; }

    /* ===== 본문 2단 ===== */
    .main { flex: 1 1 auto; min-height: 0; display: flex; gap: 10px; }
    .panel {
      display: flex; flex-direction: column; min-width: 0;
      background: var(--box); border: 1.5px solid var(--line); border-radius: var(--r); overflow: hidden;
    }
    .ed-panel { flex: 3 1 0; }
    .out-panel { flex: 2 1 0; min-width: 320px; }
    .panel-head {
      flex: 0 0 auto; display: flex; align-items: center; gap: 9px;
      margin: 12px 12px 16px; padding: 7px 14px;
      border: 2.5px solid var(--cyan); border-radius: 2px;
      font-family: "Gowun Dodum", sans-serif; font-weight: 700; color: var(--cyan-d);
      position: relative; align-self: flex-start;
    }
    .panel-head::after {
      content: ""; position: absolute; left: 14px; bottom: -12px;
      border: 7px solid transparent; border-top: 9px solid var(--cyan);
    }
    .ph-row { display: flex; align-items: center; flex-wrap: wrap; }
    .ph-tools { margin: 12px 12px 16px auto; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .ph-tools button { padding: 7px 12px; font-size: .9rem; }
    #guideButton.on {
      background: var(--cyan); border-color: var(--cyan-d); color: #fff; font-weight: 700;
    }
    #runButton { background: var(--pen-blue); border-color: var(--pen-blue-d); color: #fff; font-weight: 700; }
    #runButton:hover:not(:disabled) { background: var(--pen-blue-d); }
    #stopButton { color: var(--pen-red); border-color: var(--pen-red); }

    .CodeMirror {
      flex: 1 1 auto; height: auto; min-height: 0;
      font-family: "Menlo", "Consolas", ui-monospace, monospace;
      font-size: .95rem; line-height: 1.55;
      border-top: 1px dashed var(--line);
    }
    .cm-s-default .cm-keyword { color: var(--pen-blue-d); }
    .cm-s-default .cm-string { color: #b26a00; }
    .cm-s-default .cm-comment { color: #7a8896; }

    /* 좁은 화면: 세로로 쌓고, 도움말은 편집기 아래로 */
    @media (max-width: 1200px) {
      .out-panel { min-width: 260px; }
      .help-panel { flex: 0 0 250px; min-width: 220px; }
    }
    @media (max-width: 980px) {
      body { height: auto; overflow: auto; }
      .main { flex-direction: column; }
      .ed-panel { min-height: 46vh; }
      .out-panel, .help-panel { min-width: 0; }
      .out-panel { min-height: 30vh; }
      .help-panel.open { max-height: 45vh; }
      .ph-tools { margin-left: 12px; }
    }

    /* ===== 도움말 패널 (열어 둔 채로 코딩한다) ===== */
    .help-panel { flex: 0 0 300px; min-width: 260px; display: none; }
    .help-panel.open { display: flex; }
    #helpSearch { margin: 0 12px 8px; width: calc(100% - 24px); flex: 0 0 auto; }
    #helpScroll { flex: 1 1 auto; min-height: 0; overflow: auto; }
    #helpList { padding: 0 12px 4px; }
    .h-item {
      border: 1.5px solid var(--line); border-radius: var(--r);
      padding: 8px 10px; margin-bottom: 6px; cursor: pointer;
    }
    .h-item:hover { border-color: var(--pen-blue); background: var(--paper); }
    .h-item code {
      font-family: Menlo, Consolas, ui-monospace, monospace; font-size: .84rem;
      color: var(--pen-blue-d); font-weight: 700;
    }
    .h-item .d { color: var(--ink-2); font-size: .82rem; margin-top: 2px; }
    .h-detail {
      margin-top: 7px; padding-top: 7px; border-top: 1px dashed var(--line);
      font-size: .8rem; color: var(--ink); display: none;
    }
    .h-item.open .h-detail { display: block; }
    .h-detail dt { color: var(--cyan-d); font-weight: 700; margin-top: 5px; }
    .h-detail dd { margin: 1px 0 0; color: var(--ink-2); }
    .h-detail pre {
      background: var(--paper); border-radius: 4px; padding: 6px 8px; margin-top: 5px;
      font-family: Menlo, Consolas, ui-monospace, monospace; font-size: .76rem;
      white-space: pre-wrap; color: var(--ink);
    }
    .h-item .more {
      float: right; margin-right: 6px; font-size: .74rem; color: var(--ink-2);
      border: 1px solid var(--line); border-radius: 3px; padding: 1px 6px;
    }
    .h-item .put {
      float: right; font-size: .74rem; color: var(--ink-2);
      border: 1px solid var(--line); border-radius: 3px; padding: 1px 6px;
    }
    .h-group { font-size: .78rem; color: var(--cyan-d); font-weight: 700;
               margin: 10px 0 5px; letter-spacing: .04em; }
    .h-more { margin: 0 12px 12px; font-size: .82rem; }
    .h-more summary { cursor: pointer; color: var(--pen-blue-d); }
    .h-more table { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: .78rem; }
    .h-more th, .h-more td { border: 1px solid var(--line); padding: 4px 6px; text-align: left; }
    .h-more th { background: var(--paper); }
    .h-more code { background: var(--paper); padding: 1px 4px; border-radius: 3px;
                   font-family: Menlo, Consolas, ui-monospace, monospace; font-size: .92em; }
    .CodeMirror-hints { z-index: 80; font-family: Menlo, Consolas, ui-monospace, monospace; }

    #output {
      flex: 1 1 auto; min-height: 0; overflow: auto;
      margin: 0 12px 12px; padding: 12px;
      background: #23292f; color: #dfe7ee; border-radius: var(--r);
      font-family: "Menlo", "Consolas", ui-monospace, monospace;
      font-size: .87rem; line-height: 1.5; white-space: pre-wrap; word-break: break-all;
    }
    #output .err { color: #ff9a9a; }
    #output .sys { color: #7fd1ea; }
    .hintline { margin: 0 12px 10px; color: var(--ink-2); font-size: .84rem; }

    /* ===== 예제/가이드 모달 ===== */
    .modal-bg {
      position: fixed; inset: 0; background: rgba(38,48,60,.45);
      display: none; align-items: center; justify-content: center; z-index: 60;
    }
    .modal-bg.show { display: flex; }
    .modal {
      width: min(720px, 92vw); max-height: 84vh; overflow: auto;
      background: var(--box); border: 2px solid var(--line-d); border-radius: 6px; padding: 20px;
    }
    .modal h3 { font-family: "Gowun Dodum", sans-serif; color: var(--cyan-d); margin-bottom: 12px; }
    .ex-card {
      border: 1.5px solid var(--line); border-radius: var(--r);
      padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
    }
    .ex-card:hover { border-color: var(--pen-blue); background: var(--paper); }
    .ex-card b { color: var(--ink); }
    .ex-card .del:hover { background: var(--pen-red); color: #fff; }
    .ex-card .d { color: var(--ink-2); font-size: .86rem; }
    .modal table { border-collapse: collapse; width: 100%; font-size: .88rem; }
    .modal th, .modal td { border: 1px solid var(--line); padding: 6px 9px; text-align: left; }
    .modal th { background: var(--paper); font-family: "Gowun Dodum", sans-serif; }
    .modal code { background: var(--paper); padding: 1px 5px; border-radius: 3px;
                  font-family: "Menlo","Consolas",ui-monospace,monospace; font-size: .85em; }
    .modal .close { float: right; }
  </style>
</head>
<body>
  <div class="header">
    <div class="h-subject" style="flex-direction:row;align-items:center;gap:12px;">
      <img src="/assets/pibo-prof.png" alt="" style="height:44px;flex:0 0 auto;">
      <span style="display:flex;flex-direction:column;">
      <span class="eyebrow" id="txtEyebrow">파이썬으로 AI를 불러 봐요 · 인터넷 없이 내 컴퓨터에서</span>
      <span class="title"><span id="txtTitle">파이썬</span> <span style="font-size:.85rem;color:var(--pen-red);vertical-align:middle;">(On-Device)</span></span>
    </span>
    </div>
    <div class="h-tools">
      <a href="/" id="homeLink" style="display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1.5px solid var(--line-d);color:var(--ink);width:38px;height:38px;border-radius:var(--r);text-decoration:none;font-size:1.15rem;line-height:1;">&#8962;</a>
      <button id="langButton" title="한국어 / English" style="min-width:46px;">EN</button>
    </div>
  </div>

  <!-- 시스템 상태바 -->
  <div class="sysbar" id="sysbar">
    <span class="brand"><b>VAPI-OD</b> · on-device vision runtime</span>
    <span class="sep">|</span>
    <span class="chip" id="chipCPU"><span class="dot"></span>CPU</span>
    <span class="chip" id="chipGPU"><span class="dot"></span>GPU</span>
    <span class="chip" id="chipNPU"><span class="dot"></span>NPU</span>
    <span class="meter">
      <span><span class="k" id="txtRunState">상태</span> <span class="v" id="runState">준비됨</span></span>
    </span>
  </div>

  <div class="main">
    <!-- 편집기 -->
    <div class="panel ed-panel">
      <div class="ph-row">
        <div class="panel-head" id="txtEdHead">파이썬 코드를 써요</div>
        <div class="ph-tools">
          <button id="guideButton">가이드</button>
          <button id="exampleButton">예제</button>
          <button id="saveButton">저장</button>
          <button id="loadButton">불러오기</button>
          <button id="deployButton">배포</button>
          <button id="runButton" title="Ctrl + Enter"><span id="runLabel">실행 ▶</span></button>
          <button id="stopButton" title="Esc">정지</button>
        </div>
      </div>
      <textarea id="editor"></textarea>
    </div>

    <!-- 출력 -->
    <div class="panel out-panel">
      <div class="ph-row">
        <div class="panel-head" id="txtOutHead">결과를 확인해요</div>
        <div class="ph-tools">
          <button id="clearButton">지우기</button>
        </div>
      </div>
      <div id="stageWrap" style="display:none;margin:0 12px 8px;">
        <img id="stageImg" alt="" style="width:100%;max-height:44vh;object-fit:contain;
             background:#fff;border:1.5px solid var(--line);border-radius:var(--r);">
        <div id="stageCap" style="font-size:.78rem;color:var(--ink-2);margin-top:3px;"></div>
      </div>
      <div id="output"></div>
      <div class="hintline" id="txtHint">show() 결과는 위 칸에 나와요. 배포한 프로그램에서는 창으로 떠요. input() 은 지원하지 않아요.</div>
    </div>

    <!-- 도움말 (열어 둔 채로 코딩) -->
    <div class="panel help-panel" id="helpPanel">
      <div class="ph-row">
        <div class="panel-head" id="txtHelpHead">도움말</div>
        <div class="ph-tools">
          <button id="helpClose" title="닫기">✕</button>
        </div>
      </div>
      <input id="helpSearch" placeholder="찾기 (예: 얼굴, 소리)">
      <div id="helpScroll">
        <div id="helpList"></div>
        <details class="h-more">
          <summary id="txtHelpMore">기능 이름 · 종류 표 보기</summary>
          <div id="guideBody"></div>
        </details>
      </div>
    </div>
  </div>

  <!-- 저장한 작품 모달 -->
  <div class="modal-bg" id="workModal">
    <div class="modal">
      <button class="close" onclick="document.getElementById('workModal').classList.remove('show')">✕</button>
      <h3 id="txtWorkTitle">저장한 작품</h3>
      <div id="workList"></div>
    </div>
  </div>

  <!-- 예제 모달 -->
  <div class="modal-bg" id="exModal">
    <div class="modal">
      <button class="close" onclick="document.getElementById('exModal').classList.remove('show')">✕</button>
      <h3 id="txtExTitle">예제 프로그램</h3>
      <div id="exList"></div>
    </div>
  </div>

  <script src="/lib/cm/codemirror.js"></script>
  <script src="/lib/cm/python.js"></script>
  <script src="/lib/cm/matchbrackets.js"></script>
  <script src="/lib/cm/closebrackets.js"></script>
  <script src="/lib/cm/show-hint.js"></script>
  <script>
    /* =============================== 한/영 사전 =============================== */
    const DICT = {
      ko: {
        titleTag: "파이썬 — The Maker", title: "파이썬",
        eyebrow: "파이썬으로 AI를 불러 봐요 · 인터넷 없이 내 컴퓨터에서",
        homeLink: "The Maker (홈)", langBtn: "EN",
        edHead: "파이썬 코드를 써요", outHead: "결과를 확인해요",
        guide: "도움말", guideOff: "도움말 ✕", example: "예제", save: "저장", load: "불러오기", deploy: "배포",
        helpHead: "도움말", helpMore: "기능 이름 · 종류 표 보기", helpSearch: "찾기 (예: 얼굴, 소리)",
        put: "넣기", detail: "설명", noHit: "찾는 것이 없어요.",
        argsK: "넣는 것", retK: "돌려주는 것", exK: "예시 (눌러서 넣기)",
        g_basic: "기본", g_ai: "AI 로 보기", g_my: "내가 만든 AI",
        g_sound: "소리", g_flow: "반복 · 조건",
        run: "실행 ▶", running: "실행 중...", stop: "정지", clear: "지우기",
        runStateK: "상태", stReady: "준비됨", stRun: "실행 중", stDone: "끝남", stStop: "정지됨",
        hint: "show() 결과는 위 칸에 나와요. 배포한 프로그램에서는 창으로 떠요. input() 은 지원하지 않아요.",
        exTitle: "예제 프로그램", guideTitle: "themaker 함수 가이드",
        savePrompt: "저장할 이름을 입력하세요", loadPrompt: "불러올 작품 번호를 입력하세요",
        deployPrompt: "배포할 이름을 입력하세요",
        workTitle: "저장한 작품", savedAs: "저장했어요 · ", del: "삭제", delAsk: "지울까요? ",
        waitTts: "[소리 모델을 여는 중이에요. 처음 한 번만 몇 초 걸려요]",
        waitStt: "[음성 인식 모델을 여는 중이에요. 처음 한 번만 몇 초 걸려요]",
        waitYolo: "[모델 파일을 읽는 중이에요. 처음 한 번만 걸려요]",
        deployDone: "배포 파일을 내려받았어요. 압축을 풀고 실행 파일을 두 번 누르면 돼요.\n(The Maker 가 깔린 컴퓨터에서 동작해요)",
        deployFail: "배포 파일을 만들지 못했어요: ",
        noWorks: "저장된 작품이 없어요.", started: "[실행 시작]",
        finished: "[끝났어요 · 코드 ", okEnd: "[끝났어요]", stopped: "[정지했어요]",
        memEnd: "[프로그램이 갑자기 멈췄어요]",
        confirmReplace: "지금 코드가 지워져요. 예제를 불러올까요?",
      },
      en: {
        titleTag: "Python — The Maker", title: "Python",
        eyebrow: "call AI from Python · runs on this computer",
        homeLink: "The Maker (home)", langBtn: "한",
        edHead: "Write Python code", outHead: "Check the result",
        guide: "Help", guideOff: "Help ✕", example: "Examples", save: "Save", load: "Load", deploy: "Share",
        helpHead: "Help", helpMore: "Kinds & tables", helpSearch: "search (e.g. face, sound)",
        put: "insert", detail: "what?", noHit: "Nothing found.",
        argsK: "takes", retK: "returns", exK: "example (click to insert)",
        g_basic: "Basics", g_ai: "See with AI", g_my: "Your own AI",
        g_sound: "Sound", g_flow: "Repeat · If",
        run: "Run ▶", running: "Running...", stop: "Stop", clear: "Clear",
        runStateK: "state", stReady: "ready", stRun: "running", stDone: "done", stStop: "stopped",
        hint: "show() draws above; a shared program opens a window instead. input() is not supported.",
        exTitle: "Example programs", guideTitle: "themaker functions",
        savePrompt: "Name to save as", loadPrompt: "Enter the number of the work to load",
        deployPrompt: "Name for the shared file",
        workTitle: "Saved works", savedAs: "Saved · ", del: "delete", delAsk: "Delete? ",
        waitTts: "[opening the voice model - a few seconds, only the first time]",
        waitStt: "[opening the speech model - a few seconds, only the first time]",
        waitYolo: "[reading the model file - only the first time]",
        deployDone: "Downloaded. Unzip it and double-click the runner.\n(Works on a PC with The Maker installed)",
        deployFail: "Could not build the package: ",
        noWorks: "No saved works yet.", started: "[started]",
        finished: "[finished · exit ", okEnd: "[finished]", stopped: "[stopped]",
        memEnd: "[the program crashed]",
        confirmReplace: "This will replace your current code. Load the example?",
      },
    };
    let LANG = localStorage.getItem("vapi-lang") || "ko";
    const t = k => (DICT[LANG] && DICT[LANG][k]) || DICT.ko[k] || k;

    /* =============================== CodeMirror =============================== */
    const DEFAULT_CODE = `from themaker import *

img = camera()              # 웹캠 한 장 찍기
r = vision("object", img)   # AI 로 사물 인식 (vision("사물", img) 도 돼요)
print(r)
show(img, r)                # 결과를 창으로 보기
`;
    const cm = CodeMirror.fromTextArea(document.getElementById("editor"), {
      mode: "python", lineNumbers: true, indentUnit: 4,
      matchBrackets: true, autoCloseBrackets: true,
      extraKeys: { Tab: c => c.execCommand("indentMore"), "Shift-Tab": c => c.execCommand("indentLess") },
    });
    cm.setValue(localStorage.getItem("pycode-draft") || DEFAULT_CODE);
    cm.on("change", () => localStorage.setItem("pycode-draft", cm.getValue()));

    /* =============================== 실행/중지 =============================== */
    const out = document.getElementById("output");
    let SID = null, pollTimer = null, outPos = 0;

    function print(text, cls) {
      const span = document.createElement("span");
      if (cls) span.className = cls;
      span.textContent = text;
      out.appendChild(span);
      out.scrollTop = out.scrollHeight;
    }
    function setState(key) {
      document.getElementById("runState").textContent = t(key);
      const running = key === "stRun";
      document.getElementById("runButton").disabled = running;
      document.getElementById("runLabel").textContent = running ? t("running") : t("run");
    }

    /* 소리·음성은 첫 호출에 모델을 여느라 시간이 걸린다 — 미리 알려 준다 */
    let WARNED = { tts: false, stt: false, yolo: false };
    function notePreload(code) {
      if (!WARNED.tts && /\bspeak\s*\(/.test(code)) { WARNED.tts = true; print(t("waitTts") + "\n", "sys"); }
      if (!WARNED.stt && /\b(listen|stt)\s*\(/.test(code)) { WARNED.stt = true; print(t("waitStt") + "\n", "sys"); }
      if (!WARNED.yolo && /\bdetect\s*\(/.test(code)) { WARNED.yolo = true; print(t("waitYolo") + "\n", "sys"); }
    }

    async function run() {
      if (SID) return;
      out.textContent = ""; outPos = 0; lastSeq = 0;
      document.getElementById("stageWrap").style.display = "none";
      print(t("started") + "\n", "sys");
      notePreload(cm.getValue());
      setState("stRun");
      try {
        const j = await (await fetch("/pycode/run", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code: cm.getValue() }),
        })).json();
        if (j.result !== "ok") { print(j.data + "\n", "err"); setState("stReady"); return; }
        SID = j.data.sid;
        pollTimer = setInterval(poll, 300);
      } catch (e) { print(String(e) + "\n", "err"); setState("stReady"); }
    }

    let lastSeq = 0;
    let polling = false;                 // 응답이 늦으면 폴링이 겹쳐 메시지가 여러 번 찍힌다
    async function poll() {
      if (!SID || polling) return;
      polling = true;
      const sid = SID;
      try {
        const j = await (await fetch(`/pycode/output?sid=${sid}&pos=${outPos}`)).json();
        if (SID !== sid) return;         // 그 사이 정지·재실행된 경우
        if (j.result !== "ok") return;
        if (j.data.text) print(j.data.text);
        outPos = j.data.pos;
        if (j.data.seq && j.data.seq !== lastSeq) {      // show() 결과가 새로 왔다
          lastSeq = j.data.seq;
          document.getElementById("stageWrap").style.display = "";
          document.getElementById("stageImg").src =
            `/pycode/frame?sid=${sid}&v=${lastSeq}`;
          document.getElementById("stageCap").textContent = j.data.caption || "";
        }
        if (j.data.done) {
          clearInterval(pollTimer); pollTimer = null;
          SID = null;
          if (j.data.stopped) { print("\n" + t("stopped") + "\n", "sys"); setState("stStop"); }
          else { print("\n" + endMsg(j.data.exit) + "\n", "sys"); setState("stDone"); }
        }
      } catch (e) { /* 다음 폴링에서 재시도 */
      } finally { polling = false; }
    }

    /* 윈도우 종료 코드는 그대로 보여주면 학생이 겁먹는다 — 뜻을 풀어 준다 */
    function endMsg(code) {
      if (code === 0) return t("okEnd");
      if (code === 3221225786 || code === -1073741510) return t("stopped");
      if (code === 3221225477 || code === 3221225725) return t("memEnd");
      return t("finished") + code + "]";
    }

    async function stop() {
      if (!SID) return;
      const sid = SID;
      try {
        await fetch("/pycode/stop", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sid }),
        });
      } catch (e) {}
      /* 실제 종료·메시지는 폴링이 처리한다. 응답이 없으면 3초 뒤 강제로 끝낸다. */
      setTimeout(() => {
        if (SID === sid) {
          clearInterval(pollTimer); pollTimer = null; SID = null;
          print("\n" + t("stopped") + "\n", "sys"); setState("stStop");
        }
      }, 3000);
    }

    document.getElementById("runButton").onclick = run;
    document.getElementById("stopButton").onclick = stop;
    document.getElementById("clearButton").onclick = () => {
      out.textContent = "";
      document.getElementById("stageWrap").style.display = "none";

    function renderHelp(q) {
      const box = document.getElementById("helpList");
      const key = (q || "").trim().toLowerCase();
      box.innerHTML = "";
      let lastGroup = "", shown = 0;
      API.forEach(it => {
        const info = (LANG === "en" ? it.en : it.ko) || it.ko;
        if (key && !(it.n.toLowerCase().includes(key) || info.d.toLowerCase().includes(key)))
          return;
        shown++;
        if (it.g !== lastGroup) {
          lastGroup = it.g;
          const h = document.createElement("div");
          h.className = "h-group"; h.textContent = t("g_" + it.g);
          box.appendChild(h);
        }
        const d = document.createElement("div");
        d.className = "h-item";
        d.innerHTML =
          `<span class="put"></span><span class="more"></span><code></code><div class="d"></div>
           <div class="h-detail"><dl>
             <dt class="k1"></dt><dd class="v1"></dd>
             <dt class="k2"></dt><dd class="v2"></dd>
           </dl><pre></pre></div>`;
        d.querySelector("code").textContent = it.n;
        d.querySelector(".d").textContent = info.d;
        d.querySelector(".put").textContent = t("put");
        d.querySelector(".more").textContent = t("detail");
        d.querySelector(".k1").textContent = t("argsK");
        d.querySelector(".v1").textContent = info.a;
        d.querySelector(".k2").textContent = t("retK");
        d.querySelector(".v2").textContent = info.r;
        d.querySelector("pre").textContent = it.x;

        d.querySelector(".put").onclick = ev => { ev.stopPropagation(); insertSnippet(it.ins); };
        d.querySelector(".more").onclick = ev => { ev.stopPropagation(); d.classList.toggle("open"); };
        d.querySelector("pre").onclick = ev => { ev.stopPropagation(); insertSnippet(it.x); };
        d.onclick = () => insertSnippet(it.ins);   /* 카드를 눌러도 넣기 */
        box.appendChild(d);
      });
      if (!shown) {
        const e = document.createElement("div");
        e.className = "h-item"; e.textContent = t("noHit");
        box.appendChild(e);
      }
    }

    function insertSnippet(code) {
      const doc = cm.getDoc();
      const cur = doc.getCursor();
      const line = doc.getLine(cur.line);
      /* 줄에 이미 글이 있으면 아랫줄에 넣는다 (덮어쓰지 않게) */
      if (line.trim() && cur.ch >= line.length) {
        doc.replaceRange("\n" + code, cur);
      } else {
        doc.replaceRange(code, cur);
      }
      cm.focus();
    }

    /* 버튼 하나로 열고 닫는다 — 열려 있으면 버튼에 표시가 남아 다시 누르면 닫힌다는 걸 알 수 있다 */
    function setHelp(open) {
      const p = document.getElementById("helpPanel");
      const btn = document.getElementById("guideButton");
      p.classList.toggle("open", open);
      btn.classList.toggle("on", open);
      btn.textContent = open ? t("guideOff") : t("guide");
      if (open) {
        document.getElementById("guideBody").innerHTML = GUIDE[LANG] || GUIDE.ko;
        renderHelp(document.getElementById("helpSearch").value);
      }
      setTimeout(() => cm.refresh(), 50);
    }
    document.getElementById("guideButton").onclick = () =>
      setHelp(!document.getElementById("helpPanel").classList.contains("open"));
    document.getElementById("helpClose").onclick = () => setHelp(false);
    document.getElementById("helpSearch").addEventListener("input", e => renderHelp(e.target.value));

    /* ---------------- 자동완성 ---------------- */
    const KINDS = ["object", "face", "face_attr", "distance", "hand", "pose", "seg",
                   "caption", "question", "tag", "classify", "ocr", "qr",
                   "bg_remove", "sr", "mask", "fire", "fall", "ball", "rps",
                   "number", "helmet", "box"];
    const FUNCS = ["camera", "load", "save", "show", "draw", "vision", "detect",
                   "speak", "listen", "stt", "my_models", "print", "range",
                   "len", "for", "if", "else", "while", "import", "from"];

    function themakerHint(editor) {
      const cur = editor.getCursor();
      const line = editor.getLine(cur.line).slice(0, cur.ch);
      /* 따옴표 안이면 기능 이름을 제안한다: vision(" 까지 쳤을 때 */
      const q = line.match(/["']([\w:]*)$/);
      if (q && /vision\s*\(\s*["']?[\w:]*$/.test(line)) {
        const typed = q[1];
        const list = KINDS.filter(k => k.startsWith(typed));
        if (list.length) {
          return { list, from: CodeMirror.Pos(cur.line, cur.ch - typed.length),
                   to: cur };
        }
      }
      const w = line.match(/[\w_]+$/);
      if (!w) return null;
      const typed = w[0];
      const list = FUNCS.filter(f => f.startsWith(typed) && f !== typed);
      if (!list.length) return null;
      return { list, from: CodeMirror.Pos(cur.line, cur.ch - typed.length), to: cur };
    }

    cm.setOption("extraKeys", Object.assign({}, cm.getOption("extraKeys"), {
      "Ctrl-Space": c => c.showHint({ hint: themakerHint, completeSingle: false }),
      "Ctrl-Enter": () => { if (!SID) run(); },      // 실행
      "Cmd-Enter": () => { if (!SID) run(); },
      "Shift-Ctrl-Enter": () => stop(),
    }));
    /* 편집기 밖에서도 되게 */
    document.addEventListener("keydown", e => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); if (!SID) run(); }
      else if (e.key === "Escape" && SID) { e.preventDefault(); stop(); }
    });
    cm.on("inputRead", (editor, ch) => {
      if (!ch.text || !ch.text[0]) return;
      if (/[\w_"']/.test(ch.text[0])) {
        editor.showHint({ hint: themakerHint, completeSingle: false });
      }
    });

    /* =============================== 상태바 칩 =============================== */
    (async function initChips() {
      try {
        const info = await (await fetch("/system")).json();
        (info.devices || []).forEach(d => {
          const el = document.getElementById("chip" + d.toUpperCase());
          if (el) el.classList.add("on");
        });
        if (info.ready) return;
      } catch (e) {}
      setTimeout(initChips, 1500);
    })();

    function applyLang() {
      document.title = t("titleTag");
      const set = (id, k) => { const el = document.getElementById(id); if (el) el.textContent = t(k); };
      set("txtTitle", "title"); set("txtEyebrow", "eyebrow");
      set("txtEdHead", "edHead"); set("txtOutHead", "outHead");
      const helpOpen = document.getElementById("helpPanel").classList.contains("open");
      document.getElementById("guideButton").textContent = t(helpOpen ? "guideOff" : "guide");
      set("exampleButton", "example");
      set("saveButton", "save"); set("loadButton", "load"); set("deployButton", "deploy");
      set("stopButton", "stop"); set("clearButton", "clear");
      set("txtHint", "hint"); set("txtExTitle", "exTitle");
      set("txtHelpHead", "helpHead"); set("txtHelpMore", "helpMore");
      set("txtWorkTitle", "workTitle");
      const hs = document.getElementById("helpSearch");
      if (hs) hs.placeholder = t("helpSearch");
      if (typeof renderHelp === "function"
          && document.getElementById("helpPanel").classList.contains("open")) {
        document.getElementById("guideBody").innerHTML = GUIDE[LANG] || GUIDE.ko;
        renderHelp(hs ? hs.value : "");
      }
      set("txtRunState", "runStateK"); set("langButton", "langBtn");
      document.getElementById("runLabel").textContent = SID ? t("running") : t("run");
      const hl = document.getElementById("homeLink");
      hl.title = t("homeLink"); hl.setAttribute("aria-label", t("homeLink"));
      document.getElementById("runState").textContent = t(SID ? "stRun" : "stReady");
    }
    document.getElementById("langButton").onclick = () => {
      LANG = LANG === "ko" ? "en" : "ko";
      localStorage.setItem("vapi-lang", LANG);
      applyLang();
    };
    applyLang();
