<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>edge-lab — AI 신호 놀이</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link href="/fonts/fonts.css" rel="stylesheet">
  <script>
    try { if (localStorage.getItem("vapi-hc") === "1")
            document.documentElement.classList.add("hc"); } catch (e) {}
  </script>
  <link rel="stylesheet" href="/lib/tokens.css">
  <script src="/lib/embed.js"></script>
  <link rel="expect" href="#el-built" blocking="render">
  <style>
    /* AI 신호 놀이 — 카메라 하나로 AI 가 보는 "숫자"를 신호로 바꾸고, 그 신호로 놀아 본다.
     *
     * 1) 신호판: 손가락 개수·손 모양·손 들기·얼굴 거리/방향·표정·내가 만든 AI 를 큰 카드로.
     *    아래 "AI가 보는 숫자" 칸이 핵심이다 — 신호는 그림이 아니라 좌표·점수에서 나온다.
     * 2) 규칙 만들기: 만약 [신호]가 [값]이면 → [행동]. 코드 없이 IF→THEN 을 익힌다.
     *    조건이 "막 맞았을 때" 한 번만(상승 에지), 1.5초 쉬었다가 다시.
     * 3) 동작 암호: 동작을 차례대로 해서 문을 연다 — 순서(시퀀스)와 "유지 시간" 개념.
     *
     * 서버는 사진 한 장씩 받아(/object/hand, /face/mesh, /custom/face, /custom/predict)
     * 숫자로 돌려준다. 요청은 늘 하나씩만 보낸다 — 교실 노트북에서 줄이 쌓이지 않게.
     * sense-lab 의 규칙표·순서 놀이 아이디어를 이 서버 API 에 맞게 새로 짰다.
     */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --go: #3a9a55; --go-bg: #e3f1e6; --bad: #c2412a; --warm: #e0a030; --soft: #f4efe4; }
    html.hc { --go: #237a3b; --go-bg: #d8eedd; --bad: #9e2e19; }
    body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; color: var(--ink); background: var(--paper);
           font-family: "Gowun Dodum", "Apple SD Gothic Neo", system-ui, sans-serif; line-height: 1.5;
           padding: var(--sp-2, 8px); gap: var(--sp-2, 8px); }
    button, input, select { font-family: inherit; color: var(--ink); }
    .btn { border: 1.5px solid var(--line-d); background: #fff; font-weight: 600; padding: 7px 13px; border-radius: var(--r); cursor: pointer;
           font-size: .92rem; min-height: 40px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .btn.primary { background: var(--pen-blue); border-color: var(--pen-blue-d); color: #fff; }
    .btn.go { background: var(--go); border-color: var(--go); color: #fff; }
    .btn.on { background: var(--cyan-bg); border-color: var(--cyan); color: var(--cyan-d); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.big { min-height: var(--tap, 48px); font-size: 1.02rem; padding: 8px 18px; }
    .btn svg { width: 18px; height: 18px; flex: 0 0 auto; }
    .btn:focus-visible, select:focus-visible, input:focus-visible, .tabs button:focus-visible, .mv:focus-visible { outline: 2.5px solid var(--pen-red); outline-offset: 2px; }
    .xbtn { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--line); background: #fff; cursor: pointer; display: grid; place-items: center; flex: 0 0 auto; }
    .xbtn svg { width: 16px; height: 16px; }
    .xbtn:hover { border-color: var(--bad); color: var(--bad); }
    select, input[type="text"] { height: 40px; border: 1.5px solid var(--line); border-radius: var(--r); padding: 0 8px; background: #fff; font-size: .95rem; min-width: 0; }
    .hint { font-size: var(--fs-side, 13px); color: var(--ink-2); }
    .num { font-family: Menlo, Consolas, monospace; font-size: var(--fs-mono, 13px); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .off { display: none !important; }

    .panel.cam { flex: 0 0 44%; } .panel.work { flex: 1 1 auto; }

    /* 탭 — 세 놀이 중 하나 */
    .tabs { display: flex; border: 1.5px solid var(--line-d); border-radius: var(--r); overflow: hidden; }
    .tabs button { flex: 1; border: 0; background: #fff; min-height: var(--tap, 48px); font-size: 1rem; font-weight: 700; cursor: pointer;
                   display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 8px; }
    .tabs button + button { border-left: 1.5px solid var(--line-d); }
    .tabs button.on { background: var(--pen-blue); color: #fff; }
    .tabs svg { width: 20px; height: 20px; flex: 0 0 auto; }

    /* 카메라 무대 — 영상과 점 그림을 같은 크기로 겹친다 (거울처럼 좌우를 뒤집어 보여 준다) */
    .stage { position: relative; min-height: 220px; display: flex; align-items: center; justify-content: center;
             border-radius: var(--r); background: #2a2620; overflow: hidden; }
    .frame { position: relative; }
    .frame video, .frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .frame video { transform: scaleX(-1); object-fit: fill; }
    .frame.numsOnly video { visibility: hidden; }
    .frame.numsOnly { background: #1d2a30; background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
                      background-size: 32px 32px; }
    .camoff { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
              padding: 18px; text-align: center; color: #f4efe4; background: #2a2620; }
    .camoff svg.big { width: 64px; height: 64px; opacity: .85; }
    .camoff p { max-width: 380px; font-size: .98rem; }
    .camoff .err { color: #ffcf9e; }
    .status { display: flex; align-items: center; gap: 8px; font-size: var(--fs-side, 13px); color: var(--ink-2); min-height: 22px; }
    .status .dot { width: 11px; height: 11px; border-radius: 50%; background: #b8ad99; flex: 0 0 auto; }
    .status.live .dot { background: var(--go); } .status.wait .dot { background: var(--warm); animation: blink 1s ease-in-out infinite; }
    .status.err .dot { background: var(--bad); }
    .status .num { margin-left: auto; }
    .rulesbadge { font-size: var(--fs-side, 13px); padding: 2px 10px; border-radius: 12px; background: var(--soft); color: var(--ink-2); white-space: nowrap; }
    .rulesbadge.on { background: var(--go-bg); color: #1e5b30; font-weight: 700; }
    @keyframes blink { 50% { opacity: .35; } }

    /* 1) 신호판 카드 */
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 8px; }
    .card { border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px 10px; background: #fff; display: flex; flex-direction: column; gap: 2px;
            transition: background .15s, border-color .15s; min-height: 112px; }
    .card .ct { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: .95rem; color: var(--cyan-d); }
    .card .ct svg { width: 22px; height: 22px; flex: 0 0 auto; }
    .card .ct .tg { margin-left: auto; }
    .card .cv { font-size: 1.9rem; font-weight: 700; line-height: 1.2; color: var(--ink); word-break: keep-all; }
    .card .cv small { font-size: 1rem; font-weight: 600; margin-left: 2px; }
    .card .cs { font-size: var(--fs-side, 13px); color: var(--ink-2); }
    .card.on { border-color: var(--cyan); background: var(--cyan-bg); }
    .card.hot { border-color: var(--go); background: var(--go-bg); }
    .card.dim .cv { color: #9a8f7d; font-size: 1.15rem; padding: 6px 0; }
    .card.mine .ct { color: var(--pen-red); }
    .card .tg { font-size: .82rem; min-height: 32px; padding: 2px 10px; border-radius: 16px; border: 1.5px solid var(--line); background: #fff; cursor: pointer; font-weight: 600; }
    .card .tg.on { background: var(--pen-red); border-color: var(--pen-red); color: #fff; }
    .fingers { display: flex; gap: 8px; align-items: baseline; }
    .fingers span { font-size: 2.2rem; font-weight: 700; line-height: 1.1; }
    .fingers em { font-style: normal; font-size: 1.3rem; color: var(--ink-2); }
    .meter { height: 8px; border-radius: 4px; background: #ece5d6; overflow: hidden; }
    .meter i { display: block; height: 100%; background: var(--pen-blue); transition: width .15s; }
    .mrow { display: grid; grid-template-columns: minmax(44px, auto) 1fr 34px; white-space: nowrap; gap: 6px; align-items: center; font-size: var(--fs-side, 13px); }

    /* AI 가 보는 숫자 */
    .nums { border: 1.5px dashed var(--line); border-radius: 10px; padding: 10px; background: #fffdf8; display: flex; flex-direction: column; gap: 8px; }
    .nums h3 { font-size: 1rem; color: var(--cyan-d); display: flex; align-items: center; gap: 6px; }
    .nums h3 svg { width: 20px; height: 20px; }
    .nums .sub { font-weight: 700; font-size: .9rem; color: var(--ink); margin-top: 2px; }
    .ptgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 2px 8px; }
    .ptgrid span { font-family: Menlo, Consolas, monospace; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
    .ptgrid span b { color: var(--pen-red); font-weight: 700; }
    .ratio { display: grid; grid-template-columns: 42px 1fr 46px 20px; gap: 6px; align-items: center; font-size: var(--fs-side, 13px); }
    .ratio .tr { position: relative; height: 10px; border-radius: 5px; background: #ece5d6; overflow: visible; }
    .ratio .tr i { display: block; height: 100%; border-radius: 5px; background: #b8ad99; }
    .ratio .tr i.ext { background: var(--go); }
    .ratio .tr u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--pen-red); }
    .ratio .ok { color: var(--go); font-weight: 700; } .ratio .no { color: #9a8f7d; }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: var(--fs-side, 13px); }
    .kv dt { color: var(--ink-2); } .kv dd { font-family: Menlo, Consolas, monospace; }

    /* 2) 규칙 */
    .rules { display: flex; flex-direction: column; gap: 8px; }
    .rule { border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; background: #fff; display: flex; flex-direction: column; gap: 6px; position: relative; }
    .rule.true { border-color: var(--cyan); }
    .rule.fire { animation: fire .7s ease-out; }
    @keyframes fire { 0% { background: #fff1c8; box-shadow: 0 0 0 4px rgba(224,160,48,.45); } 100% { background: #fff; box-shadow: none; } }
    .rline { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .rline .kw { font-weight: 700; color: var(--pen-blue); min-width: 38px; }
    .rline .kw.then { color: var(--pen-red); }
    .rline .pp { color: var(--ink-2); font-size: .92rem; }
    .rline select { max-width: 190px; }
    .rline input[type="text"] { flex: 1 1 140px; }
    .lamp { width: 16px; height: 16px; border-radius: 50%; background: #ddd5c4; border: 1.5px solid var(--line); flex: 0 0 auto; }
    .rule.true .lamp { background: var(--go); border-color: var(--go); box-shadow: 0 0 0 3px rgba(58,154,85,.25); }
    .rtop { display: flex; align-items: center; gap: 8px; }
    .rtop .rn { font-weight: 700; color: var(--cyan-d); }
    .rtop .cnt { font-size: var(--fs-side, 13px); color: var(--ink-2); margin-left: auto; }
    .rhint { font-size: var(--fs-side, 13px); color: var(--pen-red); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .rhint .btn { min-height: 32px; padding: 2px 10px; font-size: .85rem; }
    .smallbtn { min-height: 34px; padding: 2px 10px; font-size: .88rem; }
    .log { display: flex; flex-direction: column; gap: 2px; font-size: var(--fs-side, 13px); color: var(--ink-2); padding: 6px 10px; border-radius: var(--r); background: var(--soft); min-height: 30px; }
    .log b { color: var(--ink); }
    .empty { text-align: center; padding: 18px 10px; border: 1.5px dashed var(--line); border-radius: 10px; color: var(--ink-2); display: flex; flex-direction: column; gap: 10px; align-items: center; }

    /* 3) 동작 암호 */
    .pwlist { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .pwlist button.pw { min-height: 40px; padding: 4px 12px; border-radius: 20px; border: 1.5px solid var(--line); background: #fff; cursor: pointer; font-weight: 600; font-size: .92rem; }
    .pwlist button.pw.on { background: var(--pen-blue); border-color: var(--pen-blue-d); color: #fff; }
    .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 70px; padding: 8px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; }
    .flow .arrow { color: var(--line); font-weight: 700; }
    .step { position: relative; display: flex; align-items: center; gap: 6px; padding: 6px 6px 10px 10px; border: 2px solid var(--line); border-radius: 10px; background: #fff; overflow: hidden; }
    .step .si { width: 22px; height: 22px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; font-size: .8rem; font-weight: 700; }
    .step b { font-size: 1rem; }
    .step .xbtn { width: 32px; height: 32px; }
    .step .fill { position: absolute; left: 0; bottom: 0; height: 5px; width: 0; background: var(--go); }
    .step.cur { border-color: var(--pen-blue); box-shadow: 0 0 0 3px rgba(31,95,122,.18); }
    .step.done { border-color: var(--go); background: var(--go-bg); }
    .step.done .si { background: var(--go); color: #fff; }
    .step.done .fill { width: 100% !important; }
    .palette { display: flex; flex-direction: column; gap: 6px; }
    .pgroup { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .pgroup > span { font-size: var(--fs-side, 13px); color: var(--ink-2); min-width: 44px; font-weight: 700; }
    .mv { min-height: 40px; padding: 4px 12px; border-radius: 20px; border: 1.5px solid var(--line-d); background: #fff; cursor: pointer; font-size: .92rem; font-weight: 600; }
    .mv:hover { background: var(--hover-bg); }
    .mv:disabled { opacity: .4; cursor: not-allowed; }
    .play { border: 2px solid var(--pen-blue); border-radius: 12px; padding: 12px; display: flex; gap: 14px; align-items: center; background: #fff; position: relative; overflow: hidden; }
    .ring { width: 96px; height: 96px; flex: 0 0 auto; position: relative; }
    .ring svg { width: 96px; height: 96px; transform: rotate(-90deg); }
    .ring .lock { position: absolute; inset: 0; display: grid; place-items: center; }
    .ring .lock svg { width: 40px; height: 40px; transform: none; color: var(--pen-blue); }
    .play .now { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .play .now small { font-size: var(--fs-side, 13px); color: var(--ink-2); }
    .play .now b { font-size: 1.9rem; line-height: 1.2; }
    .play .now .msg { font-size: .95rem; color: var(--pen-red); min-height: 1.4em; }
    .play.win { border-color: var(--go); background: var(--go-bg); }
    .play.win .ring .lock svg { color: var(--go); }
    .confetti { position: absolute; inset: 0; pointer-events: none; }
    .confetti i { position: absolute; top: -12px; width: 8px; height: 12px; border-radius: 2px; animation: drop 1.6s ease-in forwards; }
    @keyframes drop { to { transform: translateY(240px) rotate(540deg); opacity: 0; } }

    /* 화면 글자 · 알림 */
    #bigText { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.9); z-index: 20; pointer-events: none; opacity: 0;
               background: rgba(31,95,122,.94); color: #fff; font-weight: 700; font-size: clamp(2.4rem, 8vw, 5.5rem); line-height: 1.15;
               padding: 18px 40px; border-radius: 18px; text-align: center; max-width: 92vw; word-break: keep-all; transition: opacity .2s, transform .2s; }
    #bigText.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px;
             border-radius: 10px; font-size: .95rem; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 21; max-width: 90vw; }
    #toast.on { opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      .rule.fire, .confetti i, .status.wait .dot { animation: none; }
      #bigText { transition: none; }
    }
    @media (max-width: 1439px) { .panel.cam { flex-basis: 42%; } }
    @media (max-width: 1023px) { .main-container { flex-direction: column; } .panel.cam, .panel.work { flex: 0 0 auto; }
                                 .panel, .panel-body { overflow: visible; } body { overflow: auto; height: auto; }
                                 .stage { min-height: 300px; height: min(62vw, 460px); flex: 0 0 auto; } }
  </style>
  <link rel="stylesheet" href="/lib/ui.css">
  <link rel="stylesheet" href="/lib/shell.css">
</head>
<body data-density="explore">
  <div class="titlebar">
    <a class="tb-brand" href="/" title="인터넷 없이 내 컴퓨터에서 실행돼요"><img src="/assets/pibo-logo.png" alt=""><b>edge-lab</b></a>
    <span class="tb-sep"></span><span class="tb-app" id="txtTitle"></span>
    <div class="h-tools"><button id="langButton" title="한국어 / English">EN</button></div>
  </div>
  <div class="shell-body"><div class="workbench"><div class="main-container">

    <div class="panel cam">
      <div class="panel-head">
        <span class="q"><span class="qnum">1</span><span class="qtext" id="txtQ1"></span></span>
        <div class="right"><button class="btn" id="numsBtn" type="button"></button><button class="btn primary" id="camBtn" type="button"></button></div>
      </div>
      <div class="panel-body">
        <div class="tabs" id="tabs" role="tablist">
          <button type="button" role="tab" data-tab="sig"></button>
          <button type="button" role="tab" data-tab="rule"></button>
          <button type="button" role="tab" data-tab="pw"></button>
        </div>
        <div class="stage grow" id="stage">
          <div class="frame" id="frame"><video id="vid" muted playsinline></video><canvas id="ov"></canvas></div>
          <div class="camoff" id="camOffBox"></div>
        </div>
        <div class="status" id="status"><i class="dot"></i><span id="stText"></span><span class="rulesbadge" id="rulesBadge"></span><span class="num" id="stMs"></span></div>
      </div>
    </div>

    <div class="panel work">
      <div class="panel-head">
        <span class="q"><span class="qnum">2</span><span class="qtext" id="txtQ2"></span></span>
        <div class="right" id="headTools"></div>
      </div>

      <!-- 1) 신호판 -->
      <div class="panel-body" id="paneSig">
        <div class="hint" id="sigLead"></div>
        <div class="cards" id="cards"></div>
        <div class="cards" id="myCards"></div>
        <div class="nums" id="nums"></div>
      </div>

      <!-- 2) 규칙 만들기 -->
      <div class="panel-body off" id="paneRule">
        <div class="hint" id="ruleLead"></div>
        <div class="log" id="ruleLog"></div>
        <div class="rules" id="rules"></div>
      </div>

      <!-- 3) 동작 암호 -->
      <div class="panel-body off" id="panePw">
        <div class="hint" id="pwLead"></div>
        <div class="pwlist" id="pwList"></div>
        <div class="row"><input type="text" id="pwName" maxlength="20" style="flex:1 1 160px"><button class="btn" id="pwDel" type="button"></button></div>
        <div class="flow" id="flow"></div>
        <div class="play" id="play">
          <div class="ring"><svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="42" fill="none" stroke="#ece5d6" stroke-width="9"/>
            <circle id="ringFill" cx="48" cy="48" r="42" fill="none" stroke="var(--go)" stroke-width="9" stroke-linecap="round" stroke-dasharray="263.9" stroke-dashoffset="263.9"/></svg>
            <div class="lock" id="lockIcon"></div></div>
          <div class="now"><small id="nowLabel"></small><b id="nowMove"></b><div class="msg" id="pwMsg"></div></div>
          <button class="btn go big" id="pwGo" type="button"></button>
          <div class="confetti" id="confetti"></div>
        </div>
        <div class="palette" id="palette"></div>
      </div>
    </div>

  </div></div></div>
  <div id="bigText"></div>
  <div id="toast" role="status"></div>

  <script>
  (function () {
    "use strict";
    var LANG = "ko";
    try { LANG = localStorage.getItem("vapiLang") === "en" ? "en" : "ko"; } catch (e) {}
    document.documentElement.lang = LANG;

    var I18N = {
      ko: {
        title: "edge-lab — AI 신호 놀이", lang: "EN", q1: "카메라",

      { id: "face", vals: ["shown", "hide"] },
      { id: "dist", vals: ["near", "mid", "far"] },

    function modelOf(slug) { for (var i = 0; i < MODELS.length; i++) if (MODELS[i].slug === slug) return MODELS[i]; return null; }
    function sigList() {
      return BUILTIN.map(function (s) { return { id: s.id, label: t("sig_" + s.id), vals: s.vals }; })
        .concat(MODELS.map(function (m) { return { id: "m:" + m.slug, label: tf("mineP", { t: m.title || m.slug }), vals: (m.labels || []).slice() }; }));

    function sigLabel(id) {

    }
    /* 암호 칩에 쓰는 짧은 이름 */
    function moveLabel(c) {

      if (c.sig === "fingers") return tf("mv_f", { n: c.val });
      if (c.sig === "handup" && c.val === "up") return t("mv_up");
      if (c.sig === "dir") return t({ left: "mv_left", right: "mv_right", up: "mv_upL", down: "mv_downL" }[c.val] || "d_" + c.val);
      if (c.sig === "expr" && c.val !== "plain") return t(c.val === "smile" ? "mv_smile" : "mv_mouth");
      if (c.sig === "dist" && c.val !== "mid") return t(c.val === "near" ? "mv_near" : "mv_far");
      if (c.sig.indexOf("m:") === 0) return c.val;

    }

    /* ================================================================
       손가락 세기 — 21점 좌표만으로 (거리 비율이라 손이 기울어도 된다)

    function parseHand(it) {

      var h = { pts: p, box: it.box || null, gesture: it.gesture_en || "None", score: it.score || 0, fingers: 0, ratios: [], ext: [] };
      if (p.length >= 21) {
        h.ratios = fingerRatios(p);
        h.ext = h.ratios.map(function (r, i) { return r > (i === 0 ? TH_THUMB : TH_FINGER); });
        h.fingers = h.ext.filter(Boolean).length;
      }
      if (!h.box && p.length) {

        h.box = [Math.min.apply(0, xs), Math.min.apply(0, ys), Math.max.apply(0, xs), Math.max.apply(0, ys)];

    }

    /* ================================================================
       감지 상태 — 서버 답(또는 시험 신호)을 소스별로 모아 둔다
       ================================================================ */
    var RAW = { hands: [], tHand: -1e9, face: null, tFace: -1e9, expr: null, tExpr: -1e9, models: {}, W: 640, H: 480 };
    var fake = false;               // 시험 신호 모드 — 실제 답을 무시하고, 오래돼도 버리지 않는다
    var lastMs = {};                // 요청별 걸린 시간 (상태줄에 보인다)

    function applyHand(items) {
      RAW.hands = (Array.isArray(items) ? items : []).map(parseHand)
        .sort(function (a, b) { return (b.pts[0] ? b.pts[0][0] : 0) - (a.pts[0] ? a.pts[0][0] : 0); });  // 거울 화면의 왼쪽 손부터

    }
    function applyMesh(items) {
      var best = null;
      (Array.isArray(items) ? items : []).forEach(function (f) {
        var b = f.box || [0, 0, 0, 0], area = (b[2] - b[0]) * (b[3] - b[1]);
        if (!best || area > best.area) best = { area: area, box: b, cm: +f.distance || 0, dir: String(f.direction_en || ""), word: f.direction || "", iris: f.iris_px };

    }
    function applyExpr(d) {
      var sc = {};

      var smile = Math.max(sc.mouthSmileLeft || 0, sc.mouthSmileRight || 0);
      RAW.expr = d && d.found ? { top: d.top || [], smile: smile, mouth: sc.jawOpen || 0 } : { none: true };
      RAW.tExpr = now();
    }
    function applyModel(slug, list) {

      RAW.models[slug] = { list: l, t: now() };
    }

    function secondaries() { return [{ k: "expr" }].concat(activeModels().map(function (s) { return { k: "model", slug: s }; })); }
    function staleOf(src) {
      if (fake) return 1e12;
      if (src === "hand") return 1300;
      if (src === "face") return 2200;
      return 2500 + secondaries().length * 2 * TICK_MS * 2;   // 돌아가며 묻는 것은 차례가 늦게 온다
    }
    function fresh(tm, src) { return now() - tm < staleOf(src); }

    /* 모든 신호를 한 번에 계산 — 규칙·암호·카드가 같은 값을 본다 */

      var S = { active: fake || camLive(), hands: [], face: null, expr: null, models: {} };

      // 손 들기: 얼굴이 보이면 "손 윗부분이 이마보다 위, 손목이 얼굴 가운데보다 위", 없으면 화면 위쪽 35%

        if (S.face && S.face.box) {
          var fb = S.face.box;
          h.up = top < fb[1] && wr[1] < (fb[1] + fb[3]) / 2;
          h.upWhy = "top " + Math.round(top) + " < " + Math.round(fb[1]);
        } else {
          h.up = wr[1] < RAW.H * 0.35;
          h.upWhy = "y " + Math.round(wr[1]) + " < " + Math.round(RAW.H * 0.35);
        }

      return S;
    }
    function distClass(cm) { return !cm ? "" : cm < NEAR_CM ? "near" : cm > FAR_CM ? "far" : "mid"; }
    function modelTop(S, slug) {
      var l = S.models[slug];

    }
    /* 조건 하나 판정 */
    function cond(S, c) {

    /* ================================================================
       카메라 + 서버 묻기 (한 번에 하나씩)

    var vid = $("vid"), ov = $("ov"), octx = ov.getContext("2d");
    var grabCv = document.createElement("canvas"), gctx = grabCv.getContext("2d");
    var stream = null, camStarting = false, camErr = "", camResume = false;
    var loopGen = 0, loopOn = false, aiState = "off", aiErr = "", fpsN = 0, fpsT = 0, fps = 0;
    var numsOnly = false;

    function camOn() {

    }
    function fitFrame() {
      // 무대 안에 영상 비율을 지켜 가장 크게 — CSS 만으로는 가로·세로 둘 다 맞추기 어렵다

      var w = sw, h = sw / ar;

    }
    function ask(url, blob, key) {

        if (r.status === 503) { var e = new Error("loading"); e.loading = true; throw e; }

      }).then(function (j) {

            if (gen !== loopGen) return;

            else { var sec = secondaries(); job = sec[Math.floor(secN / 2) % sec.length]; }
            var url = job.k === "mesh" ? "/face/mesh?lang=" + LANG : job.k === "expr" ? "/custom/face"

            return ask(url, blob, job.k).then(function (d2) {

          });
        }).catch(function (e) {
          if (e && e.loading) { aiState = "loading"; wait = 2000; }      // 모델을 올리는 중 — 천천히 다시
          else { aiState = "err"; aiErr = (e && e.message) || String(e); wait = 1500; }

    /* ── 점 그림 — 좌표는 보낸 사진(640폭) 기준, 화면은 거울처럼 뒤집는다 ── */
    var LINKS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

      var W = RAW.W, H = RAW.H;

    }
    function label(x, y, s, bg) {

      return code[1] === "T" ? "up" : "down";
    }

    /* ── 카메라 칸 글자 ── */
    function paintCam() {
      var on = camLive();
      $("camBtn").innerHTML = (on || camStarting ? IC.camoff : IC.cam) + "<span>" + esc(on || camStarting ? t("camOff") : t("camOn")) + "</span>";
      $("camBtn").classList.toggle("primary", !on);
      $("numsBtn").innerHTML = IC.nums + "<span>" + esc(numsOnly ? t("picture") : t("numsOnly")) + "</span>";
      $("numsBtn").classList.toggle("on", numsOnly);
      $("frame").classList.toggle("numsOnly", numsOnly);
      var box = $("camOffBox");
      box.classList.toggle("off", on || fake);
      if (!on && !fake) {
        box.innerHTML = IC.cam.replace("<svg", '<svg class="big"') + "<p>" + esc(t("camIntro")) + "</p>" +
          (camErr ? '<p class="err">' + esc(camErr) + "</p>" : "") +
          '<button class="btn primary big" type="button" id="camBig">' + IC.cam + "<span>" + esc(camStarting ? t("stStart") : t("camOn")) + "</span></button>";
        $("camBig").disabled = camStarting;
      }
      paintStatus(); paintLog();
    }
    function paintStatus() {
      var st = $("status"), s, cls = "";
      if (fake) { s = t("stFake"); cls = "live"; }
      else if (!camLive()) { s = camStarting ? t("stStart") : t("stOff"); }
      else if (aiState === "loading") { s = t("stLoading"); cls = "wait"; }
      else if (aiState === "err") { s = t("stErr") + aiErr; cls = "err"; }
      else if (aiState === "live") { s = t("stLive"); cls = "live"; }
      else { s = t("stLoading"); cls = "wait"; }
      st.className = "status " + cls;
      $("stText").textContent = s;
      var ms = [];
      if (camLive() && aiState === "live") {
        if (lastMs.hand != null) ms.push("✋ " + lastMs.hand + "ms");
        if (lastMs.mesh != null) ms.push("☺ " + lastMs.mesh + "ms");
        if (fps > 0) ms.push(tf("perSec", { n: fps.toFixed(1) }));
      }
      $("stMs").textContent = ms.join(" · ");
      var n = rules.length;
      $("rulesBadge").textContent = rulesOn ? tf("rulesOnN", { n: n }) : t("rulesOffB");
      $("rulesBadge").classList.toggle("on", rulesOn && n > 0);
      $("rulesBadge").classList.toggle("off", !n);
    }
    setInterval(function () { var t1 = now(); if (fpsT) fps = fpsN * 1000 / (t1 - fpsT); fpsN = 0; fpsT = t1; }, 2000);

    $("camBtn").addEventListener("click", function () { if (camLive() || camStarting) camOff(); else camOn(); });
    $("camOffBox").addEventListener("click", function (e) { if (e.target.closest("#camBig")) camOn(); });
    $("numsBtn").addEventListener("click", function () { numsOnly = !numsOnly; paintCam(); });

    /* 가려지면 카메라·묻기를 멈춘다. 켜 두었던 것이면 다시 보일 때 켠다 (lib/embed.js) */
    function onHidden() { camResume = camLive() || camStarting; if (camLive()) camOff(); stopGame(true); }
    function onShown() { if (camResume) camOn(); camResume = false; loadModels(); checkBoard(); }
    if (window.EL_WIN) { EL_WIN.onHide(onHidden); EL_WIN.onShow(onShown); }

    /* ================================================================
       탭
       ================================================================ */
    var TAB = "sig";
    try { TAB = localStorage.getItem("el-signal-tab") || "sig"; } catch (e) {}
    if (["sig", "rule", "pw"].indexOf(TAB) < 0) TAB = "sig";
    function setTab(k) {
      TAB = k;
      try { localStorage.setItem("el-signal-tab", k); } catch (e) {}
      if (k !== "pw") stopGame(true);

    function card(id, icon, title, valueHtml, sub, cls, extra) {

    }

      } else {
        var act = activeModels();

          var top = S.active ? modelTop(S, m.slug) : null;
          if (!on) mine.push(card("m", IC.brain, m.title || m.slug, esc(t("modelIdle")), esc((m.labels || []).join(" · ")), "mine dim", tg));
          else if (!top) mine.push(card("m", IC.brain, m.title || m.slug, esc(S.active ? "…" : t("noCam")), esc((m.labels || []).join(" · ")), "mine dim", tg));
          else if (!top.name) mine.push(card("m", IC.brain, m.title || m.slug, esc(t("nothing")), "", "mine on", tg));
          else {
            var sure = top.score >= MODEL_MIN;
            mine.push(card("m", IC.brain, m.title || m.slug, esc(sure ? top.name : t("unsure")),
              '<div class="mrow"><span>' + esc(top.name) + '</span><div class="meter"><i style="width:' + Math.round(top.score * 100) + '%"></i></div><span class="num">' + Math.round(top.score * 100) + "%</span></div>",
              "mine " + (sure ? "hot" : "on"), tg));

      if (mk !== lastMineKey) { $("myCards").innerHTML = mk; lastMineKey = mk; }
    }
    function dirText(code) {
      if (!code) return "";
      var p = [];
      if (code[0] === "L") p.push(t("d_left")); if (code[0] === "R") p.push(t("d_right"));
      if (code[1] === "T") p.push(t("d_up")); if (code[1] === "B") p.push(t("d_down"));

    $("myCards").addEventListener("click", function (e) {

    /* AI 가 보는 숫자 — 신호가 어디서 나오는지 그대로 보여 준다 */

    function paintNums(S) {

      var any = false;

        any = true;
        h.push('<div class="sub">' + esc(t("nHandPts")) + '</div><div class="ptgrid">' + hand.pts.map(function (q, i) {
          var tip = TIPS.indexOf(i) >= 0;
          return "<span>" + (tip ? "<b>" + i + "</b>" : i) + " (" + Math.round(q[0]) + ", " + Math.round(q[1]) + ")</span>"; }).join("") + "</div>");
        h.push('<div class="sub">' + esc(t("nFinger")) + '</div><div class="hint">' + esc(t("nFingerRule")) + "</div>");
        hand.ratios.forEach(function (r, i) {

        });

    /* ================================================================
       2) 규칙 만들기
       ================================================================ */
    var ACTS = ["say", "sound", "text", "board"];
    var SOUNDS = ["beep", "doremi", "ding", "fanfare", "low"];
    var rules = lsGet("el-signal-rules", []);
    if (!Array.isArray(rules)) rules = [];
    rules = rules.slice(0, MAX_RULES).filter(function (r) { return r && r.a && r.act; });
    var rulesOn = lsGet("el-signal-rules-on", true) !== false;
    var edge = [];                  // 규칙마다 {prev, last, n}
    function resetEdges() { edge = rules.map(function () { return { prev: false, last: -1e9, n: 0 }; }); }
    resetEdges();
    function saveRules() { lsSet("el-signal-rules", rules); }
    function uid() { return Math.random().toString(36).slice(2, 9); }
    function addRule(tpl) {
      if (rules.length >= MAX_RULES) { toast(tf("ruleMax", { n: MAX_RULES })); return; }
      rules.push(tpl || { id: uid(), a: { sig: "gesture", val: "Victory" }, op: "", b: null, act: { type: "say", text: t("defSay"), sound: "beep" } });
      edge.push({ prev: false, last: -1e9, n: 0 });
      saveRules(); renderRules(); paintTabs(); paintStatus();
      stat("signal_rule_add");
    }
    function sigOptions(cur) {
      var list = sigList(), has = false, o = "";
      list.forEach(function (s) { if (s.id === cur) has = true; o += '<option value="' + esc(s.id) + '"' + (s.id === cur ? " selected" : "") + ">" + esc(s.label) + "</option>"; });
      if (!has && cur) o += '<option value="' + esc(cur) + '" selected>' + esc(sigLabel(cur)) + "</option>";   // 아직 목록이 안 온 내 AI
      return o;
    }
    function valsOf(sig) {
      var s = sigList().filter(function (x) { return x.id === sig; })[0];
      return s ? s.vals : [];
    }
    function valOptions(sig, cur) {
      var vals = valsOf(sig), o = "", has = false;
      vals.forEach(function (v) { if (v === cur) has = true; o += '<option value="' + esc(v) + '"' + (v === cur ? " selected" : "") + ">" + esc(valLabel(sig, v)) + "</option>"; });
      if (!has && cur) o += '<option value="' + esc(cur) + '" selected>' + esc(valLabel(sig, cur)) + "</option>";
      return o;
    }
    var boardOk = null, boardNoticed = false;             // 마지막으로 본 보드 연결 상태 (null=모름)

      return fetch("/board/status").then(function (r) { return r.json(); }).then(function (j) {
        boardOk = !!(j && j.data && j.data.connected);
      }).catch(function () { boardOk = false; }).then(function () { if (TAB === "rule") paintBoardHints(); });
    }
    function paintBoardHints() {

        var r = rules[+el.getAttribute("data-i")], hint = el.querySelector(".rhint");

      });
    }
    function renderRules() {

        box.innerHTML = '<div class="empty"><div>' + esc(t("noRules")) + '</div><div class="row" style="justify-content:center"><button class="btn primary big" type="button" data-act="add">' + IC.plus + "<span>" + esc(t("addRule")) +
          '</span></button><button class="btn big" type="button" data-act="example">' + esc(t("example")) + "</button></div></div>";
      } else {
        box.innerHTML = rules.map(function (r, i) {
          var e = edge[i] || { n: 0 };
          var line2 = r.op && r.b
            ? '<div class="rline"><select data-f="op" aria-label="and/or"><option value="and"' + (r.op === "and" ? " selected" : "") + ">" + esc(t("andW")) + '</option><option value="or"' + (r.op === "or" ? " selected" : "") + ">" + esc(t("orW")) + "</option></select>" +
              '<select data-f="b.sig">' + sigOptions(r.b.sig) + '</select><span class="pp">' + esc(t("isW")) + '</span><select data-f="b.val">' + valOptions(r.b.sig, r.b.val) + "</select>" +
              '<button class="xbtn" type="button" data-act="delb" title="' + esc(t("delCond")) + '" aria-label="' + esc(t("delCond")) + '">' + IC.x + "</button></div>"

          return '<div class="rule" data-i="' + i + '">' +

    function ruleAt(el) { var r = el.closest(".rule"); return r ? +r.getAttribute("data-i") : -1; }

      else if (act === "del") { rules.splice(i, 1); edge.splice(i, 1); saveRules(); renderRules(); paintTabs(); paintStatus(); }

      else if (act === "delb") { rules[i].op = ""; rules[i].b = null; saveRules(); renderRules(); }

      else if (act === "openBoard") { if (window.EL_WIN) EL_WIN.open("/board"); else location.href = "/board"; }
    });

    /* 규칙 판정 — 상승 에지(거짓→참)에서만, 쉬는 시간이 지났을 때만 */
    function evalRules(S) {
      var run = rulesOn && S.active && !game.playing;
      var els = document.querySelectorAll("#rules .rule");
      rules.forEach(function (r, i) {
        var e = edge[i] || (edge[i] = { prev: false, last: -1e9, n: 0 });
        var cur = run && ruleTrue(S, r);
        if (cur && !e.prev && now() - e.last >= COOLDOWN_MS) {
          e.last = now(); e.n++;
          doAction(r, i);
          stat("signal_rule_fire");
          var el = els[i];
          if (el) { el.classList.remove("fire"); void el.offsetWidth; el.classList.add("fire"); var c = el.querySelector(".cnt"); if (c) c.textContent = tf("fireN", { n: e.n }); }
        }
        e.prev = cur;
        if (els[i]) els[i].classList.toggle("true", !!cur);
      });
    }
    var logItems = [];
    function logPush(s) { logItems.unshift(s); logItems = logItems.slice(0, 3); paintLog(); }
    function paintLog() {
      var el = $("ruleLog");
      if (logItems.length) el.innerHTML = logItems.map(function (s, i) { return i ? "<span>" + esc(s) + "</span>" : "<b>" + esc(s) + "</b>"; }).join("");
      else el.textContent = camLive() || fake ? t("logEmpty") : t("needCam");
    }
    function condText(c) { return sigLabel(c.sig) + " " + valLabel(c.sig, c.val); }
    function doAction(r, i) {
      var what = condText(r.a) + (r.op && r.b ? " " + (r.op === "or" ? t("orW") : t("andW")) + " " + condText(r.b) : "");
      var a = r.act, detail;
      if (a.type === "say") { detail = t("actSay") + ": " + (a.text || ""); say(a.text || t("defSay")); }
      else if (a.type === "sound") { detail = t("actSound") + ": " + t("snd" + a.sound[0].toUpperCase() + a.sound.slice(1)); playSound(a.sound); }
      else if (a.type === "text") { detail = t("actText") + ": " + (a.text || ""); bigText(a.text || t("defText")); }
      else { detail = t("actBoard") + ": " + (a.text || ""); boardSend(a.text || t("defBoard")); }
      logPush(tf("ruleN", { n: i + 1 }) + " · " + what + " → " + detail);
      EL_SIGNAL.fired.push({ rule: i, type: a.type, text: a.text || "", sound: a.sound || "", at: Date.now() });
    }

    /* ── 행동들 ── */
    var speaking = 0;               // 말하는 중인 차례 번호 (0=조용)
    function voice() { try { return localStorage.getItem("vapi-voice") || "F1"; } catch (e) { return "F1"; } }
    function say(text) {
      if (speaking) { toast(t("ttsBusy")); return; }
      var my = speaking = Date.now();
      var done = function () { if (speaking === my) speaking = 0; };
      fetch("/speech/tts", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text, voice: voice(), lang: LANG, speed: 1.05 }) }).then(function (r) {
        if (r.status === 503) throw new Error(t("ttsLoading"));
        if (!r.ok || (r.headers.get("Content-Type") || "").indexOf("audio") < 0) return r.json().then(function (j) { throw new Error(t("ttsFail") + ((j && j.data) || r.status)); });
        return r.blob();
      }).then(function (blob) {
        var au = new Audio(URL.createObjectURL(blob));
        au.onended = au.onerror = done;
        var p = au.play(); if (p && p.catch) p.catch(done);
        setTimeout(done, 8000);          // 소리가 끝났다는 알림이 안 와도 풀어 준다
      }).catch(function (e) { done(); toast((e && e.message) || String(e)); });
    }
    function boardSend(text) {
      fetch("/board/send", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: text }) })
        .then(function (r) { return r.json(); }).then(function (j) {
          if (j && j.result === "ok") { boardOk = true; paintBoardHints(); return; }
          boardOk = false; paintBoardHints();
          toast(t("boardOff"));
          if (!boardNoticed && window.EL_WIN) {           // 셸 알림에 [보드 앱 열기] — 한 번만 (규칙이 반복해도 쌓이지 않게)
            boardNoticed = true;
            EL_WIN.notify(t("boardOff"), { actions: [{ label: t("openBoard"), href: "/board" }] });
          }
        }).catch(function (e) { toast(t("boardFail") + ((e && e.message) || e)); });
    }
    var bigTimer = 0;
    function bigText(s) {
      var el = $("bigText");
      el.textContent = s; el.classList.add("on");
      clearTimeout(bigTimer); bigTimer = setTimeout(function () { el.classList.remove("on"); }, 1800);
    }
    var toastTimer = 0;
    function toast(s) {
      var el = $("toast"); el.textContent = s; el.classList.add("on");
      clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.remove("on"); }, 2600);
    }
    /* 소리 — Web Audio 로 바로 만든다 (파일 없이) */
    var AC = null;
    function audio() {
      if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
      if (AC.state === "suspended") AC.resume();
      return AC;
    }
    document.addEventListener("pointerdown", function () { audio(); }, { once: true });
    var NOTES = {
      beep: [[880, 0, .15]], doremi: [[523, 0, .18], [587, .2, .18], [659, .4, .28]], ding: [[988, 0, .25], [784, .28, .45]],
      fanfare: [[523, 0, .12], [659, .14, .12], [784, .28, .12], [1047, .42, .45]], low: [[196, 0, .45, "sawtooth"]],
      step: [[784, 0, .1], [1175, .1, .16]], fail: [[330, 0, .18, "triangle"], [247, .2, .3, "triangle"]]
    };
    function playSound(name) {
      var ac = audio(); if (!ac) return;
      var t0 = ac.currentTime + 0.02;
      (NOTES[name] || NOTES.beep).forEach(function (n) {
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = n[3] || "sine"; o.frequency.value = n[0];
        g.gain.setValueAtTime(0.0001, t0 + n[1]);
        g.gain.exponentialRampToValueAtTime(0.25, t0 + n[1] + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + n[1] + n[2]);
        o.connect(g); g.connect(ac.destination);
        o.start(t0 + n[1]); o.stop(t0 + n[1] + n[2] + 0.05);
      });
      EL_SIGNAL.sounds.push(name);
    }

    /* ================================================================
       3) 동작 암호
       ================================================================ */
    var pws = lsGet("el-signal-passwords", null);
    if (!Array.isArray(pws) || !pws.length) {
      pws = [{ id: uid(), name: t("pwEx1"), steps: [{ sig: "gesture", val: "Closed_Fist" }, { sig: "gesture", val: "Open_Palm" }, { sig: "gesture", val: "Victory" }] }];
    }
    var pwCur = lsGet("el-signal-pw-cur", pws[0].id);
    if (!pws.some(function (x) { return x.id === pwCur; })) pwCur = pws[0].id;
    function curPw() { for (var i = 0; i < pws.length; i++) if (pws[i].id === pwCur) return pws[i]; return pws[0] || null; }
    function savePws() { lsSet("el-signal-passwords", pws); lsSet("el-signal-pw-cur", pwCur); }
    var game = { playing: false, pos: 0, hold: 0, stepAt: 0, release: false, win: false, msg: "" };

    function newPw() {
      var p = { id: uid(), name: tf("pwDefault", { n: pws.length + 1 }), steps: [] };
      pws.push(p); pwCur = p.id; stopGame(true); savePws(); renderPw();
      $("pwName").focus(); $("pwName").select();
    }
    function palette() {
      var g = [
        ["gHand", [["gesture", "Closed_Fist"], ["gesture", "Open_Palm"], ["gesture", "Victory"], ["gesture", "Thumb_Up"], ["gesture", "Pointing_Up"], ["gesture", "ILoveYou"], ["handup", "up"]]],
        ["gFinger", [["fingers", "1"], ["fingers", "2"], ["fingers", "3"], ["fingers", "4"], ["fingers", "5"]]],
        ["gFace", [["dir", "left"], ["dir", "right"], ["dir", "up"], ["dir", "down"], ["expr", "smile"], ["expr", "mouth"], ["dist", "near"], ["dist", "far"]]]
      ];
      MODELS.forEach(function (m) { g.push([m.title || m.slug, (m.labels || []).map(function (l) { return ["m:" + m.slug, l]; })]); });
      return g;
    }
    function renderPw() {
      var p = curPw();
      $("pwList").innerHTML = pws.map(function (x) {
        return '<button class="pw' + (p && x.id === p.id ? " on" : "") + '" type="button" data-pw="' + esc(x.id) + '">' + IC.lock.replace("<svg", '<svg style="width:15px;height:15px;vertical-align:-2px;margin-right:4px"') + esc(x.name || "?") + "</button>";
      }).join("");
      $("pwName").value = p ? p.name : "";
      $("pwName").placeholder = t("pwName");
      $("pwDel").innerHTML = IC.x + "<span>" + esc(t("pwDel")) + "</span>";
      $("pwDel").disabled = pws.length <= 1;
      var steps = p ? p.steps : [];
      $("flow").innerHTML = steps.length ? steps.map(function (c, i) {
        return (i ? '<span class="arrow">→</span>' : "") + '<div class="step" data-s="' + i + '"><span class="si">' + (i + 1) + "</span><b>" + esc(moveLabel(c)) + "</b>" +
          '<button class="xbtn" type="button" data-del="' + i + '" aria-label="' + esc(t("delCond")) + '"' + (game.playing ? " disabled" : "") + ">" + IC.x + '</button><i class="fill"></i></div>';
      }).join("") : '<span class="hint">' + esc(t("pwEmpty")) + "</span>";
      var full = steps.length >= MAX_STEPS;
      $("palette").innerHTML = '<div class="hint">' + esc(full ? tf("pwMax", { n: MAX_STEPS }) : t("pwPick")) + "</div>" + palette().map(function (gr) {
        return '<div class="pgroup"><span>' + esc(I18N.ko[gr[0]] ? t(gr[0]) : gr[0]) + "</span>" + gr[1].map(function (m) {
          return '<button class="mv" type="button" data-mv="' + esc(m[0]) + "|" + esc(m[1]) + '"' + (full || game.playing ? " disabled" : "") + ">" + esc(moveLabel({ sig: m[0], val: m[1] })) + "</button>";
        }).join("") + "</div>";
      }).join("") +
        '<div class="pgroup"><span>' + esc(t("pwMore")) + '</span><select id="pwSig">' + sigOptions("hand") + '</select><select id="pwVal">' + valOptions("hand", "shown") + "</select>" +
        '<button class="btn" type="button" id="pwAddMore"' + (full || game.playing ? " disabled" : "") + ">" + IC.plus + "<span>" + esc(t("pwAdd")) + "</span></button></div>";
      paintGame();
    }
    $("pwList").addEventListener("click", function (e) {
      var b = e.target.closest("[data-pw]"); if (!b) return;
      pwCur = b.getAttribute("data-pw"); stopGame(true); savePws(); renderPw();
    });
    $("pwName").addEventListener("input", function () {
      var p = curPw(); if (!p) return;
      p.name = this.value; savePws();
      var b = $("pwList").querySelector(".pw.on"); if (b) b.lastChild.textContent = p.name || "?";
    });
    $("pwDel").addEventListener("click", function () {
      if (pws.length <= 1) return;
      pws = pws.filter(function (x) { return x.id !== pwCur; }); pwCur = pws[0].id; stopGame(true); savePws(); renderPw();
    });
    function addStep(c) {
      var p = curPw(); if (!p || p.steps.length >= MAX_STEPS || game.playing) return;
      p.steps.push(c); savePws(); game.win = false; renderPw();
    }
    $("palette").addEventListener("click", function (e) {
      var b = e.target.closest("[data-mv]");
      if (b) { var v = b.getAttribute("data-mv"), k = v.indexOf("|"); addStep({ sig: v.slice(0, k), val: v.slice(k + 1) }); return; }
      if (e.target.closest("#pwAddMore")) addStep({ sig: $("pwSig").value, val: $("pwVal").value });
    });
    $("palette").addEventListener("change", function (e) { if (e.target.id === "pwSig") $("pwVal").innerHTML = valOptions(e.target.value, ""); });
    $("flow").addEventListener("click", function (e) {
      var b = e.target.closest("[data-del]"); if (!b || game.playing) return;
      var p = curPw(); p.steps.splice(+b.getAttribute("data-del"), 1); savePws(); game.win = false; renderPw();
    });
    $("pwGo").addEventListener("click", function () { if (game.playing) stopGame(); else startGame(); });

    function startGame() {
      var p = curPw();
      if (!p || !p.steps.length) { toast(t("pwNeed")); return; }
      if (!camLive() && !fake) camOn();               // [도전!] 을 눌렀으니 카메라를 켠다 — 누른 사람이 원한 것
      game = { playing: true, pos: 0, hold: 0, stepAt: now(), release: false, win: false, msg: t("pwStart0") };
      renderPw();
    }
    function stopGame(quiet) {
      if (!game.playing && quiet) return;
      game.playing = false; game.hold = 0;
      if (!quiet) game.msg = "";
      if (TAB === "pw") renderPw();
    }
    function same(a, b) { return a && b && a.sig === b.sig && a.val === b.val; }
    function gameTick(S) {
      if (!game.playing) return;
      var p = curPw(), steps = p ? p.steps : [];
      if (!steps.length) { stopGame(true); return; }
      var st = steps[game.pos], ok = cond(S, st), tm = now();
      if (game.release) { if (!ok) { game.release = false; game.msg = ""; } ok = false; }   // 같은 동작이 이어지면 한 번 풀어야 센다
      if (ok) {
        if (!game.hold) { game.hold = tm; game.msg = t("pwHold"); }
        if (tm - game.hold >= HOLD_MS) {
          game.pos++; game.hold = 0; game.stepAt = tm;
          if (game.pos >= steps.length) { win(); return; }
          game.msg = tf("pwStepOk", { n: game.pos });
          game.release = same(steps[game.pos], st);
          if (game.release) game.msg = t("pwRelease");
          playSound("step");
        }
      } else {
        if (game.hold) game.msg = "";
        game.hold = 0;
        if (game.pos > 0 && tm - game.stepAt > STEP_TIMEOUT_MS) {       // 오래 못 하면 처음부터
          game.pos = 0; game.stepAt = tm; game.release = false; game.msg = t("pwTimeout");
          playSound("fail");
        }
      }
      paintGame();
    }
    function win() {
      game.playing = false; game.win = true; game.msg = t("pwOkSub");
      playSound("fanfare"); stat("signal_password_ok");
      EL_SIGNAL.wins++;
      var cf = $("confetti"), cols = ["#3a9a55", "#e0a030", "#1f5f7a", "#b4451c", "#6fb7d8"], h = "";
      var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!reduce) for (var i = 0; i < 36; i++) h += '<i style="left:' + (Math.random() * 100).toFixed(1) + "%;background:" + cols[i % 5] + ";animation-delay:" + (Math.random() * .5).toFixed(2) + 's"></i>';
      cf.innerHTML = h; setTimeout(function () { cf.innerHTML = ""; }, 2400);
      renderPw();
    }
    function paintGame() {
      var p = curPw(), steps = p ? p.steps : [], pl = $("play");
      pl.classList.toggle("win", game.win);
      $("lockIcon").innerHTML = game.win ? IC.unlock : IC.lock;
      var prog = 0;
      if (game.win) { $("nowLabel").textContent = ""; $("nowMove").textContent = t("pwOk"); prog = 1; }
      else if (game.playing) {
        $("nowLabel").textContent = tf("pwNow", { a: game.pos + 1, b: steps.length });
        $("nowMove").textContent = moveLabel(steps[game.pos]);
        prog = game.hold ? Math.min(1, (now() - game.hold) / HOLD_MS) : 0;
      } else { $("nowLabel").textContent = ""; $("nowMove").textContent = steps.length ? moveLabel(steps[0]) + (steps.length > 1 ? " → …" : "") : "—"; }
      $("pwMsg").textContent = game.playing || game.win ? game.msg : (steps.length ? t("pwReady") : t("pwNeed"));
      $("ringFill").setAttribute("stroke-dashoffset", (263.9 * (1 - prog)).toFixed(1));
      $("pwGo").innerHTML = (game.playing ? IC.stop : IC.play) + "<span>" + esc(game.playing ? t("pwStop") : game.win ? t("pwAgain") : t("pwStart")) + "</span>";
      $("pwGo").classList.toggle("go", !game.playing);
      $("pwGo").disabled = !steps.length;
      Array.prototype.forEach.call(document.querySelectorAll("#flow .step"), function (el) {
        var i = +el.getAttribute("data-s");
        el.classList.toggle("done", game.win || (game.playing && i < game.pos));
        el.classList.toggle("cur", game.playing && i === game.pos);
        el.querySelector(".fill").style.width = game.playing && i === game.pos ? (prog * 100) + "%" : "0";
      });
    }

    /* ================================================================
       판정 고리 — 0.1초마다 (카드·규칙·암호가 같은 신호를 본다)
       ================================================================ */
    var lastPaint = 0;
    setInterval(function () {
      if (window.EL_WIN && EL_WIN.hidden) return;
      var S = derive();
      evalRules(S);
      gameTick(S);
      if (TAB === "sig" && now() - lastPaint > 200) { lastPaint = now(); paintCards(S); paintNums(S); }
    }, 100);

    /* ================================================================
       시험 고리 — 진짜 AI 없이 신호를 넣어 본다 (자동 시험·수업 시연용)
       ================================================================ */
    function makeHand(n, o) {
      // n 개 손가락을 편 가짜 손 21점 (위를 향한 손). o: {x, y, s(크기), gesture, score}
      o = o || {};
      var cx = o.x != null ? o.x : 320, cy = o.y != null ? o.y : 260, s = o.s || 1;
      var ext = [n >= 5, n >= 1, n >= 2, n >= 3, n >= 4];
      var P = function (dx, dy) { return [Math.round(cx + dx * s), Math.round(cy + dy * s)]; };
      var pts = [P(0, 100)];
      pts.push(P(-40, 70), P(-60, 45));
      pts.push(ext[0] ? P(-85, 25) : P(-35, 40), ext[0] ? P(-110, 10) : P(-5, 35));
      [-30, -10, 10, 30].forEach(function (dx, k) {
        var e = ext[k + 1];
        pts.push(P(dx, 0), P(dx, -40), e ? P(dx, -65) : P(dx, -20), e ? P(dx, -85) : P(dx, 5));
      });
      return { gesture: o.gesture || "None", gesture_en: o.gesture || "None", score: o.score != null ? o.score : 90, hand: "Right", box: null, points: pts };
    }
    window.EL_SIGNAL = {
      fired: [], sounds: [], wins: 0,
      /* det: {hand:[서버 손 항목], mesh:[서버 얼굴 항목], face:{found,top}, custom:{slug:[{name,score}]}, frame:{w,h}} */
      inject: function (det) {
        fake = true;
        det = det || {};
        if (det.frame) { RAW.W = det.frame.w || 640; RAW.H = det.frame.h || 480; fitFrame(); }
        if ("hand" in det) applyHand(det.hand);
        if ("mesh" in det) applyMesh(det.mesh);
        if ("face" in det) applyExpr(det.face);
        if (det.custom) Object.keys(det.custom).forEach(function (s) { applyModel(s, det.custom[s]); });
        paintCam(); draw();
      },
      live: function () { fake = false; RAW.hands = []; RAW.face = null; RAW.expr = null; RAW.models = {}; paintCam(); draw(); },
      makeHand: makeHand,
      state: function () {
        var S = derive();
        return { active: S.active, fingers: S.hands.map(function (h) { return h.fingers; }), gestures: S.hands.map(function (h) { return h.gesture; }),
                 up: S.hands.some(function (h) { return h.up; }), face: !!S.face, cm: S.face ? S.face.cm : 0, dir: S.face ? S.face.dir : "",
                 expr: S.expr, models: S.models };
      },
      cond: function (sig, val) { return cond(derive(), { sig: sig, val: val }); },
      rules: function () { return JSON.parse(JSON.stringify(rules)); },
      setRules: function (arr) { rules = (arr || []).slice(0, MAX_RULES); resetEdges(); saveRules(); renderRules(); paintTabs(); paintStatus(); },
      passwords: function () { return JSON.parse(JSON.stringify(pws)); },
      game: function () { return { playing: game.playing, pos: game.pos, win: game.win, msg: game.msg }; },
      camera: function () { return camLive(); },
      camOn: camOn, camOff: camOff, tab: setTab,
      hide: onHidden, show: onShown,           // 셸이 창을 가리고 보일 때와 같은 일
      board: function () { return boardOk; }
    };

    /* ── 글자 ── */
    function paintText() {
      document.title = t("title"); $("langButton").textContent = t("lang");
      $("txtQ1").textContent = t("q1");
      $("sigLead").textContent = t("sigLead");
      $("ruleLead").textContent = tf("ruleLead", { s: COOLDOWN_MS / 1000 });
      $("pwLead").textContent = tf("pwLead", { s: HOLD_MS / 1000 });
      if (window.navRepaint) window.navRepaint();
    }
    $("langButton").addEventListener("click", function () {
      try { localStorage.setItem("vapiLang", LANG === "ko" ? "en" : "ko"); } catch (e) {}
      location.reload();
    });

    paintText(); paintTabs(); paintCam(); fitFrame();
    renderRules(); renderPw();
    paintCards(derive()); paintNums(derive());
    loadModels(); checkBoard();
  })();
  </script>
  <script src="/lib/shell.js"></script>
  <script src="/lib/usage.js" data-page="signal"></script>
  <i id="el-built" hidden></i>
</body>
