<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>edge-lab</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link href="/fonts/fonts.css" rel="stylesheet">
  <script>
    /* 밝은 곳 모드: 화면이 그려지기 전에 적용해야 깜빡이지 않는다 */
    try { if (localStorage.getItem("vapi-hc") === "1")
            document.documentElement.classList.add("hc"); } catch (e) {}
  </script>
  <link rel="stylesheet" href="/lib/tokens.css">
  <style>
    /* 런처 — 앱을 골라 여는 첫 화면.
     *
     * 전에는 "/" 가 곧 체험하기였고, AI 16종은 그 안 <select> 드롭다운에
     * optgroup 여섯 묶음으로 숨어 있었다. index.html 주석에도 "스물몇 개를
     * 한 줄로 늘어놓으면 못 찾는다" 고 적혀 있었는데, 드롭다운은 그 답이
     * 아니었다 — 아이는 열어 보기 전에는 무엇이 있는지 모른다.
     *
     * 타일 치수는 lib/tokens.css 의 --tap / --fs-name 을 따른다.
     * 이름은 줄이지 않는다 — "얼굴 나이/성별 분…" 이 되면 무엇인지 모른다.
     */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      color: var(--ink);
      background-color: var(--paper);
      font-family: "Gowun Dodum", "Apple SD Gothic Neo", system-ui, sans-serif;
      font-size: var(--fs-body);
      line-height: 1.5;
    }
    a { color: var(--pen-blue-d); text-decoration: none; }

    /* 런처 판 — .workbench 안을 통째로 쓴다 */
    .launch {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 18px 22px 28px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .lgroup > h2 {
      margin: 0 0 12px;
      font-family: "Gowun Batang", serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--cyan-d);
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    /* 묶음 이름 옆의 개수 — 몇 개짜리 묶음인지 먼저 보인다 */
    .lgroup > h2 em {
      font-style: normal;
      font-family: "Menlo", "Consolas", ui-monospace, monospace;
      font-size: 11.5px;
      color: var(--ink-2);
      opacity: .8;
      letter-spacing: .06em;
      font-variant-numeric: tabular-nums;
    }
    .lgroup > h2::after {
      content: "";
      flex: 1 1 auto;
      height: 1px;
      background: var(--line);
      opacity: .45;
    }

    /* 타일 사이 12px — 붙여 놓으면 옆 앱이 열린다 */
    .grid { display: grid; gap: 12px; }
    .grid.apps { grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); max-width: 980px; }
    .grid.ai   { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }

    .tile {
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 80px;
      padding: 13px 15px;
      text-align: left;
      cursor: pointer;
      background: var(--box);
      border: 1.5px solid var(--line);
      border-radius: var(--r);
      color: var(--ink);
      font-family: inherit;
      transition: border-color .12s, box-shadow .12s, transform .12s;
    }
    .tile:hover {
      border-color: var(--cyan);
      box-shadow: 0 3px 0 rgba(31, 95, 122, .22);
      transform: translateY(-1px);
      text-decoration: none;
    }
    .tile:focus-visible { outline: 3px solid var(--pen-red); outline-offset: 2px; }
    .tile .ic {
      flex: 0 0 auto;
      width: 52px; height: 52px;
      display: grid; place-items: center;
      border-radius: var(--r);
      background: var(--cyan-bg);
      color: var(--cyan-d);
    }
    .tile .ic svg { width: 30px; height: 30px; }
    .tile .tx { min-width: 0; }
    .tile .tx b {
      display: block;
      font-size: var(--fs-name);
      font-weight: 700;
      line-height: 1.3;
      word-break: keep-all;
    }
    .tile .tx i {
      display: block;
      font-style: normal;
      font-size: var(--fs-side);
      color: var(--ink-2);
      line-height: 1.4;
      margin-top: 2px;
      word-break: keep-all;
    }
    /* AI 타일은 세로 — 이름이 길어 옆으로 두면 두 줄이 더 자주 난다 */
    .grid.ai .tile {
      flex-direction: column;
      align-items: flex-start;
      gap: 9px;
      min-height: 112px;
      padding: 14px 13px;
    }
    .grid.ai .tile .tx b { font-size: 15.5px; }
    .grid.ai .tile .tx i { font-size: 12px; }

    html.hc .tile { border-width: 2px; }

    /* 처음 여는 안내 — 파이보가 한 줄 */
    .hello {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 4px 2px 0;
    }
    .hello img { height: 62px; flex: 0 0 auto; }
    .hello .say b {
      display: block;
      font-family: "Gowun Batang", serif;
      font-size: 21px;
      line-height: 1.3;
      color: var(--ink);
    }
    .hello .say i {
      display: block;
      font-style: normal;
      font-size: var(--fs-body);
      color: var(--ink-2);
      margin-top: 3px;
    }

    /* 아직 가르친 AI 가 없을 때 */
    .none {
      font-size: var(--fs-body);
      color: var(--ink-2);
      padding: 14px 16px;
      border: 1.5px dashed var(--line);
      border-radius: var(--r);
      background: var(--box);
    }

    @media (max-width: 1023px) {
      .grid.apps { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); max-width: none; }
      .launch { overflow-y: visible; }
    }
    @media (max-width: 639px) {
      .launch { padding: 14px 14px 20px; gap: 18px; }
      .grid.apps, .grid.ai { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
      .grid.ai .tile { min-height: 104px; }
      .hello img { height: 48px; }
      .hello .say b { font-size: 18px; }
    }
    @media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
  </style>
  <link rel="stylesheet" href="/lib/ui.css">
  <link rel="stylesheet" href="/lib/shell.css">
</head>
<body data-density="explore">

  <div class="titlebar">
    <a class="tb-brand" href="/" title="인터넷 없이 내 컴퓨터에서 실행돼요">
      <img src="/assets/pibo-logo.png" alt=""><b>edge-lab</b>
    </a>
    <span class="tb-sep"></span>
    <span class="tb-app" id="txtTitle"></span>
    <div class="h-tools">
      <button id="langButton" title="한국어 / English">EN</button>
    </div>
  </div>

  <div class="shell-body">
    <div class="workbench">
      <div class="launch">

        <div class="hello">
          <img src="/assets/pibo-hello.png" alt="">
          <span class="say">
            <b id="txtHello">무엇을 해 볼까요?</b>
            <i id="txtHelloSub">인터넷 없이 내 컴퓨터 안에서 도는 AI예요.</i>
          </span>
        </div>

        <div class="lgroup">
          <h2><span id="txtAppsHead">앱</span> <em id="appsCount"></em></h2>
          <div class="grid apps" id="appGrid"></div>
        </div>

        <div id="aiGroups"></div>

        <div class="lgroup" id="customGroup" hidden>
          <h2><span id="txtCustomHead">내가 가르친 AI</span> <em id="customCount"></em></h2>
          <div class="grid ai" id="customGrid"></div>
        </div>

      </div>
    </div>
  </div>

  <script src="/lib/icons.js"></script>
  <script src="/lib/apps.js"></script>
  <script src="/lib/shell.js"></script>
  <script>
    (function () {
      "use strict";

      var A = window.EL_APPS;
      var LANG = A.lang();
      document.documentElement.lang = LANG;

      var T = {
        ko: {
          hello: "무엇을 해 볼까요?",
          helloSub: "인터넷 없이 내 컴퓨터 안에서 도는 AI예요.",
          appsHead: "앱",
          customHead: "내가 가르친 AI",
          customNone: "아직 가르친 AI가 없어요. [가르치기]에서 만들면 여기에 나와요.",
          langBtn: "EN"
        },
        en: {
          hello: "What shall we try?",
          helloSub: "AI that runs on this computer, with no internet.",
          appsHead: "Apps",
          customHead: "AI you trained",
          customNone: "Nothing trained yet. Make one in Train and it shows up here.",
          langBtn: "한"
        }
      }[LANG];

      var $ = function (id) { return document.getElementById(id); };
      $("txtHello").textContent = T.hello;
      $("txtHelloSub").textContent = T.helloSub;
      $("txtAppsHead").textContent = T.appsHead;
      $("txtCustomHead").textContent = T.customHead;
      $("langButton").textContent = T.langBtn;
      document.title = "edge-lab";

      var icon = function (n) { return (window.elIcon ? window.elIcon(n) : ""); };

      /* 타일 하나 — 링크다. 가운데 클릭·키보드가 그냥 되게 <button> 이 아니라 <a>. */
      function tile(href, ic, name, sub, title) {
        var a = document.createElement("a");
        a.className = "tile";
        a.href = href;
        if (title) a.title = title;
        a.innerHTML = '<span class="ic">' + icon(ic) + "</span>" +
                      '<span class="tx"><b></b><i></i></span>';
        a.querySelector("b").textContent = name;
        a.querySelector("i").textContent = sub || "";
        return a;
      }

      /* ── 앱 여섯 ── */
      var appGrid = $("appGrid");
      A.APPS.forEach(function (app) {
        appGrid.appendChild(tile(app.href, app.ic,
          LANG === "en" ? app.en : app.ko,
          LANG === "en" ? app.en_d : app.ko_d));
      });
      $("appsCount").textContent = A.APPS.length;

      /* ── AI 16종 : 묶음별로 편다 ──
         타일을 누르면 체험하기가 그 모델이 골라진 채로 열린다(?m=). */
      var wrap = $("aiGroups");
      A.GROUPS.forEach(function (g) {
        var id = g[0], label = (LANG === "en" ? g[2] : g[1]);
        var keys = Object.keys(A.SERVICE_LIST).filter(function (k) {
          return A.SERVICE_LIST[k].g === id;
        });
        if (!keys.length) return;

        var sec = document.createElement("div");
        sec.className = "lgroup";
        var h = document.createElement("h2");
        h.innerHTML = "<span></span> <em></em>";
        h.querySelector("span").textContent = label;
        h.querySelector("em").textContent = id + " · " + keys.length;
        sec.appendChild(h);

        var grid = document.createElement("div");
        grid.className = "grid ai";
        keys.forEach(function (k) {
          var sv = A.SERVICE_LIST[k];
          var t = tile("/try?m=" + encodeURIComponent(k), sv.ic,
                       A.name(k, LANG), "", A.tip(k, LANG));
          t.dataset.svc = (sv.api.split("/")[1] || "");
          grid.appendChild(t);
        });
        sec.appendChild(grid);
        wrap.appendChild(sec);
      });

      /* 곁글에 "어디서 도는지" 를 적는다 — 서버가 실측으로 알려 준 값이라
         PC 마다 다를 수 있어 하드코딩하지 않는다. 못 받아 오면 그냥 비운다. */
      (function fillDevice() {
        fetch("/system").then(function (r) { return r.json(); }).then(function (info) {
          var of = (info && info.device_of) || {};
          document.querySelectorAll(".tile[data-svc]").forEach(function (t) {
            var d = (of[t.dataset.svc] || "").toUpperCase();
            if (d) t.querySelector("i").textContent = d;
          });
        }).catch(function () { /* 아직 서버가 안 떴을 뿐이다 */ });
      })();

      /* ── 내가 가르친 AI ── */
      (function loadCustom() {
        fetch("/custom/models").then(function (r) { return r.json(); }).then(function (j) {
          var list = (j && j.result === "ok" && Array.isArray(j.data)) ? j.data : [];
          var grid = $("customGrid");
          $("customGroup").hidden = false;
          if (!list.length) {
            var p = document.createElement("p");
            p.className = "none";
            p.textContent = T.customNone;
            grid.parentNode.replaceChild(p, grid);
            $("customCount").textContent = "0";
            return;
          }
          list.forEach(function (m) {
            grid.appendChild(tile("/try?m=" + encodeURIComponent("custom:" + m.slug),
              "custom", m.title, (m.labels || []).join(" · ")));
          });
          $("customCount").textContent = String(list.length);
        }).catch(function () { /* 서버가 아직이면 이 묶음은 안 보인다 */ });
      })();

      /* ── 한/영 ── */
      $("langButton").addEventListener("click", function () {
        try { localStorage.setItem("vapiLang", LANG === "ko" ? "en" : "ko"); } catch (e) {}
        location.reload();
      });
    })();
  </script>
  <script src="/lib/sysbar.js"></script>
  <script src="/lib/tour.js"></script>
  <script src="/lib/usage.js" data-page="home"></script>
</body>
</html>
