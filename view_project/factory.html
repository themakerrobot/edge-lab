<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>edge-lab — 로봇 공장</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link href="/fonts/fonts.css" rel="stylesheet">
  <script>
    try { if (localStorage.getItem("vapi-hc") === "1")
            document.documentElement.classList.add("hc"); } catch (e) {}
  </script>
  <link rel="stylesheet" href="/lib/tokens.css">
  <script src="/lib/embed.js"></script>
  <link rel="expect" href="#el-built" blocking="render">
  <style>
    /* 로봇 공장 — 로봇팔(ch1-4) · 컨베이어 벨트(ch5) · 차단봉(ch6) 을 움직여 보는 곳.
     *
     * 3D 공장은 늘 움직인다. 보드 앱(/board)에서 로봇을 연결해 두면 같은 명령이 진짜 로봇에도 간다.
     * 연결이 없으면 "시뮬레이션" — 로봇이 없는 교실에서도 3D 로 순서 프로그램까지 다 해 볼 수 있다.
     * 포트는 서버(board.py)가 쥐고, 이 화면은 /board/* 로만 말한다 (lib/factory/link.js).
     *
     * 펌웨어 명령은 "#m:90,90,90,90!" 처럼 "!" 로 끝나고 줄바꿈이 없다 — 보드 앱에서 줄 끝을 "없음" 으로.
     * themakerrobot/factory-lab (같은 저작자) 을 이 저장소 화면 규격에 맞게 옮겼다.
     */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --ok: #2f8a4c; --ok-bg: #e3f1e6; --ok-ink: #1e5b30; --bad-bg: #fbe3dc; --bad-ink: #8f3312;
            --stage: #f3efe6; --term: #1f2328; --soft: #f4efe4; }
    html.hc { --ok: #237a3b; --ok-ink: #14451f; --bad-ink: #6e240b; --soft: #efe8da; }
    body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; color: var(--ink); background: var(--paper);
           font-family: "Gowun Dodum", "Apple SD Gothic Neo", system-ui, sans-serif; line-height: 1.5;
           padding: var(--sp-2, 8px); gap: var(--sp-2, 8px); }
    button, input, select, textarea { font-family: inherit; color: var(--ink); }
    [hidden] { display: none !important; }

    .btn { border: 1.5px solid var(--line-d); background: #fff; font-weight: 600; padding: 6px 12px; border-radius: var(--r); cursor: pointer;
           font-size: .92rem; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
    .btn:hover { background: var(--hover-bg); }
    .btn.primary { background: var(--pen-blue); border-color: var(--pen-blue-d); color: #fff; }
    .btn.primary:hover { background: var(--pen-blue-d); }
    .btn.on { background: var(--cyan-bg); border-color: var(--cyan); color: var(--cyan-d); }
    .btn.danger { color: var(--pen-red); border-color: var(--pen-red); }
    .btn.stop { background: var(--pen-red); border-color: var(--pen-red); color: #fff; font-size: 1rem; padding: 6px 16px; }
    .btn.stop:hover { background: var(--bad-ink); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.sm { min-height: 32px; padding: 3px 10px; font-size: .85rem; }
    .btn svg { width: 18px; height: 18px; flex: 0 0 auto; }
    .btn.sm svg { width: 16px; height: 16px; }
    .btn.ic { padding: 3px 8px; }
    .st { font-weight: 700; font-size: var(--fs-head, 14px); color: var(--cyan-d); display: flex; align-items: center; gap: 6px; }
    .st svg { width: 17px; height: 17px; }
    .st .btn { margin-left: auto; }
    .hint { font-size: var(--fs-side, 13px); color: var(--ink-2); }
    .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .row .grow { flex: 1 1 auto; }
    .sec { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; border-top: 1.5px dashed var(--line); }
    .chk { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-side, 13px); cursor: pointer; white-space: nowrap; }
    .chk input { accent-color: var(--pen-blue); width: 16px; height: 16px; margin: 0; }
    .inp, select { height: 32px; border: 1.5px solid var(--line); border-radius: var(--r); padding: 0 8px; background: #fff; font-size: .9rem; min-width: 0; }
    .inp:focus, select:focus, textarea:focus { outline: 2px solid var(--cyan); outline-offset: -1px; }
    .inp.num { width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
    .mono { font-family: Menlo, Consolas, monospace; }

    /* ── 연결 줄 : 창 모드에서는 제목줄이 없어 여기가 이 화면의 머리다 ── */
    .linkbar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 4px 6px;
               background: var(--box); border: 1.5px solid var(--line); border-radius: var(--r); }
    .state { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 999px; background: var(--soft);
             font-weight: 700; min-height: 32px; }
    .state i, .lamp i { width: 10px; height: 10px; border-radius: 50%; background: #a39a8a; flex: 0 0 auto; }
    .state.on { background: var(--ok-bg); color: var(--ok-ink); } .state.on i { background: var(--ok); }
    .state.sim { background: var(--cyan-bg); color: var(--cyan-d); } .state.sim i { background: var(--cyan); }
    .state.bad { background: var(--bad-bg); color: var(--bad-ink); } .state.bad i { background: var(--pen-red); }
    .lamp { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-side, 13px); color: var(--ink-2); }
    .lamp.busy { color: var(--cyan-d); font-weight: 700; } .lamp.busy i { background: var(--cyan); }
    .linkbar .warn { font-size: var(--fs-side, 13px); color: var(--bad-ink); background: var(--bad-bg); padding: 3px 10px; border-radius: var(--r); font-weight: 600; }
    .linkbar .hint { flex: 1 1 200px; min-width: 0; }
    .linkbar .sp { flex: 1 1 auto; }

    .panel.arm { flex: 0 0 300px; } .panel.view { flex: 1 1 auto; } .panel.side { flex: 0 0 330px; }
    .panel-head .meta { margin-left: auto; font-size: var(--fs-side, 13px); color: var(--ink-2); }

    /* ── 축 슬라이더 : 윗줄 이름 + 숫자, 아랫줄 − 슬라이더 + ── */
    .strip { display: grid; grid-template-columns: 32px 1fr 32px; grid-template-areas: "lab lab rd" "minus slider plus";
             align-items: center; gap: 2px 6px; padding: 4px 6px; border-radius: var(--r); border: 1.5px solid transparent; }
    .strip label { grid-area: lab; font-weight: 700; font-size: .95rem; }
    .strip .rd { grid-area: rd; justify-self: end; display: flex; align-items: center; gap: 6px; grid-column: 2 / 4; }
    .strip .rd .inp { width: 60px; height: 30px; text-align: right; font-variant-numeric: tabular-nums; }
    .strip .rd .sub { font-size: var(--fs-side, 13px); color: var(--ink-2); font-family: Menlo, Consolas, monospace; white-space: nowrap; }
    .strip input[type=range] { grid-area: slider; width: 100%; accent-color: var(--pen-blue); height: 28px; }
    .strip .nb[data-dir="-1"] { grid-area: minus; } .strip .nb[data-dir="1"] { grid-area: plus; }
    .strip.hl { border-color: var(--cyan); background: var(--cyan-bg); }
    .strip.flat { grid-template-columns: 64px 1fr auto; grid-template-areas: "lab slider rd"; }
    .strip.flat .rd { grid-column: auto; }
    .nb { width: 32px; height: 32px; padding: 0; background: #fff; border: 1.5px solid var(--line); border-radius: var(--r);
          display: inline-flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; touch-action: none; }
    .nb svg { width: 16px; height: 16px; }
    .nb:hover { border-color: var(--cyan); background: var(--cyan-bg); }
    body.calib .strip:not([data-ch="4"]) .rd .inp, body.calib .strip[data-ch]:not([data-ch="4"]) .nb { border-color: var(--ok); color: var(--ok); }
    body.calib .strip[data-ch]:not([data-ch="4"]) .sub { color: var(--ok); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .grid2 .btn { width: 100%; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips button { border: 1.5px solid var(--line); background: #fff; border-radius: 16px; padding: 3px 12px; cursor: pointer; min-height: 32px;
                    font-family: Menlo, Consolas, monospace; font-size: .9rem; }
    .chips button:hover { border-color: var(--cyan); background: var(--cyan-bg); }

    /* ── 3D ── */
    .view { position: relative; min-height: 200px; background: var(--stage); border: 1.5px solid var(--line); border-radius: var(--r);
            overflow: hidden; cursor: grab; touch-action: none; }
    .view.dragging { cursor: grabbing; }
    .view canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .view .simtag { position: absolute; left: 8px; top: 8px; padding: 3px 12px; border-radius: 999px; background: var(--pen-blue); color: #fff;
                    font-weight: 700; font-size: .9rem; pointer-events: none; }
    .view .simtag.live { background: var(--ok); }
    .view .hud { position: absolute; left: 8px; bottom: 8px; right: 8px; font-size: var(--fs-side, 13px); color: var(--ink-2); pointer-events: none;
                 display: flex; gap: 8px; align-items: flex-end; }
    .view .hud span { background: rgba(255,255,255,.9); border: 1px solid #dcd5c6; padding: 1px 9px; border-radius: 999px; }
    .view .hud .fps { font-family: Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; margin-left: auto; }
    .view .tip { position: absolute; display: none; pointer-events: none; z-index: 5; background: var(--ink); color: #fff;
                 padding: 3px 10px; font-size: var(--fs-side, 13px); border-radius: var(--r); font-weight: 600; }
    .view .no3d { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; color: var(--ink-2); }
    .seg { display: inline-flex; border: 1.5px solid var(--line-d); border-radius: var(--r); overflow: hidden; }
    .seg button { border: 0; background: #fff; padding: 0 10px; min-height: 32px; font-size: .85rem; font-weight: 600; cursor: pointer; }
    .seg button + button { border-left: 1.5px solid var(--line-d); }
    .seg button.on { background: var(--pen-blue); color: #fff; }
    .zoom { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; color: var(--ink-2); font-size: var(--fs-side, 13px); }
    .zoom svg { width: 17px; height: 17px; }
    .zoom input { width: 90px; accent-color: var(--pen-blue); }
    .zoom .mono { min-width: 38px; }
    .tltime { min-width: 58px; text-align: center; font-family: Menlo, Consolas, monospace; font-weight: 700; font-variant-numeric: tabular-nums; }
    .tlwrap { height: 64px; border: 1.5px solid var(--line); border-radius: var(--r); overflow: hidden; background: #fbfaf5; position: relative; }
    .tlwrap canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
    .vsep { width: 1px; height: 22px; background: var(--line); opacity: .6; margin: 0 2px; }
    .fld { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-side, 13px); }

    /* ── 순서 · 대화 ── */
    textarea.seq { width: 100%; height: 118px; resize: vertical; background: #fff; border: 1.5px solid var(--line); border-radius: var(--r);
                   padding: 6px 8px; font: 13px/1.5 Menlo, Consolas, monospace; }
    .log { font-family: Menlo, Consolas, monospace; font-size: 13px; background: var(--term); color: #e6e8ec; border-radius: var(--r);
           padding: 8px 10px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; min-height: 130px; }
    .log div { line-height: 1.5; }
    .log .tm { color: #6f7682; margin-right: 6px; }
    .log .tx { color: #8cc8ff; } .log .rx { color: #b8f0b0; } .log .sys { color: #a7adb8; font-style: italic; } .log .err { color: #f49a8c; }
    .send { display: flex; gap: 6px; }
    .send .inp { flex: 1 1 auto; height: 40px; font-family: Menlo, Consolas, monospace; }
    input[type=file] { display: none; }

    @media (max-width: 1439px) { .panel.arm { flex-basis: 280px; } .panel.side { flex-basis: 300px; } }
    @media (max-width: 1023px) { .main-container { flex-direction: column; } .panel.arm, .panel.view, .panel.side { flex: 0 0 auto; }
                                 .panel, .panel-body { overflow: visible; } body { overflow: auto; height: auto; }
                                 .view { height: 360px; flex: 0 0 auto; } .log { height: 40vh; } }
  </style>
  <link rel="stylesheet" href="/lib/ui.css">
  <link rel="stylesheet" href="/lib/shell.css">
</head>
<body data-density="explore">
  <div class="titlebar">
    <a class="tb-brand" href="/" title="인터넷 없이 내 컴퓨터에서 실행돼요"><img src="/assets/pibo-logo.png" alt=""><b>edge-lab</b></a>
    <span class="tb-sep"></span><span class="tb-app" id="txtTitle"></span>
    <div class="h-tools"><button id="langButton" title="한국어 / English">EN</button></div>
  </div>
  <div class="shell-body"><div class="workbench">

    <div class="linkbar">
      <span class="state" id="state"><i></i><span id="stateText"></span></span>
      <span class="lamp" id="lampBusy"><i></i><span id="lampBusyTxt"></span></span>
      <span class="warn" id="linkWarn" hidden></span>
      <span class="hint" id="linkHint"></span>
      <label class="chk" data-i18n-title="hdr.safeTitle"><input type="checkbox" id="safeStart" checked><span data-i18n="hdr.safe"></span></label>
      <button class="btn sm" type="button" id="btnBoard" data-ic="chip" data-i18n="hdr.board"></button>
      <button class="btn stop" type="button" id="btnStop" data-ic="hand" data-i18n="hdr.stop"></button>
    </div>

    <div class="main-container">

      <!-- 1 로봇팔 -->
      <div class="panel arm">
        <div class="panel-head"><span class="q"><span class="qnum">1</span><span class="qtext" data-i18n="arm.title"></span></span>
          <label class="chk" style="margin-left:auto" data-i18n-title="arm.liveTitle"><input type="checkbox" id="liveArm" checked><span data-i18n="arm.live"></span></label></div>
        <div class="panel-body">
          <div id="strips"></div>
          <div class="hint" data-i18n="arm.note"></div>
          <button class="btn primary" type="button" id="btnArmMove" data-ic="right" data-i18n="arm.move"></button>
          <div class="grid2">
            <button class="btn sm" type="button" id="btnArmHome" data-ic="home" data-i18n="arm.home"></button>
            <button class="btn sm" type="button" id="btnReset" data-ic="reset" data-i18n="arm.reset" data-i18n-title="arm.resetTitle"></button>
            <button class="btn sm" type="button" id="btnSlowHome" data-ic="gauge" data-i18n="arm.slowHome" data-i18n-title="arm.slowHomeTitle"></button>
            <span></span>
            <button class="btn sm" type="button" id="btnOff" data-ic="moon" data-i18n="arm.off"></button>
            <button class="btn sm" type="button" id="btnOn" data-ic="bolt" data-i18n="arm.on"></button>
          </div>

          <div class="sec">
            <div class="st" data-ic="gauge" data-i18n="spd.label"></div>
            <div class="row">
              <select id="spdJoint"><option value="1">ch1</option><option value="2">ch2</option><option value="3">ch3</option><option value="4">ch4</option><option value="5">ch6</option></select>
              <input class="inp num" id="spdVal" type="number" min="1" max="720" value="60"><span class="hint" data-i18n="spd.unit"></span>
              <button class="btn sm" type="button" id="btnSpeed" data-i18n="spd.send"></button>
            </div>
            <label class="chk"><input type="checkbox" id="easing" checked><span data-i18n="spd.ease"></span></label>
          </div>

          <div class="sec">
            <div class="st" data-ic="star" data-i18n="pose.title"></div>
            <div class="row">
              <input class="inp grow" id="presetName" type="text" maxlength="20" data-i18n-ph="pose.ph">
              <button class="btn sm" type="button" id="btnPresetSave" data-ic="plus" data-i18n="pose.save"></button>
            </div>
            <div class="chips" id="presets"></div>
            <div class="hint" data-i18n="pose.note"></div>
            <div class="row">
              <button class="btn sm" type="button" id="btnPoseFileSave" data-ic="download" data-i18n="pose.fileSave"></button>
              <button class="btn sm" type="button" id="btnPoseFileLoad" data-ic="upload" data-i18n="pose.fileLoad"></button>
              <input type="file" id="poseFileIn" accept=".json">
            </div>
          </div>

          <div class="sec">
            <div class="row">
              <button class="btn sm" type="button" id="btnCalib" data-ic="cross" data-i18n="cal.btn"></button>
              <button class="btn sm danger" type="button" id="btnCalibReset" data-ic="eraser" data-i18n="cal.reset" hidden></button>
              <span class="hint mono" id="calibTxt"></span>
            </div>
            <div class="hint" id="calibHelp" data-i18n="cal.help" hidden></div>
          </div>
        </div>
      </div>

      <!-- 2 3D 공장 + 타임라인 -->
      <div class="panel view">
        <div class="panel-head"><span class="q"><span class="qnum">2</span><span class="qtext" data-i18n="view.title"></span></span>
          <span class="meta" data-i18n="view.echo"></span></div>
        <div class="panel-body">
          <div class="view grow" id="sceneBox">
            <canvas id="sim"></canvas>
            <span class="simtag" id="simTag"></span>
            <div class="hud"><span data-i18n="view.hud"></span><span class="fps" id="fpsTxt">FPS --</span></div>
            <div class="tip" id="tip"></div>
          </div>
          <div class="row">
            <span class="seg" id="camSeg">
              <button type="button" data-cam="all" data-i18n="view.all"></button>
              <button type="button" data-cam="arm" data-i18n="view.arm"></button>
              <button type="button" data-cam="belt" data-i18n="view.belt"></button>
              <button type="button" data-cam="flag" data-i18n="view.flag"></button>
              <button type="button" data-cam="top" data-i18n="view.top"></button>
            </span>
            <button class="btn sm on" type="button" id="btnGrid" data-ic="grid" data-i18n="view.grid"></button>
            <button class="btn sm" type="button" id="btnWire" data-ic="cube" data-i18n="view.wire"></button>
            <button class="btn sm" type="button" id="btnAxes" data-ic="axes" data-i18n="view.axes"></button>
            <button class="btn sm" type="button" id="btnShot" data-ic="camera" data-i18n="view.shot"></button>
            <label class="zoom" data-i18n-title="view.zoom"><span data-ic="zoom"></span>
              <input type="range" id="camZoom" min="0.15" max="10" step="0.05" value="1.5"><span class="mono" id="camZoomTxt">1.5x</span></label>
          </div>

          <div class="sec">
            <div class="st" data-ic="film"><span data-i18n="tl.title"></span><span class="hint" id="tlKfCount" style="margin-left:auto;font-weight:400"></span></div>
            <div class="row">
              <button class="btn sm ic" type="button" id="tlToStart" data-ic="first" data-i18n-title="tl.toStart"></button>
              <button class="btn sm ic" type="button" id="tlPlay" data-i18n-title="tl.play"></button>
              <button class="btn sm ic" type="button" id="tlStop" data-ic="square" data-i18n-title="tl.stop"></button>
              <span class="tltime" id="tlTime">0.00s</span>
              <span class="vsep"></span>
              <button class="btn sm primary" type="button" id="tlAdd" data-ic="plus" data-i18n="tl.add"></button>
              <button class="btn sm danger" type="button" id="tlDel" data-ic="trash" data-i18n="tl.del"></button>
              <span class="vsep"></span>
              <label class="fld"><span data-i18n="tl.len"></span><input class="inp num" id="tlDur" type="number" value="30" min="1" max="120" step="1" style="width:56px">s</label>
              <label class="fld"><span data-i18n="tl.speed"></span><select id="tlSpeed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
              <button class="btn sm" type="button" id="tlLoop" data-ic="repeat" data-i18n="tl.loop"></button>
              <span class="vsep"></span>
              <button class="btn sm" type="button" id="tlSave" data-ic="download" data-i18n="tl.save"></button>
              <button class="btn sm" type="button" id="tlLoad" data-ic="upload" data-i18n="tl.load"></button>
              <input type="file" id="motionFileIn" accept=".txt,.json">
            </div>
            <div class="tlwrap" id="tlWrap"><canvas id="tlCanvas"></canvas></div>
            <div class="hint" data-i18n="tl.hint"></div>
          </div>
        </div>
      </div>

      <!-- 3 컨베이어 · 순서 · 대화 -->
      <div class="panel side">
        <div class="panel-head"><span class="q"><span class="qnum">3</span><span class="qtext" data-i18n="side.title"></span></span></div>
        <div class="panel-body">
          <div class="st" data-ic="factory" data-i18n="conv.title"></div>
          <div class="strip flat"><label for="roller" data-i18n="conv.roll"></label><input type="range" id="roller" min="15" max="40" value="30">
            <span class="rd"><input class="inp" id="rollerVal" type="number" min="15" max="40" value="30"><span class="sub" id="u5"></span></span></div>
          <div class="row">
            <button class="btn sm primary grow" type="button" id="btnBeltBack" data-ic="left" data-i18n="conv.back"></button>
            <button class="btn sm" type="button" id="btnRollerStop" data-ic="square" data-i18n="conv.stop"></button>
            <button class="btn sm primary grow" type="button" id="btnBeltFwd" data-ic="right" data-i18n="conv.fwd"></button>
          </div>
          <div class="hint" data-i18n="conv.rollNote"></div>
          <div class="strip flat"><label for="flag" data-i18n="conv.flag"></label><input type="range" id="flag" min="-90" max="90" value="0">
            <span class="rd"><input class="inp" id="flagVal" type="number" min="-90" max="90" value="0"><span class="sub" id="u6"></span></span></div>
          <div class="hint" data-i18n="conv.flagNote"></div>

          <div class="sec">
            <div class="st" data-ic="list"><span data-i18n="seq.title"></span>
              <button class="btn sm" type="button" id="btnSeqExample" data-ic="bulb" data-i18n="seq.example"></button></div>
            <textarea class="seq" id="seq" spellcheck="false"></textarea>
            <div class="row">
              <button class="btn sm primary" type="button" id="btnSeqRun" data-ic="play" data-i18n="seq.run"></button>
              <button class="btn sm" type="button" id="btnSeqStop" data-ic="square" data-i18n="seq.stop" disabled></button>
              <label class="chk"><input type="checkbox" id="seqLoop"><span data-i18n="seq.loop"></span></label>
            </div>
            <div class="hint" data-i18n="seq.help"></div>
          </div>

          <div class="sec grow" style="min-height:190px">
            <div class="st" data-ic="term"><span data-i18n="term.title"></span>
              <button class="btn sm" type="button" id="btnPos" data-ic="pin" data-i18n="term.pos"></button>
              <button class="btn sm" type="button" id="btnClear" data-ic="eraser" data-i18n="term.clear" style="margin-left:0"></button></div>
            <div class="log grow" id="term" style="flex:1 1 auto"></div>
            <div class="send">
              <input class="inp" id="cmd" type="text" autocomplete="off" spellcheck="false" placeholder="#pos!  #m:90,45,120,90!">
              <button class="btn primary" type="button" id="btnSend" data-ic="send" data-i18n="term.send"></button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div></div>

  <script src="/lib/factory/three.min.js"></script>
  <script src="/lib/factory/scene.js"></script>
  <script src="/lib/factory/link.js"></script>
  <script src="/lib/factory/page.js"></script>
  <script src="/lib/shell.js"></script>
  <script src="/lib/usage.js" data-page="factory"></script>
  <i id="el-built" hidden></i>
</body>
</html>
