<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>edge-lab — 소리 가르치기</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link href="/fonts/fonts.css" rel="stylesheet">
  <script>
    try { if (localStorage.getItem("vapi-hc") === "1")
            document.documentElement.classList.add("hc"); } catch (e) {}
  </script>
  <link rel="stylesheet" href="/lib/tokens.css">
  <script src="/lib/embed.js"></script>
  <link rel="expect" href="#el-built" blocking="render">
  <style>
    /* 소리 가르치기 — 내가 정한 소리(박수·휘파람·조용함·내 이름…)를 마이크로 들려주고 AI 에게 가르친다.
     *
     * AI 는 소리를 그대로 듣지 않는다. YAMNet 이 1초 조각을 숫자 521개로 바꾸고, 작은 신경망이
     * 그 숫자와 내가 붙인 이름을 짝지어 배운다. 오른쪽 "AI 귀" 가 그 숫자를 막대로 보여 준다.
     * YAMNet(wasm·모델)도 학습(순수 JS)도 전부 이 컴퓨터 안에서 돈다 — 서버 AI 가 준비되기 전에도 된다.
     *
     * themakerrobot/teach-lab 의 소리 흐름(MIT)을 옮겨 이 저장소 화면에 맞게 다시 짰다 (lib/sound/).
     */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --go: #3a9a55; --track: #ece5d6; }
    html.hc { --go: #237a3b; --track: #ddd3bf; }
    body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; color: var(--ink); background: var(--paper);
           font-family: "Gowun Dodum", "Apple SD Gothic Neo", system-ui, sans-serif; line-height: 1.5;
           padding: var(--sp-2, 8px); gap: var(--sp-2, 8px); }
    button, input, select { font-family: inherit; color: var(--ink); }
    .btn { border: 1.5px solid var(--line-d); background: #fff; font-weight: 600; padding: 7px 13px; border-radius: var(--r); cursor: pointer;
           font-size: .92rem; min-height: 40px; display: inline-flex; align-items: center; gap: 6px; }
    .btn.primary { background: var(--pen-blue); border-color: var(--pen-blue-d); color: #fff; }
    .btn.on { background: var(--cyan-bg); border-color: var(--cyan); color: var(--cyan-d); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.wide { width: 100%; justify-content: center; min-height: var(--tap, 48px); font-size: 1rem; }
    .btn.sm { min-height: 32px; padding: 3px 9px; font-size: var(--fs-side, 13px); }
    .btn svg { width: 18px; height: 18px; flex: 0 0 auto; }
    .btn.armed, .icon.armed { background: var(--pen-red); border-color: var(--pen-red); color: #fff; }
    .ph-tools { margin-left: auto; display: flex; gap: 6px; }
    .ph-tools .btn { display: inline-flex; align-items: center; gap: 5px; }
    .ph-tools .btn svg { width: 16px; height: 16px; }

    .panel.cls-p { flex: 1 1 auto; } .panel.train-p { flex: 0 0 290px; } .panel.test-p { flex: 0 0 340px; }
    .st { font-weight: 700; font-size: var(--fs-head, 14px); color: var(--cyan-d); }
    .hint { font-size: var(--fs-side, 13px); color: var(--ink-2); }
    .sec { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; border-top: 1.5px dashed var(--line); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .num { font-family: Menlo, Consolas, monospace; font-size: var(--fs-mono, 13px); }

    /* ① 종류 카드 */
    #classes { display: flex; flex-direction: column; gap: 8px; }
    .cls { --c: #6b7f8e; border: 1.5px solid var(--line); border-left: 6px solid var(--c); border-radius: var(--r); background: #fff;
           padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
    .cls.on { border-color: var(--c); box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 30%, transparent); }
    .cls-top { display: flex; align-items: center; gap: 8px; }
    .dot { width: 26px; height: 26px; border-radius: 50%; border: 3px solid #fff; background: var(--c); box-shadow: 0 0 0 1.5px var(--line-d);
           cursor: pointer; flex: 0 0 auto; position: relative; }
    .dot::after { content: ""; position: absolute; inset: -8px; }        /* 누르는 영역 40px */
    .cname { flex: 1 1 auto; min-width: 0; height: 36px; border: 1.5px solid transparent; border-radius: var(--r); padding: 0 8px;
             font-size: var(--fs-name, 16px); font-weight: 700; background: transparent; }
    .cname:hover { border-color: var(--line); } .cname:focus { border-color: var(--cyan); background: #fff; outline: none; }
    .bgtag { font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--hover-bg); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
    .cnt { color: var(--cyan-d); font-weight: 700; white-space: nowrap; }
    .cnt.few { color: var(--pen-red); }
    .icon { width: 36px; height: 36px; border: 1.5px solid transparent; border-radius: var(--r); background: none; cursor: pointer;
            display: grid; place-items: center; color: var(--ink-2); flex: 0 0 auto; }
    .icon:hover { border-color: var(--line); background: var(--hover-bg); }
    .icon svg { width: 18px; height: 18px; }
    .cls-row { display: flex; gap: 10px; align-items: stretch; }
    .recb { --lv: 0px; flex: 0 0 132px; min-height: 64px; border: 0; border-radius: 10px; background: var(--c); color: #fff; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px;
            font-size: .88rem; font-weight: 700; line-height: 1.25; text-align: center; touch-action: none; user-select: none; -webkit-user-select: none; }
    .recb svg { width: 24px; height: 24px; }
    .recb:disabled { opacity: .4; cursor: not-allowed; }
    .recb.on { background: #fff; color: var(--c); box-shadow: inset 0 0 0 4px var(--c), 0 0 0 var(--lv) color-mix(in srgb, var(--c) 28%, transparent); }
    .recb:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
    .smps { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 4px; max-height: 92px; overflow-y: auto;
            padding: 2px; border-radius: var(--r); background: var(--paper); }
    .smps .empty { align-self: center; padding: 0 6px; line-height: 40px; }
    .smp { position: relative; width: 42px; height: 30px; padding: 0; border: 1.5px solid var(--line); border-radius: 4px; background: #fff; cursor: pointer; }
    .smp canvas { width: 100%; height: 100%; display: block; }
    .smp.on { border-color: var(--ink); box-shadow: 0 0 0 2px var(--cyan); }
    .smp .sx { display: none; position: absolute; top: -7px; right: -7px; width: 20px; height: 20px; border-radius: 50%; background: var(--pen-red); color: #fff;
               place-items: center; box-shadow: 0 0 0 2px #fff; }
    .smp .sx svg { width: 11px; height: 11px; }
    .smp.on .sx { display: grid; }
    .addrow { display: flex; align-items: center; gap: 10px; }

    /* 막대 */
    .bar { display: flex; flex-direction: column; gap: 2px; }
    .bar .bl { display: flex; justify-content: space-between; gap: 6px; font-size: var(--fs-side, 13px); }
    .bar .bl span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar .bt { height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; }
    .bar .bf { height: 100%; background: var(--pen-blue); transition: width .12s; }
    .bar.top .bl { font-weight: 700; }
    .bar.top .bt { height: 14px; border-radius: 7px; }
    .bar small { color: var(--ink-2); font-size: 12px; }
    .rank { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--pen-red); color: #fff;
            font-size: 11px; margin-right: 6px; vertical-align: 1px; }
    .top3 .bf { background: var(--pen-red); opacity: .8; }

    /* ② 배우기 */
    .prg .lb { display: flex; justify-content: space-between; font-size: var(--fs-side, 13px); font-weight: 600; }
    .prg .tr { height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; }
    .prg .fl { height: 100%; width: 0; background: var(--go); }
    #chart { width: 100%; height: 96px; display: block; border: 1.5px solid var(--line); border-radius: var(--r); background: #fff; }
    .legend { display: flex; gap: 14px; font-size: var(--fs-side, 13px); }
    .legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; }
    .warn { font-size: var(--fs-side, 13px); padding: 6px 8px; border-radius: var(--r); background: #fbeee4; color: #7a2e12;
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .stale { font-size: var(--fs-side, 13px); padding: 6px 8px; border-radius: var(--r); background: #fff4d6; color: #6b4a00; }
    #perCls { display: flex; flex-direction: column; gap: 5px; }
    ul.tips { padding-left: 18px; font-size: var(--fs-side, 13px); color: var(--ink-2); display: flex; flex-direction: column; gap: 3px; }

    /* ③ 해 보기 */
    .answer { --c: #9a8f7d; display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 8px 12px; border-radius: 10px;
              border: 2px solid var(--c); background: color-mix(in srgb, var(--c) 10%, #fff); }
    .answer i { width: 22px; height: 22px; border-radius: 50%; background: var(--c); flex: 0 0 auto; }
    .answer b { flex: 1; font-size: 1.45rem; line-height: 1.2; overflow-wrap: anywhere; }
    .answer .num { font-size: 1rem; font-weight: 700; color: var(--ink-2); }
    .answer.unsure b { color: var(--ink-2); }
    .answer.idle { border-style: dashed; border-color: var(--line); background: #fff; }
    .answer.idle span { font-size: var(--fs-side, 13px); color: var(--ink-2); }
    .probwrap { position: relative; display: flex; flex-direction: column; gap: 5px; }
    #probs { display: flex; flex-direction: column; gap: 5px; }
    #thrMark { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dashed var(--pen-red); opacity: .55; pointer-events: none; }
    .thr { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; font-size: var(--fs-side, 13px); }
    .thr input { grid-column: 1 / -1; width: 100%; accent-color: var(--pen-red); height: 24px; }
    .earhead { display: flex; align-items: center; gap: 8px; }
    .earhead .st { flex: 1; }
    .level { width: 80px; height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
    .level i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #3a9a55, #e0a030, #d9412b); }
    #strip { width: 100%; height: 76px; display: block; border: 1.5px solid var(--line); border-radius: var(--r); background: #fff; }
    #fill { display: flex; align-items: center; gap: 8px; font-size: var(--fs-side, 13px); color: var(--ink-2); }
    #fill[hidden] { display: none; }
    #fill .tr { flex: 1; height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
    #fill .tr i { display: block; height: 100%; width: 0; background: var(--cyan); }
    #top3 { display: flex; flex-direction: column; gap: 5px; }

    #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px;
             border-radius: 10px; font-size: .95rem; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 5; max-width: 90vw; }
    #toast.on { opacity: 1; }
    @media (prefers-reduced-motion: reduce) { .bar .bf { transition: none; } }

    @media (max-width: 1439px) { .panel.train-p { flex-basis: 270px; } .panel.test-p { flex-basis: 320px; } }
    @media (max-width: 1023px) { .main-container { flex-direction: column; } .panel.cls-p, .panel.train-p, .panel.test-p { flex: 0 0 auto; }
                                 .panel, .panel-body { overflow: visible; } body { overflow: auto; height: auto; } }
    @media (max-width: 639px) { .cls-row { flex-direction: column; } .recb { flex-basis: auto; } .ph-tools .btn span { display: none; } }
  </style>
  <link rel="stylesheet" href="/lib/ui.css">
  <link rel="stylesheet" href="/lib/shell.css">
</head>
<body data-density="explore">
  <div class="titlebar">
    <a class="tb-brand" href="/" title="인터넷 없이 내 컴퓨터에서 실행돼요"><img src="/assets/pibo-logo.png" alt=""><b>edge-lab</b></a>
    <span class="tb-sep"></span><span class="tb-app" id="txtTitle"></span>
    <div class="h-tools"><button id="langButton" title="한국어 / English">EN</button></div>
  </div>
  <div class="shell-body"><div class="workbench"><div class="main-container">

    <div class="panel cls-p">
      <div class="panel-head">
        <span class="q"><span class="qnum">1</span><span class="qtext" id="txtQ1"></span></span>
        <div class="ph-tools">
          <button class="btn" id="newBtn" type="button"></button>
          <button class="btn" id="expBtn" type="button"></button>
          <button class="btn" id="impBtn" type="button"></button>
          <input type="file" id="impFile" accept=".json,application/json" hidden>
        </div>
      </div>
      <div class="panel-body">
        <div class="hint" id="q1hint"></div>
        <div id="classes"></div>
        <div class="addrow"><button class="btn" id="addCls" type="button"></button></div>
      </div>
    </div>

    <div class="panel train-p">
      <div class="panel-head"><span class="q"><span class="qnum">2</span><span class="qtext" id="txtQ2"></span></span></div>
      <div class="panel-body">
        <button class="btn primary wide" id="trainBtn" type="button" disabled></button>
        <div class="hint" id="trainWhy"></div>
        <div id="warns"></div>
        <div class="prg">
          <div class="lb"><span id="prgLabel"></span><span class="num" id="prgPct"></span></div>
          <div class="tr"><div class="fl" id="prgFill"></div></div>
        </div>
        <canvas id="chart"></canvas>
        <div class="legend"><span><i style="background:var(--pen-blue)"></i><span id="txtAcc"></span></span><span><i style="background:var(--pen-red)"></i><span id="txtLoss"></span></span></div>
        <div class="stale" id="stale" hidden></div>
        <div class="sec" id="result" hidden>
          <div class="hint" id="learnedN"></div>
          <div class="st" id="txtPer"></div>
          <div id="perCls"></div>
          <div class="hint" id="confused"></div>
        </div>
        <div class="sec">
          <div class="st" id="tipsT"></div>
          <ul class="tips" id="tips"></ul>
        </div>
      </div>
    </div>

    <div class="panel test-p">
      <div class="panel-head"><span class="q"><span class="qnum">3</span><span class="qtext" id="txtQ3"></span></span></div>
      <div class="panel-body">
        <button class="btn primary wide" id="liveBtn" type="button"></button>
        <div class="answer idle" id="answer"></div>
        <div class="probwrap"><div id="probs"></div><i id="thrMark"></i></div>
        <div class="thr"><span id="thrT"></span><b class="num" id="thrV"></b><input type="range" id="thr" min="30" max="95" step="5"></div>
        <div class="sec">
          <div class="earhead"><span class="st" id="earT"></span><div class="level"><i id="lvl"></i></div></div>
          <canvas id="strip"></canvas>
          <div id="fill" hidden><span id="fillT"></span><div class="tr"><i id="fillBar"></i></div></div>
          <div class="hint" id="earNote"></div>
        </div>
        <div class="sec">
          <div class="st" id="topT"></div>
          <div id="top3"></div>
          <div class="hint" id="topHint"></div>
        </div>
      </div>
    </div>

  </div></div></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/lib/sound/page.js" blocking="render"></script>
  <script src="/lib/shell.js"></script>
  <script src="/lib/usage.js" data-page="sound"></script>
  <i id="el-built" hidden></i>
</body>
</html>
