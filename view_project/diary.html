  <style>
    /* 일기 — 하루에 한 장. 기분·날씨·한 일을 누르기만 해도 일기가 된다 — 글은 쓰고 싶은 날만.
     * 쓰는 대로 저절로 남는다(이 컴퓨터의 localStorage "el-diary", 날짜가 열쇠).
     *
     * 기분과 날씨는 그림 글자(이모지) 대신 SVG 로 그렸다. 교실 컴퓨터마다 이모지 글꼴이
     * 달라서 네모로 나오거나 흑백으로 나온 적이 있다.
     * [읽어 주기] 는 이 컴퓨터의 목소리(/speech/tts)를 쓴다 — 준비되기 전에는 알려만 준다.
     */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --sun: #d9483b; --sat: #2f6fb0; --good: #3a9a55; }
    html.hc { --sun: #a3291d; --sat: #1d4f85; }
    body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; color: var(--ink); background: var(--paper);
           font-family: "Gowun Dodum", "Apple SD Gothic Neo", system-ui, sans-serif; line-height: 1.5;
           padding: var(--sp-2, 8px); gap: var(--sp-2, 8px); }
    button, input, textarea { font-family: inherit; color: var(--ink); }
    .btn { border: 1.5px solid var(--line-d); background: #fff; font-weight: 600; padding: 4px 12px; border-radius: var(--r); cursor: pointer;
           font-size: .9rem; min-height: 32px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; }
    .btn.primary { background: var(--pen-blue); border-color: var(--pen-blue-d); color: #fff; }
    .btn.danger { color: var(--pen-red); border-color: var(--pen-red); }
    .btn.on { background: var(--cyan-bg); border-color: var(--cyan); color: var(--cyan-d); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn svg { width: 16px; height: 16px; flex: 0 0 auto; }
    .btn.sq { width: 36px; padding: 0; }
    .btn.wide { width: 100%; min-height: 40px; }

    .panel.cal { flex: 0 0 372px; } .panel.edit { flex: 1 1 auto; }
    .st { font-weight: 700; font-size: var(--fs-head, 14px); color: var(--cyan-d); }
    .hint { font-size: var(--fs-side, 13px); color: var(--ink-2); }
    .sec { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; border-top: 1.5px dashed var(--line); }
    .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .num { font-family: Menlo, Consolas, monospace; font-size: var(--fs-mono, 13px); }

    /* 달력 */
    .mhead { display: flex; align-items: center; gap: 6px; }
    .mhead b { flex: 1; text-align: center; font-size: 1.1rem; }
    .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .grid .wd { text-align: center; font-size: var(--fs-side, 13px); font-weight: 700; color: var(--ink-2); }
    .grid .wd.sun, .day.sun .dn { color: var(--sun); } .grid .wd.sat, .day.sat .dn { color: var(--sat); }
    .day { position: relative; height: 50px; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; padding: 2px 0 0;
           display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .day .dn { font-size: .88rem; font-weight: 700; line-height: 1.2; }
    .day svg { width: 24px; height: 24px; }
    .day .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--cyan); margin-top: 6px; }
    .day:hover { background: var(--hover-bg); }
    .day.pad { visibility: hidden; }
    .day.future { opacity: .5; }
    .day.today { border: 2.5px solid var(--pen-red); }
    .day.today .dn { color: #fff; background: var(--pen-red); border-radius: 9px; padding: 0 6px; }
    .day.sel { background: var(--cyan-bg); border-color: var(--cyan); box-shadow: inset 0 0 0 1.5px var(--cyan); }
    .day.today.sel { border-color: var(--pen-red); }

    /* 이번 달 */
    .big { font-size: 1.05rem; } .big b { font-size: 1.35rem; color: var(--cyan-d); margin: 0 2px; }
    .bars { display: flex; flex-direction: column; gap: 4px; }
    .bar { display: grid; grid-template-columns: 24px 82px 1fr 26px; gap: 6px; align-items: center; font-size: var(--fs-side, 13px); }
    .bar svg { width: 22px; height: 22px; }
    .bar .bt { height: 12px; border-radius: 6px; background: #ece5d6; overflow: hidden; }
    .bar .bf { height: 100%; border-radius: 6px; transition: width .2s; }
    .bar .n { text-align: right; }

    /* 쓰기 */
    .pickers { display: grid; grid-template-columns: 1.1fr 1fr; gap: 12px; }
    .pick { display: flex; gap: 6px; }
    .pick button { flex: 1 1 0; min-width: 0; min-height: 76px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; cursor: pointer;
                   display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px 2px; }
    .pick button svg { width: 38px; height: 38px; transition: transform .12s; }
    .pick button span { font-size: var(--fs-side, 13px); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .pick button:hover { background: var(--hover-bg); }
    .pick button.on { border-color: var(--cyan); background: var(--cyan-bg); box-shadow: inset 0 0 0 1.5px var(--cyan); }
    .pick button.on svg { transform: scale(1.12); }
    .pick.dim button:not(.on) svg { opacity: .55; }

    .stickers { display: flex; flex-wrap: wrap; gap: 8px; }
    .stk { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 4px 14px 4px 10px; border-radius: 20px; cursor: pointer;
           border: 1.5px dashed var(--line); background: #fff; font-size: .95rem; font-weight: 600; transition: transform .1s; }
    .stk i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); border: 1.5px solid rgba(0,0,0,.18); flex: 0 0 auto; }
    .stk svg { width: 14px; height: 14px; display: none; }
    .stk.on { background: var(--c); border: 1.5px solid rgba(42,38,32,.45); box-shadow: 0 2px 0 rgba(42,38,32,.25); }
    .stk.on i { display: none; } .stk.on svg { display: block; }
    .stk.on:nth-child(odd) { transform: rotate(-2deg); } .stk.on:nth-child(even) { transform: rotate(1.5deg); }
    .stk:hover { border-style: solid; }

    .ttl { height: 44px; border: 1.5px solid var(--line); border-radius: var(--r); padding: 0 12px; background: #fff; font-size: 1.05rem; outline: none; width: 100%; }
    .ttl:focus, textarea:focus { border-color: var(--cyan); }
    textarea { width: 100%; resize: none; border: 1.5px solid var(--line); border-radius: var(--r); padding: 12px 14px; background: #fff; font-size: 1.05rem;
               line-height: 1.8; outline: none; min-height: 120px;
               /* 공책 줄 — 한 줄 높이(1.8em)마다 */
               background-image: linear-gradient(transparent calc(1.8em - 1px), #eadfca calc(1.8em - 1px)); background-size: 100% 1.8em;
               background-position: 0 12px; background-attachment: local; }
    .meta { display: flex; gap: 12px; font-size: var(--fs-side, 13px); color: var(--ink-2); }
    .meta .sp { flex: 1; }
    .future-note { padding: 18px; border-radius: 10px; background: #f4efe4; text-align: center; font-size: 1.05rem; }
    .form[hidden] { display: none; }
    .form { display: flex; flex-direction: column; gap: 10px; }
    .form.grow { min-height: 0; }
    .form > .grow { flex: 1 1 auto; min-height: 0; }

    #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px;
             border-radius: 10px; font-size: .95rem; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 5; }
    #toast.on { opacity: 1; }

    @media (max-width: 1439px) { .panel.cal { flex-basis: 352px; } }
    @media (max-width: 1023px) { .main-container { flex-direction: column; } .panel.cal, .panel.edit { flex: 0 0 auto; }
                                 .panel, .panel-body { overflow: visible; } body { overflow: auto; height: auto; }
                                 textarea { height: 40vh; } .pickers { grid-template-columns: 1fr; } }
  </style>

    </div>

  </div></div></div>

    var SVG = function (d) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + "</svg>"; };
    var IC = {
      prev: SVG('<path d="M15 5l-7 7 7 7"/>'), next: SVG('<path d="M9 5l7 7-7 7"/>'),
      pen: SVG('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>'),
      say: SVG('<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>'),
      stop: SVG('<rect x="6.5" y="6.5" width="11" height="11" rx="1.5" fill="currentColor"/>'),
      trash: SVG('<path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/>'),
      down: SVG('<path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/>'),
      check: SVG('<path d="M5 12.5l4.5 4.5L19 7.5"/>')
    };

    /* ───────── 저장 ───────── */
    var KEY = "el-diary";
    var data = {};
    try { data = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) {}
    if (typeof data !== "object" || Array.isArray(data)) data = {};
    var todayK = keyOf(new Date());
    var sel = todayK, view = dateOf(todayK); view.setDate(1);
    var timer = 0, dirty = false;

    function blank(e) { return !e || (!e.mood && !e.weather && !(e.did && e.did.length) && !(e.title || "").trim() && !(e.text || "").trim()); }
    function when(ts) { var d = new Date(ts); return p2(d.getHours()) + ":" + p2(d.getMinutes()); }
    function store() {
      clearTimeout(timer);
      if (!dirty) return;
      dirty = false;
      if (blank(data[sel])) delete data[sel];                               // 다 지운 날은 달력에 표시가 남지 않게 뺀다
      try { localStorage.setItem(KEY, JSON.stringify(data)); $("saved").textContent = data[sel] ? t("saved").replace("{t}", when(Date.now())) : ""; }
      catch (e) { $("saved").textContent = t("full"); }
      paintCal(); paintStats();
    }
    function later() { dirty = true; $("saved").textContent = t("saving"); clearTimeout(timer); timer = setTimeout(store, 500); }
    function entry() {                                                      // 고른 날의 일기 — 처음 손대는 순간 만든다
      if (!data[sel]) { data[sel] = { mood: "", weather: "", did: [], title: "", text: "", at: Date.now() }; if (window.vapiStat) vapiStat("diary_new"); }
      return data[sel];
    }
    function change(fn) { var e = entry(); fn(e); e.at = Date.now(); later(); paintForm(true); }

    /* ───────── 달력 ───────── */
    function paintCal() {
      var y = view.getFullYear(), m = view.getMonth();
      $("mLabel").textContent = fmt(t("month"), { y: y, m: m + 1, M: monthName(m) });
      var h = t("wd").map(function (w, i) { return '<div class="wd' + (i === 0 ? " sun" : i === 6 ? " sat" : "") + '">' + w + "</div>"; }).join("");
      var first = new Date(y, m, 1).getDay(), last = new Date(y, m + 1, 0).getDate();
      for (var i = 0; i < first; i++) h += '<div class="day pad"></div>';
      for (var d = 1; d <= last; d++) {
        var k = y + "-" + p2(m + 1) + "-" + p2(d), e = data[k], wd = (first + d - 1) % 7;
        var cls = "day" + (wd === 0 ? " sun" : wd === 6 ? " sat" : "") + (k === todayK ? " today" : "") + (k === sel ? " sel" : "") + (k > todayK ? " future" : "");
        var mark = e ? (e.mood ? face(e.mood) : '<span class="dot"></span>') : "";
        var tip = e ? (e.title || (e.mood ? t(e.mood) : "")) : "";
        h += '<button type="button" class="' + cls + '" data-k="' + k + '"' + (tip ? ' title="' + esc(tip) + '"' : "") + '><span class="dn">' + d + "</span>" + mark + "</button>";
      }
      $("grid").innerHTML = h;
    }
    function monthKeys() {
      var pre = view.getFullYear() + "-" + p2(view.getMonth() + 1) + "-";
      return Object.keys(data).filter(function (k) { return k.indexOf(pre) === 0 && !blank(data[k]); }).sort();
    }
    function paintStats() {
      var ks = monthKeys(), y = view.getFullYear(), m = view.getMonth();
      var last = new Date(y, m + 1, 0).getDate();
      var isNow = todayK.slice(0, 7) === keyOf(view).slice(0, 7);
      var upto = isNow ? +todayK.slice(8) : last;                           // 이번 달은 오늘까지만 센다
      if (todayK < keyOf(view)) upto = 0;
      $("txtStats").textContent = isNow ? t("stats") : fmt(t("month"), { y: y, m: m + 1, M: monthName(m) });
      $("statDays").innerHTML = fmt(t("days"), { n: ks.length }) + (upto ? '<span class="hint">' + fmt(t("daysOf"), { n: upto }) + "</span>" : "");
      var cnt = {}, max = 1;
      ks.forEach(function (k) { var md = data[k].mood; if (md) { cnt[md] = (cnt[md] || 0) + 1; max = Math.max(max, cnt[md]); } });
      $("bars").innerHTML = MOODS.map(function (md) {
        var n = cnt[md.id] || 0;
        return '<div class="bar" data-mood="' + md.id + '">' + face(md.id) + "<span>" + t(md.id) + '</span><div class="bt"><div class="bf" style="width:' +
               (n / max * 100) + "%;background:" + md.c + '"></div></div><span class="n num">' + n + "</span></div>";
      }).join("");
      /* 이어 쓰기 — 오늘(아직 안 썼으면 어제)부터 거꾸로 하루도 안 빠진 날 수 */
      var d = dateOf(todayK), s = 0;
      if (blank(data[todayK])) d.setDate(d.getDate() - 1);
      while (!blank(data[keyOf(d)])) { s++; d.setDate(d.getDate() - 1); }
      $("streak").textContent = s >= 2 ? fmt(t("streak"), { n: s }) : s === 1 && !blank(data[todayK]) ? t("one") : t("noStreak");
    }

    /* ───────── 쓰기 ───────── */
    $("moods").innerHTML = MOODS.map(function (m) { return '<button type="button" data-v="' + m.id + '" title="' + t(m.id) + '">' + face(m.id) + "<span>" + t(m.id) + "</span></button>"; }).join("");
    $("weathers").innerHTML = WEATHER.map(function (w) { return '<button type="button" data-v="' + w.id + '" title="' + t(w.id) + '">' + sky(w.id) + "<span>" + t(w.id) + "</span></button>"; }).join("");
    $("did").innerHTML = DID.map(function (d) { return '<button type="button" class="stk" data-v="' + d[0] + '" style="--c:' + d[1] + '"><i></i>' + IC.check + t(d[0]) + "</button>"; }).join("");

    function dateLabel(k) {
      var d = dateOf(k);
      return fmt(t("date"), { m: d.getMonth() + 1, d: d.getDate(), w: t(LANG === "en" ? "wd" : "wdl")[d.getDay()], M: LANG === "en" ? t("months")[d.getMonth()].slice(0, 3) : "" }) +
             (k === todayK ? " " + t("todayMark") : "");
    }
    function paintForm(keepText) {
      var e = data[sel] || {}, fut = sel > todayK;
      $("dateLabel").textContent = dateLabel(sel);
      $("future").hidden = !fut; $("form").hidden = fut;
      $("delBtn").disabled = !data[sel]; $("sayBtn").disabled = fut;
      [["moods", e.mood], ["weathers", e.weather]].forEach(function (p) {
        Array.prototype.forEach.call($(p[0]).children, function (b) { b.classList.toggle("on", b.getAttribute("data-v") === p[1]); });
        $(p[0]).classList.toggle("dim", !!p[1]);
      });
      Array.prototype.forEach.call($("did").children, function (b) { b.classList.toggle("on", (e.did || []).indexOf(b.getAttribute("data-v")) >= 0); });
      if (!keepText) { $("title").value = e.title || ""; $("text").value = e.text || ""; }
      $("count").textContent = t("chars").replace("{n}", ($("text").value || "").length);
      if (!keepText) $("saved").textContent = data[sel] && e.at ? t("saved").replace("{t}", when(e.at)) : t("empty");
    }
    function select(k, focus) {
      store(); stopSay();
      sel = k;
      var d = dateOf(k);
      if (d.getFullYear() !== view.getFullYear() || d.getMonth() !== view.getMonth()) { view = new Date(d.getFullYear(), d.getMonth(), 1); paintStats(); }
      paintCal(); paintForm();
      if (focus && sel <= todayK) $("text").focus();
    }

    $("moods").addEventListener("click", function (e) {
      var b = e.target.closest("[data-v]"); if (!b) return;
      var v = b.getAttribute("data-v");
      change(function (en) { en.mood = en.mood === v ? "" : v; });           // 한 번 더 누르면 뺀다
    });
    $("weathers").addEventListener("click", function (e) {
      var b = e.target.closest("[data-v]"); if (!b) return;
      var v = b.getAttribute("data-v");
      change(function (en) { en.weather = en.weather === v ? "" : v; });
    });
    $("did").addEventListener("click", function (e) {
      var b = e.target.closest("[data-v]"); if (!b) return;
      var v = b.getAttribute("data-v");
      change(function (en) { en.did = en.did || []; var i = en.did.indexOf(v); if (i >= 0) en.did.splice(i, 1); else en.did.push(v); });
    });
    $("title").addEventListener("input", function () { var v = this.value; change(function (en) { en.title = v; }); });
    $("text").addEventListener("input", function () { var v = this.value; change(function (en) { en.text = v; }); });
    $("grid").addEventListener("click", function (e) { var b = e.target.closest("[data-k]"); if (b) select(b.getAttribute("data-k")); });
    function moveMonth(n) { store(); view = new Date(view.getFullYear(), view.getMonth() + n, 1); paintCal(); paintStats(); }
    $("prevM").addEventListener("click", function () { moveMonth(-1); });
    $("nextM").addEventListener("click", function () { moveMonth(1); });
    $("todayBtn").addEventListener("click", function () { todayK = keyOf(new Date()); select(todayK, true); });
    $("delBtn").addEventListener("click", function () {
      if (!data[sel] || !confirm(fmt(t("delAsk"), { d: dateLabel(sel) }))) return;
      stopSay(); clearTimeout(timer);
      delete data[sel]; dirty = true; store();
      paintForm(); toast(t("deleted"));
    });

    /* ───────── 파일로 받기 — 윈도우 메모장이 한글을 바로 읽게 BOM · CRLF ───────── */
    $("exportBtn").addEventListener("click", function () {
      store();
      var ks = monthKeys(), y = view.getFullYear(), m = view.getMonth();
      if (!ks.length) { toast(t("expNone")); return; }
      var head = fmt(t("eHead"), { y: y, m: m + 1, M: monthName(m) });
      var out = [head, new Array(head.length * 2 + 1).join("="), ""];
      ks.forEach(function (k) {
        var e = data[k], d = dateOf(k), bits = [];
        out.push(k + " (" + t("wd")[d.getDay()] + ")");
        if (e.mood) bits.push(t("eMood") + ": " + t(e.mood));
        if (e.weather) bits.push(t("eWeather") + ": " + t(e.weather));
        if (bits.length) out.push(bits.join(" · "));
        if (e.did && e.did.length) out.push(t("eDid") + ": " + e.did.map(t).join(", "));
        if ((e.title || "").trim()) out.push(t("eTitle") + ": " + e.title.trim());
        if ((e.text || "").trim()) out.push("", e.text.replace(/\s+$/, ""));
        out.push("", "----------------", "");
      });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob(["﻿" + out.join("\n").replace(/\r?\n/g, "\r\n")], { type: "text/plain;charset=utf-8" }));
      a.download = t("file") + "-" + y + "-" + p2(m + 1) + ".txt";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      if (window.vapiStat) vapiStat("diary_export");
    });

    /* ───────── 읽어 주기 — 이 컴퓨터의 목소리 ───────── */
    var audio = null, asking = false;
    function voice() { try { return localStorage.getItem("vapi-voice") || "F1"; } catch (e) { return "F1"; } }   // 설정에서 고른 목소리
    function paintSay() { $("sayBtn").innerHTML = (audio ? IC.stop : IC.say) + "<span>" + (audio ? t("sayStop") : t("say")) + "</span>"; }
    function stopSay() { if (audio) { try { audio.pause(); } catch (e) {} audio = null; } paintSay(); }
    $("sayBtn").addEventListener("click", function () {
      if (audio) { stopSay(); return; }
      if (asking) return;
      var e = data[sel] || {};
      var text = [(e.title || "").trim(), (e.text || "").trim()].filter(Boolean).join(". ");
      if (!text) { toast(t("nothingToRead")); return; }
      asking = true; $("sayBtn").disabled = true;
      fetch("/speech/tts", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text.slice(0, 1500), voice: voice(), lang: LANG, speed: 1.0 }) }).then(function (r) {
        if (r.status === 503) throw new Error("wait");
        if (!r.ok || (r.headers.get("Content-Type") || "").indexOf("audio") < 0) throw new Error("tts");
        return r.blob();
      }).then(function (blob) {
        var url = URL.createObjectURL(blob), a = new Audio(url);
        audio = a; paintSay();
        a.onended = a.onerror = function () { URL.revokeObjectURL(url); if (audio === a) { audio = null; paintSay(); } };
        a.play().catch(function () { if (audio === a) { audio = null; paintSay(); } });
        if (window.vapiStat) vapiStat("diary_tts");
      }).catch(function (err) { toast(err.message === "wait" ? t("notReady") : t("ttsFail")); })
        .then(function () { asking = false; $("sayBtn").disabled = sel > todayK; });
    });

    var toastTimer = 0;
    function toast(msg) { var el = $("toast"); el.textContent = msg; el.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.remove("on"); }, 2400); }

    document.addEventListener("keydown", function (e) {
      if ((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === "s") { e.preventDefault(); store(); }
    });
    /* 가려지거나 꺼지기 전에 바로 남긴다 — 0.5초 기다리는 사이에 잃지 않게 */
    if (window.EL_WIN) EL_WIN.onHide(function () { store(); stopSay(); });
    addEventListener("pagehide", function () { store(); });

    $("langButton").addEventListener("click", function () {
      try { localStorage.setItem("vapiLang", LANG === "ko" ? "en" : "ko"); } catch (e) {}
      location.reload();
    });
    document.title = t("title"); $("langButton").textContent = t("lang");
    $("txtQ1").textContent = t("q1"); $("todayBtn").innerHTML = IC.pen + "<span>" + t("today") + "</span>";
    $("prevM").innerHTML = IC.prev; $("nextM").innerHTML = IC.next;
    $("txtMood").textContent = t("mood"); $("txtWeather").textContent = t("weather"); $("txtDid").textContent = t("did");
    $("title").placeholder = t("ttl"); $("text").placeholder = t("ph");
    $("delBtn").innerHTML = IC.trash + "<span>" + t("del") + "</span>";
    $("exportBtn").innerHTML = IC.down + "<span>" + t("exp") + "</span>";
    $("future").textContent = t("future");
    paintSay(); paintCal(); paintStats(); paintForm();

    window.EL_DIARY = {                                                     // 시험용
      get data() { return data; }, get sel() { return sel; }, get month() { return keyOf(view).slice(0, 7); },
      select: select, flush: store, get playing() { return !!audio; }
    };
  })();
  </script>
  <script src="/lib/shell.js"></script>
  <script src="/lib/usage.js" data-page="diary"></script>
  <i id="el-built" hidden></i>
</body>
</html>
